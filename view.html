<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>نور | محتوا</title>
    <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
    <script src="data/duas.js"></script>
    <style>
        :root {
            --bg-page: #fcf9f2;
            --bg-header: #fcf9f2;
            --bg-card: #ffffff;
            --text-primary: #2b2b2b;
            --text-secondary: #5a5a5a;
            --text-arabic: #0b3a30;
            --border-color: #eaeaea;
            --border-dash: #f5ede0;
            --gold: #c29b68;
            --shadow: rgba(0,0,0,0.04);
            --font-size-base: 16px;
        }
        body.dark-mode {
            --bg-page: #1a1a1a;
            --bg-header: #222222;
            --bg-card: #2a2a2a;
            --text-primary: #e8e8e8;
            --text-secondary: #b0b0b0;
            --text-arabic: #b8d9b8;
            --border-color: #3a3a3a;
            --border-dash: #3a3a3a;
            --gold: #d4af37;
            --shadow: rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-page);
            font-family: 'Tahoma', sans-serif;
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
            font-size: var(--font-size-base);
            direction: rtl;
        }
        .container { max-width: 600px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; height: 100%; }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color); flex-shrink: 0;
            transition: background 0.3s, border-color 0.3s;
            flex-wrap: nowrap; gap: 6px;
        }
        .back-btn { background: none; border: none; color: var(--gold); font-size: 24px; cursor: pointer; padding: 0 4px 0 0; }
        .header h1 {
            font-size: 18px; font-weight: bold; margin: 0; color: var(--text-primary);
            flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: color 0.3s;
        }
        .settings-btns { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .settings-btns button {
            background: none; border: 1px solid var(--border-color); border-radius: 30px;
            padding: 4px 10px; font-size: 16px; cursor: pointer; color: var(--text-secondary);
            transition: 0.2s; background-color: var(--bg-card); font-family: inherit;
            min-width: 32px; text-align: center; line-height: 1;
        }
        .settings-btns button:active { transform: scale(0.92); }
        .font-btn { font-weight: bold; font-size: 18px !important; padding: 2px 12px !important; }
        #themeBtn { font-size: 18px !important; padding: 2px 10px !important; }
        .scroll-content {
            flex: 1; overflow-y: auto; padding: 16px 18px 30px;
            -webkit-overflow-scrolling: touch; transition: background 0.3s;
        }
        .scroll-content::-webkit-scrollbar { width: 5px; }
        .scroll-content::-webkit-scrollbar-track { background: var(--bg-page); }
        .scroll-content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        .content-box {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 24px; padding: 22px 18px; box-shadow: 0 4px 16px var(--shadow);
            margin-bottom: 16px; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .dua-verse {
            margin-bottom: 22px; text-align: center; padding-bottom: 18px;
            border-bottom: 1px dashed var(--border-dash); transition: border-color 0.3s;
        }
        .dua-verse:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .arabic-text {
            font-size: calc(var(--font-size-base) * 1.4); line-height: 2.2;
            color: var(--text-arabic); font-weight: bold; margin-bottom: 8px;
            transition: color 0.3s, font-size 0.2s;
        }
        .persian-text {
            font-size: calc(var(--font-size-base) * 0.9); line-height: 1.9;
            color: var(--text-secondary); max-width: 95%; margin: 0 auto;
            transition: color 0.3s, font-size 0.2s;
        }
        .info-section {
            border-top: 2px solid var(--border-color); padding-top: 18px; margin-top: 6px;
            transition: border-color 0.3s;
        }
        .info-title { font-size: calc(var(--font-size-base) * 0.85); font-weight: bold; color: var(--gold); margin-bottom: 4px; }
        .info-text {
            font-size: calc(var(--font-size-base) * 0.8); line-height: 1.8;
            color: var(--text-secondary); text-align: justify; transition: color 0.3s;
        }
        .info-source {
            font-size: calc(var(--font-size-base) * 0.75); color: var(--text-secondary);
            opacity: 0.7; font-style: italic; margin-top: 4px;
        }
        .not-found { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        @media (max-width: 480px) {
            .header h1 { font-size: 15px; }
            .settings-btns button { font-size: 14px; padding: 3px 8px; }
            .font-btn { font-size: 16px !important; padding: 2px 10px !important; }
            #themeBtn { font-size: 16px !important; padding: 2px 8px !important; }
            .arabic-text { font-size: calc(var(--font-size-base) * 1.2); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button onclick="history.back()" class="back-btn">←</button>
        <h1 id="page-title">محتوا</h1>
        <div class="settings-btns">
            <button class="font-btn" onclick="changeFontSize(-1)">−</button>
            <button class="font-btn" onclick="changeFontSize(1)">+</button>
            <button id="themeBtn" onclick="toggleTheme()">🌙</button>
        </div>
    </div>
    <div class="scroll-content" id="scrollContent">
        <div class="content-box" id="dua-content"></div>
        <div id="dua-info-box" style="display: none;" class="info-section">
            <div class="info-title">✨ فضیلت و منبع:</div>
            <div class="info-text" id="dua-fazilat"></div>
            <div class="info-source" id="dua-source"></div>
        </div>
    </div>
</div>
<script>
    // ===== تنظیمات =====
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.getElementById('themeBtn').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }
    const MIN_FONT = 12, MAX_FONT = 24;
    let currentFontSize = 16;
    function changeFontSize(d) {
        let n = currentFontSize + d;
        if (n < MIN_FONT) n = MIN_FONT;
        if (n > MAX_FONT) n = MAX_FONT;
        currentFontSize = n;
        document.documentElement.style.setProperty('--font-size-base', n + 'px');
    }

    // ===== دریافت پارامترها =====
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'doa';
    const id = urlParams.get('id') || 'tavassol';

    // ===== یافتن محتوا =====
    let data = null;
    let title = '';

    // اگر نوع دعا باشد
    if (type === 'doa') {
        // بررسی در همه دسته‌ها
        for (const cat in duasData) {
            const found = duasData[cat].find(item => item.id === id);
            if (found) {
                data = found;
                break;
            }
        }
        title = data ? data.title : 'دعا پیدا نشد';
    }

    // ===== نمایش =====
    const titleEl = document.getElementById('dua-title');
    const contentEl = document.getElementById('dua-content');
    const infoBox = document.getElementById('dua-info-box');
    const fazilatEl = document.getElementById('dua-fazilat');
    const sourceEl = document.getElementById('dua-source');

    if (data && data.verses) {
        titleEl.textContent = data.title;
        let html = '';
        data.verses.forEach(v => {
            html += `
                <div class="dua-verse">
                    <div class="arabic-text">${v.ar}</div>
                    <div class="persian-text">${v.fa}</div>
                </div>
            `;
        });
        contentEl.innerHTML = html;
        if (data.fazilat) {
            fazilatEl.textContent = data.fazilat;
            sourceEl.textContent = data.source || '';
            infoBox.style.display = 'block';
        }
    } else {
        titleEl.textContent = title;
        contentEl.innerHTML = `<div class="not-found">متن این محتوا به زودی اضافه خواهد شد.</div>`;
        infoBox.style.display = 'none';
    }

    window.onload = function() {
        document.getElementById('scrollContent').scrollTop = 0;
    };
</script>
</body>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('✅ سرویس‌ورکر ثبت شد!'))
      .catch(err => console.log('❌ خطا:', err));
  }
  </script>
</html>
