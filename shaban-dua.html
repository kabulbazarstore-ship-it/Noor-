<style>
:root{
  --bg:#F8F5EE; --surface:#FFFDF8; --surface2:#F1ECE2;
  --brand:#123C32; --brand2:#2D6657;
  --gold:#B88A3B; --gold2:#D6B56A;
  --gold-soft:rgba(184,138,59,.10);
  --gold-border:rgba(184,138,59,.20);
  --text:#17231F; --text2:#3D4A44; --muted:#66716C;
  --divider:#E7E0D3;
  --arabic:#123C32; --translation:#3D4A44;
  --shadow:0 4px 20px rgba(18,60,50,.05);
  --shadow-sm:0 2px 10px rgba(18,60,50,.035);
  --radius:16px; --radius-sm:12px;
  --trans:.25s cubic-bezier(.4,0,.2,1);
  --font-fa:'Vazirmatn',Tahoma,sans-serif;
  --font-ar:'Amiri','Scheherazade New','Noto Naskh Arabic',serif;
  --fs-ar:24px; --fs-fa:16px; --lh-ar:2.35;
}
body.dark{
  --bg:#080E0C; --surface:#101A16; --surface2:#16231E;
  --brand:#9FC5B5; --brand2:#B9D5C8;
  --gold:#D2AC5C; --gold2:#E4C982;
  --gold-soft:rgba(210,172,92,.08);
  --gold-border:rgba(210,172,92,.16);
  --text:#F4EFE4; --text2:#C8D2CC; --muted:#A8B3AD;
  --divider:#26352F;
  --arabic:#E8E2D2; --translation:#C8D2CC;
  --shadow:0 4px 24px rgba(0,0,0,.30);
  --shadow-sm:0 2px 10px rgba(0,0,0,.20);
}
body.font-ar-amiri{--font-ar:'Amiri',serif}
body.font-ar-scheherazade{--font-ar:'Scheherazade New',serif}
body.font-ar-naskh{--font-ar:'Noto Naskh Arabic',serif}
body.font-ar-lateef{--font-ar:'Lateef',serif}
body.font-ar-reem{--font-ar:'Reem Kufi',sans-serif}
body.font-fa-vazir{--font-fa:'Vazirmatn',Tahoma,sans-serif}
body.font-fa-naskh{--font-fa:'Noto Naskh Arabic',serif}
body.font-fa-amiri{--font-fa:'Amiri',serif}
body.font-fa-scheherazade{--font-fa:'Scheherazade New',serif}
body.font-fa-lateef{--font-fa:'Lateef',serif}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font-fa);background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.7;font-size:16px;
  transition:background var(--trans),color var(--trans);
  overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:var(--trans)}
svg{display:block}
.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-sm{width:18px;height:18px}
.app{width:100%;max-width:780px;margin:0 auto;padding:0 14px 88px}

.header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:6px;
  padding:12px 0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--divider);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.hbtn{
  width:40px;height:40px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--surface);border:1px solid var(--gold-border);
  color:var(--gold);transition:var(--trans);
}
.hbtn:hover{background:var(--gold-soft);border-color:var(--gold)}
.hbtn:active{transform:scale(.94)}
.brand{flex:1;min-width:0;text-align:center;line-height:1.15}
.brand h1{
  font-family:'Amiri',serif;font-size:1.12rem;font-weight:700;
  color:var(--brand);letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
body.dark .brand h1{color:var(--gold)}
.brand .noor{
  display:block;margin-top:3px;
  font-family:'Amiri',serif;font-size:.65rem;font-weight:700;
  color:var(--gold);letter-spacing:6px;
}

.scroll-content{
  max-height:calc(100vh - 90px);
  overflow-y:auto;padding:14px 0 20px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--gold-border) transparent;
}
.scroll-content::-webkit-scrollbar{width:4px}
.scroll-content::-webkit-scrollbar-track{background:transparent}
.scroll-content::-webkit-scrollbar-thumb{background:var(--gold-border);border-radius:10px}

.top-orn{
  position:relative;overflow:hidden;text-align:center;
  padding:18px 14px 20px;margin-bottom:14px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--gold-border);
  box-shadow:var(--shadow);
}
.orn-svg{position:absolute;color:var(--gold);opacity:.10;pointer-events:none}
.orn-svg.tr{top:-6px;right:-6px;width:80px;height:80px}
.orn-svg.bl{bottom:-6px;left:-6px;width:80px;height:80px;transform:rotate(180deg)}
.orn-title{
  position:relative;z-index:1;
  font-family:'Amiri',serif;font-size:1.35rem;font-weight:700;
  color:var(--brand);letter-spacing:.5px;
}
body.dark .orn-title{color:var(--gold)}
.orn-sub{position:relative;z-index:1;font-size:.76rem;color:var(--muted)}
.orn-div{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:80px;margin:8px auto 0;
}
.orn-div:before,.orn-div:after{content:"";flex:1;height:1px;background:var(--gold-border)}
.orn-div svg{width:12px;height:12px;color:var(--gold)}

.section-head{
  position:relative;
  margin:20px 0 12px;
  padding:14px 16px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--gold-border);
  box-shadow:var(--shadow-sm);
  text-align:center;
}
.section-head:first-child{margin-top:0}
.section-head .sec-title{
  font-family:'Amiri',serif;
  font-size:1.02rem;font-weight:700;
  color:var(--gold);
  margin-bottom:4px;
  line-height:1.4;
}
.section-head .sec-sub{
  font-size:.72rem;
  color:var(--muted);
  line-height:1.6;
}
.section-head .sec-orn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:60px;margin:8px auto 0;
}
.section-head .sec-orn:before,.section-head .sec-orn:after{
  content:"";flex:1;height:1px;background:var(--gold-border);
}
.section-head .sec-orn svg{width:10px;height:10px;color:var(--gold)}

.verse-card{
  background:var(--surface);
  border:1px solid var(--gold-border);
  border-radius:var(--radius);
  padding:16px 14px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);
  transition:var(--trans);position:relative;
}
.verse-card:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(184,138,59,.08)}
.verse-card .v-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.verse-card .v-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 8px;
  border-radius:7px;
  background:var(--gold-soft);color:var(--gold);
  font-family:'Amiri',serif;font-weight:700;font-size:.72rem;
  border:1px solid var(--gold-border);
}
.verse-card .v-label{font-size:.68rem;color:var(--muted);font-weight:600}
.verse-card .v-ar{
  font-family:var(--font-ar);
  font-size:var(--fs-ar);line-height:var(--lh-ar);
  color:var(--arabic);text-align:center;font-weight:400;
  margin-bottom:12px;padding:4px 2px;white-space:pre-line;
}
.verse-card.bismillah .v-ar{font-size:calc(var(--fs-ar) * .82);margin-bottom:10px}
.verse-card .v-divider{
  height:1px;
  background:repeating-linear-gradient(90deg,var(--gold-border) 0,var(--gold-border) 3px,transparent 3px,transparent 6px);
  margin:0 auto 12px;width:52px;
}
.verse-card .v-fa{
  font-family:var(--font-fa);
  font-size:var(--fs-fa);line-height:1.95;
  color:var(--translation);text-align:justify;
  padding:0 8px;border-right:3px solid var(--gold-border);
  white-space:pre-line;
}
.verse-card.hide-trans .v-fa{display:none}
.verse-card.hide-trans .v-divider{display:none}
.verse-card.hide-trans .v-ar{margin-bottom:0}

.modal-bg{
  position:fixed;inset:0;z-index:200;
  display:none;align-items:flex-end;justify-content:center;
  padding:0 12px 12px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.modal-bg.show{display:flex}
.modal{
  width:100%;max-width:540px;max-height:86vh;overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--gold-border);
  border-radius:24px 24px 18px 18px;
  padding:20px 18px 26px;
  box-shadow:var(--shadow);
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid var(--divider);
}
.modal-head h3{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--text)}
.modal-head h3 svg{color:var(--gold);width:20px;height:20px;flex:none}
.modal-close{
  width:34px;height:34px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);
  color:var(--muted);
}
.modal-close:hover{color:var(--gold);border-color:var(--gold)}

.set-group{margin-bottom:18px}
.set-group>label{display:block;margin-bottom:8px;color:var(--muted);font-size:.75rem;font-weight:700}
.set-options{display:flex;flex-wrap:wrap;gap:6px}
.set-opt{
  padding:7px 11px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);
  color:var(--text2);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--trans);
}
.set-opt:hover{color:var(--gold);border-color:var(--gold-border)}
.set-opt.active{color:var(--gold);background:var(--gold-soft);border-color:var(--gold)}
.font-preview{font-family:var(--font-ar);font-size:1rem}
.set-ctrl{
  display:flex;align-items:center;gap:6px;width:max-content;
  padding:4px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);
}
.set-ctrl button{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:1.05rem;font-weight:700}
.set-ctrl button:hover{background:var(--gold-soft);color:var(--gold)}
.set-ctrl .val{min-width:42px;text-align:center;color:var(--gold);font-size:.82rem;font-weight:700}

.info-block{
  padding:14px 16px;
  background:var(--surface2);
  border:1px solid var(--gold-border);
  border-radius:var(--radius-sm);
  margin-bottom:10px;
}
.info-block h4{
  display:flex;align-items:center;gap:6px;
  font-size:.8rem;font-weight:700;color:var(--gold);margin-bottom:8px;
}
.info-block h4 svg{width:16px;height:16px;flex:none}
.info-block p{
  font-size:.8rem;line-height:1.95;
  color:var(--text2);text-align:justify;white-space:pre-line;
}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;align-items:center;justify-content:space-around;
  height:62px;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--divider);
  box-shadow:0 -6px 24px rgba(0,0,0,.06);
}
body.dark .bottom-nav{box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 4px;border-radius:12px;
  color:var(--muted);text-decoration:none;
  font-size:.6rem;font-weight:500;transition:var(--trans);
}
.nav-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover,.nav-btn.active{color:var(--gold)}

.toast{
  position:fixed;left:50%;bottom:78px;z-index:300;
  display:flex;align-items:center;gap:8px;
  max-width:90%;padding:10px 18px;border-radius:14px;
  background:var(--brand);color:#fff;
  border:1px solid var(--gold-border);
  box-shadow:var(--shadow);
  transform:translateX(-50%) translateY(20px);
  opacity:0;pointer-events:none;
  transition:all .35s ease;font-size:.8rem;font-weight:600;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:var(--gold2)}

@media(max-width:480px){
  :root{--fs-ar:22px;--fs-fa:15px}
  .app{padding-left:10px;padding-right:10px}
  .hbtn{width:36px;height:36px}
  .hbtn .icon{width:18px;height:18px}
  .brand h1{font-size:1rem}
  .orn-title{font-size:1.2rem}
  .verse-card{padding:14px 12px}
  .section-head{padding:12px 12px}
  .section-head .sec-title{font-size:.95rem}
}
</style>
</head>

        { ar: "اللّٰهُمَّ اجْعَلْنِی مِنَ الْمُتَقَبَّلِینَ، وَاجْعَلْنِی مِنَ الْمَرْحُومِینَ، وَاجْعَلْنِی مِنَ الْمَغْفُورِ لَهُمْ.", fa: "خدایا! مرا از پذیرفته‌شدگان، و رحمت‌شدگان، و آمرزیده‌شدگان قرار ده." },

        { ar: "اللّٰهُمَّ اجْعَلْنِی مِنْ أَنْصَارِ وَلِیِّكَ الْقَائِمِ بِأَمْرِكَ، وَالثَّابِتِینَ عَلَىٰ طَاعَتِهِ، وَالسَّابِقِینَ إِلَىٰ إِرَادَتِهِ.", fa: "خدایا! مرا از یاران ولیّت، قائم به امرت، و از استواران بر طاعتش، و از پیشی‌گیرندگان به سوی اراده‌اش قرار ده." },

        { ar: "اللّٰهُمَّ بِحَقِّ هٰذِهِ اللَّیْلَةِ، وَبِحَقِّ مَوْلُودِهَا، وَبِحَقِّ مُحَمَّدٍ وَآلِهِ الطَّاهِرِینَ، أَنْ تَغْفِرَ لِی وَلِوَالِدَیَّ، وَلِجَمِیعِ الْمُؤْمِنِینَ وَالْمُؤْمِنَاتِ.", fa: "خدایا! به حقّ این شب، و به حقّ مولود آن، و به حقّ محمّد و خاندان پاکش، که مرا و پدر و مادرم، و همه‌ی مؤمنان و مؤمنات را بیامرزی." },

        { ar: "اللّٰهُمَّ عَجِّلْ لِوَلِیِّكَ الْفَرَجَ، وَاجْعَلْ هٰذِهِ اللَّیْلَةَ لَنَا لَیْلَةَ خَیْرٍ وَبَرَكَةٍ وَرَحْمَةٍ.", fa: "خدایا! برای ولیّت گشایش را تعجیل کن، و این شب را برای ما شب خیر و برکت و رحمت قرار ده." }
      ]
    },

    /* -------------------- بخش ۴: دعای مشهور ماه شعبان -------------------- */
    {
      title: "دعای معروف ماه شعبان (اللهم إن لم تکن غفرت لنا)",
      sub: "از امام صادق (ع) — خواندن در شب‌های جمعه و سحرها",
      verses: [
        { ar: "اللّٰهُمَّ إِنْ لَمْ تَکُنْ غَفَرْتَ لَنَا فِیمَا مَضَیٰ مِنْ شَعْبَانَ، فَاغْفِرْ لَنَا فِیمَا بَقِیَ مِنْهُ.", fa: "خدایا! اگر در گذشته‌ی ماه شعبان ما را نیامرزیده‌ای، در باقی‌مانده‌اش ما را بیامرز." },

        { ar: "فَإِنَّكَ قُلْتَ وَقَوْلُكَ الْحَقُّ: ﴿وَاسْتَغْفِرُوا اللهَ إِنَّ اللهَ غَفُورٌ رَحِیمٌ﴾.", fa: "که تو فرمودی و گفتارت حق است: «و از خدا آمرزش بخواهید، که خدا آمرزنده‌ی مهربان است»." },

        { ar: "اللّٰهُمَّ إِنِّی أَسْأَلُكَ بِحَقِّ مُحَمَّدٍ وَآلِ مُحَمَّدٍ، أَنْ تُصَلِّیَ عَلَىٰ مُحَمَّدٍ وَآلِ مُحَمَّدٍ، وَأَنْ تَغْفِرَ لِی ذُنُوبِی، وَتَتُوبَ عَلَیَّ.", fa: "خدایا! از تو به حق محمّد و خاندان محمّد می‌خواهم که بر محمّد و خاندان محمّد درود فرستی، و گناهانم را بیامرزی، و توبه‌ام را بپذیری." },

        { ar: "اللّٰهُمَّ اجْعَلْنِی مِنَ التَّوَّابِینَ، وَاجْعَلْنِی مِنَ الْمُتَطَهِّرِینَ، وَاجْعَلْنِی مِنْ عِبَادِكَ الصَّالِحِینَ.", fa: "خدایا! مرا از توبه‌کنندگان، و از پاکیزگان، و از بندگان شایسته‌ات قرار ده." },

        { ar: "اللّٰهُمَّ اجْعَلْ لِی فِی هٰذَا الشَّهْرِ نَصِیباً مِنْ رَحْمَتِكَ، وَمَغْفِرَةً مِنْ ذُنُوبِی، وَتَوْفِیقاً لِمَا تُحِبُّ وَتَرْضَىٰ.", fa: "خدایا! در این ماه برای من بهره‌ای از رحمتت، و آمرزشی از گناهانم، و توفیقی برای آنچه دوست داری و می‌پسندی قرار ده." }
      ]
    },

    /* -------------------- بخش ۵: دعای هنگام رؤیت هلال ماه شعبان -------------------- */
    {
      title: "دعای هنگام رؤیت هلال ماه شعبان",
      sub: "خواندن این دعا هنگام دیدن هلال ماه شعبان",
      verses: [
        { ar: "اللّٰهُمَّ إِنِّی أَسْأَلُكَ بِاسْمِكَ الَّذِی دَارَتْ بِهِ الْأَفْلَاكُ، وَاسْتَقَامَتْ بِهِ الْأَمْلَاكُ، وَصَلَحَ بِهِ الْأَوَّلُونَ وَالْآخِرُونَ.", fa: "خدایا! از تو می‌خواهم به نامت که افلاک با آن گردش می‌کنند، و فرشتگان با آن استوارند، و پیشینیان و پسینیان با آن شایسته گشتند." },

        { ar: "اللّٰهُمَّ ارْزُقْنَا فِی هٰذَا الشَّهْرِ، سَلَامَةً وَإِیمَاناً، وَعَافِیَةً وَإِسْلَاماً، وَمَغْفِرَةً وَرِضْوَاناً.", fa: "خدایا! در این ماه برای ما سلامت و ایمان، عافیت و اسلام، و آمرزش و رضوان روزی کن." },

        { ar: "وَارْزُقْنَا فِیهِ التَّوْفِیقَ لِمَا تُحِبُّ وَتَرْضَىٰ، وَبَاعِدْنَا فِیهِ عَمَّا تُبْغِضُ وَتَكْرَهُ، وَاجْعَلْ آخِرَهُ لَنَا مَغْفِرَةً وَرَحْمَةً.", fa: "و در آن توفیق انجام آنچه را دوست داری و می‌پسندی روزی ما کن، و از آنچه دشمن داری و نمی‌پسندی دورمان کن، و پایانش را برایمان آمرزش و رحمت قرار ده." },

        { ar: "اللّٰهُمَّ أَهِلَّهُ عَلَیْنَا بِالْأَمْنِ وَالْإِیمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ، وَالْمُسَارَعَةِ إِلَىٰ مَا تُحِبُّ وَتَرْضَىٰ.", fa: "خدایا! این ماه را با امنیت و ایمان، و سلامت و اسلام، و شتاب به سوی آنچه دوست داری و می‌پسندی بر ما وارد کن." }
      ]
    },

    /* -------------------- بخش ۷: دعای امام سجاد در ماه شعبان -------------------- */
    {
      title: "دعای امام سجاد (ع) در ماه شعبان",
      sub: "از صحیفه سجادیه — دعایی که امام سجاد در این ماه می‌خواندند",
      verses: [
        { ar: "اللّٰهُمَّ بَارِکْ لَنَا فِی شَعْبَانَ، وَبَلِّغْنَا شَهْرَ رَمَضَانَ، وَأَعِنَّا عَلَىٰ صِیَامِهِ وَقِیَامِهِ.", fa: "خدایا! در ماه شعبان برای ما برکت ده، و ما را به ماه رمضان برسان، و بر روزه و شب‌زنده‌داری‌اش یاری کن." },

        { ar: "اللّٰهُمَّ اجْعَلْ صِیَامِی فِی هٰذَا الشَّهْرِ مَقْبُولًا، وَقِیَامِی فِیهِ مَشْكُورًا، وَعَمَلِی فِیهِ مَبْرُورًا.", fa: "خدایا! روزه‌ام را در این ماه پذیرفته، و قیامم را سپاسیده، و عملم را نیک مقبول قرار ده." },

        { ar: "اللّٰهُمَّ أَعِنِّی عَلَىٰ صِیَامِ هٰذَا الشَّهْرِ، وَاجْعَلْنِی مِنَ الصَّائِمِینَ الْقَائِمِینَ، وَاجْعَلْنِی مِنَ الْمُتَقَبَّلِینَ الْمَرْحُومِینَ.", fa: "خدایا! مرا بر روزه‌ی این ماه یاری کن، و از روزه‌داران شب‌زنده‌دار قرار ده، و از پذیرفته‌شدگان و رحمت‌شدگان." },

        { ar: "اللّٰهُمَّ إِنِّی أَسْأَلُكَ بِحَقِّ مُحَمَّدٍ وَآلِ مُحَمَّدٍ، أَنْ تَغْفِرَ لِی ذُنُوبِی، وَتَتُوبَ عَلَیَّ، وَتَجْعَلَنِی مِنْ أَهْلِ مَا فِیهِ مِنَ الْخَیْرِ وَالْبَرَكَةِ.", fa: "خدایا! از تو به حق محمّد و خاندان محمّد می‌خواهم که گناهانم را بیامرزی، و توبه‌ام را بپذیری، و از اهل آن خیر و برکتی که در این ماه است قرارم دهی." },

        { ar: "اللّٰهُمَّ إِنِّی أَسْأَلُكَ الْجَنَّةَ، وَأَعُوذُ بِكَ مِنَ النَّارِ، وَأَسْأَلُكَ أَنْ تَقْضِیَ حَوَائِجِی فِی الدُّنْیَا وَالْآخِرَةِ.", fa: "خدایا! از تو بهشت را می‌خواهم، و از آتش به تو پناه می‌برم، و از تو می‌خواهم که حاجاتم را در دنیا و آخرت برآورده کنی." }
      ]
    },

    /* -------------------- بخش ۸: اذکار و ذخایر ماه شعبان -------------------- */
    {
      title: "اذکار و ذخایر ماه شعبان",
      sub: "اذکاری که در روایات برای این ماه بسیار سفارش شده است",
      verses: [
        { ar: "أَسْتَغْفِرُ اللهَ رَبِّی وَأَتُوبُ إِلَیْهِ. (۷۰ مرتبه هر روز)", fa: "از خدایی که پروردگار من است آمرزش می‌خواهم و به سوی او بازمی‌گردم. (۷۰ مرتبه)" },

        { ar: "اللّٰهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَآلِ مُحَمَّدٍ. (بسیار)", fa: "خدایا! بر محمّد و خاندان محمّد درود فرست." },

        { ar: "لَا إِلٰهَ إِلَّا اللهُ. (بسیار)", fa: "معبودی جز خدا نیست." },

        { ar: "اللّٰهُمَّ أَغْنِنِی بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِی بِفَضْلِكَ عَمَّنْ سِوَاكَ.", fa: "خدایا! مرا با حلال خود از حرامت بی‌نیاز کن، و با فضلت از هر کس جز خودت." },

        { ar: "سُبْحَانَ اللهِ وَالْحَمْدُ لِلّٰهِ وَلَا إِلٰهَ إِلَّا اللهُ وَاللهُ أَكْبَرُ.", fa: "منزّه است خدا، و ستایش از آنِ خداست، و معبودی جز خدا نیست، و خدا بزرگ‌تر است." },

        { ar: "رَبِّ اغْفِرْ لِی وَتُبْ عَلَیَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِیمُ.", fa: "پروردگارا! مرا بیامرز و توبه‌ام را بپذیر، همانا تو توبه‌پذیر مهربانی." },

        { ar: "اللّٰهُمَّ إِنِّی أَسْأَلُكَ الْجَنَّةَ، وَأَعُوذُ بِكَ مِنَ النَّارِ.", fa: "خدایا! از تو بهشت را می‌خواهم، و از آتش به تو پناه می‌برم." },

        { ar: "حَسْبُنَا اللهُ وَنِعْمَ الْوَکِیلُ.", fa: "خدا ما را بس است و چه نیکو وکیلی است." },

        { ar: "اللّٰهُمَّ عَجِّلْ لِوَلِیِّكَ الْفَرَجَ. (بسیار)", fa: "خدایا! برای ولیّت گشایش را تعجیل کن." },

        { ar: "یَا اللهُ، یَا رَحْمٰنُ، یَا رَحِیمُ، اغْفِرْ لِی ذُنُوبِی.", fa: "ای خدا، ای بخشنده، ای مهربان، گناهانم را بیامرز." }
      ]
    }
  ],

  fazilat: "ماه شعبان یکی از با فضیلت‌ترین ماه‌های سال است. پیامبر اکرم (ص) فرمودند: «شعبان ماه من است و رمضان ماه خداست.» در این ماه پیامبر اکرم (ص) بسیار روزه می‌گرفتند و آن را به رمضان متصل می‌کردند.\n\nاز مهم‌ترین دعاها و مناجات‌های ماه شعبان:\n- صلوات شعبانیه (از امام سجاد ع)\n- مناجات شعبانیه (از امیرالمؤمنین ع)\n- دعای شب نیمه شعبان\n- دعای مشهور «اللهم إن لم تکن غفرت لنا...»\n- دعای هنگام رؤیت هلال ماه شعبان\n- دعاهای شب‌های جمعه\n- اذکار فراوان: استغفار، صلوات، لا اله الا الله\n\nامام صادق (ع) فرمودند: «هر کس سه روز آخر شعبان را روزه بگیرد و به رمضان متصل کند، خداوند گناهان گذشته و آینده او را می‌آمرزد.»\n\nشب نیمه شعبان از با فضیلت‌ترین شب‌های سال است. امام صادق (ع) فرمودند: «شب نیمه شعبان، با فضیلت‌ترین شب پس از شب قدر است. در این شب، خداوند فضل خود را بر بندگانش تقسیم می‌کند و آنان را می‌آمرزد.»\n\nامام خمینی (ره) درباره مناجات شعبانیه فرمودند: «این مناجات از بزرگ‌ترین مناجات‌هاست و تمام ائمه (ع) در ماه شعبان آن را می‌خواندند.»\n\nخواندن دعاهای این ماه، موجب پاکی دل، بخشش گناهان، جلب رحمت الهی، افزایش روزی، و آماده شدن برای ماه مبارک رمضان می‌شود.",

  source: "مفاتیح الجنان (شیخ عباس قمی) • صحیفه سجادیه • اقبال الأعمال (سید ابن طاووس) • مصباح المتهجد (شیخ طوسی) • بحار الأنوار (علامه مجلسی) • الکافی (شیخ کلینی)",

  time: "بهترین زمان‌ها: تمام روزها و شب‌های ماه شعبان، به‌ویژه:\n- شب‌های جمعه (برای مناجات شعبانیه، دعای کمیل و دعای مشهور ماه شعبان)\n- سحرها و بین‌الطلوعین\n- شب و روز نیمه شعبان\n- هنگام رؤیت هلال ماه شعبان\n- روزهای اول و آخر ماه\n\nتوصیه شده با وضو، رو به قبله، با اخلاص و حضور قلب خوانده شود و همراه آن روزه، استغفار، صلوات و صدقه باشد."
};

/* ============================================================
   RENDER VERSES
   ============================================================ */
function renderVerses(){
  const c = $('#versesContainer');
  c.innerHTML = '';
  let totalIndex = 0;

  DUA_DATA.sections.forEach((section) => {
    const header = document.createElement('div');
    header.className = 'section-head';
    header.innerHTML = `
      <div class="sec-title">${section.title}</div>
      ${section.sub ? `<div class="sec-sub">${section.sub}</div>` : ''}
      <div class="sec-orn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9 12 2"/>
        </svg>
      </div>
    `;
    c.appendChild(header);

    section.verses.forEach((v) => {
      totalIndex++;
      const el = document.createElement('div');
      el.className = 'verse-card' + (v.bismillah ? ' bismillah' : '');
      el.innerHTML = `
        <div class="v-head">
          <span class="v-num">${faNum(totalIndex)}</span>
          <span class="v-label">بند ${faNum(totalIndex)}</span>
        </div>
        <div class="v-ar">${v.ar}</div>
        <div class="v-divider"></div>
        <div class="v-fa">${v.fa}</div>
      `;
      c.appendChild(el);
    });
  });
}

/* ============================================================
   INFO MODAL
   ============================================================ */
$('#modalFazilat').textContent = DUA_DATA.fazilat;
$('#modalSource').textContent = DUA_DATA.source;
$('#modalTime').textContent = DUA_DATA.time;

$('#btnInfo').onclick = ()=> $('#modalInfo').classList.add('show');
$('#btnSettings').onclick = ()=> $('#modalSettings').classList.add('show');

$$('[data-close]').forEach(b => b.onclick = ()=> $('#'+b.dataset.close).classList.remove('show'));
$$('.modal-bg').forEach(m => m.onclick = (e)=>{ if(e.target===m) m.classList.remove('show'); });

/* ============================================================
   THEME
   ============================================================ */
const sunIcon = `<svg id="themeIcon" class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const moonIcon = `<svg id="themeIcon" class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function applyTheme(dark){
  document.body.classList.toggle('dark',dark);
  localStorage.setItem('noor_theme', dark ? 'dark' : 'light');
  $('#themeToggle').innerHTML = dark ? sunIcon : moonIcon;
}
applyTheme(localStorage.getItem('noor_theme')==='dark');
$('#themeToggle').onclick = ()=> applyTheme(!document.body.classList.contains('dark'));

/* ============================================================
   SETTINGS
   ============================================================ */
let arSize = parseInt(localStorage.getItem('noor_ar_size') || '24');
let faSize = parseInt(localStorage.getItem('noor_fa_size') || '16');
let lineHeight = localStorage.getItem('noor_lh') || '2.35';
let showTrans = localStorage.getItem('noor_trans') !== 'false';
const fontAr = localStorage.getItem('noor_font_ar') || 'amiri';
const fontFa = localStorage.getItem('noor_font_fa') || 'vazir';

document.body.classList.add('font-ar-'+fontAr);
document.body.classList.add('font-fa-'+fontFa);

function applySettings(){
  document.documentElement.style.setProperty('--fs-ar', arSize+'px');
  document.documentElement.style.setProperty('--fs-fa', faSize+'px');
  document.documentElement.style.setProperty('--lh-ar', lineHeight);
  $$('.verse-card').forEach(v=> v.classList.toggle('hide-trans', !showTrans));
  if($('#arSizeVal')) $('#arSizeVal').textContent = faNum(arSize);
  if($('#faSizeVal')) $('#faSizeVal').textContent = faNum(faSize);
  localStorage.setItem('noor_ar_size', arSize);
  localStorage.setItem('noor_fa_size', faSize);
  localStorage.setItem('noor_lh', lineHeight);
  localStorage.setItem('noor_trans', showTrans);
}
applySettings();

$$('[data-ar-step]').forEach(b => b.onclick = ()=>{
  arSize = Math.max(16, Math.min(42, arSize + parseInt(b.dataset.arStep)*2));
  applySettings();
});
$$('[data-fa-step]').forEach(b => b.onclick = ()=>{
  faSize = Math.max(12, Math.min(26, faSize + parseInt(b.dataset.faStep)*2));
  applySettings();
});
$$('[data-lh]').forEach(b=>{
  if(b.dataset.lh===lineHeight) b.classList.add('active');
  b.onclick = ()=>{
    $$('[data-lh]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    lineHeight = b.dataset.lh;
    applySettings();
  };
});
$$('[data-trans]').forEach(b=>{
  const isOn = (b.dataset.trans==='1')===showTrans;
  b.classList.toggle('active',isOn);
  b.onclick = ()=>{
    $$('[data-trans]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    showTrans = b.dataset.trans==='1';
    applySettings();
  };
});
$$('[data-font-ar]').forEach(b=>{
  if(b.dataset.fontAr===fontAr) b.classList.add('active');
  b.onclick = ()=>{
    $$('[data-font-ar]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-ar-\S+/g,'').trim();
    document.body.classList.add('font-ar-'+b.dataset.fontAr);
    localStorage.setItem('noor_font_ar', b.dataset.fontAr);
  };
});
$$('[data-font-fa]').forEach(b=>{
  if(b.dataset.fontFa===fontFa) b.classList.add('active');
  b.onclick = ()=>{
    $$('[data-font-fa]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-fa-\S+/g,'').trim();
    document.body.classList.add('font-fa-'+b.dataset.fontFa);
    localStorage.setItem('noor_font_fa', b.dataset.fontFa);
  };
});

/* ============================================================
   BACK BUTTON
   ============================================================ */
$('#btnBack').onclick = ()=>{
  if(document.referrer && (document.referrer.includes('list.html') || document.referrer.includes('doa.html'))) history.back();
  else location.href = 'list.html?type=famous';
};

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg){
  const t = $('#toast');
  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ============================================================
   INIT
   ============================================================ */
renderVerses();
applySettings();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js')
      .then(()=> console.log('NOOR Service Worker registered.'))
      .catch(()=> {});
  });
}

console.log('🌙 دعاهای ماه شعبان | NOOR – بارگذاری شد. تعداد بخش‌ها:', DUA_DATA.sections.length);
</script>
