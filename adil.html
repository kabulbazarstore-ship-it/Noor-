<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123C32">
<title>دعای عدیل | نــــور NOOR</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Lateef&family=Reem+Kufi:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F5EE; --surface: #FFFDF8; --surface2: #F1ECE2;
  --brand: #123C32; --brand2: #2D6657;
  --gold: #B88A3B; --gold2: #D6B56A;
  --gold-soft: rgba(184, 138, 59, 0.10);
  --gold-border: rgba(184, 138, 59, 0.20);
  --text: #17231F; --text-2: #3d4a44; --muted: #66716C;
  --divider: #E7E0D3;
  --arabic: #123C32; --translation: #3d4a44;
  --shadow: 0 4px 20px rgba(18, 60, 50, 0.05);
  --shadow-sm: 0 2px 8px rgba(18, 60, 50, 0.03);
  --radius: 16px; --radius-sm: 12px;
  --trans: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font-fa: 'Vazirmatn', Tahoma, sans-serif;
  --font-ar: 'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif;
  --fs-ar: 24px; --fs-fa: 16px; --line-height: 2.3;
}
body.dark {
  --bg: #080E0C; --surface: #101A16; --surface2: #16231E;
  --brand: #9FC5B5; --brand2: #B9D5C8;
  --gold: #D2AC5C; --gold2: #E4C982;
  --gold-soft: rgba(210, 172, 92, 0.08);
  --gold-border: rgba(210, 172, 92, 0.16);
  --text: #F4EFE4; --text-2: #c8d2cc; --muted: #A8B3AD;
  --divider: #26352F;
  --arabic: #e8e2d2; --translation: #c8d2cc;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.20);
}
body.font-ar-amiri { --font-ar: 'Amiri', serif; }
body.font-ar-scheherazade { --font-ar: 'Scheherazade New', serif; }
body.font-ar-naskh { --font-ar: 'Noto Naskh Arabic', serif; }
body.font-ar-lateef { --font-ar: 'Lateef', serif; }
body.font-ar-reem { --font-ar: 'Reem Kufi', sans-serif; }
body.font-fa-vazir { --font-fa: 'Vazirmatn', Tahoma, sans-serif; }
body.font-fa-naskh { --font-fa: 'Noto Naskh Arabic', serif; }
body.font-fa-amiri { --font-fa: 'Amiri', serif; }
body.font-fa-scheherazade { --font-fa: 'Scheherazade New', serif; }
body.font-fa-lateef { --font-fa: 'Lateef', serif; }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font-fa); background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.7; font-size: 16px;
  transition: background var(--trans), color var(--trans);
  overflow-x: hidden;
}
button, input { font-family: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: var(--trans); }
svg { display: block; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-sm { width: 18px; height: 18px; }
.app { max-width: 780px; margin: 0 auto; padding: 0 14px 40px; }

.header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 6px;
  padding: 12px 0; background: var(--bg);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.hbtn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--gold-border);
  color: var(--gold); flex: none;
}
.hbtn:hover { background: var(--gold-soft); border-color: var(--gold); }
.hbtn:active { transform: scale(0.94); }
.brand { flex: 1; text-align: center; line-height: 1.15; min-width: 0; }
.brand h1 {
  font-family: 'Amiri', serif;
  font-size: 1.15rem; font-weight: 700;
  color: var(--brand); letter-spacing: 0.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.dark .brand h1 { color: var(--gold); }
.brand .brand-noor {
  display: block; font-family: 'Amiri', serif;
  font-size: 0.65rem; font-weight: 700;
  color: var(--gold); letter-spacing: 6px;
  margin-top: 3px;
}

.scroll-content {
  max-height: calc(100vh - 90px);
  overflow-y: auto;
  padding: 14px 0 20px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--gold-border) transparent;
}
.scroll-content::-webkit-scrollbar { width: 4px; }
.scroll-content::-webkit-scrollbar-track { background: transparent; }
.scroll-content::-webkit-scrollbar-thumb { background: var(--gold-border); border-radius: 10px; }

.top-orn {
  position: relative; overflow: hidden;
  text-align: center;
  padding: 18px 14px 20px;
  margin-bottom: 14px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--gold-border);
  box-shadow: var(--shadow);
}
.top-orn .orn-svg {
  position: absolute; color: var(--gold); opacity: 0.10; pointer-events: none;
}
.top-orn .orn-svg.tr { top: -6px; right: -6px; width: 80px; height: 80px; }
.top-orn .orn-svg.bl { bottom: -6px; left: -6px; width: 80px; height: 80px; transform: rotate(180deg); }
.top-orn .orn-title {
  font-family: 'Amiri', serif;
  font-size: 1.45rem; font-weight: 700;
  color: var(--brand); letter-spacing: 1px;
  margin-bottom: 3px;
}
body.dark .top-orn .orn-title { color: var(--gold); }
.top-orn .orn-sub { font-size: 0.78rem; color: var(--muted); }
.top-orn .orn-div {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin: 8px auto 0; width: 80px;
}
.top-orn .orn-div::before, .top-orn .orn-div::after {
  content: ""; flex: 1; height: 1px; background: var(--gold-border);
}
.top-orn .orn-div svg { color: var(--gold); width: 12px; height: 12px; }

.verse-card {
  background: var(--surface);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius);
  padding: 16px 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  transition: var(--trans);
  position: relative;
}
.verse-card:hover {
  border-color: var(--gold);
  box-shadow: 0 4px 16px rgba(184, 138, 59, 0.08);
}
.verse-card .v-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.verse-card .v-num {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px; padding: 0 8px;
  border-radius: 7px;
  background: var(--gold-soft); color: var(--gold);
  font-family: 'Amiri', serif; font-weight: 700;
  font-size: 0.72rem;
  border: 1px solid var(--gold-border);
}
.verse-card .v-label {
  font-size: 0.68rem; color: var(--muted);
  font-weight: 600;
}
.verse-card .v-ar {
  font-family: var(--font-ar);
  font-size: var(--fs-ar);
  line-height: var(--line-height);
  color: var(--arabic);
  text-align: center;
  font-weight: 400;
  margin-bottom: 12px;
  padding: 4px 2px;
  white-space: pre-line;
}
.verse-card .v-divider {
  height: 1px;
  background: repeating-linear-gradient(90deg, var(--gold-border) 0, var(--gold-border) 3px, transparent 3px, transparent 6px);
  margin: 0 auto 12px;
  width: 50px;
}
.verse-card .v-fa {
  font-family: var(--font-fa);
  font-size: var(--fs-fa);
  line-height: 1.95;
  color: var(--translation);
  text-align: justify;
  padding: 0 2px;
  white-space: pre-line;
}
.verse-card.hide-trans .v-fa { display: none; }
.verse-card.hide-trans .v-divider { display: none; }
.verse-card.hide-trans .v-ar { margin-bottom: 0; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 200; padding: 0 12px 12px;
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 520px; max-height: 85vh;
  overflow-y: auto; background: var(--surface);
  border-radius: 24px 24px 18px 18px;
  padding: 20px 18px 26px;
  border: 1px solid var(--gold-border);
  animation: slideUp 0.3s ease;
  box-shadow: var(--shadow);
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--divider);
}
.modal-head h3 {
  font-size: 1rem; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  color: var(--text);
}
.modal-head h3 svg { color: var(--gold); width: 20px; height: 20px; flex: none; }
.modal-close {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--muted);
}
.modal-close:hover { color: var(--gold); border-color: var(--gold); }

.set-group { margin-bottom: 16px; }
.set-group > label {
  display: block; font-size: 0.75rem; font-weight: 700;
  color: var(--muted); margin-bottom: 8px;
}
.set-options { display: flex; flex-wrap: wrap; gap: 6px; }
.set-opt {
  padding: 6px 12px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--text-2); font-size: 0.75rem;
  font-weight: 600; cursor: pointer; transition: var(--trans);
}
.set-opt:hover { border-color: var(--gold-border); color: var(--gold); }
.set-opt.active { background: var(--gold-soft); color: var(--gold); border-color: var(--gold); }
.set-ctrl {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--divider);
  border-radius: 10px; padding: 4px; width: fit-content;
}
.set-ctrl button {
  width: 34px; height: 34px; border-radius: 8px;
  color: var(--muted); font-weight: 700; font-size: 1rem;
}
.set-ctrl button:hover { background: var(--gold-soft); color: var(--gold); }
.set-ctrl .val {
  min-width: 40px; text-align: center;
  color: var(--gold); font-weight: 700; font-size: 0.82rem;
}
.font-preview { font-family: 'Amiri', serif; font-size: 1.1rem; }

.info-block {
  padding: 14px 16px;
  background: var(--surface2);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
}
.info-block h4 {
  font-size: 0.8rem; font-weight: 700;
  color: var(--gold); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.info-block h4 svg { width: 16px; height: 16px; flex: none; }
.info-block p {
  font-size: 0.8rem; line-height: 1.95;
  color: var(--text-2); text-align: justify;
  white-space: pre-line;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-around; align-items: center;
  background: var(--surface); border-top: 1px solid var(--divider);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  height: 62px;
  box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.06);
}
body.dark .bottom-nav { box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.4); }
.nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; flex: 1; padding: 6px 4px; border-radius: 12px; color: var(--muted);
  transition: var(--trans); font-size: 0.6rem; font-weight: 500;
  text-decoration: none; background: none; border: 0; cursor: pointer;
}
.nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover, .nav-btn.active { color: var(--gold); }

.toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--brand); color: #fff;
  padding: 10px 18px; border-radius: 14px;
  font-size: 0.8rem; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 300; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--gold-border); max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { color: var(--gold2); width: 16px; height: 16px; }

.app { padding-bottom: 80px; }

@media (max-width: 480px) {
  .brand h1 { font-size: 1rem; }
  :root { --fs-ar: 22px; --fs-fa: 15px; }
  .hbtn { width: 36px; height: 36px; }
  .hbtn .icon { width: 18px; height: 18px; }
  .verse-card { padding: 14px 12px; }
  .top-orn .orn-title { font-size: 1.25rem; }
}
</style>
</head>

    <div class="set-group">

        <div class="set-opt" data-font-ar="amiri"><span class="font-preview">بِسْمِ اللَّه</span></div>

    { ar: "بِسْمِ اللهِ الرَّحْمنِ الرَّحِیمِ", fa: "به نام خداوند بخشنده‌ی مهربان" },
    { ar: "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ ﴿شَهِدَ اللّٰهُ أَنَّهُ لَاإِلٰهَ إِلّا هُوَ وَالْمَلائِكَةُ وَأُولُوا الْعِلْمِ قَائِماً بِالْقِسْطِ لَاإِلٰهَ إِلّا هُوَ الْعَزِيزُ الْحَكِيمُ، إِنَّ الدِّينَ عِنْدَ اللّٰهِ الْإِسْلامُ﴾", fa: "به نام خدا که رحمتش بسیار و مهربانی‌اش همیشگی است؛ «خداوند درحالی که [به کارگردانی در همۀ امورِ هستی] قائم به عدالت است، [با زبانِ وحی و نظام استوار آفرینش و وحدتِ حاکمیت در خلقت] گواهی می دهد که هیچ معبودی جز او نیست و فرشتگان و دانشمندان نیز [گواهی می دهند که] جز او معبودی وجود ندارد، [معبودی] که توانای شکست ناپذیر و حکیم است؛ مسلّماً دین نزد خدا فقط اسلام است»" },
    { ar: "وَ أَنَا الْعَبْدُ الضَّعِيفُ الْمُذْنِبُ الْعاصِى الْمُحْتاجُ الْحَقِيرُ، أَشْهَدُ لِمُنْعِمِى وَخالِقِى وَرازِقِى وَمُكْرِمِى كَما شَهِدَ لِذاتِهِ، وَشَهِدَتْ لَهُ الْمَلائِكَةُ وَأُولُوا الْعِلْمِ مِنْ عِبادِهِ، بِأَنَّهُ لَاإِلٰهَ إِلّا هُوَ ذُو النِّعَمِ وَالْإِحْسانِ، وَالْكَرَمِ وَالْامْتِنانِ", fa: "و من بنده ناتوان گنه‌کار نافرمان نیازمند ناچیز تو گواهی می‌دهم به نعمت‌دهنده و آفریننده و روزی‌بخش و اکرام کننده‌ام، چنان‌که خود گواهی داد بر یگانگی ذاتش و هم گواهی دادند فرشتگان و صاحبان دانش از بندگانش بر اینکه معبودی جز او نیست، هم او که صاحب نعمت‌ها و احسان و بزرگواری و بخشش است" },
    { ar: "قادِرٌ أَزَلِيٌّ، عالِمٌ أَبَدِيٌّ، حَيٌّ أَحَدِيٌّ، مَوْجُودٌ سَرْمَدِيٌّ، سَمِيعٌ بَصِيرٌ؛ مُرِيدٌ كارِهٌ، مُدْرِكٌ صَمَدِيٌّ، يَسْتَحِقُّ هَذِهِ الصِّفاتِ وَهُوَ عَلَىٰ ما هُوَ عَلَيْهِ فِي عِزِّ صِفاتِهِ، كَانَ قَوِيّاً قَبْلَ وُجُودِ الْقُدْرَةِ وَالْقُوَّةِ، وَكانَ عَلِيماً قَبْلَ إِيجادِ الْعِلْمِ وَالْعِلَّةِ، لَمْ يَزَلْ سُلْطاناً إِذْ لَامَمْلَكَةَ وَلَا مالَ، وَلَمْ يَزَلْ سُبْحَاناً عَلىٰ جَمِيعِ الْأَحْوالِ", fa: "آن توانای بی‌ابتدا، دانای بی‌انتها، زنده یکتا، موجود همیشگی، شنوای بینا؛ خواهان نارضایتی از گناه، دریابنده بی‌نیازی که او شایسته این صفات است و او در پرده توانمندی صفات خویش آن‌گونه است که فقط خود داند، توانا بود پیش از پیدایش توانایی و نیرو، دانا بود پیش از آفریدن دانش و سبب و انگیزه، همواره پادشاه بود آنگاه که نه کشوری بود و نه مالی و همیشه منزّه بود در همه حال" },
    { ar: "وُجُودُهُ قَبْلَ الْقَبْلِ فِى أَزَلِ الْآزالِ، وَبَقاؤُهُ بَعْدَ الْبَعْدِ مِنْ غَيْرِ انْتِقالٍ وَلَا زَوالٍ، غَنِيٌّ فِى الْأَوَّلِ وَالْآخِرِ، مُسْتَغْنٍ فِى الْباطِنِ وَالظَّاهِرِ، لَاجَوْرَ فِى قَضِيَّتِهِ، ولَا مَيْلَ فِى مَشِيئَتِهِ، وَلَا ظُلْمَ فِى تَقْدِيرِهِ، وَلَا مَهْرَبَ مِنْ حُكُومَتِهِ، وَلَا مَلْجَأَ مِنْ سَطَواتِهِ، وَلَا مَنْجٰا مِنْ نَقِماتِهِ", fa: "وجودش پیش از پیش بود در بی‌آغاز آغازها و بقایش بعد از بعد است بدون جابجایی و دگرگونی، توانگر است در آغاز و انجام، بی‌نیاز است در باطن و ظاهر، در داوری‌اش ستمی نیست و در اراده‌اش انحرافی وجود ندارد و در تقدیرش بیدادی به چشم نمی‌خورد و از حکومتش راه گریزی نیست و از شدّت خشمش پناهگاهی وجود ندارد و از انتقامش راه نجاتی نمی‌باشد" },
    { ar: "سَبَقَتْ رَحْمَتُهُ غَضَبَهُ، وَلَا يَفُوتُهُ أَحَدٌ إِذا طَلَبَهُ، أَزاحَ الْعِلَلَ فِى التَّكْلِيفِ، وَسَوَّى التَّوْفِيقَ بَيْنَ الضَّعِيفِ وَالشَّرِيفِ، مَكَّنَ أَداءَ الْمَأْمُورِ، وَسَهَّلَ سَبِيلَ اجْتِنابِ الْمَحْظُورِ، لَمْ يُكَلِّفِ الطَّاعَةَ إِلّا دُونَ الْوُسْعِ وَالطَّاقَةِ، سُبْحانَهُ مَا أَبْيَنَ كَرَمَهُ، وَأَعْلَىٰ شَأْنَهُ ! سُبْحانَهُ مَا أَجَلَّ نَيْلَهُ، وَأَعْظَمَ إِحْسانَهُ !", fa: "رحمتش بر خشمش پیشی گرفت، آن را که بخواهد از چنگش نرهد، موانع تکلیف را برطرف ساخته و توفیق را یکسان قرار داده است بین ناتوان و برجسته، ممکن نمود ادای وظیفه را و راه دوری جستن از حرام را هموار ساخت، طاعت را تکلیف نکرد جز به کمتر از ظرفیت و طاقت، منزّه است او، چه آشکار است کرمش و چه والاتر است مقامش، منزّه است او، چه بزرگ است عطایش و چه بزرگ است احسانش" },
    { ar: "بَعَثَ الْأَنْبِياءَ لِيُبَيِّنَ عَدْلَهُ، وَنَصَبَ الْأَوْصِياءَ لِيُظْهِرَ طَوْلَهُ وَفَضْلَهُ، وَجَعَلَنا مِنْ أُمَّةِ سَيِّدِ الْأَنْبِياءِ، وَخَيْرِ الْأَوْلِياءِ، وَأَفْضَلِ الْأَصْفِياءِ، وَأَعْلَى الْأَزْكِياءِ، مُحَمَّدٍ صَلَّى اللّٰهُ عَلَيْهِ وَ آلِهِ وَسَلَّمَ", fa: "پیامبران را برانگیخت تا دادگری‌اش را بیان کنند و جانشینان آنان را بگماشت تا نمایان سازد عطای بی‌حد و فضلش را و ما را از امت سرور انبیاء و بهترین اولیاء و برترین برگزیده‌ها و والاترین پاکان، محمّد (درود خدا بر او خاندانش) قرار داد" },
    { ar: "آمَنَّا بِهِ وَبِما دَعانا إِلَيْهِ، وَبِالْقُرْآنِ الَّذِى أَنْزَلَهُ عَلَيْهِ، وَبِوَصِيِّهِ الَّذِى نَصَبَهُ يَوْمَ الْغَدِيرِ وَأَشارَ بِقَوْلِهِ: هٰذا عَلِيٌّ إِلَيْهِ، وَأَشْهَدُ أَنَّ الْأَئِمَّةَ الْأَبْرارَ وَالْخُلَفاءَ الْأَخْيارَ بَعْدَ الرَّسُولِ الْمُخْتارِ: عَلِيٌّ قامِعُ الْكُفّارِ، وَمِنْ بَعْدِهِ سَيِّدُ أَوْلادِهِ الْحَسَنُ بْنُ عَلِيٍّ، ثُمَّ أَخُوهُ السِّبْطُ التَّابِعُ لِمَرْضاةِ اللّٰهِ الْحُسَيْنُ، ثُمَّ الْعابِدُ عَلِيٌّ، ثُمَّ الْباقِرُ مُحَمَّدٌ، ثُمَّ الصّادِقُ جَعْفَرٌ؛ ثُمَّ الْكَاظِمُ مُوسىٰ، ثُمَّ الرِّضا عَلِيٌّ، ثُمَّ التَّقِىُّ مُحَمَّدٌ، ثُمَّ النَّقِىُّ عَلِيٌّ، ثُمَّ الزَّكِىُّ الْعَسْكَرِىُّ الْحَسَنُ، ثُمَّ الْحُجَّةُ الْخَلَفُ الْقائِمُ الْمُنْتَظَرُ الْمَهْدِىُّ الْمُرْجَى الَّذِى بِبَقائِهِ بَقِيَتِ الدُّنْيا، وَبِيُمْنِهِ رُزِقَ الْوَرْىٰ، وَبِوُجُودِهِ ثَبَتَتِ الْأَرْضُ وَالسَّماءُ، وَبِهِ يَمْلَأُ اللّٰهُ الْأَرْضَ قِسْطاً وَعَدْلاً بَعْدَما مُلِئَتْ ظُلْماً وَجَوْراً", fa: "به او ایمان آوردیم و به آنچه ما را بسوی آن دعوت کرد و به قرآنی که خدا بر او نازل کرد و به جانشینش که در روز غدیر معین کرد و با گفته‌اش به او اشاره نمود و فرمود: «این علی است» و گواهی می‌دهم که امامان نیکو کردار و جانشینان نیکوکار پس از رسول برگزیده خدایند، علی سرکوبگر کافران است و پس از او سرور فرزندانش حسن بن علی، سپس برادر حضرت حسن نواده پیامبر، پیرو رضای خدا حسین، سپس عبادت‌کننده علی، سپس باقر محمّد، سپس صادق جعفر؛ سپس کاظم موسی، سپس علی رضا، سپس تقی محمّد، سپس نقی علی، سپس زکی عسگری حسن، سپس حجّت، جانشین بر حق، قائم منتظر مهدی، آن امیدبخشی که به بقایش دنیا باقیست و از برکتش بندگان روزی یافته‌اند و به وجودش زمین و آسمان استوار گشته است و خدا به وسیله او زمین را از عدل و داد پر می‌کند، پس‌ازآنکه از ستم و بیداد پر شده" },
    { ar: "وَأَشْهَدُ أَنَّ أَقْوالَهُمْ حُجَّةٌ، وَامْتِثالَهُمْ فَرِيضَةٌ، وَطاعَتَهُمْ مَفْرُوضَةٌ، وَمَوَدَّتَهُمْ لازِمَةٌ مَقْضِيَّةٌ، وَالْاقْتِداءَ بِهِمْ مُنْجِيَةٌ، وَمُخالَفَتَهُمْ مُرْدِيَةٌ، وَهُمْ سَاداتُ أَهْلِ الْجَنَّةِ أَجْمَعِينَ، وَشُفَعاءُ يَوْمِ الدِّينِ، وَأَئِمَّةُ أَهْلِ الْأَرْضِ عَلَى الْيَقِينِ، وَأَفْضَلُ الْأَوْصِياءِ الْمَرْضِيِّينَ", fa: "و گواهی می‌دهم که گفتار آنان حجّت و پیروی از آنان واجب و اطاعتشان فریضه الهی و دوستی با آنان لازم و حتم و اقتدای به آنان نجات‌بخش و مخالفتشان سرنگون کننده است و ایشان سروران همه اهل بهشت و شفیعان روز جزا و امامان اهل زمین بطور یقین و برترین جانشینان پسندیده" },
    { ar: "وَأَشْهَدُ أَنَّ الْمَوْتَ حَقٌّ، وَمُساءَلَةَ الْقَبْرِ حَقٌّ، وَالْبَعْثَ حَقٌّ، وَالنُّشُورَ حَقٌّ، وَالصِّراطَ حَقٌّ، وَالْمِيزانَ حَقٌّ، وَالْحِسابَ حَقٌّ، وَالْكِتابَ حَقٌّ، وَالْجَنَّةَ حَقٌّ، وَالنَّارَ حَقٌّ، وَأَنَّ السَّاعَةَ آتِيَةٌ لَارَيْبَ فِيها، وَأَنَّ اللّٰهَ يَبْعَثُ مَنْ فِى الْقُبُورِ", fa: "و گواهی می‌دهم که مرگ حق است و سؤال قبر و برانگیخته شدن حق است و ورود خلایق به محشر و صراط و میزان و حساب حق و کتاب و بهشت و دوزخ همه و همه حق است و ساعت موعود آمدنی است، هیچ تردیدی در آن نیست و اینکه خدا آنان‌ را که در قبرها هستند برخواهد انگیخت" },
    { ar: "اللّٰهُمَّ فَضْلُكَ رَجَائِى، وَكَرَمُكَ وَرَحْمَتُكَ أَمَلِى، لَاعَمَلَ لِى أَسْتَحِقُّ بِهِ الْجَنَّةَ، وَلَا طاعَةَ لِى أَسْتَوْجِبُ بِهَا الرِّضْوانَ، إِلّا أَنِّى اعْتَقَدْتُ تَوْحِيدَكَ وَعَدْلَكَ، وَارْتَجَيْتُ إِحْسانَكَ وَفَضْلَكَ، وَتَشَفَّعْتُ إِلَيْكَ بِالنَّبِيِّ وَآلِهِ مِنْ أَحِبَّتِكَ، وَأَنْتَ أَكْرَمُ الْأَكْرَمِينَ وَأَرْحَمُ الرَّاحِمِينَ، وَصَلَّى اللّٰهُ عَلىٰ نَبِيِّنا مُحَمَّدٍ وَآلِهِ أَجْمَعِينَ الطَّيِّبِينَ الطَّاهِرِينَ وَسَلَّمَ تَسْلِيماً كَثِيراً كَثِيراً، وَلَا حَوْلَ وَلَا قُوَّةَ إِلّا بِاللّٰهِ الْعَلِيِّ الْعَظِيمِ", fa: "خدایا! بخششت امید من و بزرگواری‌ و رحمتت آرزوی من است، عملی که به آن سزاوار بهشت باشم ندارم و طاعتی که به آن شایسته خشنودی‌ات گردم در پرونده‌ام نیست، جز اینکه یگانگی و دادگری‌ات را باور دارم و به احسان و فضلت دل بستم و از محبوبانت، پیامبر و خاندانش را در بارگاه تو شفیع آوردم و تو کریم‌ترین کریمانی و مهربان‌ترین مهربانانی و درود خدا بر پیامبرمان محمّد و همه خاندانش آن پاکان و پاکیزگان و سلام بسیار او بر آنان باد و هیچ نیرو و توانى نیست جز به خداى بلندمرتبه بزرگ" },
    { ar: "اللّٰهُمَّ يَا أَرْحَمَ الرَّاحِمِينَ إِنِّي أَوْدَعْتُكَ يَقِينِي هٰذَا وَثَباتَ دِينِى وَأَنْتَ خَيْرُ مُسْتَوْدَعٍ، وَقَدْ أَمَرْتَنا بِحِفْظِ الْوَدائِعِ، فَرُدَّهُ عَلَىَّ وَقْتَ حُضُورِ مَوْتِى، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ", fa: "خدایا ای مهربان‌ترین مهربانان، این یقین و استواری در دینم را به تو سپردم و تو بهترین امانت‌داری، چه تو خود ما را به حفظ امانت‌ها فرمان دادی، پس این امانت مرا گاه فرارسیدن مرگم به من برگردان، به رحمتت ای مهربان‌ترین مهربانان" },
    { ar: "رَضِيتُ بِاللّٰهِ رَبّاً، وَبِمُحَمَّدٍ صَلَّى اللّٰهُ عَلَيْهِ وَآلِهِ نَبِيّاً، وَبِالْإِسْلامِ دِيناً، وَبِالْقُرْآنِ كِتاباً، وَبِالْكَعْبَةِ قِبْلَةً، وَبِعَلِيٍّ وَلِيّاً وَ إِماماً، وَبِالْحَسَنِ وَالْحُسَيْنِ وَعَلِيِّ بْنِ الْحُسَيْنِ وَمُحَمَّدِ بْنِ عَلِيٍّ وَجَعْفَرِ بْنِ مُحَمَّدٍ وَمُوسَى بْنِ جَعْفَرٍ وَعَلِيِّ بْنِ مُوسىٰ وَمُحَمَّدِ بْنِ عَلِيٍّ وَعَلِيِّ بْنِ مُحَمَّدٍ وَالْحَسَنِ بْنِ عَلِيٍّ وَالْحُجَّةِ بْنِ الْحَسَنِ صَلَواتُ اللّٰهِ عَلَيْهِمْ أَئِمَّةً . اللّٰهُمَّ إِنِّى رَضِيتُ بِهِمْ أَئِمَّةً فَارْضَنِى لَهُمْ إِنَّكَ عَلىٰ كُلِّ شَىْءٍ قَدِيرٌ", fa: "خشنودم به اینکه خدا پروردگارم باشد و محمّد (درود خدا بر او و خاندانش باد) پیامبرم و اسلام آیینم و قرآن کتابم و کعبه قبله‌ام و علی ولی و امامم و حسن و حسین و علی بن الحسین و محمّد بن علی و جعفر بن محمّد و موسی بن جعفر و علی بن موسی و محمّد بن علی و علی بن محمّد و حسن بن علی و حجّت بن الحسن که درود خدا بر همه آنان باد پیشوایانم باشند. خدایا! خشنودم به اینکه آنان امامانم باشند، پس مرا مورد پسند و خشنودی ایشان قرار ده زیرا تو بر هر کاری توانایی." }
  ],
  fazilat: "فخر المحققین می‌فرماید: «خواندن دعای شریف عدیله و به یاد سپردن معنای آن در ذهن، برای به سلامت رستن از خطر «عدیله عند الموت» سودمند است.»\n\nامام صادق (ع) فرمودند: بعد از هر نماز واجب این دعا را بخوانید تا ایمان شما مستقر شود و از بین نرود.\n\nاین دعا گرچه از معصومین (ع) روایت نشده و از نوشته‌های برخی علماست، اما به دلیل تأکید بزرگان، در میان شیعیان مشهور است و برای حفظ ایمان در لحظه مرگ بسیار مفید است.\n\nاز خواص مهم این دعا: حفظ ایمان در لحظه مرگ، نجات از وسوسه‌های شیطان هنگام مرگ، ثبات قدم در دین، و آرامش قلبی.",
  source: "روایت شیخ طوسی از محمد بن سلیمان دیلمی از امام صادق (ع) • مصباح المتهجد (شیخ طوسی) • مفاتیح الجنان (شیخ عباس قمی) • تأکید فخر المحققین و میرزا حسین نوری (ره)",
  time: "بعد از هر نماز واجب توصیه شده است. همچنین خواندن آن در هر زمان، به ویژه هنگام بیماری و در بستر مرگ برای حفظ ایمان سفارش شده است."
};

/* ============================================================
   RENDER VERSES
   ============================================================ */
function renderVerses() {
  const c = $('#versesContainer');
  c.innerHTML = '';
  DUA_DATA.verses.forEach((v, i) => {
    const el = document.createElement('div');
    el.className = 'verse-card';
    el.innerHTML = `
      <div class="v-head">
        <span class="v-num">${faNum(i + 1)}</span>
        <span class="v-label">بند ${faNum(i + 1)}</span>
      </div>
      <div class="v-ar">${v.ar}</div>
      <div class="v-divider"></div>
      <div class="v-fa">${v.fa}</div>
    `;
    c.appendChild(el);
  });
}

/* ============================================================
   INFO MODAL
   ============================================================ */
$('#modalFazilat').textContent = DUA_DATA.fazilat;
$('#modalSource').textContent = DUA_DATA.source;
$('#modalTime').textContent = DUA_DATA.time;

$('#btnInfo').onclick = () => $('#modalInfo').classList.add('show');
$('#btnSettings').onclick = () => $('#modalSettings').classList.add('show');

$$('[data-close]').forEach(b => b.onclick = () => $('#' + b.dataset.close).classList.remove('show'));
$$('.modal-bg').forEach(m => m.onclick = (e) => { if (e.target === m) m.classList.remove('show'); });

/* ============================================================
   THEME
   ============================================================ */
const sunIcon = `<svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
const moonIcon = `<svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  localStorage.setItem('noor_theme', dark ? 'dark' : 'light');
  if ($('#themeToggle')) $('#themeToggle').innerHTML = dark ? sunIcon : moonIcon;
}
applyTheme(localStorage.getItem('noor_theme') === 'dark');
$('#themeToggle').onclick = () => applyTheme(!document.body.classList.contains('dark'));

/* ============================================================
   SETTINGS
   ============================================================ */
let arSize = parseInt(localStorage.getItem('noor_ar_size') || '24');
let faSize = parseInt(localStorage.getItem('noor_fa_size') || '16');
let lineHeight = localStorage.getItem('noor_lh') || '2.3';
let showTrans = localStorage.getItem('noor_trans') !== 'false';
const fontAr = localStorage.getItem('noor_font_ar') || 'amiri';
const fontFa = localStorage.getItem('noor_font_fa') || 'vazir';

document.body.classList.add('font-ar-' + fontAr);
document.body.classList.add('font-fa-' + fontFa);

function applySettings() {
  document.documentElement.style.setProperty('--fs-ar', arSize + 'px');
  document.documentElement.style.setProperty('--fs-fa', faSize + 'px');
  document.documentElement.style.setProperty('--line-height', lineHeight);
  $$('.verse-card').forEach(v => v.classList.toggle('hide-trans', !showTrans));
  if ($('#arSizeVal')) $('#arSizeVal').textContent = faNum(arSize);
  if ($('#faSizeVal')) $('#faSizeVal').textContent = faNum(faSize);
  localStorage.setItem('noor_ar_size', arSize);
  localStorage.setItem('noor_fa_size', faSize);
  localStorage.setItem('noor_lh', lineHeight);
  localStorage.setItem('noor_trans', showTrans);
}
applySettings();

$$('[data-ar-step]').forEach(b => b.onclick = () => {
  arSize = Math.max(16, Math.min(42, arSize + parseInt(b.dataset.arStep) * 2));
  applySettings();
});
$$('[data-fa-step]').forEach(b => b.onclick = () => {
  faSize = Math.max(12, Math.min(24, faSize + parseInt(b.dataset.faStep) * 2));
  applySettings();
});
$$('[data-lh]').forEach(b => {
  if (b.dataset.lh === lineHeight) b.classList.add('active');
  b.onclick = () => {
    $$('[data-lh]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    lineHeight = b.dataset.lh;
    applySettings();
  };
});
$$('[data-trans]').forEach(b => {
  const isOn = (b.dataset.trans === '1') === showTrans;
  b.classList.toggle('active', isOn);
  b.onclick = () => {
    $$('[data-trans]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    showTrans = b.dataset.trans === '1';
    applySettings();
  };
});
$$('[data-font-ar]').forEach(b => {
  if (b.dataset.fontAr === fontAr) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-ar]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-ar-\S+/g, '').trim();
    document.body.classList.add('font-ar-' + b.dataset.fontAr);
    localStorage.setItem('noor_font_ar', b.dataset.fontAr);
  };
});
$$('[data-font-fa]').forEach(b => {
  if (b.dataset.fontFa === fontFa) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-fa]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-fa-\S+/g, '').trim();
    document.body.classList.add('font-fa-' + b.dataset.fontFa);
    localStorage.setItem('noor_font_fa', b.dataset.fontFa);
  };
});

/* ============================================================
   BACK BUTTON
   ============================================================ */
$('#btnBack').onclick = () => {
  if (document.referrer && (document.referrer.includes('list.html') || document.referrer.includes('doa.html'))) history.back();
  else location.href = 'list.html?type=problem';
};

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg) {
  const t = $('#toast');
  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   INIT
   ============================================================ */
renderVerses();
applySettings();

console.log('🤲 دعای عدیل | NOOR – بارگذاری شد. تعداد بندها:', DUA_DATA.verses.length);
</script>
</body>
</html>
