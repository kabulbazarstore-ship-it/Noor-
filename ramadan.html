<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123C32">
<title>دعاهای رمضان | نــــور NOOR</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Lateef&family=Reem+Kufi:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F5EE; --surface: #FFFDF8; --surface2: #F1ECE2;
  --brand: #123C32; --brand2: #2D6657;
  --gold: #B88A3B; --gold2: #D6B56A;
  --gold-soft: rgba(184, 138, 59, 0.10);
  --gold-border: rgba(184, 138, 59, 0.20);
  --text: #17231F; --text-2: #3d4a44; --muted: #66716C;
  --divider: #E7E0D3;
  --arabic: #123C32; --translation: #3d4a44;
  --shadow: 0 4px 20px rgba(18, 60, 50, 0.05);
  --shadow-sm: 0 2px 8px rgba(18, 60, 50, 0.03);
  --radius: 16px; --radius-sm: 12px;
  --trans: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font-fa: 'Vazirmatn', Tahoma, sans-serif;
  --font-ar: 'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif;
  --fs-ar: 26px; --fs-fa: 16px; --line-height: 2.3;
}
body.dark {
  --bg: #080E0C; --surface: #101A16; --surface2: #16231E;
  --brand: #9FC5B5; --brand2: #B9D5C8;
  --gold: #D2AC5C; --gold2: #E4C982;
  --gold-soft: rgba(210, 172, 92, 0.08);
  --gold-border: rgba(210, 172, 92, 0.16);
  --text: #F4EFE4; --text-2: #c8d2cc; --muted: #A8B3AD;
  --divider: #26352F;
  --arabic: #e8e2d2; --translation: #c8d2cc;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.20);
}
body.font-ar-amiri { --font-ar: 'Amiri', serif; }
body.font-ar-scheherazade { --font-ar: 'Scheherazade New', serif; }
body.font-ar-naskh { --font-ar: 'Noto Naskh Arabic', serif; }
body.font-ar-lateef { --font-ar: 'Lateef', serif; }
body.font-ar-reem { --font-ar: 'Reem Kufi', sans-serif; }
body.font-fa-vazir { --font-fa: 'Vazirmatn', Tahoma, sans-serif; }
body.font-fa-naskh { --font-fa: 'Noto Naskh Arabic', serif; }
body.font-fa-amiri { --font-fa: 'Amiri', serif; }
body.font-fa-scheherazade { --font-fa: 'Scheherazade New', serif; }
body.font-fa-lateef { --font-fa: 'Lateef', serif; }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font-fa); background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.7; font-size: 16px;
  transition: background var(--trans), color var(--trans);
  overflow-x: hidden;
}
button, input { font-family: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: var(--trans); }
svg { display: block; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-sm { width: 18px; height: 18px; }
.app { max-width: 780px; margin: 0 auto; padding: 0 14px 40px; }

.header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 6px;
  padding: 12px 0; background: var(--bg);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.hbtn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--gold-border);
  color: var(--gold); flex: none;
}
.hbtn:hover { background: var(--gold-soft); border-color: var(--gold); }
.hbtn:active { transform: scale(0.94); }
.brand { flex: 1; text-align: center; line-height: 1.15; min-width: 0; }
.brand h1 {
  font-family: 'Amiri', serif;
  font-size: 1.15rem; font-weight: 700;
  color: var(--brand); letter-spacing: 0.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.dark .brand h1 { color: var(--gold); }
.brand .brand-noor {
  display: block; font-family: 'Amiri', serif;
  font-size: 0.65rem; font-weight: 700;
  color: var(--gold); letter-spacing: 6px;
  margin-top: 3px;
}

/* DAY NAV (نوار انتخاب سریع روز) */
.day-nav {
  display: flex; gap: 6px;
  overflow-x: auto;
  padding: 12px 2px 14px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.day-nav::-webkit-scrollbar { display: none; }
.day-nav button {
  flex-shrink: 0;
  padding: 6px 12px;
  border-radius: 30px;
  background: var(--surface);
  border: 1px solid var(--gold-border);
  color: var(--text-2);
  font-size: 0.72rem; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: var(--trans);
  white-space: nowrap;
}
.day-nav button:hover {
  background: var(--gold-soft);
  border-color: var(--gold);
  color: var(--gold);
}
.day-nav button.active {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  border-color: var(--gold);
  color: #fff;
  box-shadow: 0 4px 12px rgba(184, 138, 59, 0.3);
}

/* PREV/NEXT */
.prev-next {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.prev-next button {
  flex: 1;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--gold-border);
  color: var(--text-2);
  font-size: 0.78rem; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: var(--trans);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.prev-next button:hover:not(:disabled) {
  background: var(--gold-soft);
  border-color: var(--gold);
  color: var(--gold);
}
.prev-next button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.prev-next button svg { width: 16px; height: 16px; }

/* SCROLL CONTENT */
.scroll-content {
  max-height: calc(100vh - 200px);
  overflow-y: auto;
  padding: 0 0 20px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--gold-border) transparent;
}
.scroll-content::-webkit-scrollbar { width: 4px; }
.scroll-content::-webkit-scrollbar-track { background: transparent; }
.scroll-content::-webkit-scrollbar-thumb { background: var(--gold-border); border-radius: 10px; }

.top-orn {
  position: relative; overflow: hidden;
  text-align: center;
  padding: 18px 14px 20px;
  margin-bottom: 14px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--gold-border);
  box-shadow: var(--shadow);
}
.top-orn .orn-svg {
  position: absolute; color: var(--gold); opacity: 0.10; pointer-events: none;
}
.top-orn .orn-svg.tr { top: -6px; right: -6px; width: 80px; height: 80px; }
.top-orn .orn-svg.bl { bottom: -6px; left: -6px; width: 80px; height: 80px; transform: rotate(180deg); }
.top-orn .orn-title {
  font-family: 'Amiri', serif;
  font-size: 1.45rem; font-weight: 700;
  color: var(--brand); letter-spacing: 1px;
  margin-bottom: 3px;
}
body.dark .top-orn .orn-title { color: var(--gold); }
.top-orn .orn-sub { font-size: 0.78rem; color: var(--muted); }
.top-orn .orn-div {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin: 8px auto 0; width: 80px;
}
.top-orn .orn-div::before, .top-orn .orn-div::after {
  content: ""; flex: 1; height: 1px; background: var(--gold-border);
}
.top-orn .orn-div svg { color: var(--gold); width: 12px; height: 12px; }

.verse-card {
  background: var(--surface);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius);
  padding: 16px 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  transition: var(--trans);
  position: relative;
}
.verse-card:hover {
  border-color: var(--gold);
  box-shadow: 0 4px 16px rgba(184, 138, 59, 0.08);
}
.verse-card .v-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.verse-card .v-num {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px; padding: 0 8px;
  border-radius: 7px;
  background: var(--gold-soft); color: var(--gold);
  font-family: 'Amiri', serif; font-weight: 700;
  font-size: 0.72rem;
  border: 1px solid var(--gold-border);
}
.verse-card .v-label {
  font-size: 0.68rem; color: var(--muted);
  font-weight: 600;
}
.verse-card .v-ar {
  font-family: var(--font-ar);
  font-size: var(--fs-ar);
  line-height: var(--line-height);
  color: var(--arabic);
  text-align: center;
  font-weight: 400;
  margin-bottom: 12px;
  padding: 4px 2px;
  white-space: pre-line;
}
.verse-card .v-ar br { display: block; content: ""; margin: 8px 0; }
.verse-card .v-divider {
  height: 1px;
  background: repeating-linear-gradient(90deg, var(--gold-border) 0, var(--gold-border) 3px, transparent 3px, transparent 6px);
  margin: 0 auto 12px;
  width: 50px;
}
.verse-card .v-fa {
  font-family: var(--font-fa);
  font-size: var(--fs-fa);
  line-height: 1.95;
  color: var(--translation);
  text-align: justify;
  padding: 0 2px;
  white-space: pre-line;
}
.verse-card.hide-trans .v-fa { display: none; }
.verse-card.hide-trans .v-divider { display: none; }
.verse-card.hide-trans .v-ar { margin-bottom: 0; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 200; padding: 0 12px 12px;
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 520px; max-height: 85vh;
  overflow-y: auto; background: var(--surface);
  border-radius: 24px 24px 18px 18px;
  padding: 20px 18px 26px;
  border: 1px solid var(--gold-border);
  animation: slideUp 0.3s ease;
  box-shadow: var(--shadow);
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--divider);
}
.modal-head h3 {
  font-size: 1rem; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  color: var(--text);
}
.modal-head h3 svg { color: var(--gold); width: 20px; height: 20px; flex: none; }
.modal-close {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--muted);
}
.modal-close:hover { color: var(--gold); border-color: var(--gold); }

.set-group { margin-bottom: 16px; }
.set-group > label {
  display: block; font-size: 0.75rem; font-weight: 700;
  color: var(--muted); margin-bottom: 8px;
}
.set-options { display: flex; flex-wrap: wrap; gap: 6px; }
.set-opt {
  padding: 6px 12px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--text-2); font-size: 0.75rem;
  font-weight: 600; cursor: pointer; transition: var(--trans);
}
.set-opt:hover { border-color: var(--gold-border); color: var(--gold); }
.set-opt.active { background: var(--gold-soft); color: var(--gold); border-color: var(--gold); }
.set-ctrl {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--divider);
  border-radius: 10px; padding: 4px; width: fit-content;
}
.set-ctrl button {
  width: 34px; height: 34px; border-radius: 8px;
  color: var(--muted); font-weight: 700; font-size: 1rem;
}
.set-ctrl button:hover { background: var(--gold-soft); color: var(--gold); }
.set-ctrl .val {
  min-width: 40px; text-align: center;
  color: var(--gold); font-weight: 700; font-size: 0.82rem;
}
.font-preview { font-family: 'Amiri', serif; font-size: 1.1rem; }

.info-block {
  padding: 14px 16px;
  background: var(--surface2);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
}
.info-block h4 {
  font-size: 0.8rem; font-weight: 700;
  color: var(--gold); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.info-block h4 svg { width: 16px; height: 16px; flex: none; }
.info-block p {
  font-size: 0.8rem; line-height: 1.95;
  color: var(--text-2); text-align: justify;
  white-space: pre-line;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-around; align-items: center;
  background: var(--surface); border-top: 1px solid var(--divider);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  height: 62px;
  box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.06);
}
body.dark .bottom-nav { box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.4); }
.nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; flex: 1; padding: 6px 4px; border-radius: 12px; color: var(--muted);
  transition: var(--trans); font-size: 0.6rem; font-weight: 500;
  text-decoration: none; background: none; border: 0; cursor: pointer;
}
.nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover, .nav-btn.active { color: var(--gold); }

.toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--brand); color: #fff;
  padding: 10px 18px; border-radius: 14px;
  font-size: 0.8rem; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 300; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--gold-border); max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { color: var(--gold2); width: 16px; height: 16px; }

.app { padding-bottom: 80px; }

@media (max-width: 480px) {
  .brand h1 { font-size: 1rem; }
  :root { --fs-ar: 24px; --fs-fa: 15px; }
  .hbtn { width: 36px; height: 36px; }
  .hbtn .icon { width: 18px; height: 18px; }
  .verse-card { padding: 14px 12px; }
  .top-orn .orn-title { font-size: 1.25rem; }
  .day-nav button { padding: 5px 10px; font-size: 0.68rem; }
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <button class="hbtn" id="btnBack" aria-label="بازگشت">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </button>
    <div class="brand">
      <h1 id="pageTitle">دعاهای رمضان</h1>
      <span class="brand-noor">نور</span>
    </div>

    <button class="hbtn" id="btnInfo" aria-label="اطلاعات و فضیلت">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    </button>

    <button class="hbtn" id="btnSettings" aria-label="تنظیمات مطالعه">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>

    <button class="hbtn" id="themeToggle" aria-label="تغییر تم">
      <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </header>

  <!-- DAY NAV -->
  <nav class="day-nav" id="dayNav"></nav>

  <!-- SCROLL CONTENT -->
  <div class="scroll-content" id="scrollContent">

    <!-- PREV/NEXT -->
    <div class="prev-next">
      <button id="prevBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
        روز قبل
      </button>
      <button id="nextBtn">
        روز بعد
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
    </div>

    <div id="versesContainer"></div>

  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-btn" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 21v-6h4v6"/></svg>
    <span>خانه</span>
  </a>
  <a class="nav-btn" href="quran.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      <path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/>
    </svg>
    <span>قرآن</span>
  </a>
  <a class="nav-btn" href="ziyarat.html">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>زیارت</span>
  </a>
  <a class="nav-btn" href="imam.html">
    <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <span>امام زمان</span>
  </a>
</nav>

<!-- INFO MODAL -->
<div class="modal-bg" id="modalInfo">
  <div class="modal">
    <div class="modal-head">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        درباره دعاهای رمضان
      </h3>
      <button class="modal-close" data-close="modalInfo">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="info-block">
      <h4>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        فضیلت و خواص
      </h4>
      <p id="modalFazilat"></p>
    </div>

    <div class="info-block">
      <h4>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        منبع
      </h4>
      <p id="modalSource"></p>
    </div>

<script>

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const faNum = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

/* ============================================================
   DATA — ۳۰ دعای روزهای ماه رمضان
   ============================================================ */
const DUA_DATA = {
  title: "دعاهای رمضان",
  days: [
    { day: 1, ar: "اللَّهُمَّ اجْعَلْ صِيَامِي فِيهِ صِيَامَ الصَّائِمِينَ، وَقِيَامِي فِيهِ قِيَامَ الْقَائِمِينَ، وَنَبِّهْنِي فِيهِ عَنْ نَوْمَةِ الْغَافِلِينَ، وَهَبْ لِي جُرْمِي فِيهِ يَا إِلَهَ الْعَالَمِينَ، وَاعْفُ عَنِّي يَا عَافِياً عَنِ الْمُجْرِمِينَ.", fa: "خدایا، روزه‌ام را در این ماه، روزه‌ی روزه‌داران قرار ده و شب‌زنده‌داری‌ام را شب‌زنده‌داری شب‌زنده‌داران و بیدارم کن در آن از خواب بی‌خبران و ببخش گناهم را در آن، ای معبود جهانیان و از من درگذر، ای درگذرنده از گنه‌کاران." },
    { day: 2, ar: "اللَّهُمَّ قَرِّبْنِي فِيهِ إِلَى مَرْضَاتِكَ، وَجَنِّبْنِي فِيهِ مِنْ سَخَطِكَ وَنَقِمَاتِكَ، وَوَفِّقْنِي فِيهِ لِقِرَاءَةِ آيَاتِكَ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.", fa: "خدایا، مرا در این ماه به خشنودی‌ات نزدیک کن و از خشم و انتقامت برکنار دار و به قرائت آیاتت موفق کن، ای مهربان‌ترین مهربانان." },
    { day: 3, ar: "اللَّهُمَّ ارْزُقْنِي فِيهِ الذِّهْنَ وَالتَّنْبِيهَ، وَبَاعِدْنِي فِيهِ مِنَ السَّفَاهَةِ وَالتَّمْوِيهِ، وَاجْعَلْ لِي نَصِيباً مِنْ كُلِّ خَيْرٍ تُنْزِلُ فِيهِ، بِجُودِكَ يَا أَجْوَدَ الْأَجْوَدِينَ.", fa: "خدایا، در این ماه به من تیزهوشی و بیداری عنایت فرما و از بی‌خردی و اشتباه دورم ساز و از هر خیری که در این ماه نازل می‌کنی، برایم بهره‌ای قرار ده، به حق جودت ای جودمندترین جودمندان." },
    { day: 4, ar: "اللَّهُمَّ قَوِّنِي فِيهِ عَلَى إِقَامَةِ أَمْرِكَ، وَأَذِقْنِي فِيهِ حَلَاوَةَ ذِكْرِكَ، وَأَوْزِعْنِي فِيهِ لِأَدَاءِ شُكْرِكَ بِكَرَمِكَ، وَاحْفَظْنِي فِيهِ بِحِفْظِكَ وَسِتْرِكَ، يَا أَبْصَرَ النَّاظِرِينَ.", fa: "خدایا، در این ماه برای برپاداشتن امرت نیرومندم ساز و شیرینی ذکرت را به من بچشان و ادای شکرت را به من الهام کن و به نگهداری و پوششت نگاهم دار، ای بیناترین بینندگان." },
    { day: 5, ar: "اللَّهُمَّ اجْعَلْنِي فِيهِ مِنَ الْمُسْتَغْفِرِينَ، وَاجْعَلْنِي فِيهِ مِنْ عِبَادِكَ الصَّالِحِينَ الْقَانِتِينَ، وَاجْعَلْنِي فِيهِ مِنْ أَوْلِيَائِكَ الْمُقَرَّبِينَ، بِرَأْفَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.", fa: "خدایا، قرار ده مرا در این ماه از آمرزش‌جویان و از بندگان شایسته فرمانبردار و از اولیای مقرّبت، به رأفتت ای مهربان‌ترین مهربانان." },
    { day: 6, ar: "اللَّهُمَّ لَا تَخْذُلْنِي فِيهِ لِتَعَرُّضِ مَعْصِيَتِكَ، وَلَا تَضْرِبْنِي بِسِيَاطِ نَقِمَتِكَ، وَزَحْزِحْنِي فِيهِ مِنْ مُوجِبَاتِ سَخَطِكَ، بِمَنِّكَ وَأَيَادِيكَ، يَا مُنْتَهَى رَغْبَةِ الرَّاغِبِينَ.", fa: "خدایا، مرا در این ماه در معرض نافرمانی‌ات وامگذار و با تازیانه‌های انتقامت عذابم مکن و از انگیزه‌های خشمت دورم بدار، به مهرورزی و عطاهایت، ای نهایت شوق مشتاقان." },
    { day: 7, ar: "اللَّهُمَّ أَعِنِّي فِيهِ عَلَى صِيَامِهِ وَقِيَامِهِ، وَجَنِّبْنِي فِيهِ مِنْ هَفَوَاتِهِ وَآثَامِهِ، وَارْزُقْنِي فِيهِ ذِكْرَكَ بِدَوَامِهِ، بِتَوْفِيقِكَ يَا هَادِيَ الْمُضِلِّينَ.", fa: "خدایا، مرا در این ماه بر روزه و شب‌زنده‌داری‌اش یاری ده و از لغزش‌ها و گناهانش دورم بدار و ذکرت را همواره روزی‌ام کن، به توفیقت ای راهنمای گمراهان." },
    { day: 8, ar: "اللَّهُمَّ ارْزُقْنِي فِيهِ رَحْمَةَ الْأَيْتَامِ، وَإِطْعَامَ الطَّعَامِ، وَإِفْشَاءَ السَّلَامِ، وَصُحْبَةَ الْكِرَامِ، بِطَوْلِكَ يَا مَلْجَأَ الْآمِلِينَ.", fa: "خدایا، در این ماه مهرورزی به ایتام و خوراندن طعام و آشکار کردن سلام و هم‌نشینی با اهل کرامت را نصیبم فرما، به عطایت ای پناهگاه آرزومندان." },
    { day: 9, ar: "اللَّهُمَّ اجْعَلْ لِي فِيهِ نَصِيباً مِنْ رَحْمَتِكَ الْوَاسِعَةِ، وَاهْدِنِي فِيهِ لِبَرَاهِينِكَ السَّاطِعَةِ، وَخُذْ بِنَاصِيَتِي إِلَى مَرْضَاتِكَ الْجَامِعَةِ، بِمَحَبَّتِكَ يَا أَمَلَ الْمُشْتَاقِينَ.", fa: "خدایا، برای من در این ماه بهره‌ای از رحمت گسترده‌ات قرار ده و به جانب دلایل درخشانت راهنمایی کن و مهارم را گرفته به سوی خشنودی فراگیرت متوجه کن، به مهرت ای آرزوی مشتاقان." },
    { day: 10, ar: "اللَّهُمَّ اجْعَلْنِي فِيهِ مِنَ الْمُتَوَكِّلِينَ عَلَيْكَ، وَاجْعَلْنِي فِيهِ مِنَ الْفَائِزِينَ لَدَيْكَ، وَاجْعَلْنِي فِيهِ مِنَ الْمُقَرَّبِينَ إِلَيْكَ، بِإِحْسَانِكَ يَا غَايَةَ الطَّالِبِينَ.", fa: "خدایا، مرا در این ماه از توکل‌کنندگان و از رستگاران نزد خود و از مقرّبان درگاهت قرار بده، به احسانت ای هدف جویندگان." },
    { day: 11, ar: "اللَّهُمَّ حَبِّبْ إِلَيَّ فِيهِ الْإِحْسَانَ، وَكَرِّهْ إِلَيَّ فِيهِ الْفُسُوقَ وَالْعِصْيَانَ، وَحَرِّمْ عَلَيَّ فِيهِ السَّخَطَ وَالنِّيرَانَ، بِعَوْنِكَ يَا غِيَاثَ الْمُسْتَغِيثِينَ.", fa: "خدایا، در این ماه نیکی را پسندیده من گردان و نادرستی‌ها و نافرمانی‌ها را مورد کراهت من قرار ده و خشم و آتش برافروخته را بر من حرام گردان، به یاری‌ات ای فریادرس دادخواهان." },
    { day: 12, ar: "اللَّهُمَّ زَيِّنِّي فِيهِ بِالسِّتْرِ وَالْعَفَافِ، وَاسْتُرْنِي فِيهِ بِلِبَاسِ الْقُنُوعِ وَالْكَفَافِ، وَاحْمِلْنِي فِيهِ عَلَى الْعَدْلِ وَالْإِنْصَافِ، وَآمِنِّي فِيهِ مِنْ كُلِّ مَا أَخَافُ، بِعِصْمَتِكَ يَا عِصْمَةَ الْخَائِفِينَ.", fa: "خدایا، مرا در این ماه به پوشش و پاکدامنی بیارای و لباس قناعت و اندازه‌نگهداشتن در زندگی را به من بپوشان و بر عدالت و انصاف وادارم کن و مرا در این ماه از هرچه می‌ترسم ایمنی ده، به نگهداری‌ات ای نگهدارنده هراسندگان." },
    { day: 13, ar: "اللَّهُمَّ طَهِّرْنِي فِيهِ مِنَ الدَّنَسِ وَالْأَقْذَارِ، وَصَبِّرْنِي فِيهِ عَلَى كَائِنَاتِ الْأَقْدَارِ، وَوَفِّقْنِي فِيهِ لِلتُّقَى وَصُحْبَةِ الْأَبْرَارِ، بِعَوْنِكَ يَا قُرَّةَ عَيْنِ الْمَسَاكِينِ.", fa: "خدایا، مرا در این ماه از آلودگی‌ها و ناپاکی‌ها پاک کن و بر شدنی‌های مورد تقدیرت شکیبایم گردان و به پرهیزگاری و هم‌نشینی با نیکان توفیقم ده، به یاری‌ات ای نور چشم درماندگان." },
    { day: 14, ar: "اللَّهُمَّ لَا تُؤَاخِذْنِي فِيهِ بِالْعَثَرَاتِ، وَأَقِلْنِي فِيهِ مِنَ الْخَطَايَا وَالْهَفَوَاتِ، وَلَا تَجْعَلْنِي فِيهِ غَرَضاً لِلْبَلَايَا وَالْآفَاتِ، بِعِزَّتِكَ يَا عِزَّ الْمُسْلِمِينَ.", fa: "خدایا، مرا در این ماه بر لغزش‌ها سرزنش مکن و از خطاها و افتادن در گناهان دور بدار و هدف بلاها و آفات قرار مده، به عزّتت ای عزّت مسلمانان." },
    { day: 15, ar: "اللَّهُمَّ ارْزُقْنِي فِيهِ طَاعَةَ الْخَاشِعِينَ، وَاشْرَحْ فِيهِ صَدْرِي بِإِنَابَةِ الْمُخْبِتِينَ، بِأَمَانِكَ يَا أَمَانَ الْخَائِفِينَ.", fa: "خدایا، در این ماه طاعت فروتنان را نصیبم کن و سینه‌ام را برای بازگشت به سویت همانند بازگشت خاضعان باز کن، به امان دادنت ای امان‌ده هراسندگان." },
    { day: 16, ar: "اللَّهُمَّ وَفِّقْنِي فِيهِ لِمُوَافَقَةِ الْأَبْرَارِ، وَجَنِّبْنِي فِيهِ مُرَافَقَةَ الْأَشْرَارِ، وَآوِنِّي فِيهِ بِرَحْمَتِكَ إِلَى دَارِ الْقَرَارِ، بِإِلَهِيَّتِكَ يَا إِلَهَ الْعَالَمِينَ.", fa: "خدایا، مرا در این ماه به همراهی و همسویی با نیکان توفیق ده و از هم‌نشینی با بدان دور بدار و به حق رحمتت به خانه آرامش جایم ده، به پرستیدگی‌ات ای پرستیده جهانیان." },
    { day: 17, ar: "اللَّهُمَّ اهْدِنِي فِيهِ لِصَالِحِ الْأَعْمَالِ، وَاقْضِ لِي فِيهِ الْحَوَائِجَ وَالْآمَالَ، يَا مَنْ لَا يَحْتَاجُ إِلَى التَّفْسِيرِ وَالسُّؤَالِ، يَا عَالِماً بِمَا فِي صُدُورِ الْعَالَمِينَ، صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ الطَّاهِرِينَ.", fa: "خدایا، مرا در این ماه به سوی کارهای شایسته هدایت فرما و حاجت‌ها و آرزوهایم را برآور، ای آن که نیاز به روشنگری و پرسش ندارد، ای آگاه به آنچه در سینه جهانیان است بر محمّد و خاندان پاکش درود فرست." },
    { day: 18, ar: "اللَّهُمَّ نَبِّهْنِي فِيهِ لِبَرَكَاتِ أَسْحَارِهِ، وَنَوِّرْ فِيهِ قَلْبِي بِضِيَاءِ أَنْوَارِهِ، وَخُذْ بِكُلِّ أَعْضَائِي إِلَى اتِّبَاعِ آثَارِهِ، بِنُورِكَ يَا مُنَوِّرَ قُلُوبِ الْعَارِفِينَ.", fa: "خدایا، مرا در این ماه به برکت‌های سحرهایش آگاه کن و دلم را با روشنایی انوارش روشنی بخش و تمام اعضایم را به پیروی آثارش بگمار، به نورت ای نوربخش دل‌های عارفان." },
    { day: 19, ar: "اللَّهُمَّ وَفِّرْ فِيهِ حَظِّي مِنْ بَرَكَاتِهِ، وَسَهِّلْ سَبِيلِي إِلَى خَيْرَاتِهِ، وَلَا تَحْرِمْنِي قَبُولَ حَسَنَاتِهِ، يَا هَادِياً إِلَى الْحَقِّ الْمُبِينِ.", fa: "خدایا، در این ماه بهره‌ام را از برکت‌هایش کامل گردان و راهم را به سوی نیکی‌هایش هموار نما و از پذیرفتن خوبی‌هایش محرومم مساز، ای هدایت‌کننده به سوی حق آشکار." },
    { day: 20, ar: "اللَّهُمَّ افْتَحْ لِي فِيهِ أَبْوَابَ الْجِنَانِ، وَأَغْلِقْ عَنِّي فِيهِ أَبْوَابَ النِّيرَانِ، وَوَفِّقْنِي فِيهِ لِتِلَاوَةِ الْقُرْآنِ، يَا مُنْزِلَ السَّكِينَةِ فِي قُلُوبِ الْمُؤْمِنِينَ.", fa: "خدایا، در این ماه درهای بهشت‌هایت را به رویم باز کن و درهای آتش دوزخ را به رویم بربند و به تلاوت قرآن موفقم بدار، ای فروفرستنده آرامش در دل مؤمنان." },
    { day: 21, ar: "اللَّهُمَّ اجْعَلْ لِي فِيهِ إِلَى مَرْضَاتِكَ دَلِيلاً، وَلَا تَجْعَلْ لِلشَّيْطَانِ فِيهِ عَلَيَّ سَبِيلاً، وَاجْعَلِ الْجَنَّةَ لِي مَنْزِلاً وَمَقِيلاً، يَا قَاضِيَ حَوَائِجِ الطَّالِبِينَ.", fa: "خدایا، در این ماه برای من به سوی خشنودی‌ات دلیلی قرار ده و برای شیطان راهی به سوی من قرار مده و بهشت را منزل و آسایشگاهم قرار ده، ای برآورنده حاجات خواهندگان." },
    { day: 22, ar: "اللَّهُمَّ افْتَحْ لِي فِيهِ أَبْوَابَ فَضْلِكَ، وَأَنْزِلْ عَلَيَّ فِيهِ بَرَكَاتِكَ، وَوَفِّقْنِي فِيهِ لِمُوجِبَاتِ مَرْضَاتِكَ، وَأَسْكِنِّي فِيهِ بُحْبُوحَاتِ جَنَّاتِكَ، يَا مُجِيبَ دَعْوَةِ الْمُضْطَرِّينَ.", fa: "خدایا، در این ماه درهای احسانت را به روی من بگشا و برکاتت را بر من نازل فرما و به انگیزه‌های خشنودی‌ات موفقم بدار و در میان بهشت‌هایت جایم ده، ای برآورنده خواهش درماندگان." },
    { day: 23, ar: "اللَّهُمَّ اغْسِلْنِي فِيهِ مِنَ الذُّنُوبِ، وَطَهِّرْنِي فِيهِ مِنَ الْعُيُوبِ، وَامْتَحِنْ قَلْبِي فِيهِ بِتَقْوَى الْقُلُوبِ، يَا مُقِيلَ عَثَرَاتِ الْمُذْنِبِينَ.", fa: "خدایا، در این ماه از گناهانم شست‌وشویم ده و از عیب‌ها پاکم کن و دلم را به پرهیزکاری دل‌ها بیازمای، ای نادیده‌گیرنده لغزش‌های اهل گناه." },
    { day: 24, ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ فِيهِ مَا يُرْضِيكَ، وَأَعُوذُ بِكَ مِمَّا يُؤْذِيكَ، وَأَسْأَلُكَ التَّوْفِيقَ فِيهِ لِأَنْ أُطِيعَكَ وَلَا أَعْصِيكَ، يَا جَوَادَ السَّائِلِينَ.", fa: "خدایا، در این ماه آنچه تو را خشنود می‌کند از تو درخواست می‌کنم و از آنچه تو را ناخشنود می‌کند به تو پناه می‌آورم و از تو در این ماه توفیق اطاعت و ترک نافرمانی‌ات را خواستارم، ای بخشنده به نیازمندان." },
    { day: 25, ar: "اللَّهُمَّ اجْعَلْنِي فِيهِ مُحِبّاً لِأَوْلِيَائِكَ، وَمُعَادِياً لِأَعْدَائِكَ، مُسْتَنّاً بِسُنَّةِ خَاتَمِ أَنْبِيَائِكَ، يَا عَاصِمَ قُلُوبِ النَّبِيِّينَ.", fa: "خدایا، مرا در این ماه دلبسته اولیائت و دشمن دشمنانت قرار ده و آراسته به راه و روش خاتم پیامبرانت گردان، ای نگهدارنده دل‌های پیامبران." },

    { day: 27, ar: "اللَّهُمَّ ارْزُقْنِي فِيهِ فَضْلَ لَيْلَةِ الْقَدْرِ، وَصَيِّرْ أُمُورِي فِيهِ مِنَ الْعُسْرِ إِلَى الْيُسْرِ، وَاقْبَلْ مَعَاذِيرِي، وَحُطَّ عَنِّيَ الذَّنْبَ وَالْوِزْرَ، يَا رَءُوفاً بِعِبَادِهِ الصَّالِحِينَ.", fa: "خدایا، در این ماه فضیلت شب قدر را روزی‌ام ساز و کارهایم را از سختی به آسانی برگردان و پوزش‌هایم را بپذیر و گناه و بار گران را از پشتم بریز، ای مهربان به بندگان شایسته‌اش." },
    { day: 28, ar: "اللَّهُمَّ وَفِّرْ حَظِّي فِيهِ مِنَ النَّوَافِلِ، وَأَكْرِمْنِي فِيهِ بِإِحْضَارِ الْمَسَائِلِ، وَقَرِّبْ فِيهِ وَسِيلَتِي إِلَيْكَ مِنْ بَيْنِ الْوَسَائِلِ، يَا مَنْ لَا يَشْغَلُهُ إِلْحَاحُ الْمُلِحِّينَ.", fa: "خدایا، بهره‌ام را در این ماه از مستحبات فراوان کن و مرا با تحقق درخواست‌ها گرامی دار و از میان وسایل، وسیله‌ام را به سویت نزدیک کن، ای که پافشاری اصرارورزان مشغولش نسازد." },
    { day: 29, ar: "اللَّهُمَّ غَشِّنِي فِيهِ بِالرَّحْمَةِ، وَارْزُقْنِي فِيهِ التَّوْفِيقَ وَالْعِصْمَةَ، وَطَهِّرْ قَلْبِي مِنْ غَيَاهِبِ التُّهَمَةِ، يَا رَحِيماً بِعِبَادِهِ الْمُؤْمِنِينَ.", fa: "خدایا، مرا در این ماه با رحمتت فروگیر و توفیق و خودنگهداری نصیبم کن و از تیرگی‌های تهمت دلم را پاک گردان، ای مهربان به بندگان با ایمان." },
    { day: 30, ar: "اللَّهُمَّ اجْعَلْ صِيَامِي فِيهِ بِالشُّكْرِ وَالْقَبُولِ عَلَى مَا تَرْضَاهُ وَيَرْضَاهُ الرَّسُولُ، مُحْكَمَةً فُرُوعُهُ بِالْأُصُولِ، بِحَقِّ سَيِّدِنَا مُحَمَّدٍ وَآلِهِ الطَّاهِرِينَ، وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ.", fa: "خدایا، روزه‌ام را در این ماه، بر پایه آنچه تو و پیامبر آن را می‌پسندد مورد سپاس و پذیرش قرار ده، درحالی که فروعش بر اصولش استوار باشد، به حق سرورمان محمّد و اهل بیت پاکش، و سپاس خدای را پروردگار جهانیان." }

  fazilat: "از ابن عباس روایت شده که پیامبر اکرم (ص) برای روزه هر روز ماه مبارک رمضان فضیلت بسیار بیان فرمود و برای هر روز دعای مخصوصی با فضیلت و ثواب بسیار ذکر کرد.\n\nامام سجاد (ع) در صحیفه سجادیه این دعاها را در هر شب ماه رمضان می‌خواندند و در آن، از خداوند بهترین حالات را برای بندگان طلب می‌کردند.\n\nاز امام صادق (ع) روایت شده: «دعا در ماه رمضان مستجاب است و هر که در این ماه برای برادر مؤمنش دعا کند، فرشته‌ای از جانب خداوند می‌گوید: برای تو هم همانند آن باشد.»\n\nاز خواص مهم این دعاها: آمرزش گناهان، پذیرش اعمال، رسیدن به مقام مقرّبان، طول عمر با برکت، و نورانیت قلب.",
  source: "مفاتیح الجنان (شیخ عباس قمی) • اقبال الأعمال (سید بن طاووس) • مصباح المتهجد (شیخ طوسی) • صحیفه سجادیه",
  time: "پس از هر نماز واجب در طول ماه مبارک رمضان، یا هنگام افطار و سحر، با وضو و رو به قبله خوانده شود. توصیه شده است که هر روز، دعای همان روز خوانده شود."
};

/* ============================================================
   STATE
   ============================================================ */
let currentDay = parseInt(localStorage.getItem('noor_ramadan_day')) || 1;
if (currentDay < 1) currentDay = 1;
if (currentDay > DUA_DATA.days.length) currentDay = DUA_DATA.days.length;

/* ============================================================
   RENDER DAY NAV
   ============================================================ */
function renderDayNav() {
  const nav = $('#dayNav');
  nav.innerHTML = '';
  DUA_DATA.days.forEach(d => {
    const btn = document.createElement('button');
    btn.dataset.day = d.day;
    btn.textContent = 'روز ' + faNum(d.day);
    btn.onclick = () => goToDay(d.day);
    nav.appendChild(btn);
  });
}

/* ============================================================
   RENDER VERSES
   ============================================================ */
function renderVerses() {
  const dayData = DUA_DATA.days.find(d => d.day === currentDay);
  if (!dayData) return;
  const c = $('#versesContainer');
  c.innerHTML = '';

  // Top decoration
  const orn = document.createElement('div');
  orn.className = 'top-orn';
  orn.innerHTML = `
    <svg class="orn-svg tr" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="0.8">
      <path d="M50 5 L95 50 L50 95 L5 50 Z"/>
      <path d="M50 20 L80 50 L50 80 L20 50 Z"/>
      <circle cx="50" cy="50" r="15"/>
    </svg>
    <svg class="orn-svg bl" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="0.8">
      <path d="M50 5 L95 50 L50 95 L5 50 Z"/>
      <path d="M50 20 L80 50 L50 80 L20 50 Z"/>
      <circle cx="50" cy="50" r="15"/>
    </svg>
    <div class="orn-title">روز ${faNum(dayData.day)} ماه رمضان</div>
    <div class="orn-sub">دعای مخصوص این روز</div>
    <div class="orn-div">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9 12 2"/></svg>
    </div>
  `;
  c.appendChild(orn);

  // Verse card
  const card = document.createElement('div');
  card.className = 'verse-card';
  card.innerHTML = `
    <div class="v-head">
      <span class="v-num">روز ${faNum(dayData.day)}</span>
      <span class="v-label">دعای روز ${faNum(dayData.day)}</span>
    </div>
    <div class="v-ar">${dayData.ar}</div>
    <div class="v-divider"></div>
    <div class="v-fa">${dayData.fa}</div>
  `;
  c.appendChild(card);

  // Update day nav active
  $$('.day-nav button').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.day) === currentDay);
  });

  // Update prev/next
  $('#prevBtn').disabled = currentDay <= 1;
  $('#nextBtn').disabled = currentDay >= DUA_DATA.days.length;

  localStorage.setItem('noor_ramadan_day', currentDay);
  $('#pageTitle').textContent = 'روز ' + faNum(currentDay) + ' رمضان';
}

/* ============================================================
   GO TO DAY
   ============================================================ */
function goToDay(day) {
  if (day < 1 || day > DUA_DATA.days.length) return;
  currentDay = day;
  renderVerses();
  applySettings();
  const activeBtn = document.querySelector(`.day-nav button[data-day="${day}"]`);
  if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  $('#scrollContent').scrollTop = 0;
}

/* ============================================================
   INFO MODAL
   ============================================================ */
$('#modalFazilat').textContent = DUA_DATA.fazilat;
$('#modalSource').textContent = DUA_DATA.source;
$('#modalTime').textContent = DUA_DATA.time;

$('#btnInfo').onclick = () => $('#modalInfo').classList.add('show');
$('#btnSettings').onclick = () => $('#modalSettings').classList.add('show');

$$('[data-close]').forEach(b => b.onclick = () => $('#' + b.dataset.close).classList.remove('show'));
$$('.modal-bg').forEach(m => m.onclick = (e) => { if (e.target === m) m.classList.remove('show'); });

/* ============================================================
   THEME
   ============================================================ */
const sunIcon = `<svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
const moonIcon = `<svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  localStorage.setItem('noor_theme', dark ? 'dark' : 'light');
  if ($('#themeToggle')) $('#themeToggle').innerHTML = dark ? sunIcon : moonIcon;
}
applyTheme(localStorage.getItem('noor_theme') === 'dark');
$('#themeToggle').onclick = () => applyTheme(!document.body.classList.contains('dark'));

/* ============================================================
   SETTINGS
   ============================================================ */
let arSize = parseInt(localStorage.getItem('noor_ar_size') || '26');
let faSize = parseInt(localStorage.getItem('noor_fa_size') || '16');
let lineHeight = localStorage.getItem('noor_lh') || '2.3';
let showTrans = localStorage.getItem('noor_trans') !== 'false';
const fontAr = localStorage.getItem('noor_font_ar') || 'amiri';
const fontFa = localStorage.getItem('noor_font_fa') || 'vazir';

document.body.classList.add('font-ar-' + fontAr);
document.body.classList.add('font-fa-' + fontFa);

function applySettings() {
  document.documentElement.style.setProperty('--fs-ar', arSize + 'px');
  document.documentElement.style.setProperty('--fs-fa', faSize + 'px');
  document.documentElement.style.setProperty('--line-height', lineHeight);
  $$('.verse-card').forEach(v => v.classList.toggle('hide-trans', !showTrans));
  if ($('#arSizeVal')) $('#arSizeVal').textContent = faNum(arSize);
  if ($('#faSizeVal')) $('#faSizeVal').textContent = faNum(faSize);
  localStorage.setItem('noor_ar_size', arSize);
  localStorage.setItem('noor_fa_size', faSize);
  localStorage.setItem('noor_lh', lineHeight);
  localStorage.setItem('noor_trans', showTrans);
}
applySettings();

$$('[data-ar-step]').forEach(b => b.onclick = () => {
  arSize = Math.max(16, Math.min(42, arSize + parseInt(b.dataset.arStep) * 2));
  applySettings();
});
$$('[data-fa-step]').forEach(b => b.onclick = () => {
  faSize = Math.max(12, Math.min(24, faSize + parseInt(b.dataset.faStep) * 2));
  applySettings();
});
$$('[data-lh]').forEach(b => {
  if (b.dataset.lh === lineHeight) b.classList.add('active');
  b.onclick = () => {
    $$('[data-lh]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    lineHeight = b.dataset.lh;
    applySettings();
  };
});
$$('[data-trans]').forEach(b => {
  const isOn = (b.dataset.trans === '1') === showTrans;
  b.classList.toggle('active', isOn);
  b.onclick = () => {
    $$('[data-trans]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    showTrans = b.dataset.trans === '1';
    applySettings();
  };
});
$$('[data-font-ar]').forEach(b => {
  if (b.dataset.fontAr === fontAr) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-ar]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-ar-\S+/g, '').trim();
    document.body.classList.add('font-ar-' + b.dataset.fontAr);
    localStorage.setItem('noor_font_ar', b.dataset.fontAr);
  };
});
$$('[data-font-fa]').forEach(b => {
  if (b.dataset.fontFa === fontFa) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-fa]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-fa-\S+/g, '').trim();
    document.body.classList.add('font-fa-' + b.dataset.fontFa);
    localStorage.setItem('noor_font_fa', b.dataset.fontFa);
  };
});

/* ============================================================
   PREV/NEXT
   ============================================================ */
$('#prevBtn').onclick = () => goToDay(currentDay - 1);
$('#nextBtn').onclick = () => goToDay(currentDay + 1);

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', function(e) {
  // جهت‌ها برای روز قبل/بعد (در RTL)
  if (e.key === 'ArrowLeft') goToDay(currentDay + 1);
  else if (e.key === 'ArrowRight') goToDay(currentDay - 1);
});

/* ============================================================
   BACK BUTTON
   ============================================================ */
$('#btnBack').onclick = () => {
  if (document.referrer && (document.referrer.includes('list.html') || document.referrer.includes('doa.html'))) history.back();
  else location.href = 'list.html?type=daily';
};

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg) {
  const t = $('#toast');
  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   INIT
   ============================================================ */
renderDayNav();
renderVerses();
applySettings();

// Scroll to active day on load
window.addEventListener('load', function() {
  const activeBtn = document.querySelector(`.day-nav button[data-day="${currentDay}"]`);
  if (activeBtn) activeBtn.scrollIntoView({ inline: 'center', block: 'nearest' });
});

console.log('🌙 دعاهای رمضان | NOOR – بارگذاری شد. تعداد روزها:', DUA_DATA.days.length);
