/* ===== Hadith List ===== */
function renderHadithList() {
  const c = $('#hadithList');
  c.innerHTML = '';
  let list = HADITHS_DATA;

  if (currentFilter !== 'all') {
    list = list.filter(h => h.speaker === currentFilter);
  }

  if (searchQuery) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(h =>
      (h.arabic && h.arabic.includes(q)) ||
      (h.translation && h.translation.includes(q)) ||
      (h.speakerName && h.speakerName.includes(q)) ||
      (h.topicName && h.topicName.includes(q)) ||
      (h.source && h.source.includes(q)) ||
      (h.tags && h.tags.some(t => t.includes(q))) ||
      (h.verses && h.verses.some(v => v.ar.includes(q) || v.fa.includes(q)))
    );
  }

  const catName = currentFilter === 'all' ? 'همه احادیث' :
    (HADITHS_DATA.find(h => h.speaker === currentFilter)?.speakerName || '');
  $('#listTitle').textContent = catName;
  $('#listCount').textContent = faNum(list.length) + ' حدیث';

  if (!list.length) {
    c.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <p>حدیثی یافت نشد.</p>
      </div>`;
    return;
  }

  list.forEach(h => {
    const isBm = bookmarks.includes(h.id);
    const arText = h.verses ? h.verses[0].ar : h.arabic;
    const faText = h.verses ? h.verses[0].fa : h.translation;
    const item = document.createElement('div');
    item.className = 'hadith-item';
    item.innerHTML = `
      <div class="h-ico">${ICONS.hadith}</div>
      <div class="h-info">
        <div class="h-speaker">${h.speakerName}</div>
        <div class="h-ar">${highlight(arText, searchQuery)}</div>
        <div class="h-fa">${highlight(faText, searchQuery)}</div>
      </div>
      <button class="h-bm ${isBm ? 'active' : ''}" data-bm="${h.id}" aria-label="نشان‌گذاری">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
    `;
    item.onclick = (e) => {
      if (e.target.closest('[data-bm]')) return;
      openHadith(h.id);
    };
    item.querySelector('[data-bm]').onclick = (e) => {
      e.stopPropagation();
      toggleBookmark(h.id);
      renderHadithList();
      renderHeroHadith();
    };
    c.appendChild(item);
  });
}

function highlight(text, query) {
  if (!query || !text) return text;
  const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return String(text).replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
}

/* ===== Open Hadith ===== */
function openHadith(id) {
  let h = HADITHS_DATA.find(x => x.id === id);
  // جستجو در احادیث کوتاه Hero
  if (!h && id.startsWith('short_h_')) {
    const idx = parseInt(id.replace('short_h_', ''));
    const s = SHORT_HADITHS[idx];
    if (s) {
      h = {
        id: id,
        speakerName: s.speaker,
        arabic: s.ar,
        translation: s.fa,
        source: s.ref,
        topicName: 'حدیث کوتاه',
        tags: ['کوتاه']
      };
    }
  }
  if (!h) return;
  currentHadith = h;
  history = history.filter(x => x.id !== id);
  history.unshift({ id, timestamp: Date.now() });
  history = history.slice(0, 30);
  localStorage.setItem('noor_hadith_hist', JSON.stringify(history));

  $('#listView').classList.add('hidden');
  $('#detailView').classList.add('active');
  $('#floatingBtns').style.display = 'flex';
  $('#pageTitle').textContent = 'حدیث';
  $('#searchWrap').classList.remove('show');
  renderDetail(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderDetail(id) {
  let h = HADITHS_DATA.find(x => x.id === id);
  if (!h && id.startsWith('short_h_')) {
    const idx = parseInt(id.replace('short_h_', ''));
    const s = SHORT_HADITHS[idx];
    if (s) {
      h = {
        id: id,
        speakerName: s.speaker,
        arabic: s.ar,
        translation: s.fa,
        source: s.ref,
        topicName: 'حدیث کوتاه',
        tags: ['کوتاه']
      };
    }
  }
  if (!h) return;
  const isKasa = !!h.verses;
  const arText = isKasa ? h.verses[0].ar : h.arabic;
  const faText = isKasa ? h.verses[0].fa : h.translation;

  let html = `
    <div class="detail-head">
      <div class="dh-ico">${ICONS.hadith}</div>
      <div class="dh-title">${h.topicName || 'حدیث'}</div>
      <div class="dh-sub">${h.speakerName}</div>
      <div class="dh-meta"><span>${h.source}</span></div>
    </div>
  `;

  if (isKasa) {
    html += `<div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      متن کامل
    </div>`;
    h.verses.forEach(v => {
      html += `
        <div class="hadith-body${showTrans ? '' : ' hide-trans'}">
          <div class="hb-ar">${v.ar}</div>
          <div class="hb-fa">${v.fa}</div>
        </div>
      `;
    });
  } else {
    html += `
      <div class="hadith-body${showTrans ? '' : ' hide-trans'}">
        <div class="hb-ar">${arText}</div>
        <div class="hb-fa">${faText}</div>
      </div>
    `;
  }

  html += `
    <div class="info-block">
      <h4>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        اطلاعات حدیث
      </h4>
      <p><strong>گوینده:</strong> ${h.speakerName}</p>
      ${h.topicName ? `<p><strong>موضوع:</strong> ${h.topicName}</p>` : ''}
      <p><strong>منبع:</strong> ${h.source}</p>
    </div>
  `;

  if (h.tags && h.tags.length) {
    html += `
      <div class="info-block">
        <h4>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          برچسب‌ها
        </h4>
        <div class="tags">${h.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
    `;
  }

  const related = HADITHS_DATA.filter(x => x.id !== h.id && x.topic === h.topic && !x.verses).slice(0, 3);
  if (related.length) {
    html += `<div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      احادیث مرتبط
    </div>`;
    const lst = document.createElement('div');
    lst.className = 'hadith-list';
    related.forEach(r => {
      const it = document.createElement('div');
      it.className = 'hadith-item';
      it.innerHTML = `
        <div class="h-ico">${ICONS.hadith}</div>
        <div class="h-info">
          <div class="h-speaker">${r.speakerName}</div>
          <div class="h-ar">${r.arabic.slice(0, 60)}...</div>
          <div class="h-fa">${r.translation.slice(0, 60)}...</div>
        </div>
      `;
      it.onclick = () => openHadith(r.id);
      lst.appendChild(it);
    });
    $('#detailContent').innerHTML = html;
    $('#detailContent').appendChild(lst);
    return;
  }
  $('#detailContent').innerHTML = html;
}

/* ===== Bookmark ===== */
function toggleBookmark(id) {
  const idx = bookmarks.indexOf(id);
  if (idx > -1) {
    bookmarks.splice(idx, 1);
    toast('از نشان‌شده‌ها حذف شد');
  } else {
    bookmarks.push(id);
    toast('به نشان‌شده‌ها اضافه شد');
  }
  localStorage.setItem('noor_hadith_bm', JSON.stringify(bookmarks));
  updateBmCount();
}

function updateBmCount() {
  const c = $('#bmCount');
  if (bookmarks.length > 0) {
    c.textContent = faNum(bookmarks.length);
    c.style.display = 'block';
  } else c.style.display = 'none';
}

$('#btnSearch').onclick = () => {
  const w = $('#searchWrap');
  w.classList.toggle('show');
  if (w.classList.contains('show')) {
    setTimeout(() => $('#searchInput').focus(), 100);
  } else {
    $('#searchInput').value = '';
    searchQuery = '';
    renderHadithList();
  }
};

/* ===== Random ===== */
$('#qaRandom').onclick = () => {
  const pool = HADITHS_DATA;
  if (pool.length === 0) return;
  let rand;
  let tries = 0;
  do {
    rand = pool[Math.floor(Math.random() * pool.length)];
    tries++;
  } while (currentHadith && rand.id === currentHadith.id && tries < 10);
  openHadith(rand.id);
  toast('یک حدیث برای شما انتخاب شد');
};

function renderCustomList(ids, title) {
  // اگر در حالت detail هستیم برگردیم
  closeDetail();
  $('#pageTitle').textContent = title;
  const c = $('#hadithList');
  c.innerHTML = '';
  const list = ids.map(id => {
    let h = HADITHS_DATA.find(x => x.id === id);
    if (!h && id.startsWith('short_h_')) {
      const idx = parseInt(id.replace('short_h_', ''));
      const s = SHORT_HADITHS[idx];
      if (s) h = { id, speakerName: s.speaker, arabic: s.ar, translation: s.fa, source: s.ref };
    }
    return h;
  }).filter(Boolean);
  $('#listTitle').textContent = title;
  $('#listCount').textContent = faNum(list.length) + ' حدیث';

  if (!list.length) {
    c.innerHTML = `<div class="empty"><p>موردی یافت نشد.</p></div>`;
    return;
  }

  list.forEach(h => {
    const item = document.createElement('div');
    item.className = 'hadith-item';
    const arText = h.verses ? h.verses[0].ar : h.arabic;
    const faText = h.verses ? h.verses[0].fa : h.translation;
    const extra = notes[h.id] ? `<div class="h-fa" style="color:var(--gold);margin-top:4px;border-top:1px dashed var(--gold-border);padding-top:6px;">یادداشت: ${notes[h.id].slice(0, 80)}</div>` : '';
    item.innerHTML = `
      <div class="h-ico">${ICONS.hadith}</div>
      <div class="h-info">
        <div class="h-speaker">${h.speakerName || ''}</div>
        <div class="h-ar">${arText.slice(0, 80)}...</div>
        <div class="h-fa">${faText.slice(0, 80)}...</div>
        ${extra}
      </div>
    `;
    item.onclick = () => openHadith(h.id);
    c.appendChild(item);
  });
}

/* ===== Copy & Share ===== */
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => toast('متن کپی شد')).catch(() => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('متن کپی شد'); } catch (e) { toast('کپی ناموفق'); }
  document.body.removeChild(ta);
}
function shareText(t) {
  if (navigator.share) navigator.share({ title: 'حدیث', text: t }).catch(() => {});
  else copyText(t);
}

$('#fabCopy').onclick = () => {
  if (!currentHadith) return;
  $('#modalCopy').classList.add('show');
};

$('#fabNotes').onclick = () => {
  if (!currentHadith) return;
  editingNoteId = currentHadith.id;
  $('#notesArea').value = notes[currentHadith.id] || '';
  $('#modalNotes').classList.add('show');
  setTimeout(() => $('#notesArea').focus(), 200);
};

$('#copyArabic').onclick = () => {
  if (!currentHadith) return;
  const t = currentHadith.verses ? currentHadith.verses.map(v => v.ar).join('\n\n') : currentHadith.arabic;
  copyText(t);
  $('#modalCopy').classList.remove('show');
};
$('#copyTrans').onclick = () => {
  if (!currentHadith) return;
  const t = currentHadith.verses ? currentHadith.verses.map(v => v.fa).join('\n\n') : currentHadith.translation;
  copyText(t);
  $('#modalCopy').classList.remove('show');
};
$('#copyBoth').onclick = () => {
  if (!currentHadith) return;
  const h = currentHadith;
  let t = '';
  if (h.verses) {
    t = h.verses.map(v => v.ar + '\n' + v.fa).join('\n\n');
  } else {
    t = h.arabic + '\n' + h.translation;
  }
  t += '\n\n' + (h.speakerName || '') + '\n' + (h.source || '');
  copyText(t);
  $('#modalCopy').classList.remove('show');
};
$('#shareBtn').onclick = () => {
  if (!currentHadith) return;
  const h = currentHadith;
  let t = '';
  if (h.verses) {
    t = h.verses[0].ar + '\n' + h.verses[0].fa;
  } else {
    t = h.arabic + '\n' + h.translation;
  }
  t += '\n\n' + (h.speakerName || '') + '\n' + (h.source || '');
  shareText(t);
  $('#modalCopy').classList.remove('show');
};

/* ===== Notes Save ===== */
$('#saveNotesBtn').onclick = () => {
  if (!editingNoteId) return;
  const val = $('#notesArea').value;
  if (val.trim()) notes[editingNoteId] = val;
  else delete notes[editingNoteId];
  localStorage.setItem('noor_hadith_notes', JSON.stringify(notes));
  $('#modalNotes').classList.remove('show');
  editingNoteId = null;
  toast('یادداشت ذخیره شد');
};

/* ===== Modal Close ===== */
$$('[data-close]').forEach(b => b.onclick = () => $('#' + b.dataset.close).classList.remove('show'));
$$('.modal-bg').forEach(m => m.onclick = (e) => { if (e.target === m) m.classList.remove('show'); });

/* ===== Settings Button ===== */
$('#btnSettings').onclick = () => $('#modalSettings').classList.add('show');

/* ===== Back ===== */
$('#btnBack').onclick = () => {
  if (currentHadith) closeDetail();
  else location.href = 'index.html';
};

function closeDetail() {
  currentHadith = null;
  $('#listView').classList.remove('hidden');
  $('#detailView').classList.remove('active');
  $('#floatingBtns').style.display = 'none';
  $('#pageTitle').textContent = 'احادیث';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ===== Toast ===== */
function toast(msg) {
  const t = $('#toast');
  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(() => t.classList.remove('show'), 2200);
}
