<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123C32">
<title>احادیث | نور</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F5EE; --surface: #FFFDF8; --surface2: #F1ECE2;
  --brand: #123C32; --brand2: #2D6657;
  --gold: #B88A3B; --gold2: #D6B56A;
  --gold-soft: rgba(184, 138, 59, 0.12);
  --gold-border: rgba(184, 138, 59, 0.28);
  --text: #17231F; --text-2: #3d4a44; --muted: #66716C;
  --divider: #E7E0D3;
  --arabic: #123C32; --translation: #3d4a44;
  --shadow: 0 4px 20px rgba(18, 60, 50, 0.06);
  --shadow-sm: 0 2px 8px rgba(18, 60, 50, 0.04);
  --radius: 18px; --radius-sm: 12px;
  --trans: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font-fa: 'Vazirmatn', Tahoma, sans-serif;
  --font-ar: 'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif;
  --fs-ar: 24px; --fs-fa: 16px; --line-height: 2.4;
  --nav-h: 68px;
}
body.dark {
  --bg: #080E0C; --surface: #101A16; --surface2: #16231E;
  --brand: #9FC5B5; --brand2: #B9D5C8;
  --gold: #D2AC5C; --gold2: #E4C982;
  --gold-soft: rgba(210, 172, 92, 0.10);
  --gold-border: rgba(210, 172, 92, 0.22);
  --text: #F4EFE4; --text-2: #c8d2cc; --muted: #A8B3AD;
  --divider: #26352F;
  --arabic: #e8e2d2; --translation: #c8d2cc;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
}
body.font-fa-vazir { --font-fa: 'Vazirmatn', Tahoma, sans-serif; }
body.font-fa-amiri { --font-fa: 'Amiri', serif; }
body.font-fa-naskh { --font-fa: 'Noto Naskh Arabic', serif; }
body.font-ar-amiri { --font-ar: 'Amiri', serif; }
body.font-ar-scheherazade { --font-ar: 'Scheherazade New', serif; }
body.font-ar-naskh { --font-ar: 'Noto Naskh Arabic', serif; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font-fa); background: var(--bg); color: var(--text);
  min-height: 100vh; padding-bottom: calc(var(--nav-h) + 20px);
  line-height: 1.7; font-size: 16px;
  transition: background var(--trans), color var(--trans);
  overflow-x: hidden;
}
button, input, textarea { font-family: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: var(--trans); }
svg { display: block; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-sm { width: 18px; height: 18px; }
.app { max-width: 780px; margin: 0 auto; padding: 0 14px; }

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 6px;
  padding: 12px 0; background: var(--bg);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.hbtn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--gold-border);
  color: var(--gold); flex: none;
}
.hbtn:hover { background: var(--gold-soft); border-color: var(--gold); }
.hbtn:active { transform: scale(0.94); }
.brand { flex: 1; text-align: center; line-height: 1.15; }
.brand h1 {
  font-family: 'Amiri', serif;
  font-size: 1.35rem; font-weight: 700;
  color: var(--brand); letter-spacing: 1px;
}
body.dark .brand h1 { color: var(--gold); }
.brand .brand-jd {
  display: block; font-size: 0.6rem;
  color: var(--muted); letter-spacing: 2px; margin-top: 2px;
}
.brand .brand-noor {
  display: block; font-family: 'Amiri', serif;
  font-size: 0.75rem; font-weight: 700;
  color: var(--gold); letter-spacing: 7px;
  margin-top: -1px; text-shadow: 0 0 12px var(--gold-soft);
}

/* SEARCH */
.search-wrap { margin: 14px 0; display: none; }
.search-wrap.show { display: block; }
.search-box { position: relative; }
.search-box input {
  width: 100%; padding: 13px 46px 13px 16px;
  border-radius: 60px; border: 1px solid var(--gold-border);
  background: var(--surface); color: var(--text);
  font-size: 0.9rem; outline: none; transition: var(--trans);
}
.search-box input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.search-box input::placeholder { color: var(--muted); }
.search-box .ico {
  position: absolute; right: 16px; top: 50%;
  transform: translateY(-50%); color: var(--muted); pointer-events: none;
}

/* HERO */
.hero {
  position: relative; overflow: hidden;
  margin: 16px 0; padding: 24px 20px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--gold-border);
  box-shadow: var(--shadow);
}
.hero-orn { position: absolute; color: var(--gold); opacity: 0.15; pointer-events: none; }
.hero-orn.tr { top: -8px; right: -8px; width: 100px; height: 100px; }
.hero-orn.bl { bottom: -8px; left: -8px; width: 100px; height: 100px; transform: rotate(180deg); }
.hero-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.7rem; font-weight: 700;
  color: var(--gold); background: var(--gold-soft);
  padding: 4px 12px; border-radius: 20px;
  border: 1px solid var(--gold-border);
  margin-bottom: 14px;
}
.hero-label svg { width: 14px; height: 14px; }
.hero-date {
  display: block; text-align: center;
  font-size: 0.7rem; color: var(--muted);
  margin-bottom: 10px; letter-spacing: 1px;
}
.hero-ar {
  font-family: var(--font-ar);
  font-size: 1.35rem; font-weight: 700;
  line-height: 2.1; color: var(--arabic);
  text-align: center; margin-bottom: 12px;
  padding: 0 8px;
}
.hero-fa {
  font-family: var(--font-fa);
  font-size: 0.9rem; line-height: 1.95;
  color: var(--translation); text-align: center;
  padding-top: 12px; border-top: 1px dashed var(--gold-border);
  margin-bottom: 12px;
}
.hero-meta {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; font-size: 0.7rem; color: var(--muted);
  flex-wrap: wrap; margin-bottom: 12px;
}
.hero-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--gold); opacity: 0.6; }
.hero-meta .speaker { color: var(--gold); font-weight: 700; }
.hero-actions {
  display: flex; gap: 8px; justify-content: center;
  padding-top: 12px; border-top: 1px solid var(--divider);
}
.hero-actions button {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--surface2); color: var(--muted);
  border: 1px solid var(--divider);
}
.hero-actions button:hover { color: var(--gold); border-color: var(--gold); }
.hero-actions button.active { color: var(--gold); background: var(--gold-soft); border-color: var(--gold); }
.hero-actions svg { width: 18px; height: 18px; }

/* NOOR SECTION */
.noor-section {
  margin: 20px 0;
  background: var(--surface);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.noor-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px; padding-bottom: 12px;
  border-bottom: 1px solid var(--divider);
}
.noor-head svg { color: var(--gold); width: 20px; height: 20px; }
.noor-head h3 { font-size: 0.95rem; font-weight: 700; }
.noor-head span {
  margin-right: auto; font-size: 0.65rem;
  color: var(--muted); letter-spacing: 1px;
}
.noor-grid { display: flex; flex-direction: column; gap: 10px; }
.noor-item {
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface2); border: 1px solid var(--divider);
  transition: var(--trans);
}
.noor-item:hover { border-color: var(--gold); }
.noor-item .noor-top {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.noor-item .noor-ico {
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--gold-soft); color: var(--gold);
  display: flex; align-items: center; justify-content: center; flex: none;
}
.noor-item .noor-ico svg { width: 17px; height: 17px; }
.noor-item .noor-title { font-size: 0.78rem; font-weight: 700; color: var(--gold); flex: 1; }
.noor-item .noor-ar {
  font-family: var(--font-ar);
  font-size: 1.05rem; line-height: 1.95;
  color: var(--arabic); text-align: center;
  padding: 6px 4px; margin-bottom: 6px;
}
.noor-item .noor-fa {
  font-size: 0.75rem; line-height: 1.85;
  color: var(--translation); text-align: center;
  padding-top: 6px; border-top: 1px dashed var(--gold-border);
}
.noor-item .noor-ref {
  display: block; font-size: 0.65rem;
  color: var(--muted); text-align: center;
  margin-top: 6px; font-style: italic;
}

/* QUICK ACTIONS */
.quick-actions {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; margin-bottom: 16px;
}
.qa-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--gold-border);
  color: var(--text); text-align: right;
  transition: var(--trans); position: relative;
}
.qa-btn:hover { background: var(--gold-soft); border-color: var(--gold); transform: translateY(-2px); }
.qa-btn .qa-ico {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--gold-soft); color: var(--gold);
  display: flex; align-items: center; justify-content: center; flex: none;
}
.qa-btn .qa-ico svg { width: 20px; height: 20px; }
.qa-btn .qa-info { flex: 1; min-width: 0; }
.qa-btn .qa-title { font-size: 0.82rem; font-weight: 700; }
.qa-btn .qa-sub { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
.qa-btn .qa-badge {
  position: absolute; top: 8px; left: 8px;
  background: var(--gold); color: #fff;
  font-size: 0.6rem; padding: 2px 7px;
  border-radius: 8px; font-weight: 700;
}

/* SECTION HEAD */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 22px 0 12px; gap: 10px;
}
.section-head h3 {
  font-size: 1rem; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.section-head h3 svg { color: var(--gold); width: 18px; height: 18px; }
.section-head .cnt {
  font-size: 0.72rem; color: var(--gold);
  background: var(--gold-soft); padding: 3px 10px;
  border-radius: 10px; font-weight: 600;
  border: 1px solid var(--gold-border);
}

/* FILTER CHIPS */
.filter-chips {
  display: flex; gap: 6px; overflow-x: auto;
  padding-bottom: 4px; margin-bottom: 12px;
  scrollbar-width: none;
}
.filter-chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 6px 14px;
  border-radius: 20px; font-size: 0.72rem;
  font-weight: 600; cursor: pointer;
  background: var(--surface); color: var(--muted);
  border: 1px solid var(--divider);
  transition: var(--trans);
  white-space: nowrap;
}
.chip:hover { border-color: var(--gold-border); color: var(--gold); }
.chip.active { background: var(--gold-soft); color: var(--gold); border-color: var(--gold); }

/* HADITH LIST */
.hadith-list { display: flex; flex-direction: column; gap: 10px; }
.hadith-item {
  display: flex; gap: 12px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--gold-border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  cursor: pointer; transition: var(--trans);
  position: relative; overflow: hidden;
}
.hadith-item:hover { background: var(--surface2); border-color: var(--gold); transform: translateY(-1px); }
.hadith-item .h-ico {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--gold-soft); color: var(--gold);
  display: flex; align-items: center; justify-content: center; flex: none;
}
.hadith-item .h-ico svg { width: 20px; height: 20px; }
.hadith-item .h-info { flex: 1; min-width: 0; }
.hadith-item .h-ar {
  font-family: var(--font-ar);
  font-size: 0.95rem; line-height: 1.9;
  color: var(--arabic); margin-bottom: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.hadith-item .h-fa {
  font-size: 0.72rem; color: var(--muted); line-height: 1.7;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
  padding-top: 6px; border-top: 1px dashed var(--gold-border);
}
.hadith-item .h-speaker {
  font-size: 0.65rem; color: var(--gold);
  font-weight: 700; margin-bottom: 4px;
}
.hadith-item .h-bm {
  width: 34px; height: 34px; border-radius: 10px;
  color: var(--muted); flex: none;
}
.hadith-item .h-bm:hover, .hadith-item .h-bm.active { color: var(--gold); background: var(--gold-soft); }

/* DETAIL VIEW */
.detail-view { display: none; }
.detail-view.active { display: block; }
.list-view.hidden { display: none; }

.detail-head {
  position: relative; overflow: hidden;
  margin: 16px 0; padding: 22px 20px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand2) 100%);
  color: #fff; text-align: center;
  border: 1px solid var(--gold-border);
  box-shadow: var(--shadow);
}
.detail-head::before {
  content: ""; position: absolute; top: -50px; right: -50px;
  width: 150px; height: 150px; border-radius: 50%;
  background: radial-gradient(circle, rgba(214, 181, 106, 0.22), transparent 70%);
}
.detail-head .dh-ico {
  width: 52px; height: 52px; border-radius: 14px;
  background: rgba(214, 181, 106, 0.18);
  color: var(--gold2); margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
}
.detail-head .dh-ico svg { width: 26px; height: 26px; }
.detail-head .dh-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
.detail-head .dh-sub { font-size: 0.75rem; color: rgba(255,255,255,0.75); }
.detail-head .dh-meta {
  display: flex; justify-content: center; align-items: center;
  gap: 8px; font-size: 0.7rem; color: rgba(255,255,255,0.75);
  margin-top: 8px; flex-wrap: wrap;
}

.hadith-body {
  background: var(--surface); border: 1px solid var(--gold-border);
  border-radius: var(--radius); padding: 22px 18px;
  margin-bottom: 12px; box-shadow: var(--shadow-sm);
}
.hadith-body .hb-ar {
  font-family: var(--font-ar);
  font-size: var(--fs-ar); line-height: var(--line-height);
  color: var(--arabic); text-align: center;
  padding: 6px 8px 16px;
  border-bottom: 1px dashed var(--gold-border);
}
.hadith-body .hb-fa {
  font-family: var(--font-fa);
  font-size: var(--fs-fa); line-height: 1.95;
  color: var(--translation); text-align: center;
  padding-top: 14px;
}
.hadith-body.hide-trans .hb-fa { display: none; }
.hadith-body.hide-trans .hb-ar { padding-bottom: 6px; border-bottom: 0; }

.info-block {
  padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--gold-border);
  border-radius: var(--radius-sm); margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.info-block h4 {
  font-size: 0.78rem; font-weight: 700;
  color: var(--gold); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.info-block h4 svg { width: 15px; height: 15px; }
.info-block p {
  font-size: 0.78rem; line-height: 1.95;
  color: var(--text-2); text-align: justify;
}
.info-block .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.info-block .tag {
  font-size: 0.68rem; padding: 3px 9px; border-radius: 8px;
  background: var(--gold-soft); color: var(--gold);
  border: 1px solid var(--gold-border);
}

.section-title {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin: 20px 0 12px;
  font-size: 0.85rem; color: var(--gold); font-weight: 700;
}
.section-title::before, .section-title::after {
  content: ""; flex: 1; height: 1px;
  background: var(--gold-border); max-width: 80px;
}
.section-title svg { width: 16px; height: 16px; }

/* FLOATING */
.floating-btns {
  position: fixed; bottom: calc(var(--nav-h) + 16px); left: 14px;
  z-index: 90; display: flex; flex-direction: column; gap: 8px;
}
.fab {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--brand); color: var(--gold2);
  border: 1px solid var(--gold-border);
  box-shadow: var(--shadow);
}
.fab:hover { background: var(--brand2); transform: translateY(-2px); }
.fab:active { transform: scale(0.94); }
.fab svg { width: 20px; height: 20px; }

/* MODAL */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 200; padding: 0 12px 12px;
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 520px; max-height: 88vh;
  overflow-y: auto; background: var(--surface);
  border-radius: 24px 24px 18px 18px;
  padding: 22px 18px 26px;
  border: 1px solid var(--gold-border);
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--divider);
}
.modal-head h3 {
  font-size: 1.05rem; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.modal-head h3 svg { color: var(--gold); width: 20px; height: 20px; }
.modal-close {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--muted);
}
.modal-close:hover { color: var(--gold); }

/* SETTINGS */
.set-group { margin-bottom: 16px; }
.set-group > label {
  display: block; font-size: 0.78rem; font-weight: 700;
  color: var(--muted); margin-bottom: 8px;
}
.set-options { display: flex; flex-wrap: wrap; gap: 6px; }
.set-opt {
  padding: 7px 14px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--text-2); font-size: 0.78rem;
  font-weight: 600; cursor: pointer; transition: var(--trans);
}
.set-opt:hover { border-color: var(--gold-border); color: var(--gold); }
.set-opt.active { background: var(--gold-soft); color: var(--gold); border-color: var(--gold); }
.set-ctrl {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--divider);
  border-radius: 10px; padding: 4px; width: fit-content;
}
.set-ctrl button {
  width: 36px; height: 36px; border-radius: 8px;
  color: var(--muted); font-weight: 700; font-size: 1rem;
}
.set-ctrl button:hover { background: var(--gold-soft); color: var(--gold); }
.set-ctrl .val {
  min-width: 44px; text-align: center;
  color: var(--gold); font-weight: 700; font-size: 0.85rem;
}
.font-preview { font-family: 'Amiri', serif; font-size: 1.3rem; }

/* NOTES */
.notes-area {
  width: 100%; min-height: 120px;
  padding: 12px 14px; border-radius: 12px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--text); font-size: 0.85rem;
  line-height: 1.8; resize: vertical; outline: none;
  transition: var(--trans);
}
.notes-area:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 100; display: flex; justify-content: space-around;
  align-items: center; background: var(--surface);
  border-top: 1px solid var(--divider);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  height: var(--nav-h);
  box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.06);
}
body.dark .bottom-nav { box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.4); }
.nav-btn {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; flex: 1; padding: 6px 4px;
  border-radius: 12px; color: var(--muted);
  transition: var(--trans); position: relative;
  font-size: 0.62rem; font-weight: 500;
  text-decoration: none; background: none; border: 0; cursor: pointer;
}
.nav-btn svg {
  width: 22px; height: 22px; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}

.nav-btn.active::before {

  transform: translateX(-50%);
  width: 22px; height: 3px;
  border-radius: 0 0 4px 4px; background: var(--gold);
}

/* TOAST */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + 16px); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--brand); color: #fff;
  padding: 10px 20px; border-radius: 14px;

  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--gold-border); max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { color: var(--gold2); width: 18px; height: 18px; }

.empty {
  text-align: center; padding: 50px 20px; color: var(--muted);
}
.empty svg { width: 50px; height: 50px; color: var(--gold); opacity: 0.4; margin: 0 auto 14px; }
.empty p { font-size: 0.85rem; }

mark {

}

@media (max-width: 480px) {

  .hbtn { width: 36px; height: 36px; }
  .hbtn .icon { width: 18px; height: 18px; }
}

<script>
/* ============================================================
    نور — احادیث
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const faNum = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

/* ===== STATE ===== */
let bookmarks = JSON.parse(localStorage.getItem('noor_hadith_bm') || '[]');
let notes = JSON.parse(localStorage.getItem('noor_hadith_notes') || '{}');
let history = JSON.parse(localStorage.getItem('noor_hadith_hist') || '[]');
let currentHadith = null;
let currentFilter = 'all';
let searchQuery = '';
let editingNoteId = null;

/* ===== THEME ===== */
function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  localStorage.setItem('noor_theme', dark ? 'dark' : 'light');
  const tl = $('#themeLight'), td = $('#themeDark');
  if (tl && td) {
    tl.classList.toggle('active', !dark);
    td.classList.toggle('active', dark);
  }
}
applyTheme(localStorage.getItem('noor_theme') === 'dark');

/* ===== SETTINGS ===== */
let arSize = parseInt(localStorage.getItem('noor_ar_size') || '24');
let faSize = parseInt(localStorage.getItem('noor_fa_size') || '16');
let lineHeight = localStorage.getItem('noor_lh') || '2.4';
let showTrans = localStorage.getItem('noor_trans') !== 'false';
const fontAr = localStorage.getItem('noor_font_ar') || 'amiri';
const fontFa = localStorage.getItem('noor_font_fa') || 'vazir';
document.body.classList.add('font-ar-' + fontAr);
document.body.classList.add('font-fa-' + fontFa);

function applySettings() {
  document.documentElement.style.setProperty('--fs-ar', arSize + 'px');
  document.documentElement.style.setProperty('--fs-fa', faSize + 'px');
  document.documentElement.style.setProperty('--line-height', lineHeight);
  document.querySelectorAll('.hadith-body').forEach(v => v.classList.toggle('hide-trans', !showTrans));
  if ($('#arSizeVal')) $('#arSizeVal').textContent = faNum(arSize);
  if ($('#faSizeVal')) $('#faSizeVal').textContent = faNum(faSize);
  localStorage.setItem('noor_ar_size', arSize);
  localStorage.setItem('noor_fa_size', faSize);
  localStorage.setItem('noor_lh', lineHeight);
  localStorage.setItem('noor_trans', showTrans);
}
applySettings();

$$('[data-ar-step]').forEach(b => b.onclick = () => {
  arSize = Math.max(16, Math.min(42, arSize + parseInt(b.dataset.arStep) * 2));
  applySettings();
});
$$('[data-fa-step]').forEach(b => b.onclick = () => {
  faSize = Math.max(12, Math.min(24, faSize + parseInt(b.dataset.faStep) * 2));
  applySettings();
});
$$('[data-lh]').forEach(b => {
  if (b.dataset.lh === lineHeight) b.classList.add('active');
  b.onclick = () => {
    $$('[data-lh]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    lineHeight = b.dataset.lh;
    applySettings();
  };
});
$$('[data-trans]').forEach(b => {
  const isOn = (b.dataset.trans === '1') === showTrans;
  b.classList.toggle('active', isOn);

    showTrans = b.dataset.trans === '1';
    applySettings();
  };
});

const PERSIAN_MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

function getDayOfYear() {
  const today = new Date();
  const start = new Date(today.getFullYear(), 0, 0);
  const diff = today - start;
  return Math.floor(diff / 86400000);
}

function getJalaliDate() {
  try {
    const d = new Date();
    const gy = d.getFullYear(), gm = d.getMonth() + 1, gd = d.getDate();
    const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    let jy;
    if (gy <= 1600) {
      jy = 0;
    } else {
      jy = 979;
      gy -= 1600;
    }
    const gy2 = (gm > 2) ? (gy + 1) : gy;
    let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
    jy += 33 * Math.floor(days / 12053);
    days %= 12053;
    jy += 4 * Math.floor(days / 1461);
    days %= 1461;
    if (days > 365) {
      jy += Math.floor((days - 1) / 365);
      days = (days - 1) % 365;
    }
    const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
    const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
    return { jy, jm, jd };
  } catch (e) {
    return null;
  }
}

function getTodayLabel() {
  const j = getJalaliDate();
  if (j) {
    return `${faNum(j.jd)} ${PERSIAN_MONTHS[j.jm - 1]} ${faNum(j.jy)}`;
  }
  return new Date().toLocaleDateString('fa-IR');
}

/* ===== GET NOOR ITEMS FOR TODAY ===== */
function getTodayNoor() {
  const day = getDayOfYear();
  return {
    verse: QURAN_VERSES[day % QURAN_VERSES.length],
    hadith: SHORT_HADITHS[day % SHORT_HADITHS.length],
    dua: SHORT_DUAS[day % SHORT_DUAS.length],
    deed: GOOD_DEEDS[day % GOOD_DEEDS.length]
  };
}

  { id: 'f3', speaker: 'fatemeh', speakerName: 'حضرت فاطمه (س)', topic: 'walayat', topicName: 'ولایت', arabic: 'إِنَّ أَفْضَلَ النَّاسِ بَعْدَ رَسُولِ اللَّهِ عَلِيُّ بْنُ أَبِي طَالِبٍ', translation: 'برترین مردم پس از رسول خدا، علی بن ابی‌طالب است', source: 'بحارالانوار، ج۴۳، ص۸۵', tags: ['فضیلت', 'علی'] },
  { id: 'f4', speaker: 'fatemeh', speakerName: 'حضرت فاطمه (س)', topic: 'mohebbat', topicName: 'محبت اهل بیت', arabic: 'مَنْ أَحَبَّنَا أَهْلَ الْبَيْتِ فَلْيَسْتَعِدَّ لِلْفَقْرِ', translation: 'هر کس ما اهل بیت را دوست دارد، باید خود را برای فقر آماده کند', source: 'بحارالانوار، ج۴۳، ص۸۷', tags: ['محبت', 'اهل بیت'] },
  { id: 'f5', speaker: 'fatemeh', speakerName: 'حضرت فاطمه (س)', topic: 'quran', topicName: 'قرآن', arabic: 'سَيِّدَةُ نِسَاءِ الْعَالَمِينَ فَاطِمَةُ بِنْتُ مُحَمَّدٍ', translation: 'سرور زنان جهانیان فاطمه دختر محمد است', source: 'بحارالانوار، ج۴۳، ص۸۹', tags: ['فاطمه', 'سرور'] },
  { id: 'f6', speaker: 'fatemeh', speakerName: 'حضرت فاطمه (س)', topic: 'dua', topicName: 'دعا', arabic: 'جَعَلَ اللَّهُ الصَّلَاةَ تَطْهِيراً لَكُمْ مِنَ الْكِبْرِ', translation: 'خداوند نماز را مایه پاکی شما از کبر قرار داد', source: 'خطبه فدکیه', tags: ['نماز', 'کبر'] },
  { id: 'f7', speaker: 'fatemeh', speakerName: 'حضرت فاطمه (س)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ أَخْلَصَ الْعِبَادَةَ لِلَّهِ بَلَغَ بِهَا أَعْلَى الدَّرَجَاتِ', translation: 'هر کس عبادت را برای خدا خالص کند، به بالاترین درجات می‌رسد', source: 'بحارالانوار', tags: ['عبادت', 'اخلاص'] },
  { id: 'f8', speaker: 'fatemeh', speakerName: 'حضرت فاطمه (س)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'حُبِّبَ إِلَيَّ مِنَ الدُّنْيَا ثَلَاثٌ: تِلَاوَةُ الْقُرْآنِ، وَالنَّظَرُ فِي وَجْهِ رَسُولِ اللَّهِ، وَالْإِنْفَاقُ فِي سَبِيلِ اللَّهِ', translation: 'از دنیا سه چیز نزد من محبوب است: تلاوت قرآن، نگاه به چهره رسول خدا، و انفاق در راه خدا', source: 'بحارالانوار', tags: ['قرآن', 'انفاق'] },
  { id: 'f9', speaker: 'fatemeh', speakerName: 'حضرت فاطمه (س)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'الْجَارُ ثُمَّ الدَّارُ', translation: 'اول همسایه، سپس خانه', source: 'بحارالانوار', tags: ['همسایه', 'خانه'] },
  { id: 'f10', speaker: 'fatemeh', speakerName: 'حضرت فاطمه (س)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'طُوبَى لِمَنْ كَانَ عِلْمُهُ بِاللَّهِ', translation: 'خوشا به حال کسی که دانشش به خدا باشد', source: 'بحارالانوار', tags: ['علم', 'خدا'] },

  /* ===== امام حسن (ع) ===== */
  { id: 'h1', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'الْحِلْمُ زِينَةُ الْمَرْءِ وَالْعِلْمُ مَنْصِبُهُ', translation: 'بردباری زینت انسان و علم مقام اوست', source: 'تحف العقول، ص۲۲۶', tags: ['حلم', 'علم'] },
  { id: 'h2', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'مَنْ تَرَكَ الْحَقَّ لِلْبَاطِلِ فَقَدْ ظَلَمَ نَفْسَهُ', translation: 'هر کس حق را برای باطل رها کند، به خود ستم کرده است', source: 'بحارالانوار، ج۴۴، ص۱۲', tags: ['حق', 'باطل'] },
  { id: 'h3', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'elm', topicName: 'علم', arabic: 'إِنَّ اللَّهَ يَرْحَمُ عَبْداً أَحْيَا عِلْماً', translation: 'خداوند رحمت می‌کند بر بنده‌ای که علمی را زنده کند', source: 'تحف العقول، ص۲۲۷', tags: ['علم', 'رحمت'] },
  { id: 'h4', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'أَفْضَلُ الزُّهْدِ إِخْفَاءُ الزُّهْدِ', translation: 'برترین زهد، پنهان کردن زهد است', source: 'بحارالانوار، ج۴۴، ص۱۵', tags: ['زهد', 'اخلاص'] },
  { id: 'h5', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'مَنْ أَكْرَمَ الْمُؤْمِنَ فَقَدْ أَكْرَمَ اللَّهَ', translation: 'هر کس مؤمنی را گرامی دارد، خدا را گرامی داشته است', source: 'تحف العقول، ص۲۲۸', tags: ['مؤمن', 'اکرام'] },
  { id: 'h6', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'لَا تُجَالِسُوا الْأَغْنِيَاءَ فَإِنَّهُمْ يَحْقِرُونَ مَنْ لَيْسَ مِثْلَهُمْ', translation: 'با ثروتمندان هم‌نشین نشوید که هرکس مثل آنان نباشد را تحقیر می‌کنند', source: 'بحارالانوار', tags: ['هم‌نشینی', 'ثروت'] },
  { id: 'h7', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'الْمَجْدُ فِي الصِّيَانَةِ لَيْسَ الْمَجْدُ فِي الْخِيَانَةِ', translation: 'بزرگواری در حفظ امانت است نه در خیانت', source: 'تحف العقول', tags: ['امانت', 'بزرگواری'] },
  { id: 'h8', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'elm-va-amal', topicName: 'علم و عمل', arabic: 'اعْمَلْ لِدُنْيَاكَ كَأَنَّكَ تَعِيشُ أَبَداً وَاعْمَلْ لِآخِرَتِكَ كَأَنَّكَ تَمُوتُ غَداً', translation: 'برای دنیایت چنان کار کن که گویا همیشه زنده‌ای و برای آخرتت چنان که گویا فردا می‌میری', source: 'تحف العقول', tags: ['دنیا', 'آخرت'] },
  { id: 'h9', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'خَيْرُ النَّاسِ مَنْ أَنْفَعَ النَّاسَ', translation: 'بهترین مردم کسی است که به مردم سود برساند', source: 'بحارالانوار', tags: ['خیر', 'نفع'] },
  { id: 'h10', speaker: 'hasan', speakerName: 'امام حسن (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'الْبُخْلُ عَارٌ وَالْجُبْنُ نَقْصٌ', translation: 'بخل ننگ و ترس نقص است', source: 'تحف العقول', tags: ['بخل', 'ترس'] },

  /* ===== امام حسین (ع) ===== */
  { id: 'ho1', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'إِنَّ النَّاسَ عَبِيدُ الدُّنْيَا وَالدِّينُ لَعْقٌ عَلَى أَلْسِنَتِهِمْ', translation: 'مردم بندگان دنیا هستند و دین بر زبانشان لقلقه‌ای بیش نیست', source: 'تحف العقول، ص۲۴۵', tags: ['دنیا', 'دین'] },
  { id: 'ho2', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'مَنْ طَلَبَ رِضَى اللَّهِ بِسَخَطِ النَّاسِ كَفَاهُ اللَّهُ أَمْرَ النَّاسِ', translation: 'هر کس رضایت خدا را با ناخشنودی مردم طلب کند، خداوند او را از امر مردم بی‌نیاز می‌کند', source: 'بحارالانوار، ج۴۴، ص۱۹۲', tags: ['رضای خدا', 'مردم'] },
  { id: 'ho3', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'sabr', topicName: 'صبر', arabic: 'الصَّبْرُ مِفْتَاحُ الْفَرَجِ وَنُورُ الْيَقِينِ', translation: 'صبر کلید گشایش و نور یقین است', source: 'بحارالانوار، ج۴۴، ص۱۹۴', tags: ['صبر', 'یقین'] },
  { id: 'ho4', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'إِنَّ لِلَّهِ عِبَاداً خَصَّهُمْ بِالنِّعَمِ فَأَبْقَوْهَا بِالْعَفَافِ', translation: 'خداوند بندگانی را با نعمت‌ها اختصاص داده، پس آن را با عفت و پاکدامنی باقی می‌دارند', source: 'تحف العقول، ص۲۴۶', tags: ['عفت', 'نعمت'] },
  { id: 'ho5', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ أَرَادَ أَنْ يَكُونَ أَكْرَمَ النَّاسِ فَلْيَتَّقِ اللَّهَ', translation: 'هر کس می‌خواهد کریم‌ترین مردم باشد، باید از خدا بترسد', source: 'بحارالانوار، ج۴۴، ص۱۹۶', tags: ['تقوا', 'کرامت'] },
  { id: 'ho6', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'بِأَبِي أَنْتَ وَأُمِّي يَا ابْنَ رَسُولِ اللَّهِ', translation: 'پدر و مادرم فدای تو باد ای فرزند رسول خدا', source: 'کامل الزیارات', tags: ['محبت', 'رسول'] },
  { id: 'ho7', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'walayat', topicName: 'ولایت', arabic: 'إِنِّي لَمْ أَخْرُجْ أَشِراً وَلَا بَطِراً وَلَا مُفْسِداً', translation: 'من از روی خودخواهی و نه برای عیاشی و فساد قیام نکردم', source: 'بحارالانوار، ج۴۴، ص۳۲۹', tags: ['قیام', 'اصلاح'] },
  { id: 'ho8', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'akhirat', topicName: 'آخرت', arabic: 'النَّاسُ فِي الدُّنْيَا ضَيْفٌ وَالْمَوْتُ ضِيَافَةٌ', translation: 'مردم در دنیا مهمانند و مرگ پذیرایی است', source: 'بحارالانوار', tags: ['دنیا', 'مرگ'] },
  { id: 'ho9', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'dua', topicName: 'دعا', arabic: 'اللَّهُمَّ اجْعَلْ مَحْيَايَ مَحْيَا مُحَمَّدٍ وَآلِ مُحَمَّدٍ', translation: 'خدایا زندگی من را زندگی محمد و آل محمد قرار ده', source: 'زیارت عاشورا', tags: ['دعا', 'محمد'] },
  { id: 'ho10', speaker: 'hossein', speakerName: 'امام حسین (ع)', topic: 'walayat', topicName: 'ولایت', arabic: 'إِنَّ الْحَيَاةَ عَقِيدَةٌ وَجِهَادٌ', translation: 'زندگی همانا عقیده و جهاد است', source: 'نهضت عاشورا', tags: ['زندگی', 'جهاد'] },

  /* ===== امام سجاد (ع) ===== */
  { id: 's1', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'namaz', topicName: 'عبادت', arabic: 'إِنَّ أَحَبَّ الْأَعْمَالِ إِلَى اللَّهِ الْإِقْبَالُ عَلَى الْعِبَادَةِ', translation: 'محبوب‌ترین اعمال نزد خداوند، روی آوردن به عبادت است', source: 'تحف العقول، ص۲۸۰', tags: ['عبادت', 'محبوب'] },
  { id: 's2', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ عَرَفَ اللَّهَ خَافَ اللَّهَ', translation: 'هر کس خدا را بشناسد از خدا می‌ترسد', source: 'صحیفه سجادیه، دعای ۳', tags: ['معرفت', 'خوف'] },
  { id: 's3', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'أَلَا إِنَّ لِلَّهِ عِبَاداً يَغْبِطُهُمُ الْأَنْبِيَاءُ', translation: 'آگاه باشید که خداوند بندگانی دارد که پیامبران به آنان غبطه می‌خورند', source: 'تحف العقول، ص۲۸۲', tags: ['مقام', 'اولیاء'] },
  { id: 's4', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'elm', topicName: 'علم', arabic: 'رَأْسُ الْحِكْمَةِ مَخَافَةُ اللَّهِ', translation: 'سر آغاز حکمت، ترس از خداست', source: 'صحیفه سجادیه، دعای ۵', tags: ['حکمت', 'خوف'] },
  { id: 's5', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'namaz', topicName: 'عبادت', arabic: 'لَا يَزَالُ الْمُؤْمِنُ فِي رَحْمَةِ اللَّهِ مَا كَانَ فِي طَاعَةِ اللَّهِ', translation: 'مؤمن تا در طاعت خداست، همواره در رحمت خدا خواهد بود', source: 'بحارالانوار، ج۴۶، ص۸۵', tags: ['طاعت', 'رحمت'] },
  { id: 's6', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ', translation: 'خدایا خشیتت را در پنهان و آشکار از تو می‌خواهم', source: 'صحیفه سجادیه', tags: ['خشیت', 'دعا'] },
  { id: 's7', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'حُسْنُ الْخُلُقِ مَعَ الْأَهْلِ', translation: 'خوش‌اخلاقی با خانواده از نیکویی است', source: 'بحارالانوار', tags: ['اخلاق', 'خانواده'] },
  { id: 's8', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'dua', topicName: 'دعا', arabic: 'لَا يُحِبُّ اللَّهُ مَنْ أَحَبَّ الدُّنْيَا', translation: 'خدا دوست ندارد کسی را که دنیا را دوست بدارد', source: 'تحف العقول', tags: ['دنیا', 'محبت'] },
  { id: 's9', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'akhirat', topicName: 'آخرت', arabic: 'کُنْ لِلدُّنْیَا کَاسِراً وَلِلْآخِرَةِ عامِراً', translation: 'دنیا را ویران کن و آخرت را آبادان', source: 'بحارالانوار', tags: ['دنیا', 'آخرت'] },
  { id: 's10', speaker: 'sajjad', speakerName: 'امام سجاد (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'إِنِّي لَأَكْرَهُ الرَّجُلَ أَنْ يَكُونَ عَلَى الْمُسْلِمِينَ عَالَةً', translation: 'من خوش ندارم کسی سربار مسلمین باشد', source: 'کافی', tags: ['کار', 'سربار'] },

  /* ===== امام باقر (ع) ===== */
  { id: 'b1', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'elm-va-amal', topicName: 'علم و عمل', arabic: 'إِنَّ الْعِلْمَ يُعَلِّمُ صاحِبَهُ الْوَرَعَ', translation: 'همانا علم به صاحب خود تقوا و پرهیزکاری می‌آموزد', source: 'کافی، ج۱، ص۳۶', tags: ['علم', 'ورع'] },
  { id: 'b2', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'مَنْ دَعَا النَّاسَ إِلَى نَفْسِهِ فَاتَّهِمُوهُ', translation: 'هر کس مردم را به سوی خود دعوت کند، او را متهم کنید', source: 'تحف العقول، ص۲۹۰', tags: ['دعوت', 'اتهام'] },
  { id: 'b3', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'namaz', topicName: 'عبادت', arabic: 'لَوْ يَعْلَمُ الْعَابِدُ مَا لَهُ فِي عِبَادَتِهِ لَمَا انْقَطَعَ', translation: 'اگر عابد بداند در عبادتش چه دارد، هرگز قطع نمی‌کند', source: 'کافی، ج۲، ص۸۲', tags: ['عبادت', 'اجر'] },
  { id: 'b4', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ أَحْسَنَ الظَّنَّ بِاللَّهِ كَانَ كَمَا يَظُنُّ', translation: 'هر کس به خدا گمان نیک داشته باشد، خداوند به همان گمان با او رفتار می‌کند', source: 'بحارالانوار، ج۴۶، ص۱۵۰', tags: ['حسن ظن', 'گمان'] },
  { id: 'b5', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'elm', topicName: 'علم', arabic: 'إِنَّ اللَّهَ يُحِبُّ الْعَبْدَ الْمُتَفَكِّرَ', translation: 'خداوند بنده‌ای را که می‌اندیشد دوست دارد', source: 'کافی، ج۲، ص۵۳', tags: ['تفکر', 'محبوب'] },
  { id: 'b6', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'صِلَةُ الْأَرْحَامِ تُحْسِنُ الْأَخْلَاقَ', translation: 'صله رحم اخلاق را نیکو می‌کند', source: 'کافی', tags: ['صله رحم', 'اخلاق'] },
  { id: 'b7', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'quran', topicName: 'قرآن', arabic: 'قِرَاءَةُ الْقُرْآنِ فِي الْمُصْحَفِ تُخَفِّفُ الْعَذَابَ عَنِ الْوَالِدَيْنِ', translation: 'خواندن قرآن از روی مصحف عذاب را از پدر و مادر سبک می‌کند', source: 'کافی', tags: ['قرآن', 'والدین'] },
  { id: 'b8', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ أَصْبَحَ لَا يَظْلِمُ أَحَداً غُفِرَ لَهُ', translation: 'هر کس صبح کند و به کسی ستم نکند، آمرزیده می‌شود', source: 'کافی', tags: ['ظلم', 'آمرزش'] },
  { id: 'b9', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'sabr', topicName: 'صبر', arabic: 'الصَّبْرُ مِنَ الْإِيمَانِ بِمَنْزِلَةِ الرَّأْسِ مِنَ الْجَسَدِ', translation: 'صبر در ایمان به منزله سر در بدن است', source: 'کافی', tags: ['صبر', 'ایمان'] },
  { id: 'b10', speaker: 'baqer', speakerName: 'امام باقر (ع)', topic: 'dua', topicName: 'دعا', arabic: 'أَفْضَلُ الْعِبَادَةِ الدُّعَاءُ', translation: 'برترین عبادت دعا است', source: 'کافی', tags: ['دعا', 'عبادت'] },

  /* ===== امام صادق (ع) ===== */
  { id: 'sa1', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ عَرَفَ اللَّهَ خَافَ اللَّهَ', translation: 'هر کس خدا را بشناسد، از خدا می‌ترسد', source: 'کافی، ج۱، ص۱۳۵', tags: ['معرفت', 'خوف'] },
  { id: 'sa2', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'namaz', topicName: 'نماز', arabic: 'الصَّلَاةُ قُرْبَانُ كُلِّ تَقِيٍّ', translation: 'نماز قربانی هر پرهیزکاری است', source: 'وسائل الشیعه، ج۳، ص۳۰', tags: ['نماز', 'تقوا'] },
  { id: 'sa3', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ جَاهَدَ نَفْسَهُ فَقَدْ جَاهَدَ عَدُوَّهُ', translation: 'هر کس با نفس خود جهاد کند، با دشمن خود جهاد کرده است', source: 'تحف العقول، ص۳۲۰', tags: ['جهاد نفس', 'مجاهده'] },
  { id: 'sa4', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'tavazo', topicName: 'تواضع', arabic: 'التَّوَاضُعُ زِينَةُ الْمُؤْمِنِ', translation: 'تواضع زینت مؤمن است', source: 'کافی، ج۲، ص۱۲۵', tags: ['تواضع', 'زینت'] },
  { id: 'sa5', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'mohebbat', topicName: 'محبت اهل بیت', arabic: 'مَنْ أَحَبَّنَا فَلْيَكُنْ مُسْتَعِدّاً لِلْفَقْرِ', translation: 'هر کس ما را دوست دارد، باید برای فقر آماده باشد', source: 'بحارالانوار، ج۴۷، ص۴۵', tags: ['محبت', 'فقر'] },
  { id: 'sa6', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'اَلْمُؤْمِنُ مِرْآةُ أَخِيهِ الْمُؤْمِنِ', translation: 'مؤمن آینه برادر مؤمن خود است', source: 'کافی، ج۲، ص۱۶۹', tags: ['مؤمن', 'برادر'] },
  { id: 'sa7', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ سَتَرَ عَلَى مُؤْمِنٍ عَيْباً سَتَرَ اللَّهُ عَلَيْهِ سَبْعِينَ عَيْباً', translation: 'هر کس عیب مؤمنی را بپوشاند، خدا هفتاد عیب او را می‌پوشاند', source: 'کافی', tags: ['عیب', 'پوشاندن'] },
  { id: 'sa8', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'أَحْسِنْ مُجَاوَرَةَ مَنْ جَاوَرَكَ تَكُنْ مُسْلِماً', translation: 'با همسایه‌ات خوب همسایگی کن تا مسلمان باشی', source: 'کافی', tags: ['همسایه', 'اسلام'] },
  { id: 'sa9', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'elm', topicName: 'علم', arabic: 'اُطْلُبُوا الْعِلْمَ وَتَزَيَّنُوا مَعَهُ بِالْحِلْمِ وَالْوَقَارِ', translation: 'علم بجویید و با آن به حلم و وقار آراسته شوید', source: 'کافی', tags: ['علم', 'حلم'] },
  { id: 'sa10', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'dua', topicName: 'دعا', arabic: 'اَلدُّعَاءُ يَرُدُّ الْقَضَاءَ الْمُبْرَمَ', translation: 'دعا قضای حتمی را برمی‌گرداند', source: 'کافی', tags: ['دعا', 'قضا'] },
  { id: 'sa11', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'كُنْ لِلَّهِ عَبْداً وَ لِلنَّاسِ أَخاً', translation: 'برای خدا بنده و برای مردم برادر باش', source: 'بحارالانوار', tags: ['عبودیت', 'اخوت'] },
  { id: 'sa12', speaker: 'sadeq', speakerName: 'امام صادق (ع)', topic: 'quran', topicName: 'قرآن', arabic: 'الْقُرْآنُ عَهْدُ اللَّهِ إِلَى خَلْقِهِ', translation: 'قرآن پیمان خدا با بندگان است', source: 'کافی', tags: ['قرآن', 'پیمان'] },

  /* ===== امام کاظم (ع) ===== */
  { id: 'k1', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'أَصْدَقُ النَّاسِ مَنْ رَضِيَ بِالْقَضَاءِ', translation: 'راست‌ترین مردم کسی است که به قضای الهی راضی باشد', source: 'تحف العقول، ص۳۶۰', tags: ['رضا', 'قضا'] },
  { id: 'k2', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'akhirat', topicName: 'آخرت', arabic: 'إِنَّ اللَّهَ يُمْهِلُ الظَّالِمَ فَإِذَا أَخَذَهُ لَمْ يُفْلِتْهُ', translation: 'خداوند به ستمگر مهلت می‌دهد، ولی هنگامی که بگیرد رهایش نمی‌کند', source: 'بحارالانوار، ج۴۸، ص۱۲', tags: ['ظلم', 'عقاب'] },
  { id: 'k3', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'مَنْ أَخَافَ الْمُؤْمِنَ فَقَدْ أَخَافَ اللَّهَ', translation: 'هر کس مؤمنی را بترساند، خدا را ترسانده است', source: 'تحف العقول، ص۳۶۲', tags: ['مؤمن', 'خوف'] },
  { id: 'k4', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'sabr', topicName: 'صبر', arabic: 'الصَّبْرُ أَفْضَلُ الْأَعْمَالِ', translation: 'صبر برترین اعمال است', source: 'بحارالانوار، ج۴۸، ص۱۵', tags: ['صبر', 'افضل'] },
  { id: 'k5', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'elm-va-amal', topicName: 'علم و عمل', arabic: 'مَنْ أَحْسَنَ عَمَلَهُ جَازَاهُ اللَّهُ بِالْحُسْنَى', translation: 'هر کس عمل خود را نیکو کند، خداوند او را به نیکی پاداش می‌دهد', source: 'تحف العقول، ص۳۶۴', tags: ['عمل', 'پاداش'] },
  { id: 'k6', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ لَمْ يَجْعَلْ قَلْبَهُ وَاحِداً لَمْ يَكُنْ لَهُ فِي الدُّنْيَا قَرَارٌ', translation: 'هر کس دلش را یکسان نگرداند، در دنیا آرامش ندارد', source: 'بحارالانوار', tags: ['دل', 'آرامش'] },
  { id: 'k7', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'مَنْ ضَحِكَ فِي وَجْهِ أَخِيهِ الْمُؤْمِنِ كَتَبَ اللَّهُ لَهُ حَسَنَةً', translation: 'هر کس به روی برادر مؤمن خود لبخند بزند، خدا برایش حسنه‌ای می‌نویسد', source: 'کافی', tags: ['لبخند', 'حسنه'] },
  { id: 'k8', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ كَفَّ عَنْ أَعْرَاضِ النَّاسِ كَفَّ اللَّهُ عَنْهُ عَيْبَهُ', translation: 'هر کس از آبروی مردم دست بکشد، خدا از عیب او دست می‌کشد', source: 'بحارالانوار', tags: ['آبرو', 'عیب'] },
  { id: 'k9', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'dua', topicName: 'دعا', arabic: 'كُنْ لِلَّهِ عَبْداً وَلِلْخَلْقِ خَيْرَ جَارٍ', translation: 'بنده خدا و برای مردم بهترین همسایه باش', source: 'تحف العقول', tags: ['بندگی', 'همسایگی'] },
  { id: 'k10', speaker: 'kazem', speakerName: 'امام کاظم (ع)', topic: 'quran', topicName: 'قرآن', arabic: 'إِنَّ أَفْضَلَ الْعِبَادَةِ تِلَاوَةُ الْقُرْآنِ', translation: 'برترین عبادت تلاوت قرآن است', source: 'بحارالانوار', tags: ['قرآن', 'تلاوت'] },

  /* ===== امام رضا (ع) ===== */
  { id: 'r1', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'الصَّدَقَةُ مِفْتَاحُ الرِّزْقِ', translation: 'صدقه کلید روزی است', source: 'عیون اخبار الرضا، ج۲، ص۳۰', tags: ['صدقه', 'روزی'] },
  { id: 'r2', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'tavazo', topicName: 'تواضع', arabic: 'مَنْ تَوَاضَعَ لِلَّهِ رَفَعَهُ اللَّهُ', translation: 'هر کس برای خدا تواضع کند، خداوند او را بالا می‌برد', source: 'عیون اخبار الرضا، ج۲، ص۳۲', tags: ['تواضع', 'رفعت'] },
  { id: 'r3', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'لَا يَكُونُ الْمُؤْمِنُ مُؤْمِناً حَتَّى يَكُونَ خَوْفُهُ مِنَ اللَّهِ أَكْثَرَ مِنْ خَوْفِهِ مِنَ النَّاسِ', translation: 'مؤمن مؤمن نیست تا اینکه ترسش از خدا بیشتر از ترسش از مردم باشد', source: 'عیون اخبار الرضا، ج۲، ص۳۴', tags: ['خوف', 'ایمان'] },
  { id: 'r4', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'namaz', topicName: 'عبادت', arabic: 'أَفْضَلُ الْعِبَادَةِ الْفِكْرُ فِي آيَاتِ اللَّهِ', translation: 'برترین عبادت، تفکر در آیات خداست', source: 'عیون اخبار الرضا، ج۲، ص۳۶', tags: ['تفکر', 'عبادت'] },
  { id: 'r5', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'akhirat', topicName: 'آخرت', arabic: 'مَنْ أَصْبَحَ وَأَمْسَى وَهَمُّهُ الْآخِرَةُ كَفَاهُ اللَّهُ هَمَّ الدُّنْيَا', translation: 'هر کس صبح و شام کند در حالی که همّ و غمش آخرت باشد، خداوند غم دنیا را از او برطرف می‌کند', source: 'عیون اخبار الرضا، ج۲، ص۳۸', tags: ['آخرت', 'همّ'] },
  { id: 'r6', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'الْبُخْلُ عَارٌ وَالْجُبْنُ نَقْصٌ', translation: 'بخل ننگ و ترس نقص است', source: 'بحارالانوار', tags: ['بخل', 'ترس'] },
  { id: 'r7', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'صِلْ رَحِمَكَ وَلَوْ بِشَرْبَةٍ مِنْ مَاءٍ', translation: 'صله رحم کن، حتی با یک جرعه آب', source: 'عیون اخبار الرضا', tags: ['صله رحم', 'آب'] },
  { id: 'r8', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ سَتَرَ عَلَى مُؤْمِنٍ سَتَرَ اللَّهُ عَلَيْهِ', translation: 'هر کس عیب مؤمنی را بپوشاند، خدا عیبش را می‌پوشاند', source: 'عیون اخبار الرضا', tags: ['سِتر', 'مؤمن'] },
  { id: 'r9', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'elm', topicName: 'علم', arabic: 'لَا يَكُونُ الْعِلْمُ إِلَّا مِنْ أَهْلِهِ', translation: 'علم نیست مگر از اهلش', source: 'عیون اخبار الرضا', tags: ['علم', 'اهل'] },
  { id: 'r10', speaker: 'reza', speakerName: 'امام رضا (ع)', topic: 'mohebbat', topicName: 'محبت اهل بیت', arabic: 'مَنْ أَحَبَّنَا فَلْيَتَّبِعْ آثَارَنَا', translation: 'هر کس ما را دوست دارد باید از آثار ما پیروی کند', source: 'بحارالانوار', tags: ['محبت', 'پیروی'] },

  /* ===== امام جواد (ع) ===== */
  { id: 'j1', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'elm', topicName: 'علم', arabic: 'إِنَّ الْعِلْمَ حَيَاةُ الْقُلُوبِ', translation: 'همانا علم، حیات دل‌هاست', source: 'تحف العقول، ص۴۰۰', tags: ['علم', 'حیات'] },
  { id: 'j2', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'elm', topicName: 'علم', arabic: 'مَنْ أَكْرَمَ عَالِماً فَقَدْ أَكْرَمَ اللَّهَ', translation: 'هر کس عالمی را گرامی دارد، خدا را گرامی داشته است', source: 'بحارالانوار، ج۵۰، ص۴۵', tags: ['عالم', 'اکرام'] },
  { id: 'j3', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'sabr', topicName: 'صبر', arabic: 'الصَّبْرُ أَفْضَلُ مَا يُحَلَّى بِهِ الْمُؤْمِنُ', translation: 'صبر بهترین چیزی است که مؤمن به آن آراسته می‌شود', source: 'تحف العقول، ص۴۰۲', tags: ['صبر', 'زینت'] },
  { id: 'j4', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'mohebbat', topicName: 'محبت اهل بیت', arabic: 'مَنْ أَحَبَّنَا أَهْلَ الْبَيْتِ فَلْيَصْبِرْ عَلَى الْأَذَى', translation: 'هر کس ما اهل بیت را دوست دارد، باید بر آزار صبر کند', source: 'بحارالانوار، ج۵۰، ص۴۸', tags: ['محبت', 'صبر'] },
  { id: 'j5', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'elm-va-amal', topicName: 'علم و عمل', arabic: 'إِنَّ اللَّهَ يُحِبُّ الْعَامِلَ الْأَمِينَ', translation: 'خداوند کارگر امین را دوست دارد', source: 'تحف العقول، ص۴۰۴', tags: ['امانت', 'کار'] },
  { id: 'j6', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ لَمْ يَعْرِفِ الْمَوَارِيدَ أَفْسَدَ الْمَصَادِرَ', translation: 'هر کس ورودی‌ها را نداند، خروجی‌ها را تباه می‌کند', source: 'بحارالانوار', tags: ['معرفت', 'تدبیر'] },
  { id: 'j7', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'dua', topicName: 'دعا', arabic: 'ثَلَاثٌ مَنْ كُنَّ فِيهِ لَمْ يَنْدَمْ: تَرْكُ الْعَجَلَةِ، وَالْمَشُورَةُ، وَالتَّوَكُّلُ', translation: 'سه چیز است که هر کس آن را رعایت کند پشیمان نمی‌شود: ترک عجله، مشورت، و توکل', source: 'بحارالانوار', tags: ['عجله', 'مشورت'] },
  { id: 'j8', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'صِلْ أَخَاكَ الْمُؤْمِنَ وَلَوْ بِقِطْعَةٍ مِنَ الْحَلْوَاءِ', translation: 'با برادر مؤمن خود پیوند کن اگر چه با یک تکه شیرینی باشد', source: 'بحارالانوار', tags: ['برادر', 'پیوند'] },
  { id: 'j9', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ كَانَ جَاهِلاً كَانَ ضَعِيفاً', translation: 'هر کس نادان باشد، ضعیف است', source: 'تحف العقول', tags: ['جهل', 'ضعف'] },
  { id: 'j10', speaker: 'javad', speakerName: 'امام جواد (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'الْمُؤْمِنُ يَحْتَاجُ إِلَى تَوْفِيقٍ مِنَ اللَّهِ وَ وَاعِظٍ مِنْ نَفْسِهِ', translation: 'مؤمن به توفیق الهی و پنددهنده‌ای از درون خود نیاز دارد', source: 'کافی', tags: ['توفیق', 'وجدان'] },

  /* ===== امام هادی (ع) ===== */
  { id: 'ha1', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'quran', topicName: 'قرآن', arabic: 'مَنْ قَرَأَ الْقُرْآنَ يَظُنُّ أَنَّهُ لَا يُتَابَعُ عَلَيْهِ كَانَ مُتَعَبِّداً', translation: 'هر کس قرآن را بخواند و گمان کند که از او پیروی نمی‌شود، عبادت‌کننده‌ای است', source: 'تحف العقول، ص۴۵۰', tags: ['قرآن', 'عبادت'] },
  { id: 'ha2', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'sabr', topicName: 'صبر', arabic: 'الصَّبْرُ مِفْتَاحُ كُلِّ خَيْرٍ', translation: 'صبر کلید هر خیری است', source: 'بحارالانوار، ج۵۰، ص۱۲۵', tags: ['صبر', 'خیر'] },
  { id: 'ha3', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'مَنْ أَحْسَنَ إِلَى النَّاسِ أَحْسَنَ اللَّهُ إِلَيْهِ', translation: 'هر کس به مردم نیکی کند، خداوند به او نیکی می‌کند', source: 'تحف العقول، ص۴۵۲', tags: ['نیکی', 'مردم'] },
  { id: 'ha4', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'إِنَّ أَفْضَلَ النَّاسِ مَنْ نَفَعَ النَّاسَ', translation: 'برترین مردم کسی است که به مردم سود برساند', source: 'بحارالانوار، ج۵۰، ص۱۲۸', tags: ['نفع', 'مردم'] },
  { id: 'ha5', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'elm-va-amal', topicName: 'علم و عمل', arabic: 'لَا تَنْظُرْ إِلَى مَنْ نَطَقَ بَلِ انْظُرْ إِلَى مَنْ أَحْسَنَ', translation: 'به کسی که سخن می‌گوید نگاه نکن، بلکه به کسی که نیکو عمل می‌کند نگاه کن', source: 'تحف العقول، ص۴۵۴', tags: ['عمل', 'گفتار'] },
  { id: 'ha6', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'الْحِكْمَةُ لَا تَنْجَعُ فِي الطِّبَاعِ الْخَبِيثَةِ', translation: 'حکمت در طبع‌های پلید اثر نمی‌کند', source: 'بحارالانوار', tags: ['حکمت', 'طبع'] },
  { id: 'ha7', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'مَنْ هَانَتْ عَلَيْهِ نَفْسُهُ فَلَا تَأْمَنْ شَرَّهُ', translation: 'هر کس خودش را سبک بشمارد، از شر او ایمن نباش', source: 'بحارالانوار', tags: ['شر', 'نفس'] },
  { id: 'ha8', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'dua', topicName: 'دعا', arabic: 'الدُّنْيَا سُوقٌ رَبِحَ فِيهَا قَوْمٌ وَ خَسِرَ آخَرُونَ', translation: 'دنیا بازاری است که گروهی سود و گروهی زیان می‌کنند', source: 'تحف العقول', tags: ['دنیا', 'سود'] },
  { id: 'ha9', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'احْذَرْ مِنْ كُلِّ عَمَلٍ يَعْمَلُهُ فِي السِّرِّ وَيُسْتَحَى مِنْهُ فِي الْعَلَانِيَةِ', translation: 'بپرهیز از هر عملی که در پنهان انجام می‌شود و در آشکار از آن شرم می‌آید', source: 'بحارالانوار', tags: ['عمل', 'حیا'] },
  { id: 'ha10', speaker: 'hadi', speakerName: 'امام هادی (ع)', topic: 'mohebbat', topicName: 'محبت اهل بیت', arabic: 'حُبُّنَا يُسْقِطُ الذُّنُوبَ كَمَا يُسْقِطُ الرِّيحُ الْوَرَقَ', translation: 'محبت ما گناهان را فرو می‌ریزد، همچنان که باد برگ را', source: 'بحارالانوار', tags: ['محبت', 'گناه'] },

  /* ===== امام عسکری (ع) ===== */
  { id: 'as1', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'namaz', topicName: 'عبادت', arabic: 'إِنَّ أَفْضَلَ الْعَمَلِ الْإِيمَانُ بِاللَّهِ ثُمَّ الصَّلَاةُ', translation: 'برترین عمل، ایمان به خدا و سپس نماز است', source: 'تحف العقول، ص۴۸۰', tags: ['ایمان', 'نماز'] },
  { id: 'as2', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'مَنْ أَحَبَّنَا فَلْيَكُنْ عَلَى خُلُقٍ حَسَنٍ', translation: 'هر کس ما را دوست دارد، باید خوش‌اخلاق باشد', source: 'بحارالانوار، ج۵۰، ص۲۴۰', tags: ['محبت', 'اخلاق'] },
  { id: 'as3', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'sabr', topicName: 'صبر', arabic: 'الصَّبْرُ عَلَى الْفَقْرِ مِنَ الْإِيمَانِ', translation: 'صبر بر فقر از ایمان است', source: 'تحف العقول، ص۴۸۲', tags: ['صبر', 'فقر'] },
  { id: 'as4', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'akhlaq-ejtemai', topicName: 'اخلاق اجتماعی', arabic: 'مَنْ أَكْرَمَ أَخَاهُ فَقَدْ أَكْرَمَ اللَّهَ', translation: 'هر کس برادر خود را گرامی دارد، خدا را گرامی داشته است', source: 'بحارالانوار، ج۵۰، ص۲۴۲', tags: ['برادر', 'اکرام'] },
  { id: 'as5', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'إِنَّ اللَّهَ يُحِبُّ الْعَبْدَ الْحَيِيَّ الْحَلِيمَ', translation: 'خداوند بنده‌ای را که با حیا و بردبار است دوست دارد', source: 'تحف العقول، ص۴۸۴', tags: ['حیا', 'حلم'] },
  { id: 'as6', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'لَا تَشْغَلِ الْقَلْبَ بِمَا لَا یَعْنِیهِ', translation: 'دل را به چیزی که به آن مربوط نیست مشغول مکن', source: 'بحارالانوار', tags: ['دل', 'مشغول'] },
  { id: 'as7', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'elm', topicName: 'علم', arabic: 'الْعَالِمُ كَالشَّمْسِ یُضِیءُ لِلْعَالَمِ', translation: 'عالم همچون خورشید است که برای جهانیان نور می‌دهد', source: 'بحارالانوار', tags: ['عالم', 'خورشید'] },
  { id: 'as8', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'dua', topicName: 'دعا', arabic: 'مَنْ كَانَ مَعَ اللَّهِ كَانَ اللَّهُ مَعَهُ', translation: 'هر کس با خدا باشد، خدا با اوست', source: 'تحف العقول', tags: ['خدا', 'همراهی'] },
  { id: 'as9', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'akhlaq', topicName: 'اخلاق', arabic: 'التَّوَاضُعُ نِعْمَةٌ وَالْكِبْرُ نِقْمَةٌ', translation: 'تواضع نعمت و تکبر نقمت است', source: 'تحف العقول', tags: ['تواضع', 'تکبر'] },
  { id: 'as10', speaker: 'askari', speakerName: 'امام عسکری (ع)', topic: 'mohebbat', topicName: 'محبت اهل بیت', arabic: 'إِنَّ مَحَبَّتَنَا أَهْلَ الْبَيْتِ تُكَفِّرُ الذُّنُوبَ', translation: 'همانا محبت ما اهل بیت گناهان را می‌پوشاند', source: 'بحارالانوار', tags: ['محبت', 'گناه'] },

  /* ===== امام زمان (عج) ===== */
  { id: 'm1', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'walayat', topicName: 'ولایت', arabic: 'إِنَّ اللَّهَ يَقُولُ: مَنِ انْتَظَرَ فَرَجَنَا فَكَأَنَّمَا كَانَ فِي عِبَادَةِ اللَّهِ', translation: 'خداوند می‌فرماید: هر کس فرج ما را انتظار بکشد، گویا در عبادت خدا بوده است', source: 'بحارالانوار، ج۵۲، ص۱۲۲', tags: ['انتظار', 'فرج'] },
  { id: 'm2', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'mohebbat', topicName: 'محبت اهل بیت', arabic: 'مَنْ أَحَبَّنَا فَلْيَسْتَعِدَّ لِلْبَلَاءِ', translation: 'هر کس ما را دوست دارد، باید خود را برای بلا آماده کند', source: 'بحارالانوار، ج۵۲، ص۱۲۴', tags: ['محبت', 'بلا'] },
  { id: 'm3', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'walayat', topicName: 'ولایت', arabic: 'أَفْضَلُ أَعْمَالِ شِيعَتِنَا انْتِظَارُ الْفَرَجِ', translation: 'برترین اعمال شیعیان ما، انتظار فرج است', source: 'بحارالانوار، ج۵۲، ص۱۲۶', tags: ['انتظار', 'افضل'] },
  { id: 'm4', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'namaz', topicName: 'عبادت', arabic: 'مَنْ كَانَ لِلَّهِ مُطِيعاً كَانَ اللَّهُ لَهُ مُعِيناً', translation: 'هر کس برای خدا مطیع باشد، خداوند یار و یاور او خواهد بود', source: 'بحارالانوار، ج۵۲، ص۱۲۸', tags: ['طاعت', 'یاری'] },
  { id: 'm5', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'walayat', topicName: 'ولایت', arabic: 'إِنَّ اللَّهَ سَيُتِمُّ نُورَهُ وَلَوْ كَرِهَ الْكَافِرُونَ', translation: 'خداوند نور خود را کامل خواهد کرد، هر چند کافران ناخشنود باشند', source: 'بحارالانوار، ج۵۲، ص۱۳۰', tags: ['نور', 'وعده'] },
  { id: 'm6', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'dua', topicName: 'دعا', arabic: 'أَكْثِرُوا الدُّعَاءَ لِتَعْجِيلِ الْفَرَجِ', translation: 'برای تعجیل فرج بسیار دعا کنید', source: 'بحارالانوار', tags: ['دعا', 'فرج'] },
  { id: 'm7', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'tazkiye', topicName: 'تزکیه نفس', arabic: 'فَإِنَّ اللَّهَ هُوَ الْغَنِيُّ الْحَمِيدُ', translation: 'زیرا خدا همان بی‌نیاز ستوده است', source: 'توقیعات', tags: ['خدا', 'بی‌نیازی'] },
  { id: 'm8', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'walayat', topicName: 'ولایت', arabic: 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', translation: 'هیچ جنبش و توانی جز به خدا نیست', source: 'بحارالانوار', tags: ['توحید', 'قدرت'] },
  { id: 'm9', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'mohebbat', topicName: 'محبت اهل بیت', arabic: 'إِنَّهُمْ عِنْدَنَا مَحْفُوظُونَ', translation: 'همانا دوستان ما نزد ما محفوظ‌اند', source: 'بحارالانوار', tags: ['دوست', 'حفظ'] },
  { id: 'm10', speaker: 'mahdi', speakerName: 'امام زمان (عج)', topic: 'dua', topicName: 'دعا', arabic: 'أَمَّا تَعْجِيلُ الْفَرَجِ فَإِنَّهُ إِلَى اللَّهِ', translation: 'اما تعجیل فرج به دست خداست', source: 'توقیعات', tags: ['فرج', 'خدا'] },

    verses: [
      { ar: 'بِسَنَدٍ صَحيحٍ عَنْ جابِرِ بْنِ عَبْدِاللَّهِ الاَنْصاري عَنْ فاطِمَةَ الزَّهْراءِ عَلَيهَا السَّلامُ بِنْتِ رَسُولِ اللَّهِ صَلَّي اللَّهُ عَلَيهِ وَآلِهِ قالَ سَمِعْتُ فاطِمَةَ اَنَّها قالَتْ دَخَلَ عَلَيَّ اَبي رَسُولُ اللَّهِ في بَعْضِ الْأَيَّامِ، فَقالَ السَّلامُ عَلَيْكِ يا فاطِمَةُ، فَقُلْتُ عَلَيْكَ السَّلامُ قالَ اِنّي اَجِدُ في بَدَني ضُعْفاً، فَقُلْتُ لَهُ اُعيذُكَ بِاللَّهِ يا اَبَتاهُ مِنَ الضُّعْفِ، فَقَالَ يا فاطِمَةُ ايتيني بِالْكِسآءِ الْيَماني فَغَطّيني بِهِ، فَاَتَيْتُهُ بِالْكِسآءِ الْيَماني فَغَطَّيْتُهُ بِهِ، وَصِرْتُ اَنْظُرُ اِلَيْهِ، وَاِذا وَجْهُهُ يَتَلَأْلَؤُ كَاَنَّهُ الْبَدْرُ في لَيْلَةِ تَمامِهِ وَكَمالِهِ', fa: 'به سندی صحیح از جابر بن عبداللّه انصاری روایت شده از فاطمه زهرا سلام‌اللّه علیها دختر رسول خدا صلی‌اللّه علیه وآله، جابر گوید شنیدم از فاطمه زهرا که فرمود: وارد شد بر من پدرم رسول خدا در بعضی از روزها و فرمود: سلام بر تو ای فاطمه در پاسخش گفتم: بر تو باد سلام فرمود: من در بدنم سستی و ضعفی احساس می‌کنم، گفتم: پناه می‌دهم تو را به خدا ای پدرجان از سستی و ضعف فرمود: ای فاطمه برایم کساء یمانی را بیاور و مرا بدان بپوشان من کساء یمانی را برایش آوردم و او را بدان پوشاندم و هم‌چنان بدو می‌نگریستم و در آن حال چهره‌اش همانند ماه شب چهارده می‌درخشید.' },
      { ar: 'فَما كانَتْ اِلاَّ ساعَةً وَاِذا بِوَلَدِيَ الْحَسَنِ قَدْ اَقْبَلَ، وَقالَ السَّلامُ عَلَيْكِ يا اُمَّاهُ، فَقُلْتُ وَعَلَيْكَ السَّلامُ يا قُرَّةَ عَيْني وَثَمَرَةَ فُؤادي، فَقالَ يا اُمَّاهُ اِنّي اَشَمُّ عِنْدَكِ رآئِحَةً طَيِّبَةً، كَاَنَّها رآئِحَةُ جَدّي رَسُولِ اللَّهِ، فَقُلْتُ نَعَمْ اِنَّ جَدَّكَ تَحْتَ الْكِسآءِ، فَاَقْبَلَ الْحَسَنُ نَحْوَ الْكِسآءِ، وَقالَ السَّلامُ عَلَيْكَ يا جَدَّاهُ يا رَسُولَ اللَّهِ، اَتَاْذَنُ لي اَنْ اَدْخُلَ مَعَكَ تَحْتَ الْكِسآءِ، فَقالَ وَعَلَيْكَ السَّلامُ يا وَلَدي وَيا صاحِبَ حَوْضي، قَدْ اَذِنْتُ لَكَ، فَدَخَلَ مَعَهُ تَحْتَ الْكِسآءِ', fa: 'پس ساعتی نگذشت که دیدم فرزندم حسن وارد شد و گفت سلام بر تو ای مادر گفتم: بر تو باد سلام ای نور دیده‌ام و میوه دلم گفت: مادرجان من در نزد تو بوی خوشی استشمام می‌کنم گویا بوی جدم رسول خدا است گفتم: آری همانا جد تو در زیر کساء است پس حسن بطرف کساء رفت و گفت: سلام بر تو ای جد بزرگوار ای رسول خدا آیا به من اذن می‌دهی که وارد شوم با تو در زیر کساء؟ فرمود: بر تو باد سلام ای فرزندم و ای صاحب حوض من اذنت دادم پس حسن با آن جناب بزیر کساء رفت.' },
      { ar: 'فَما كانَتْ اِلاَّ ساعَةً وَاِذا بِوَلَدِيَ الْحُسَيْنِ قَدْ اَقْبَلَ، وَقالَ السَّلامُ عَلَيْكِ يا اُمَّاهُ، فَقُلْتُ وَعَلَيْكَ السَّلامُ يا وَلَدي وَيا قُرَّةَ عَيْني وَثَمَرَةَ فُؤادي، فَقالَ لي يا اُمَّاهُ اِنّي اَشَمُّ عِنْدَكِ رآئِحَةً طَيِّبَةً، كَاَنَّها رآئِحَةُ جَدّي رَسُولِ اللَّهِ صَلَّي اللَّهُ عَلَيْهِ وَآلِهِ فَقُلْتُ نَعَمْ اِنَّ جَدَّكَ وَاَخاكَ تَحْتَ الْكِسآءِ، فَدَنَي الْحُسَيْنُ نَحْوَ الْكِسآءِ، وَقالَ السَّلامُ عَلَيْكَ يا جَدَّاهُ، اَلسَّلامُ عَلَيْكَ يا مَنِ اخْتارَهُ اللَّهُ، اَتَاْذَنُ لي اَنْ اَكُونَ مَعَكُما تَحْتَ الْكِسآءِ، فَقالَ وَعَلَيْكَ السَّلامُ يا وَلَدي وَيا شافِعَ اُمَّتي، قَدْ اَذِنْتُ لَكَ فَدَخَلَ مَعَهُما تَحْتَ الْكِسآءِ', fa: 'ساعتی نگذشت که فرزندم حسین وارد شد و گفت: سلام بر تو ای مادر گفتم: بر تو باد سلام ای فرزند من و ای نور دیده‌ام و میوه دلم فرمود: مادرجان من در نزد تو بوی خوشی استشمام می‌کنم گویا بوی جدم رسول خدا(ص) است گفتم آری همانا جد تو و برادرت در زیر کساء هستند حسین نزدیک کساء رفته گفت: سلام بر تو ای جد بزرگوار، سلام بر تو ای کسی که خدا او را برگزید آیا به من اذن می‌دهی که داخل شوم با شما در زیر کساء فرمود: و بر تو باد سلام ای فرزندم و ای شفاعت‌کننده امتم به تو اذن دادم پس او نیز با آن دو در زیر کساء وارد شد.' },
      { ar: 'فَاَقْبَلَ عِنْدَ ذلِكَ اَبُوالْحَسَنِ عَلِيُّ بْنُ اَبي طالِبٍ، وَقالَ السَّلامُ عَلَيْكِ يا بِنْتَ رَسُولِ اللَّهِ، فَقُلْتُ وَعَلَيْكَ السَّلامُ يا اَبَا الْحَسَنِ وَ يا اَميرَ الْمُؤْمِنينَ فَقالَ يا فاطِمَةُ اِنّي اَشَمُّ عِنْدَكِ رائِحَةً طَيِّبَةً كَاَنَّها رآئِحَةُ اَخي وَابْنِ عَمّي رَسُولِ اللَّهِ، فَقُلْتُ نَعَمْ ها هُوَ مَعَ وَلَدَيْكَ تَحْتَ الْكِسآءِ، فَاَقْبَلَ عَلِيٌّ نَحْوَ الْكِسآءِ، وَقالَ السَّلامُ عَلَيْكَ يا رَسُولَ اللَّهِ، اَتَاْذَنُ لي اَنْ اَكُونَ مَعَكُمْ تَحْتَ الْكِسآءِ، قالَ لَهُ وَعَلَيْكَ السَّلامُ يا اَخي يا وَصِيّي وَخَليفَتي وَصاحِبَ لِوآئي، قَدْ اَذِنْتُ لَكَ فَدَخَلَ عَلِيٌّ تَحْتَ الْكِسآءِ', fa: 'در این هنگام ابوالحسن علی بن ابی‌طالب وارد شد و فرمود سلام بر تو ای دختر رسول خدا گفتم: و بر تو باد سلام ای اباالحسن و ای امیرمؤمنان فرمود: ای فاطمه من بوی خوشی نزد تو استشمام می‌کنم گویا بوی برادرم و پسرعمویم رسول خدا است ؟ گفتم: آری این او است که با دو فرزندت در زیر کساء هستند پس علی نیز به طرف کساء رفت و گفت سلام بر تو ای رسول خدا آیا اذن می‌دهی که من نیز با شما در زیر کساء باشم رسول خدا به او فرمود: و بر تو باد سلام ای برادر من و ای وصی و خلیفه و پرچمدار من به تو اذن دادم پس علی نیز وارد در زیر کساء شد.' },
      { ar: 'ثُمَّ اَتَيْتُ نَحْوَ الْكِسآءِ، وَقُلْتُ اَلسَّلامُ عَلَيْكَ يا اَبَتاهُ يا رَسُولَ اللَّهِ، اَتَاْذَنُ لي اَن اَكُونَ مَعَكُمْ تَحْتَ الْكِسآءِ، قالَ وَعَلَيْكِ السَّلامُ يا بِنْتي وَيا بَضْعَتي قَدْ اَذِنْتُ لَكِ، فَدَخَلْتُ تَحْتَ الْكِسآءِ', fa: 'در این هنگام من نیز به طرف کساء رفتم و عرض کردم سلام بر تو ای پدرجان ای رسول خدا آیا به من هم اذن می‌دهی که با شما در زیر کساء باشم؟ فرمود: و بر تو باد سلام ای دخترم و ای پاره تنم به تو هم اذن دادم، پس من نیز به زیر کساء رفتم.' },
      { ar: 'فَلَمَّا اكْتَمَلْنا جَميعاً تَحْتَ الْكِسآءِ، اَخَذَ اَبي رَسُولُ اللَّهِ بِطَرَفَيِ الْكِسآءِ، وَاَوْمَئَ بِيَدِهِ الْيُمْني اِلَي السَّمآءِ، وَقالَ اَللَّهُمَّ اِنَّ هؤُلاءِ اَهْلُ بَيْتي وَخآصَّتي وَحآمَّتي، لَحْمُهُمْ لَحْمي، وَدَمُهُمْ دَمي، يُؤْلِمُني ما يُؤْلِمُهُمْ، وَيَحْزُنُني ما يَحْزُنُهُمْ، اَنَا حَرْبٌ لِمَنْ حارَبَهُمْ، وَسِلْمٌ لِمَنْ سالَمَهُمْ وَعَدُوٌّ لِمَنْ عاداهُمْ، وَمُحِبٌّ لِمَنْ اَحَبَّهُمْ، اِنَّهُمْ مِنّي وَاَ نَا مِنْهُمْ، فَاجْعَلْ صَلَواتِكَ وَبَرَكاتِكَ وَرَحْمَتَكَ، وَغُفْرانَكَ وَرِضْوانَكَ عَلَيَّ وَعَلَيْهِمْ، وَاَذْهِبْ عَنْهُمُ الرِّجْسَ، وَطَهِّرْهُمْ تَطْهيراً', fa: 'و چون همگی در زیر کساء جمع شدیم پدرم رسول خدا دو طرف کساء را گرفت و با دست راست به سوی آسمان اشاره کرد و فرمود: خدایا اینانند خاندان من و خواص و نزدیکانم گوشتشان گوشت من و خونشان خون من است می‌آزارد مرا هرچه ایشان را بیازارد و به اندوه می‌اندازد مرا هرچه ایشان را به اندوه در آورد من در جنگم با هر که با ایشان بجنگد و در صلحم با هر که با ایشان در صلح است و دشمنم با هر کس که با ایشان دشمنی کند و دوستم با هر کس که ایشان را دوست دارد اینان از منند و من از ایشانم پس بفرست درودهای خود و برکت‌هایت و مهرت و آمرزشت و خوشنودیت را بر من و بر ایشان و دور کن از ایشان پلیدی را و پاکیزه شان کن به خوبی.' },
      { ar: 'فَقالَ اللَّهُ عَزَّوَجَلَّ يا مَلائِكَتي وَيا سُكَّانَ سَمواتي، اِنّي ما خَلَقْتُ سَمآءً مَبْنِيَّةً، وَلا اَرْضاً مَدْحِيَّةً، وَلا قَمَراً مُنيراً، وَلا شَمْساً مُضِيئَةً، وَلا فَلَكاً يَدُورُ، وَلا بَحْراً يَجْري، وَلا فُلْكاً يَسْري، اِلاَّ في مَحَبَّةِ هؤُلاءِ الْخَمْسَةِ الَّذينَ هُمْ تَحْتَ الْكِسآءِ، فَقالَ الْأَمينُ جِبْرآئيلُ يا رَبِّ وَمَنْ تَحْتَ الْكِسآءِ، فَقالَ عَزَّوَجَلَّ هُمْ اَهْلُ بَيْتِ النُّبُوَّةِ، وَمَعْدِنُ الرِّسالَةِ، هُمْ فاطِمَةُ وَاَبُوها وَبَعْلُها وَبَنُوها', fa: 'پس خدای عزوجل فرمود: ای فرشتگان من و ای ساکنان آسمان‌هایم براستی که من نیافریدم آسمان بنا شده و نه زمین گسترده و نه ماه تابان و نه مهر درخشان و نه فلک چرخان و نه دریای روان و نه کشتی در جریان را مگر به خاطر دوستی این پنج تن اینان که در زیر کسایند پس جبرئیل امین عرض کرد: پروردگارا کیانند در زیر کساء؟ خدای عزوجل فرمود: آنان خاندان نبوت و رسالتند: آنان فاطمه است و پدرش و شوهر و دو فرزندش.' },
      { ar: 'فَقالَ جِبْرآئيلُ يا رَبِّ، اَتَاْذَنُ لي اَنْ اَهْبِطَ اِلَي الْأَرْضِ لِأَكُونَ مَعَهُمْ سادِساً، فَقالَ اللَّهُ نَعَمْ قَدْ اَذِنْتُ لَكَ، فَهَبَطَ الْأَمينُ جِبْرآئيلُ، وَقالَ السَّلامُ عَلَيْكَ يا رَسُولَ اللَّهِ، الْعَلِيُ الْأَعْلي يُقْرِئُكَ السَّلامَ، وَيَخُصُّكَ بِالتَّحِيَّةِ وَالْإِكْرامِ، وَيَقُولُ لَكَ وَعِزَّتي وَجَلالي اِنّي ما خَلَقْتُ سَمآءً مَبْنِيَّةً، وَلا اَرْضاً مَدْحِيَّةً، وَلا قَمَراً مُنيراً، وَلا شَمْساً مُضيئَةً وَلا فَلَكاً يَدُورُ، وَلا بَحْراً يَجْري، وَلا فُلْكاً يَسْري، اِلاَّ لِأَجْلِكُمْ وَمَحَبَّتِكُمْ، وَقَدْ اَذِنَ لي اَنْ اَدْخُلَ مَعَكُمْ، فَهَلْ تَاْذَنُ لي يا رَسُولَ اللَّهِ، فَقالَ رَسُولُ اللَّهِ وَعَلَيْكَ السَّلامُ يا اَمينَ وَحْيِ اللَّهِ، اِنَّهُ نَعَمْ قَدْ اَذِنْتُ لَكَ، فَدَخَلَ جِبْرآئيلُ مَعَنا تَحْتَ الْكِسآءِ، فَقالَ لِأَبي اِنَّ اللَّهَ قَدْ اَوْحى اِلَيْكُمْ يَقُولُ: اِنَّما يُريدُ اللَّهُ لِيُذْهِبَ عَنْكُمُ الرِّجْسَ اَهْلَ الْبَيْتِ، وَيُطَهِّرَكُمْ تَطْهيراً', fa: 'جبرئیل عرض کرد: پروردگارا آیا به من هم اذن می‌دهی که به زمین فرود آیم تا ششمین آنها باشم خدا فرمود: آری به تو اذن دادم پس جبرئیل امین به زمین آمد و گفت: سلام بر تو ای رسول خدا، (پروردگار) علی اعلی سلامت می‌رساند و تو را به تحیت و اکرام مخصوص داشته و می‌فرماید: به عزت و جلالم سوگند که من نیافریدم آسمان بنا شده و نه زمین گسترده و نه ماه تابان و نه مهر درخشان و نه فلک چرخان و نه دریای روان و نه کشتی در جریان را مگر برای خاطر شما و محبت و دوستی شما و به من نیز اذن داده است که با شما در زیر کساء باشم پس آیا تو هم ای رسول خدا اذنم می‌دهی؟ رسول خدا(ص ) فرمود و بر تو باد سلام ای امین وحی خدا آری به تو هم اذن دادم پس جبرئیل با ما وارد در زیر کساء شد و به پدرم گفت: همانا خداوند بسوی شما وحی کرده و می‌فرماید: (حقیقت این است که خدا می‌خواهد پلیدی (و ناپاکی) را از شما خاندان ببرد و پاکیزه کند شما را پاکیزگی کامل).' },
      { ar: 'فَقالَ عَلِيٌّ لِأَبي يا رَسُولَ اللَّهِ، اَخْبِرْني ما لِجُلُوسِنا هذا تَحْتَ الْكِسآءِ مِنَ الْفَضْلِ عِنْدَ اللَّهِ؟ فَقالَ النَّبِيُّ وَالَّذي بَعَثَني بِالْحَقِّ نَبِيّاً، وَاصْطَفاني بِالرِّسالَةِ نَجِيّاً، ما ذُكِرَ خَبَرُنا هذا في مَحْفِلٍ مِنْ مَحافِلِ اَهْلِ الْأَرْضِ، وَفيهِ جَمْعٌ مِنْ شَيعَتِنا وَمُحِبّينا، اِلاَّ وَنَزَلَتْ عَلَيْهِمُ الرَّحْمَةُ وَحَفَّتْ بِهِمُ الْمَلائِكَةُ، وَاسْتَغْفَرَتْ لَهُمْ اِلي اَنْ يَتَفَرَّقُوا، فَقالَ عَلِيٌّ اِذاً وَاللَّهِ فُزْنا وَفازَ شيعَتُنا وَرَبِّ الْكَعْبَةِ', fa: 'علی علیه‌السلام به پدرم گفت: ای رسول خدا به من بگو این جلوس (و نشستن) ما در زیر کساء چه فضیلتی (و چه شرافتی) نزد خدا دارد؟ پیغمبر(ص ) فرمود: سوگند بدان خدائی که مرا به حق به پیامبری برانگیخت و به رسالت و نجات دادن (خلق) برگزید که ذکر نشود این خبر (و سرگذشت) ما در محفلی از محافل مردم زمین که در آن گروهی از شیعیان و دوستان ما باشند جز آنکه نازل شود بر ایشان رحمت (حق) و فرا گیرند ایشان را فرشتگان و برای آنها آمرزش خواهند تا آنگاه که از دور هم پراکنده شوند، علی (که این فضیلت را شنید) فرمود: با این ترتیب به خدا سوگند ما رستگار شدیم و سوگند به پروردگار کعبه که شیعیان ما نیز رستگار شدند.' },
      { ar: 'فَقالَ النَّبِيُّ ثانِياً يا عَلِيُّ وَالَّذي بَعَثَني بِالْحَقِّ نَبِيّاً، وَاصْطَفاني بِالرِّسالَةِ نَجِيّاً، ما ذُكِرَ خَبَرُنا هذا في مَحْفِلٍ مِنْ مَحافِلِ اَهْلِ الْأَرْضِ، وَفيهِ جَمْعٌ مِنْ شيعَتِنا وَمُحِبّينا، وَفيهِمْ مَهْمُومٌ اِلاَّ وَفَرَّجَ اللَّهُ هَمَّهُ، وَلا مَغْمُومٌ اِلاَّ وَكَشَفَ اللَّهُ غَمَّهُ، وَلا طالِبُ حاجَةٍ اِلاَّ وَقَضَي اللّهُ حاجَتَهُ، فَقالَ عَلِيٌّ اِذاً وَاللَّهِ فُزْنا وَسُعِدْنا، وَكَذلِكَ شيعَتُنا فازُوا وَسُعِدُوا فِي الدُّنْيا وَالْأخِرَةِ، وَرَبِّ الْكَعْبَةِ', fa: 'دوباره پیغمبر فرمود: ای علی سوگند بدانکه مرا بحق به نبوت برانگیخت و به رسالت و نجات دادن (خلق) برگزید ذکر نشود این خبر (و سرگذشت) ما در محفلی از محافل مردم زمین که در آن گروهی از شیعیان و دوستان ما باشند و در میان آنها اندوهناکی باشد جز آنکه خدا اندوهش را برطرف کند و نه غمناکی جز آنکه خدا غمش را بگشاید و نه حاجت‌خواهی باشد جز آنکه خدا حاجتش را برآورد، علی گفت: بدین ترتیب به خدا سوگند ما کامیاب و سعادتمند شدیم و هم‌چنین سوگند به پروردگار کعبه که شیعیان ما نیز رستگار شدند.' }
    ]
  },

  /* ===== خطبه غدیر ===== */
  {
    id: 'ghadir',
    speaker: 'ghadir',
    speakerName: 'پیامبر اکرم (ص)',
    topic: 'walayat',
    topicName: 'ولایت و امامت',
    arabic: 'خُطْبَةُ الْغَدِيرِ',
    translation: 'خطبه غدیر — خطبه پیامبر اکرم (ص) در روز عید غدیر خم',
    source: 'بحارالانوار، ج۳۷، ص۲۵۴-۲۷۰ • مفاتیح الجنان',
    tags: ['غدیر', 'ولایت', 'امامت'],
    verses: [
      { ar: 'الْحَمْدُ لِلَّهِ الَّذِي عَلَا فِي تَوْحِيدِهِ، وَدَنَا فِي تَفْرِيدِهِ، وَجَلَّ فِي سُلْطَانِهِ، وَعَظُمَ فِي أَرْكَانِهِ، وَأَحَاطَ بِكُلِّ شَيْءٍ عِلْماً، وَهُوَ فِي مَكَانِهِ، وَقَهَرَ جَمِيعَ الْخَلْقِ بِقُدْرَتِهِ وَبُرْهَانِهِ', fa: 'ستایش خداوندی را که در توحیدش برتر و در یگانگی‌اش نزدیک است و در سلطنتش جلیل و در ارکانش عظیم است. به همه چیز دانش دارد و در جای خویش است و همه آفریدگان را با قدرت و برهانش مقهور ساخته است.' },
      { ar: 'أَيُّهَا النَّاسُ، إِنَّ جَبْرَئِيلَ أَتَانِي عَنْ رَبِّي جَلَّ جَلَالُهُ وَقَالَ: يَا مُحَمَّدُ، إِنَّ اللَّهَ يُقْرِئُكَ السَّلَامَ وَيَقُولُ لَكَ: إِنِّي أَرْسَلْتُكَ إِلَى النَّاسِ كَافَّةً بَشِيراً وَنَذِيراً', fa: 'ای مردم! جبرئیل از سوی پروردگارم که جلالش بزرگ است نزد من آمد و گفت: ای محمد! همانا خداوند بر تو سلام می‌رساند و می‌فرماید: من تو را به سوی همه مردم به عنوان بشارت‌دهنده و بیم‌دهنده فرستادم.' },
      { ar: 'أَيُّهَا النَّاسُ، إِنِّي قَدْ بَلَّغْتُ مَا أُرْسِلْتُ بِهِ إِلَيْكُمْ، وَحُجَّتِي عَلَىٰ كُلِّ مَنْ حَضَرَ وَمَنْ غَابَ', fa: 'ای مردم! من آنچه به آن فرستاده شده بودم به شما رساندم و حجت من بر هر حاضر و غایب تمام است.' },
      { ar: 'مَعَاشِرَ النَّاسِ، تَدَبَّرُوا الْقُرْآنَ وَافْهَمُوا آيَاتِهِ وَانْظُرُوا مُحْكَمَاتِهِ وَلَا تَتَّبِعُوا مُتَشَابِهَهُ', fa: 'ای گروه مردم! در قرآن بیندیشید و آیاتش را بفهمید و به محکماتش بنگرید و از متشابهاتش پیروی نکنید.' },
      { ar: 'أَيُّهَا النَّاسُ، إِنِّي تَارِكٌ فِيكُمُ الثَّقَلَيْنِ: كِتَابَ اللَّهِ وَعِتْرَتِي أَهْلَ بَيْتِي، مَا إِنْ تَمَسَّكْتُمْ بِهِمَا لَنْ تَضِلُّوا أَبَداً', fa: 'ای مردم! من دو چیز گرانبها در میان شما می‌گذارم: کتاب خدا و عترتم، اهل بیتم. اگر به این دو تمسک کنید، هرگز گمراه نخواهید شد.' },
      { ar: 'أَيُّهَا النَّاسُ، مَنْ أَوْلَىٰ بِكُمْ مِنْ أَنْفُسِكُمْ؟ فَقَالُوا: اللَّهُ وَرَسُولُهُ أَعْلَمُ. فَقَالَ: إِنَّ اللَّهَ مَوْلَايَ وَأَنَا مَوْلَى الْمُؤْمِنِينَ، وَأَنَا أَوْلَىٰ بِهِمْ مِنْ أَنْفُسِهِمْ', fa: 'ای مردم! چه کسی بر شما از خودتان سزاوارتر است؟ گفتند: خدا و رسولش داناترند. فرمود: همانا خدا مولای من است و من مولای مؤمنانم و من به آنان از خودشان سزاوارترم.' },
      { ar: 'ثُمَّ أَخَذَ بِيَدِ عَلِيٍّ فَرَفَعَهَا وَقَالَ: مَنْ كُنْتُ مَوْلَاهُ فَعَلِيٌّ مَوْلَاهُ. اللَّهُمَّ وَالِ مَنْ وَالَاهُ، وَعَادِ مَنْ عَادَاهُ، وَأَحِبَّ مَنْ أَحَبَّهُ، وَأَبْغِضْ مَنْ أَبْغَضَهُ، وَانْصُرْ مَنْ نَصَرَهُ، وَاخْذُلْ مَنْ خَذَلَهُ', fa: 'سپس دست علی را گرفت و بالا برد و فرمود: هر کس من مولای اویم، علی مولای اوست. خدایا دوست بدار هر که او را دوست دارد، دشمن بدار هر که او را دشمن دارد، دوست بدار هر که او را دوست دارد، دشمن بدار هر که او را دشمن دارد، یاری کن هر که او را یاری کند، خوار کن هر که او را خوار کند.' },
      { ar: 'اللَّهُمَّ اشْهَدْ أَنِّي قَدْ بَلَّغْتُ وَرَسُولُكَ شَاهِدٌ. ثُمَّ قَالَ: أَيُّهَا النَّاسُ، إِنَّ اللَّهَ قَدْ أَكْمَلَ لَكُمْ دِينَكُمْ بِإِمَامَةِ عَلِيٍّ وَلِيِّهِ', fa: 'خدایا گواه باش که من ابلاغ کردم و رسول تو گواه است. سپس فرمود: ای مردم! همانا خداوند دین شما را با امامت علی، ولی خود، کامل کرد.' },
      { ar: 'وَأَنْزَلَ عَلَيَّ: ﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِيناً﴾', fa: 'و بر من نازل فرمود: «امروز دین شما را برایتان کامل کردم و نعمت خود را بر شما تمام نمودم و اسلام را به عنوان آیین شما پسندیدم» (مائده، آیه ۳).' },
      { ar: 'مَعَاشِرَ النَّاسِ، إِنِّي أُشْهِدُ اللَّهَ وَرَسُولَهُ وَالْمُؤْمِنِينَ أَنَّ عَلِيّاً وَأَوْلَادَهُ أَئِمَّةُ الْمُسْلِمِينَ، وَحُجَجُ اللَّهِ عَلَى الْعَالَمِينَ', fa: 'ای گروه مردم! خدا و رسولش و مؤمنان را گواه می‌گیرم که همانا علی و فرزندانش امامان مسلمانان و حجت‌های خدا بر جهانیانند.' },
      { ar: 'أَيُّهَا النَّاسُ، إِنِّي أَدْعُوكُمْ إِلَىٰ بَيْعَتِي لِعَلِيٍّ، فَإِنَّ اللَّهَ أَمَرَنِي بِذَلِكَ. هُنَاكَ صَاحَ النَّاسُ: نَعَمْ، سَمِعْنَا وَأَطَعْنَا لِلَّهِ وَلِرَسُولِهِ', fa: 'ای مردم! شما را به بیعت با علی فرا می‌خوانم که خداوند مرا به این امر فرمان داده است. آنگاه مردم صدا زدند: آری! شنیدیم و برای خدا و رسولش اطاعت کردیم.' },
      { ar: 'اللَّهُمَّ إِنِّي أُشْهِدُكَ عَلَىٰ هَؤُلَاءِ الْقَوْمِ بِمَا أَمَرْتَنِي بِهِ، وَإِنَّ لَكَ الْحُجَّةَ عَلَيْهِمْ فِي ذَلِكَ', fa: 'خدایا! تو را بر این گروه گواه می‌گیرم به آنچه مرا به آن فرمان دادی و همانا برای تو بر آنان حجت است.' }
    ]
  }
];

/* ===== Hero Hadith (روزانه) ===== */
function renderHeroHadith() {
  const day = getDayOfYear();
  // احادیث اصلی + احادیث کوتاه را ادغام می‌کنیم برای تنوع بیشتر
  const all = HADITHS_DATA.concat(SHORT_HADITHS.map((h, i) => ({
    id: 'short_h_' + i,
    speakerName: h.speaker,
    arabic: h.ar,
    translation: h.fa,
    source: h.ref,
    tags: ['کوتاه']
  })));
  const h = all[day % all.length];
  const isBm = bookmarks.includes(h.id);
  const arText = h.verses ? h.verses[0].ar : h.arabic;
  const faText = h.verses ? h.verses[0].fa : h.translation;

  $('#heroDate').textContent = getTodayLabel();
  $('#heroContent').innerHTML = `
    <div class="hero-ar">${arText}</div>
    <div class="hero-fa">${faText}</div>
    <div class="hero-meta">
      <span class="speaker">${h.speakerName || ''}</span>
      <span class="dot"></span>
      <span>${h.source || ''}</span>
    </div>
    <div class="hero-actions">
      <button data-act="bm" class="${isBm ? 'active' : ''}" title="نشان‌گذاری">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button data-act="copy" title="کپی">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <button data-act="open" title="مشاهده">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button data-act="share" title="اشتراک‌گذاری">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
    </div>
  `;
  $$('#heroContent [data-act]').forEach(b => b.onclick = () => {
    const act = b.dataset.act;
    if (act === 'bm') {
      toggleBookmark(h.id);
      renderHeroHadith();
    } else if (act === 'copy') {
      copyText(arText + '\n\n' + faText + '\n\n' + (h.speakerName || '') + '\n' + (h.source || ''));
    } else if (act === 'open') {
      openHadith(h.id);
    } else if (act === 'share') {
      shareText((h.speakerName || '') + '\n\n' + arText + '\n\n' + faText + '\n\n' + (h.source || ''));
    }
  });
}
