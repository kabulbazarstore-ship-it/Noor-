<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123C32">
<title>دعای جوشن کبیر | نــــور NOOR</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Lateef&family=Reem+Kufi:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F5EE; --surface: #FFFDF8; --surface2: #F1ECE2;
  --brand: #123C32; --brand2: #2D6657;
  --gold: #B88A3B; --gold2: #D6B56A;
  --gold-soft: rgba(184, 138, 59, 0.10);
  --gold-border: rgba(184, 138, 59, 0.20);
  --text: #17231F; --text-2: #3d4a44; --muted: #66716C;
  --divider: #E7E0D3;
  --arabic: #123C32; --translation: #3d4a44;
  --shadow: 0 4px 20px rgba(18, 60, 50, 0.05);
  --shadow-sm: 0 2px 8px rgba(18, 60, 50, 0.03);
  --radius: 16px; --radius-sm: 12px;
  --trans: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font-fa: 'Vazirmatn', Tahoma, sans-serif;
  --font-ar: 'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif;
  --fs-ar: 22px; --fs-fa: 16px; --line-height: 2.3;
}
body.dark {
  --bg: #080E0C; --surface: #101A16; --surface2: #16231E;
  --brand: #9FC5B5; --brand2: #B9D5C8;
  --gold: #D2AC5C; --gold2: #E4C982;
  --gold-soft: rgba(210, 172, 92, 0.08);
  --gold-border: rgba(210, 172, 92, 0.16);
  --text: #F4EFE4; --text-2: #c8d2cc; --muted: #A8B3AD;
  --divider: #26352F;
  --arabic: #e8e2d2; --translation: #c8d2cc;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.20);
}
body.font-ar-amiri { --font-ar: 'Amiri', serif; }
body.font-ar-scheherazade { --font-ar: 'Scheherazade New', serif; }
body.font-ar-naskh { --font-ar: 'Noto Naskh Arabic', serif; }
body.font-ar-lateef { --font-ar: 'Lateef', serif; }
body.font-ar-reem { --font-ar: 'Reem Kufi', sans-serif; }
body.font-fa-vazir { --font-fa: 'Vazirmatn', Tahoma, sans-serif; }
body.font-fa-naskh { --font-fa: 'Noto Naskh Arabic', serif; }
body.font-fa-amiri { --font-fa: 'Amiri', serif; }
body.font-fa-scheherazade { --font-fa: 'Scheherazade New', serif; }
body.font-fa-lateef { --font-fa: 'Lateef', serif; }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font-fa); background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.7; font-size: 16px;
  transition: background var(--trans), color var(--trans);
  overflow-x: hidden;
}
button, input { font-family: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: var(--trans); }
svg { display: block; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-sm { width: 18px; height: 18px; }
.app { max-width: 780px; margin: 0 auto; padding: 0 14px 40px; }

.header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 6px;
  padding: 12px 0; background: var(--bg);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.hbtn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--gold-border);
  color: var(--gold); flex: none;
}
.hbtn:hover { background: var(--gold-soft); border-color: var(--gold); }
.hbtn:active { transform: scale(0.94); }
.brand { flex: 1; text-align: center; line-height: 1.15; min-width: 0; }
.brand h1 {
  font-family: 'Amiri', serif;
  font-size: 1.1rem; font-weight: 700;
  color: var(--brand); letter-spacing: 0.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.dark .brand h1 { color: var(--gold); }
.brand .brand-noor {
  display: block; font-family: 'Amiri', serif;
  font-size: 0.65rem; font-weight: 700;
  color: var(--gold); letter-spacing: 6px;
  margin-top: 3px;
}

.scroll-content {
  max-height: calc(100vh - 90px);
  overflow-y: auto;
  padding: 14px 0 20px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--gold-border) transparent;
}
.scroll-content::-webkit-scrollbar { width: 4px; }
.scroll-content::-webkit-scrollbar-track { background: transparent; }
.scroll-content::-webkit-scrollbar-thumb { background: var(--gold-border); border-radius: 10px; }

.top-orn {
  position: relative; overflow: hidden;
  text-align: center;
  padding: 18px 14px 20px;
  margin-bottom: 14px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--gold-border);
  box-shadow: var(--shadow);
}
.top-orn .orn-svg {
  position: absolute; color: var(--gold); opacity: 0.10; pointer-events: none;
}
.top-orn .orn-svg.tr { top: -6px; right: -6px; width: 80px; height: 80px; }
.top-orn .orn-svg.bl { bottom: -6px; left: -6px; width: 80px; height: 80px; transform: rotate(180deg); }
.top-orn .orn-title {
  font-family: 'Amiri', serif;
  font-size: 1.45rem; font-weight: 700;
  color: var(--brand); letter-spacing: 1px;
  margin-bottom: 3px;
}
body.dark .top-orn .orn-title { color: var(--gold); }
.top-orn .orn-sub { font-size: 0.78rem; color: var(--muted); }
.top-orn .orn-div {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin: 8px auto 0; width: 80px;
}
.top-orn .orn-div::before, .top-orn .orn-div::after {
  content: ""; flex: 1; height: 1px; background: var(--gold-border);
}
.top-orn .orn-div svg { color: var(--gold); width: 12px; height: 12px; }

.verse-card {
  background: var(--surface);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius);
  padding: 16px 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  transition: var(--trans);
  position: relative;
}
.verse-card:hover {
  border-color: var(--gold);
  box-shadow: 0 4px 16px rgba(184, 138, 59, 0.08);
}
.verse-card .v-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.verse-card .v-num {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px; padding: 0 8px;
  border-radius: 7px;
  background: var(--gold-soft); color: var(--gold);
  font-family: 'Amiri', serif; font-weight: 700;
  font-size: 0.72rem;
  border: 1px solid var(--gold-border);
}
.verse-card .v-label {
  font-size: 0.68rem; color: var(--muted);
  font-weight: 600;
}
.verse-card .v-ar {
  font-family: var(--font-ar);
  font-size: var(--fs-ar);
  line-height: var(--line-height);
  color: var(--arabic);
  text-align: center;
  font-weight: 400;
  margin-bottom: 12px;
  padding: 4px 2px;
  white-space: pre-line;
}
.verse-card .v-divider {
  height: 1px;
  background: repeating-linear-gradient(90deg, var(--gold-border) 0, var(--gold-border) 3px, transparent 3px, transparent 6px);
  margin: 0 auto 12px;
  width: 50px;
}
.verse-card .v-fa {
  font-family: var(--font-fa);
  font-size: var(--fs-fa);
  line-height: 1.95;
  color: var(--translation);
  text-align: justify;
  padding: 0 2px;
  white-space: pre-line;
}
.verse-card.hide-trans .v-fa { display: none; }
.verse-card.hide-trans .v-divider { display: none; }
.verse-card.hide-trans .v-ar { margin-bottom: 0; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 200; padding: 0 12px 12px;
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 520px; max-height: 85vh;
  overflow-y: auto; background: var(--surface);
  border-radius: 24px 24px 18px 18px;
  padding: 20px 18px 26px;
  border: 1px solid var(--gold-border);
  animation: slideUp 0.3s ease;
  box-shadow: var(--shadow);
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--divider);
}
.modal-head h3 {
  font-size: 1rem; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  color: var(--text);
}
.modal-head h3 svg { color: var(--gold); width: 20px; height: 20px; flex: none; }
.modal-close {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--muted);
}
.modal-close:hover { color: var(--gold); border-color: var(--gold); }

.set-group { margin-bottom: 16px; }
.set-group > label {
  display: block; font-size: 0.75rem; font-weight: 700;
  color: var(--muted); margin-bottom: 8px;
}
.set-options { display: flex; flex-wrap: wrap; gap: 6px; }
.set-opt {
  padding: 6px 12px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--text-2); font-size: 0.75rem;
  font-weight: 600; cursor: pointer; transition: var(--trans);
}
.set-opt:hover { border-color: var(--gold-border); color: var(--gold); }
.set-opt.active { background: var(--gold-soft); color: var(--gold); border-color: var(--gold); }
.set-ctrl {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--divider);
  border-radius: 10px; padding: 4px; width: fit-content;
}
.set-ctrl button {
  width: 34px; height: 34px; border-radius: 8px;
  color: var(--muted); font-weight: 700; font-size: 1rem;
}
.set-ctrl button:hover { background: var(--gold-soft); color: var(--gold); }
.set-ctrl .val {
  min-width: 40px; text-align: center;
  color: var(--gold); font-weight: 700; font-size: 0.82rem;
}
.font-preview { font-family: 'Amiri', serif; font-size: 1.1rem; }

.info-block {
  padding: 14px 16px;
  background: var(--surface2);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
}
.info-block h4 {
  font-size: 0.8rem; font-weight: 700;
  color: var(--gold); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.info-block h4 svg { width: 16px; height: 16px; flex: none; }
.info-block p {
  font-size: 0.8rem; line-height: 1.95;
  color: var(--text-2); text-align: justify;
  white-space: pre-line;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-around; align-items: center;
  background: var(--surface); border-top: 1px solid var(--divider);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  height: 62px;
  box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.06);
}
body.dark .bottom-nav { box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.4); }
.nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; flex: 1; padding: 6px 4px; border-radius: 12px; color: var(--muted);
  transition: var(--trans); font-size: 0.6rem; font-weight: 500;
  text-decoration: none; background: none; border: 0; cursor: pointer;
}
.nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover, .nav-btn.active { color: var(--gold); }

.toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--brand); color: #fff;
  padding: 10px 18px; border-radius: 14px;
  font-size: 0.8rem; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 300; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--gold-border); max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { color: var(--gold2); width: 16px; height: 16px; }

.app { padding-bottom: 80px; }

@media (max-width: 480px) {
  .brand h1 { font-size: 1rem; }
  :root { --fs-ar: 20px; --fs-fa: 15px; }
  .hbtn { width: 36px; height: 36px; }
  .hbtn .icon { width: 18px; height: 18px; }
  .verse-card { padding: 14px 12px; }
  .top-orn .orn-title { font-size: 1.25rem; }
}
</style>
</head>

    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا جَلِیلُ یَا جَمِیلُ یَا وَکِیلُ یَا کَفِیلُ یَا دَلِیلُ یَا قَبِیلُ یَا مُدِیلُ یَا مُنِیلُ یَا مُقِیلُ یَا مُحِیلُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای بزرگوار، ای زیبا، ای کارگزار، ای ضامن، ای راهنما، ای پشتیبان، ای چرخاننده، ای عطاکننده، ای درگذرنده، ای دگرگون‌کننده." },
    { ar: "یَا دَلِیلَ الْمُتَحَیِّرِینَ یَا غِیَاثَ الْمُسْتَغِیثِینَ یَا صَرِیخَ الْمُسْتَصْرِخِینَ یَا جَارَ الْمُسْتَجِیرِینَ یَا أَمَانَ الْخَائِفِینَ یَا عَوْنَ الْمُؤْمِنِینَ یَا رَاحِمَ الْمَسَاکِینَ یَا مَلْجَأَ الْعَاصِینَ یَا غَافِرَ الْمُذْنِبِینَ یَا مُجِیبَ دَعْوَةِ الْمُضْطَرِّینَ", fa: "ای راهنمای سرگردانان، ای فریادرس فریادخواهان، ای دادرس دادخواهان، ای پناه پناه‌جویان، ای امنیت هراسندگان، ای یاری مؤمنان، ای رحم‌کننده به مستمندان، ای پناهگاه گنه‌کاران، ای آمرزنده گناهکاران، ای اجابت‌کننده دعای درماندگان." },
    { ar: "یَا ذَا الْجُودِ وَ الْإِحْسَانِ یَا ذَا الْفَضْلِ وَ الامْتِنَانِ یَا ذَا الْأَمْنِ وَ الْأَمَانِ یَا ذَا الْقُدْسِ وَ السُّبْحَانِ یَا ذَا الْحِکْمَةِ وَ الْبَیَانِ یَا ذَا الرَّحْمَةِ وَ الرِّضْوَانِ یَا ذَا الْحُجَّةِ وَ الْبُرْهَانِ یَا ذَا الْعَظَمَةِ وَ السُّلْطَانِ یَا ذَا الرَّأْفَةِ وَ الْمُسْتَعَانِ یَا ذَا الْعَفْوِ وَ الْغُفْرَانِ", fa: "ای صاحب جود و احسان، ای صاحب فضل و منت، ای صاحب امنیت و ایمنی، ای صاحب قدس و تسبیح، ای صاحب حکمت و بیان، ای صاحب رحمت و خشنودی، ای صاحب حجت و برهان، ای صاحب عظمت و سلطنت، ای صاحب رأفت و یاری‌خواسته، ای صاحب عفو و آمرزش." },
    { ar: "یَا مَنْ هُوَ رَبُّ کُلِّ شَیْ‏ءٍ یَا مَنْ هُوَ إِلَهُ کُلِّ شَیْ‏ءٍ یَا مَنْ هُوَ خَالِقُ کُلِّ شَیْ‏ءٍ یَا مَنْ هُوَ صَانِعُ کُلِّ شَیْ‏ءٍ یَا مَنْ هُوَ قَبْلَ کُلِّ شَیْ‏ءٍ یَا مَنْ هُوَ بَعْدَ کُلِّ شَیْ‏ءٍ یَا مَنْ هُوَ فَوْقَ کُلِّ شَیْ‏ءٍ یَا مَنْ هُوَ عَالِمٌ بِکُلِّ شَیْ‏ءٍ یَا مَنْ هُوَ قَادِرٌ عَلَى کُلِّ شَیْ‏ءٍ یَا مَنْ هُوَ یَبْقَى وَ یَفْنَى کُلُّ شَیْ‏ءٍ", fa: "ای کسی که او پروردگار هر چیزی است، ای کسی که او معبود هر چیزی است، ای کسی که او آفریننده هر چیزی است، ای کسی که او سازنده هر چیزی است، ای کسی که او پیش از هر چیزی است، ای کسی که او پس از هر چیزی است، ای کسی که او برفراز هر چیزی است، ای کسی که او به هر چیزی داناست، ای کسی که او بر هر چیزی تواناست، ای کسی که او باقی است و همه چیز نابود می‌شود." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا مُؤْمِنُ یَا مُهَیْمِنُ یَا مُکَوِّنُ یَا مُزَیِّنُ یَا مُعْلِنُ یَا مُقَسِّمُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای ایمنی‌بخش، ای نگهبان، ای پدیدآورنده، ای آراینده، ای آشکارکننده، ای تقسیم‌کننده." },
    { ar: "یَا مَنْ هُوَ فِی مُلْکِهِ مُقِیمٌ یَا مَنْ هُوَ فِی سُلْطَانِهِ قَدِیمٌ یَا مَنْ هُوَ فِی جَلالِهِ عَظِیمٌ یَا مَنْ هُوَ عَلَى عِبَادِهِ رَحِیمٌ یَا مَنْ هُوَ بِکُلِّ شَیْ‏ءٍ عَلِیمٌ یَا مَنْ هُوَ بِمَنْ عَصَاهُ حَلِیمٌ یَا مَنْ هُوَ بِمَنْ رَجَاهُ کَرِیمٌ یَا مَنْ هُوَ فِی صُنْعِهِ حَکِیمٌ یَا مَنْ هُوَ فِی حِکْمَتِهِ لَطِیفٌ یَا مَنْ هُوَ فِی لُطْفِهِ قَدِیمٌ", fa: "ای کسی که در پادشاهی‌اش پایدار است، ای کسی که در سلطنت‌اش قدیم است، ای کسی که در جلال‌اش بزرگ است، ای کسی که بر بندگانش مهربان است، ای کسی که به هر چیزی داناست، ای کسی که با کسی که نافرمانیش کرده بردبار است، ای کسی که با کسی که به او امید بسته کریم است، ای کسی که در صنعتش حکیم است، ای کسی که در حکمتش لطیف است، ای کسی که در لطفش قدیم است." },
    { ar: "یَا مَنْ لا یُرْجَى إِلا فَضْلُهُ یَا مَنْ لا یُسْأَلُ إِلا عَفْوُهُ یَا مَنْ لا یُنْظَرُ إِلا بِرُّهُ یَا مَنْ لا یُخَافُ إِلا عَدْلُهُ یَا مَنْ لا یَدُومُ إِلا مُلْکُهُ یَا مَنْ لا سُلْطَانَ إِلا سُلْطَانُهُ یَا مَنْ وَسِعَتْ کُلَّ شَیْ‏ءٍ رَحْمَتُهُ یَا مَنْ سَبَقَتْ رَحْمَتُهُ غَضَبَهُ یَا مَنْ أَحَاطَ بِکُلِّ شَیْ‏ءٍ عِلْمُهُ یَا مَنْ لَیْسَ أَحَدٌ مِثْلَهُ", fa: "ای کسی که جز به فضلش امید نیست، ای کسی که جز عفو و گذشتش خواسته نمی‌شود، ای کسی که جز به نیکی‌اش نگریسته نمی‌شود، ای کسی که جز از عدلش ترس نیست، ای کسی که جز پادشاهی‌اش پایدار نیست، ای کسی که جز سلطنتش سلطنتی نیست، ای کسی که رحمتش همه چیز را فراگرفته، ای کسی که رحمتش بر خشمش پیشی گرفته، ای کسی که علمش همه چیز را احاطه کرده، ای کسی که هیچ کس مانند او نیست." },
    { ar: "یَا فَارِجَ الْهَمِّ یَا کَاشِفَ الْغَمِّ یَا غَافِرَ الذَّنْبِ یَا قَابِلَ التَّوْبِ یَا خَالِقَ الْخَلْقِ یَا صَادِقَ الْوَعْدِ یَا مُوفِیَ الْعَهْدِ یَا عَالِمَ السِّرِّ یَا فَالِقَ الْحَبِّ یَا رَازِقَ الْأَنَامِ", fa: "ای گشاینده غم، ای برطرف‌کننده اندوه، ای آمرزنده گناه، ای پذیرنده توبه، ای آفریننده خلق، ای راست‌گو در وعده، ای وفاکننده به پیمان، ای دانای راز، ای شکافنده دانه، ای روزی‌دهنده مردمان." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا عَلِیُّ یَا وَفِیُّ یَا غَنِیُّ یَا مَلِیُّ یَا حَفِیُّ یَا رَضِیُّ یَا زَکِیُّ یَا بَدِیُّ یَا قَوِیُّ یَا وَلِیُّ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای والا، ای وفادار، ای بی‌نیاز، ای کریم، ای مهربان، ای خشنود، ای پاک، ای پدیدآورنده، ای توانا، ای سرپرست." },
    { ar: "یَا مَنْ أَظْهَرَ الْجَمِیلَ یَا مَنْ سَتَرَ الْقَبِیحَ یَا مَنْ لَمْ یُؤَاخِذْ بِالْجَرِیرَةِ یَا مَنْ لَمْ یَهْتِکِ السِّتْرَ یَا عَظِیمَ الْعَفْوِ یَا حَسَنَ التَّجَاوُزِ یَا وَاسِعَ الْمَغْفِرَةِ یَا بَاسِطَ الْیَدَیْنِ بِالرَّحْمَةِ یَا صَاحِبَ کُلِّ نَجْوَى یَا مُنْتَهَى کُلِّ شَکْوَى", fa: "ای کسی که نیکویی را آشکار کردی، ای کسی که زشتی را پوشاندی، ای کسی که به گناه مؤاخذه نمی‌کنی، ای کسی که پرده را نمی‌دری، ای بزرگ‌عفو، ای نیکوگذشت، ای گسترده‌آمرزش، ای گشاده‌دست به رحمت، ای همراه هر نجوا، ای نهایت هر شکایت." },
    { ar: "یَا ذَا النِّعْمَةِ السَّابِغَةِ یَا ذَا الرَّحْمَةِ الْوَاسِعَةِ یَا ذَا الْمِنَّةِ السَّابِقَةِ یَا ذَا الْحِکْمَةِ الْبَالِغَةِ یَا ذَا الْقُدْرَةِ الْکَامِلَةِ یَا ذَا الْحُجَّةِ الْقَاطِعَةِ یَا ذَا الْکَرَامَةِ الظَّاهِرَةِ یَا ذَا الْعِزَّةِ الدَّائِمَةِ یَا ذَا الْقُوَّةِ الْمَتِینَةِ یَا ذَا الْعَظَمَةِ الْمَنِیعَةِ", fa: "ای صاحب نعمت کامل، ای صاحب رحمت گسترده، ای صاحب منت پیشین، ای صاحب حکمت رسا، ای صاحب قدرت کامل، ای صاحب حجت قاطع، ای صاحب کرامت آشکار، ای صاحب عزت پایدار، ای صاحب نیروی استوار، ای صاحب عظمت بازدارنده." },
    { ar: "یَا بَدِیعَ السَّمَاوَاتِ یَا جَاعِلَ الظُّلُمَاتِ یَا رَاحِمَ الْعَبَرَاتِ یَا مُقِیلَ الْعَثَرَاتِ یَا سَاتِرَ الْعَوْرَاتِ یَا مُحْیِیَ الْأَمْوَاتِ یَا مُنْزِلَ الْآیَاتِ یَا مُضَعِّفَ الْحَسَنَاتِ یَا مَاحِیَ السَّیِّئَاتِ یَا شَدِیدَ النَّقِمَاتِ", fa: "ای پدیدآورنده آسمان‌ها، ای قراردهنده تاریکی‌ها، ای رحم‌کننده بر اشک‌ها، ای درگذرنده از لغزش‌ها، ای پوشنده عیب‌ها، ای زنده‌کننده مردگان، ای فرستنده آیات، ای چند برابرکننده نیکی‌ها، ای پاک‌کننده بدی‌ها، ای سخت‌کیفر." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا مُصَوِّرُ یَا مُقَدِّرُ یَا مُدَبِّرُ یَا مُطَهِّرُ یَا مُنَوِّرُ یَا مُیَسِّرُ یَا مُبَشِّرُ یَا مُنْذِرُ یَا مُقَدِّمُ یَا مُؤَخِّرُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای صورت‌بخش، ای اندازه‌گیر، ای تدبیرکننده، ای پاک‌کننده، ای روشنی‌بخش، ای آسان‌کننده، ای مژده‌رسان، ای هشداردهنده، ای پیش‌انداز، ای پس‌انداز." },
    { ar: "یَا رَبَّ الْبَیْتِ الْحَرَامِ یَا رَبَّ الشَّهْرِ الْحَرَامِ یَا رَبَّ الْبَلَدِ الْحَرَامِ یَا رَبَّ الرُّکْنِ وَ الْمَقَامِ یَا رَبَّ الْمَشْعَرِ الْحَرَامِ یَا رَبَّ الْمَسْجِدِ الْحَرَامِ یَا رَبَّ الْحِلِّ وَ الْحَرَامِ یَا رَبَّ النُّورِ وَ الظَّلامِ یَا رَبَّ التَّحِیَّةِ وَ السَّلامِ یَا رَبَّ الْقُدْرَةِ فِی الْأَنَامِ", fa: "ای پروردگار خانه حرام، ای پروردگار ماه حرام، ای پروردگار شهر حرام، ای پروردگار رکن و مقام، ای پروردگار مشعر حرام، ای پروردگار مسجد الحرام، ای پروردگار حلال و حرام، ای پروردگار نور و تاریکی، ای پروردگار تحیّت و سلام، ای پروردگار قدرت در میان مردمان." },
    { ar: "یَا أَحْکَمَ الْحَاکِمِینَ یَا أَعْدَلَ الْعَادِلِینَ یَا أَصْدَقَ الصَّادِقِینَ یَا أَطْهَرَ الطَّاهِرِینَ یَا أَحْسَنَ الْخَالِقِینَ یَا أَسْرَعَ الْحَاسِبِینَ یَا أَسْمَعَ السَّامِعِینَ یَا أَبْصَرَ النَّاظِرِینَ یَا أَشْفَعَ الشَّافِعِینَ یَا أَکْرَمَ الْأَکْرَمِینَ", fa: "ای حکیم‌ترین حاکمان، ای دادگرترین دادگران، ای راست‌ترین راستگویان، ای پاک‌ترین پاکان، ای نیکوترین آفرینندگان، ای سریع‌ترین حسابرسان، ای شنواترین شنوایان، ای بیناترین بینایان، ای شفیع‌ترین شفیعان، ای کریم‌ترین کریمان." },
    { ar: "یَا عِمَادَ مَنْ لا عِمَادَ لَهُ یَا سَنَدَ مَنْ لا سَنَدَ لَهُ یَا ذُخْرَ مَنْ لا ذُخْرَ لَهُ یَا حِرْزَ مَنْ لا حِرْزَ لَهُ یَا غِیَاثَ مَنْ لا غِیَاثَ لَهُ یَا فَخْرَ مَنْ لا فَخْرَ لَهُ یَا عِزَّ مَنْ لا عِزَّ لَهُ یَا مُعِینَ مَنْ لا مُعِینَ لَهُ یَا أَنِیسَ مَنْ لا أَنِیسَ لَهُ یَا أَمَانَ مَنْ لا أَمَانَ لَهُ", fa: "ای تکیه‌گاه بی‌تکیه‌گاهان، ای پشتوانه بی‌پشتوانگان، ای ذخیره بی‌ذخیرگان، ای نگهدار بی‌نگهداران، ای فریادرس بی‌فریادرسان، ای فخر بی‌فخران، ای عزت بی‌عزتان، ای یاری بی‌یاران، ای مونس بی‌مونسان، ای امنیت بی‌امنیتان." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا عَاصِمُ یَا قَائِمُ یَا دَائِمُ یَا رَاحِمُ یَا سَالِمُ یَا حَاکِمُ یَا عَالِمُ یَا قَاسِمُ یَا قَابِضُ یَا بَاسِطُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای نگهدار، ای برپا، ای پاینده، ای رحم‌کننده، ای سلامت‌بخش، ای حاکم، ای دانا، ای تقسیم‌کننده، ای قبض‌کننده، ای گسترش‌دهنده." },
    { ar: "یَا عَاصِمَ مَنِ اسْتَعْصَمَهُ یَا رَاحِمَ مَنِ اسْتَرْحَمَهُ یَا غَافِرَ مَنِ اسْتَغْفَرَهُ یَا نَاصِرَ مَنِ اسْتَنْصَرَهُ یَا حَافِظَ مَنِ اسْتَحْفَظَهُ یَا مُکْرِمَ مَنِ اسْتَکْرَمَهُ یَا مُرْشِدَ مَنِ اسْتَرْشَدَهُ یَا صَرِیخَ مَنِ اسْتَصْرَخَهُ یَا مُعِینَ مَنِ اسْتَعَانَهُ یَا مُغِیثَ مَنِ اسْتَغَاثَهُ", fa: "ای نگهدار کسی که از تو نگه خواست، ای رحم‌کننده به کسی که از تو رحم خواست، ای آمرزنده کسی که از تو آمرزش خواست، ای یاور کسی که از تو یاری خواست، ای نگهبان کسی که از تو نگهبانی خواست، ای گرامی‌دارنده کسی که از تو کرامت خواست، ای راهنمای کسی که از تو هدایت خواست، ای دادرس کسی که از تو دادخواهی کرد، ای یاری‌دهنده کسی که از تو یاری خواست، ای فریادرس کسی که از تو فریادخواهی کرد." },
    { ar: "یَا عَزِیزاً لا یُضَامُ یَا لَطِیفاً لا یُرَامُ یَا قَیُّوماً لا یَنَامُ یَا دَائِماً لا یَفُوتُ یَا حَیّاً لا یَمُوتُ یَا مَلِکاً لا یَزُولُ یَا بَاقِیاً لا یَفْنَى یَا عَالِماً لا یَجْهَلُ یَا صَمَداً لا یُطْعَمُ یَا قَوِیّاً لا یَضْعُفُ", fa: "ای عزیزی که به او تعدی نشود، ای لطیفی که به او دست نیابند، ای قیّومی که خواب نبرد، ای پاینده‌ای که فوت نشود، ای زنده‌ای که نمیرد، ای پادشاهی که زوال نپذیرد، ای باقی‌ای که فنا نشود، ای دانایی که نادان نشود، ای بی‌نیازی که خورده نشود، ای توانایی که ضعیف نشود." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا أَحَدُ یَا وَاحِدُ یَا شَاهِدُ یَا مَاجِدُ یَا حَامِدُ یَا رَاشِدُ یَا بَاعِثُ یَا وَارِثُ یَا ضَارُّ یَا نَافِعُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای یکتا، ای یگانه، ای گواه، ای با مجد، ای ستاینده، ای راه‌یاب، ای برانگیزنده، ای وارث، ای زیان‌رسان، ای سودبخش." },
    { ar: "یَا أَعْظَمَ مِنْ کُلِّ عَظِیمٍ یَا أَکْرَمَ مِنْ کُلِّ کَرِیمٍ یَا أَرْحَمَ مِنْ کُلِّ رَحِیمٍ یَا أَعْلَمَ مِنْ کُلِّ عَلِیمٍ یَا أَحْکَمَ مِنْ کُلِّ حَکِیمٍ یَا أَقْدَمَ مِنْ کُلِّ قَدِیمٍ یَا أَکْبَرَ مِنْ کُلِّ کَبِیرٍ یَا أَلْطَفَ مِنْ کُلِّ لَطِیفٍ یَا أَجَلَّ مِنْ کُلِّ جَلِیلٍ یَا أَعَزَّ مِنْ کُلِّ عَزِیزٍ", fa: "ای بزرگ‌تر از هر بزرگ، ای کریم‌تر از هر کریم، ای مهربان‌تر از هر مهربان، ای داناتر از هر دانا، ای حکیم‌تر از هر حکیم، ای قدیم‌تر از هر قدیم، ای بزرگ‌تر از هر بزرگ، ای لطیف‌تر از هر لطیف، ای والاتر از هر والا، ای عزیزتر از هر عزیز." },
    { ar: "یَا کَرِیمَ الصَّفْحِ یَا عَظِیمَ الْمَنِّ یَا کَثِیرَ الْخَیْرِ یَا قَدِیمَ الْفَضْلِ یَا دَائِمَ اللُّطْفِ یَا لَطِیفَ الصُّنْعِ یَا مُنَفِّسَ الْکَرْبِ یَا کَاشِفَ الضُّرِّ یَا مَالِکَ الْمُلْکِ یَا قَاضِیَ الْحَقِّ", fa: "ای کریم‌الصفح، ای بزرگ‌منّت، ای بسیار خیر، ای قدیم‌الفضل، ای همیشه‌لطف، ای لطیف‌الصنع، ای گشاینده گرفتاری، ای برطرف‌کننده زیان، ای مالک پادشاهی، ای داور حق." },
    { ar: "یَا مَنْ هُوَ فِی عَهْدِهِ وَفِیٌّ یَا مَنْ هُوَ فِی وَفَائِهِ قَوِیٌّ یَا مَنْ هُوَ فِی قُوَّتِهِ عَلِیٌّ یَا مَنْ هُوَ فِی عُلُوِّهِ قَرِیبٌ یَا مَنْ هُوَ فِی قُرْبِهِ لَطِیفٌ یَا مَنْ هُوَ فِی لُطْفِهِ شَرِیفٌ یَا مَنْ هُوَ فِی شَرَفِهِ عَزِیزٌ یَا مَنْ هُوَ فِی عِزِّهِ عَظِیمٌ یَا مَنْ هُوَ فِی عَظَمَتِهِ مَجِیدٌ یَا مَنْ هُوَ فِی مَجْدِهِ حَمِیدٌ", fa: "ای کسی که در پیمانش وفادار است، ای کسی که در وفایش نیرومند است، ای کسی که در نیرویش والاست، ای کسی که در والایی‌اش نزدیک است، ای کسی که در نزدیکی‌اش لطیف است، ای کسی که در لطفش شریف است، ای کسی که در شرافتش عزیز است، ای کسی که در عزتش بزرگ است، ای کسی که در عظمتش مجید است، ای کسی که در مجدش حمید است." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا کَافِی یَا شَافِی یَا وَافِی یَا مُعَافِی یَا هَادِی یَا دَاعِی یَا قَاضِی یَا رَاضِی یَا عَالِی یَا بَاقِی", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای کفایت‌کننده، ای شفابخش، ای وفاکننده، ای عافیت‌بخش، ای راهنما، ای دعوت‌کننده، ای داور، ای خشنود، ای والا، ای باقی." },
    { ar: "یَا مَنْ کُلُّ شَیْ‏ءٍ خَاضِعٌ لَهُ یَا مَنْ کُلُّ شَیْ‏ءٍ خَاشِعٌ لَهُ یَا مَنْ کُلُّ شَیْ‏ءٍ کَائِنٌ لَهُ یَا مَنْ کُلُّ شَیْ‏ءٍ مَوْجُودٌ بِهِ یَا مَنْ کُلُّ شَیْ‏ءٍ مُنِیبٌ إِلَیْهِ یَا مَنْ کُلُّ شَیْ‏ءٍ خَائِفٌ مِنْهُ یَا مَنْ کُلُّ شَیْ‏ءٍ قَائِمٌ بِهِ یَا مَنْ کُلُّ شَیْ‏ءٍ صَائِرٌ إِلَیْهِ یَا مَنْ کُلُّ شَیْ‏ءٍ یُسَبِّحُ بِحَمْدِهِ یَا مَنْ کُلُّ شَیْ‏ءٍ هَالِکٌ إِلا وَجْهَهُ", fa: "ای کسی که همه چیز برای او فروتن است، ای کسی که همه چیز برای او خاشع است، ای کسی که همه چیز برای او هست، ای کسی که همه چیز به او موجود است، ای کسی که همه چیز به او بازگشت می‌کند، ای کسی که همه چیز از او می‌ترسد، ای کسی که همه چیز به او برپاست، ای کسی که همه چیز به او بازمی‌گردد، ای کسی که همه چیز به ستایشش تسبیح می‌گوید، ای کسی که همه چیز جز ذاتش نابود است." },
    { ar: "یَا مَنْ لا مَفَرَّ إِلا إِلَیْهِ یَا مَنْ لا مَفْزَعَ إِلا إِلَیْهِ یَا مَنْ لا مَقْصَدَ إِلا إِلَیْهِ یَا مَنْ لا مَنْجَى مِنْهُ إِلا إِلَیْهِ یَا مَنْ لا یُرْغَبُ إِلا إِلَیْهِ یَا مَنْ لا حَوْلَ وَ لا قُوَّةَ إِلا بِهِ یَا مَنْ لا یُسْتَعَانُ إِلا بِهِ یَا مَنْ لا یُتَوَکَّلُ إِلا عَلَیْهِ یَا مَنْ لا یُرْجَى إِلا هُوَ یَا مَنْ لا یُعْبَدُ إِلا هُوَ", fa: "ای کسی که جز به او گریز نیست، ای کسی که جز به او پناه نیست، ای کسی که جز به او قصد نیست، ای کسی که جز به او رهایی از او نیست، ای کسی که جز به او رغبت نیست، ای کسی که هیچ نیرو و توانی جز به او نیست، ای کسی که جز به او یاری خواسته نمی‌شود، ای کسی که جز بر او توکل نمی‌شود، ای کسی که جز او امید نیست، ای کسی که جز او پرستیده نمی‌شود." },
    { ar: "یَا خَیْرَ الْمَرْهُوبِینَ یَا خَیْرَ الْمَرْغُوبِینَ یَا خَیْرَ الْمَطْلُوبِینَ یَا خَیْرَ الْمَسْئُولِینَ یَا خَیْرَ الْمَقْصُودِینَ یَا خَیْرَ الْمَذْکُورِینَ یَا خَیْرَ الْمَشْکُورِینَ یَا خَیْرَ الْمَحْبُوبِینَ یَا خَیْرَ الْمَدْعُوِّینَ یَا خَیْرَ الْمُسْتَأْنِسِینَ", fa: "ای بهترین کسی که از او می‌ترسند، ای بهترین کسی که به او رغبت می‌کنند، ای بهترین کسی که طلب می‌شود، ای بهترین کسی که سؤال می‌شود، ای بهترین کسی که قصد می‌شود، ای بهترین کسی که یاد می‌شود، ای بهترین کسی که سپاس می‌شود، ای بهترین کسی که دوست داشته می‌شود، ای بهترین کسی که خوانده می‌شود، ای بهترین کسی که با او انس می‌گیرند." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا غَافِرُ یَا سَاتِرُ یَا قَادِرُ یَا قَاهِرُ یَا فَاطِرُ یَا کَاسِرُ یَا جَابِرُ یَا ذَاکِرُ یَا نَاظِرُ یَا نَاصِرُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای آمرزنده، ای پوشنده، ای توانا، ای چیره، ای آفریننده، ای درهم‌شکننده، ای جبران‌کننده، ای یادکننده، ای نگاه‌کننده، ای یاور." },
    { ar: "یَا مَنْ خَلَقَ فَسَوَّى یَا مَنْ قَدَّرَ فَهَدَى یَا مَنْ یَکْشِفُ الْبَلْوَى یَا مَنْ یَسْمَعُ النَّجْوَى یَا مَنْ یُنْقِذُ الْغَرْقَى یَا مَنْ یُنْجِی الْهَلْکَى یَا مَنْ یَشْفِی الْمَرْضَى یَا مَنْ أَضْحَکَ وَ أَبْکَى یَا مَنْ أَمَاتَ وَ أَحْیَا یَا مَنْ خَلَقَ الزَّوْجَیْنِ الذَّکَرَ وَ الْأُنْثَى", fa: "ای کسی که آفرید و آراست، ای کسی که تقدیر کرد و هدایت نمود، ای کسی که بلاها را برطرف می‌کند، ای کسی که نجواها را می‌شنود، ای کسی که غرق‌شدگان را نجات می‌دهد، ای کسی که هلاک‌شدگان را رهایی می‌بخشد، ای کسی که بیماران را شفا می‌دهد، ای کسی که خنداند و گریاند، ای کسی که میراند و زنده کرد، ای کسی که دو جفت نر و ماده را آفرید." },
    { ar: "یَا مَنْ فِی الْبَرِّ وَ الْبَحْرِ سَبِیلُهُ یَا مَنْ فِی الْآفَاقِ آیَاتُهُ یَا مَنْ فِی الْآیَاتِ بُرْهَانُهُ یَا مَنْ فِی الْمَمَاتِ قُدْرَتُهُ یَا مَنْ فِی الْقُبُورِ عِبْرَتُهُ یَا مَنْ فِی الْقِیَامَةِ مُلْکُهُ یَا مَنْ فِی الْحِسَابِ هَیْبَتُهُ یَا مَنْ فِی الْمِیزَانِ قَضَاؤُهُ یَا مَنْ فِی الْجَنَّةِ ثَوَابُهُ یَا مَنْ فِی النَّارِ عِقَابُهُ", fa: "ای کسی که در خشکی و دریا راه اوست، ای کسی که در افق‌ها نشانه‌های اوست، ای کسی که در نشانه‌ها برهان اوست، ای کسی که در مرگ قدرت اوست، ای کسی که در قبرها عبرت اوست، ای کسی که در قیامت پادشاهی اوست، ای کسی که در حساب هیبت اوست، ای کسی که در میزان قضای اوست، ای کسی که در بهشت پاداش اوست، ای کسی که در آتش عذاب اوست." },
    { ar: "یَا مَنْ إِلَیْهِ یَهْرُبُ الْخَائِفُونَ یَا مَنْ إِلَیْهِ یَفْزَعُ الْمُذْنِبُونَ یَا مَنْ إِلَیْهِ یَقْصِدُ الْمُنِیبُونَ یَا مَنْ إِلَیْهِ یَرْغَبُ الزَّاهِدُونَ یَا مَنْ إِلَیْهِ یَلْجَأُ الْمُتَحَیِّرُونَ یَا مَنْ بِهِ یَسْتَأْنِسُ الْمُرِیدُونَ یَا مَنْ بِهِ یَفْتَخِرُ الْمُحِبُّونَ یَا مَنْ فِی عَفْوِهِ یَطْمَعُ الْخَاطِئُونَ یَا مَنْ إِلَیْهِ یَسْکُنُ الْمُوقِنُونَ یَا مَنْ عَلَیْهِ یَتَوَکَّلُ الْمُتَوَکِّلُونَ", fa: "ای کسی که هراسندگان به او پناه می‌برند، ای کسی که گناهکاران به او پناه می‌جویند، ای کسی که توبه‌کنندگان به او قصد می‌کنند، ای کسی که زاهدان به او رغبت می‌کنند، ای کسی که سرگردانان به او پناه می‌آورند، ای کسی که مریدان با او انس می‌گیرند، ای کسی که دوستداران به او افتخار می‌کنند، ای کسی که خطاکاران به عفو او طمع می‌کنند، ای کسی که یقین‌داران به او آرام می‌گیرند، ای کسی که توکل‌کنندگان بر او توکل می‌کنند." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا حَبِیبُ یَا طَبِیبُ یَا قَرِیبُ یَا رَقِیبُ یَا حَسِیبُ یَا مَهِیبُ یَا مُثِیبُ یَا مُجِیبُ یَا خَبِیرُ یَا بَصِیرُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای حبیب، ای طبیب، ای نزدیک، ای مراقب، ای حساب‌رس، ای با هیبت، ای پاداش‌دهنده، ای اجابت‌کننده، ای آگاه، ای بینا." },
    { ar: "یَا أَقْرَبَ مِنْ کُلِّ قَرِیبٍ یَا أَحَبَّ مِنْ کُلِّ حَبِیبٍ یَا أَبْصَرَ مِنْ کُلِّ بَصِیرٍ یَا أَخْبَرَ مِنْ کُلِّ خَبِیرٍ یَا أَشْرَفَ مِنْ کُلِّ شَرِیفٍ یَا أَرْفَعَ مِنْ کُلِّ رَفِیعٍ یَا أَقْوَى مِنْ کُلِّ قَوِیٍّ یَا أَغْنَى مِنْ کُلِّ غَنِیٍّ یَا أَجْوَدَ مِنْ کُلِّ جَوَادٍ یَا أَرْأَفَ مِنْ کُلِّ رَءُوفٍ", fa: "ای نزدیک‌تر از هر نزدیک، ای محبوب‌تر از هر محبوب، ای بیناتر از هر بینا، ای آگاه‌تر از هر آگاه، ای شریف‌تر از هر شریف، ای برتر از هر برتر، ای نیرومندتر از هر نیرومند، ای بی‌نیازتر از هر بی‌نیاز، ای بخشنده‌تر از هر بخشنده، ای مهربان‌تر از هر مهربان." },
    { ar: "یَا غَالِباً غَیْرَ مَغْلُوبٍ یَا صَانِعاً غَیْرَ مَصْنُوعٍ یَا خَالِقاً غَیْرَ مَخْلُوقٍ یَا مَالِکاً غَیْرَ مَمْلُوکٍ یَا قَاهِراً غَیْرَ مَقْهُورٍ یَا رَافِعاً غَیْرَ مَرْفُوعٍ یَا حَافِظاً غَیْرَ مَحْفُوظٍ یَا نَاصِراً غَیْرَ مَنْصُورٍ یَا شَاهِداً غَیْرَ غَائِبٍ یَا قَرِیباً غَیْرَ بَعِیدٍ", fa: "ای چیره‌ای که مغلوب نمی‌شوی، ای سازنده‌ای که ساخته نمی‌شوی، ای آفریننده‌ای که آفریده نمی‌شوی، ای مالکی که مملوک نمی‌شوی، ای قاهری که مقهور نمی‌شوی، ای بالابرنده‌ای که بالا برده نمی‌شوی، ای نگهبانی که نگهداری نمی‌شوی، ای یاوری که یاری نمی‌شوی، ای گواهی که غایب نمی‌شوی، ای نزدیکی که دور نمی‌شوی." },
    { ar: "یَا نُورَ النُّورِ یَا مُنَوِّرَ النُّورِ یَا خَالِقَ النُّورِ یَا مُدَبِّرَ النُّورِ یَا مُقَدِّرَ النُّورِ یَا نُورَ کُلِّ نُورٍ یَا نُوراً قَبْلَ کُلِّ نُورٍ یَا نُوراً بَعْدَ کُلِّ نُورٍ یَا نُوراً فَوْقَ کُلِّ نُورٍ یَا نُوراً لَیْسَ کَمِثْلِهِ نُورٌ", fa: "ای نور نورها، ای روشنی‌بخش نور، ای آفریننده نور، ای تدبیرکننده نور، ای اندازه‌گیر نور، ای نور هر نوری، ای نوری که پیش از هر نوری است، ای نوری که پس از هر نوری است، ای نوری که برفراز هر نوری است، ای نوری که مانندش نوری نیست." },
    { ar: "یَا مَنْ عَطَاؤُهُ شَرِیفٌ یَا مَنْ فِعْلُهُ لَطِیفٌ یَا مَنْ لُطْفُهُ مُقِیمٌ یَا مَنْ إِحْسَانُهُ قَدِیمٌ یَا مَنْ قَوْلُهُ حَقٌّ یَا مَنْ وَعْدُهُ صِدْقٌ یَا مَنْ عَفْوُهُ فَضْلٌ یَا مَنْ عَذَابُهُ عَدْلٌ یَا مَنْ ذِکْرُهُ حُلْوٌ یَا مَنْ فَضْلُهُ عَمِیمٌ", fa: "ای کسی که عطایش شریف است، ای کسی که کارش لطیف است، ای کسی که لطفش پایدار است، ای کسی که احسانش قدیم است، ای کسی که گفتارش حق است، ای کسی که وعده‌اش راست است، ای کسی که عفو و گذشتش فضل است، ای کسی که عذابش عدل است، ای کسی که یادش شیرین است، ای کسی که فضلش عمومی است." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا مُسَهِّلُ یَا مُفَصِّلُ یَا مُبَدِّلُ یَا مُذَلِّلُ یَا مُنَزِّلُ یَا مُنَوِّلُ یَا مُفْضِلُ یَا مُجْزِلُ یَا مُمْهِلُ یَا مُجْمِلُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای آسان‌کننده، ای شرح‌دهنده، ای تبدیل‌کننده، ای رام‌کننده، ای فرودآورنده، ای عطاکننده، ای فزون‌بخش، ای فراوان‌بخش، ای مهلت‌دهنده، ای نیکوکار." },
    { ar: "یَا مَنْ یَرَى وَ لا یُرَى یَا مَنْ یَخْلُقُ وَ لا یُخْلَقُ یَا مَنْ یَهْدِی وَ لا یُهْدَى یَا مَنْ یُحْیِی وَ لا یُحْیَى یَا مَنْ یَسْأَلُ وَ لا یُسْأَلُ یَا مَنْ یُطْعِمُ وَ لا یُطْعَمُ یَا مَنْ یُجِیرُ وَ لا یُجَارُ عَلَیْهِ یَا مَنْ یَقْضِی وَ لا یُقْضَى عَلَیْهِ یَا مَنْ یَحْکُمُ وَ لا یُحْکَمُ عَلَیْهِ یَا مَنْ لَمْ یَلِدْ وَ لَمْ یُولَدْ وَ لَمْ یَکُنْ لَهُ کُفُواً أَحَدٌ", fa: "ای کسی که می‌بینی و دیده نمی‌شوی، ای کسی که می‌آفرینی و آفریده نمی‌شوی، ای کسی که هدایت می‌کنی و هدایت نمی‌شوی، ای کسی که زنده می‌کنی و زنده نمی‌شوی، ای کسی که سؤال می‌کنی و سؤال نمی‌شوی، ای کسی که طعام می‌دهی و طعام نمی‌خوری، ای کسی که پناه می‌دهی و بر تو پناه داده نمی‌شود، ای کسی که قضا می‌کنی و بر تو قضا نمی‌شود، ای کسی که حکم می‌کنی و بر تو حکم نمی‌شود، ای کسی که نه زاده و نه زاییده شده‌ای و هیچ کس برایت همتا نیست." },
    { ar: "یَا نِعْمَ الْحَسِیبُ یَا نِعْمَ الطَّبِیبُ یَا نِعْمَ الرَّقِیبُ یَا نِعْمَ الْقَرِیبُ یَا نِعْمَ الْمُجِیبُ یَا نِعْمَ الْحَبِیبُ یَا نِعْمَ الْکَفِیلُ یَا نِعْمَ الْوَکِیلُ یَا نِعْمَ الْمَوْلَى یَا نِعْمَ النَّصِیرُ", fa: "ای نیکو حساب‌رس، ای نیکو طبیب، ای نیکو مراقب، ای نیکو نزدیک، ای نیکو اجابت‌کننده، ای نیکو حبیب، ای نیکو ضامن، ای نیکو کارگزار، ای نیکو مولا، ای نیکو یاور." },
    { ar: "یَا سُرُورَ الْعَارِفِینَ یَا مُنَى الْمُحِبِّینَ یَا أَنِیسَ الْمُرِیدِینَ یَا حَبِیبَ التَّوَّابِینَ یَا رَازِقَ الْمُقِلِّینَ یَا رَجَاءَ الْمُذْنِبِینَ یَا قُرَّةَ عَیْنِ الْعَابِدِینَ یَا مُنَفِّسَ عَنِ الْمَکْرُوبِینَ یَا مُفَرِّجَ عَنِ الْمَغْمُومِینَ یَا إِلَهَ الْأَوَّلِینَ وَ الْآخِرِینَ", fa: "ای شادی عارفان، ای آرزوی محبان، ای مونس مریدان، ای حبیب توبه‌کنندگان، ای روزی‌دهنده تنگدستان، ای امید گناهکاران، ای نور چشم عابدان، ای گشاینده گرفتاری درماندگان، ای برطرف‌کننده غم اندوهگینان، ای معبود اولین و آخرین." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا رَبَّنَا یَا إِلَهَنَا یَا سَیِّدَنَا یَا مَوْلانَا یَا نَاصِرَنَا یَا حَافِظَنَا یَا دَلِیلَنَا یَا مُعِینَنَا یَا حَبِیبَنَا یَا طَبِیبَنَا", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای پروردگار ما، ای معبود ما، ای آقای ما، ای مولای ما، ای یاور ما، ای نگهبان ما، ای راهنمای ما، ای یاری‌دهنده ما، ای حبیب ما، ای طبیب ما." },
    { ar: "یَا رَبَّ النَّبِیِّینَ وَ الْأَبْرَارِ یَا رَبَّ الصِّدِّیقِینَ وَ الْأَخْیَارِ یَا رَبَّ الْجَنَّةِ وَ النَّارِ یَا رَبَّ الصِّغَارِ وَ الْکِبَارِ یَا رَبَّ الْحُبُوبِ وَ الثِّمَارِ یَا رَبَّ الْأَنْهَارِ وَ الْأَشْجَارِ یَا رَبَّ الصَّحَارِی وَ الْقِفَارِ یَا رَبَّ الْبَرَارِی وَ الْبِحَارِ یَا رَبَّ اللَّیْلِ وَ النَّهَارِ یَا رَبَّ الْأَعْلانِ وَ الْأَسْرَارِ", fa: "ای پروردگار پیامبران و نیکان، ای پروردگار صدیقان و خوبان، ای پروردگار بهشت و آتش، ای پروردگار خردسالان و بزرگسالان، ای پروردگار دانه‌ها و میوه‌ها، ای پروردگار رودها و درختان، ای پروردگار بیابان‌ها و زمین‌های خشک، ای پروردگار خشکی‌ها و دریاها، ای پروردگار شب و روز، ای پروردگار آشکارها و پنهان‌ها." },
    { ar: "یَا مَنْ نَفَذَ فِی کُلِّ شَیْ‏ءٍ أَمْرُهُ یَا مَنْ لَحِقَ بِکُلِّ شَیْ‏ءٍ عِلْمُهُ یَا مَنْ بَلَغَتْ إِلَى کُلِّ شَیْ‏ءٍ قُدْرَتُهُ یَا مَنْ لا تُحْصِی الْعِبَادُ نِعَمَهُ یَا مَنْ لا تَبْلُغُ الْخَلائِقُ شُکْرَهُ یَا مَنْ لا تُدْرِکُ الْأَفْهَامُ جَلالَهُ یَا مَنْ لا تَنَالُ الْأَوْهَامُ کُنْهَهُ یَا مَنِ الْعَظَمَةُ وَ الْکِبْرِیَاءُ رِدَاؤُهُ یَا مَنْ لا تَرُدُّ الْعِبَادُ قَضَاءَهُ یَا مَنْ لا مُلْکَ إِلا مُلْکُهُ یَا مَنْ لا عَطَاءَ إِلا عَطَاؤُهُ", fa: "ای کسی که فرمانش در همه چیز نفوذ کرده، ای کسی که علمش به همه چیز رسیده، ای کسی که قدرتش به همه چیز رسیده، ای کسی که بندگان نعمت‌هایش را نمی‌توانند شماره کنند، ای کسی که آفریدگان به شکرگزاری‌اش نمی‌رسند، ای کسی که اندیشه‌ها جلالش را در نمی‌یابند، ای کسی که وهم‌ها به کنهش نمی‌رسند، ای کسی که عظمت و کبریا ردای اوست، ای کسی که بندگان قضایش را رد نمی‌کنند، ای کسی که جز پادشاهی او پادشاهی نیست، ای کسی که جز عطای او عطایی نیست." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا عَفُوُّ یَا غَفُورُ یَا صَبُورُ یَا شَکُورُ یَا رَءُوفُ یَا عَطُوفُ یَا مَسْئُولُ یَا وَدُودُ یَا سُبُّوحُ یَا قُدُّوسُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای درگذرنده، ای آمرزنده، ای شکیبا، ای سپاسگزار، ای مهربان، ای نوازشگر، ای خواسته شده، ای دوست‌دار، ای منزّه، ای پاک." },
    { ar: "یَا مَنْ فِی السَّمَاءِ عَظَمَتُهُ یَا مَنْ فِی الْأَرْضِ آیَاتُهُ یَا مَنْ فِی کُلِّ شَیْ‏ءٍ دَلائِلُهُ یَا مَنْ فِی الْبِحَارِ عَجَائِبُهُ یَا مَنْ فِی الْجِبَالِ خَزَائِنُهُ یَا مَنْ یَبْدَأُ الْخَلْقَ ثُمَّ یُعِیدُهُ یَا مَنْ إِلَیْهِ یَرْجِعُ الْأَمْرُ کُلُّهُ یَا مَنْ أَظْهَرَ فِی کُلِّ شَیْ‏ءٍ لُطْفَهُ یَا مَنْ أَحْسَنَ کُلَّ شَیْ‏ءٍ خَلَقَهُ یَا مَنْ تَصَرَّفَ فِی الْخَلائِقِ قُدْرَتُهُ", fa: "ای کسی که در آسمان عظمت اوست، ای کسی که در زمین نشانه‌های اوست، ای کسی که در همه چیز دلایل اوست، ای کسی که در دریاها شگفتی‌های اوست، ای کسی که در کوه‌ها گنجینه‌های اوست، ای کسی که آفرینش را آغاز می‌کند سپس آن را بازمی‌گرداند، ای کسی که همه کارها به او بازمی‌گردد، ای کسی که در همه چیز لطف خود را آشکار کرده، ای کسی که هر چه آفرید نیکو آفرید، ای کسی که قدرت او در آفریدگان تصرف کرده است." },
    { ar: "یَا حَبِیبَ مَنْ لا حَبِیبَ لَهُ یَا طَبِیبَ مَنْ لا طَبِیبَ لَهُ یَا مُجِیبَ مَنْ لا مُجِیبَ لَهُ یَا شَفِیقَ مَنْ لا شَفِیقَ لَهُ یَا رَفِیقَ مَنْ لا رَفِیقَ لَهُ یَا مُغِیثَ مَنْ لا مُغِیثَ لَهُ یَا دَلِیلَ مَنْ لا دَلِیلَ لَهُ یَا أَنِیسَ مَنْ لا أَنِیسَ لَهُ یَا رَاحِمَ مَنْ لا رَاحِمَ لَهُ یَا صَاحِبَ مَنْ لا صَاحِبَ لَهُ", fa: "ای حبیب بی‌حبیبان، ای طبیب بی‌طبیبان، ای اجابت‌کننده بی‌اجابت‌شدگان، ای مهربان بی‌مهربانان، ای رفیق بی‌رفیقان، ای فریادرس بی‌فریادرسان، ای راهنمای بی‌راهنمایان، ای مونس بی‌مونسان, ای رحم‌کننده بی‌رحم‌شدگان، ای همراه بی‌همراهان." },
    { ar: "یَا کَافِیَ مَنِ اسْتَکْفَاهُ یَا هَادِیَ مَنِ اسْتَهْدَاهُ یَا کَالِیَ مَنِ اسْتَکْلاهُ یَا رَاعِیَ مَنِ اسْتَرْعَاهُ یَا شَافِیَ مَنِ اسْتَشْفَاهُ یَا قَاضِیَ مَنِ اسْتَقْضَاهُ یَا مُغْنِیَ مَنِ اسْتَغْنَاهُ یَا مُوفِیَ مَنِ اسْتَوْفَاهُ یَا مُقَوِّیَ مَنِ اسْتَقْوَاهُ یَا وَلِیَّ مَنِ اسْتَوْلاهُ", fa: "ای کفایت‌کننده کسی که از تو کفایت خواست، ای راهنمای کسی که از تو هدایت خواست، ای نگهبان کسی که از تو نگهبانی خواست، ای چوپان کسی که از تو چوپانی خواست، ای شفابخش کسی که از تو شفا خواست، ای داور کسی که از تو داوری خواست، ای بی‌نیازکننده کسی که از تو بی‌نیازی خواست، ای وفاکننده کسی که از تو وفا خواست، ای نیروبخش کسی که از تو نیرو خواست، ای سرپرست کسی که از تو سرپرستی خواست." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا خَالِقُ یَا رَازِقُ یَا نَاطِقُ یَا صَادِقُ یَا فَالِقُ یَا فَارِقُ یَا فَاتِقُ یَا رَاتِقُ یَا سَابِقُ یَا سَامِقُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای آفریننده، ای روزی‌دهنده، ای گوینده، ای راست‌گو، ای شکافنده، ای جداکننده، ای گشاینده، ای پیونددهنده، ای پیش‌تر، ای بلندمرتبه." },
    { ar: "یَا مَنْ یُقَلِّبُ اللَّیْلَ وَ النَّهَارَ یَا مَنْ جَعَلَ الظُّلُمَاتِ وَ الْأَنْوَارَ یَا مَنْ خَلَقَ الظِّلَّ وَ الْحَرُورَ یَا مَنْ سَخَّرَ الشَّمْسَ وَ الْقَمَرَ یَا مَنْ قَدَّرَ الْخَیْرَ وَ الشَّرَّ یَا مَنْ خَلَقَ الْمَوْتَ وَ الْحَیَاةَ یَا مَنْ لَهُ الْخَلْقُ وَ الْأَمْرُ یَا مَنْ لَمْ یَتَّخِذْ صَاحِبَةً وَ لا وَلَداً یَا مَنْ لَیْسَ لَهُ شَرِیکٌ فِی الْمُلْکِ یَا مَنْ لَمْ یَکُنْ لَهُ وَلِیٌّ مِنَ الذُّلِّ", fa: "ای کسی که شب و روز را دگرگون می‌کند، ای کسی که تاریکی‌ها و روشنی‌ها را قرار داد، ای کسی که سایه و گرمی را آفرید، ای کسی که خورشید و ماه را مسخر کرد، ای کسی که خیر و شر را تقدیر کرد، ای کسی که مرگ و زندگی را آفرید، ای کسی که آفرینش و فرمان از آن اوست، ای کسی که همسر و فرزندی برنگرفت، ای کسی که در پادشاهی‌اش شریکی نیست، ای کسی که از خواری یاوری برای خود برنگرفت." },
    { ar: "یَا مَنْ یَعْلَمُ مُرَادَ الْمُرِیدِینَ یَا مَنْ یَعْلَمُ ضَمِیرَ الصَّامِتِینَ یَا مَنْ یَسْمَعُ أَنِینَ الْوَاهِنِینَ یَا مَنْ یَرَى بُکَاءَ الْخَائِفِینَ یَا مَنْ یَمْلِکُ حَوَائِجَ السَّائِلِینَ یَا مَنْ یَقْبَلُ عُذْرَ التَّائِبِینَ یَا مَنْ لا یُصْلِحُ عَمَلَ الْمُفْسِدِینَ یَا مَنْ لا یُضِیعُ أَجْرَ الْمُحْسِنِینَ یَا مَنْ لا یَبْعُدُ عَنْ قُلُوبِ الْعَارِفِینَ یَا أَجْوَدَ الْأَجْوَدِینَ", fa: "ای کسی که آرزوی آرزومندان را می‌داند، ای کسی که ضمیر خاموشان را می‌داند، ای کسی که ناله ناتوانان را می‌شنود، ای کسی که گریه هراسندگان را می‌بیند، ای کسی که حاجت‌های خواهندگان در اختیار اوست، ای کسی که عذر توبه‌کنندگان را می‌پذیرد، ای کسی که کار مفسدان را اصلاح نمی‌کند، ای کسی که پاداش نیکوکاران را ضایع نمی‌کند، ای کسی که از دل‌های عارفان دور نیست، ای بخشنده‌ترین بخشندگان." },
    { ar: "یَا دَائِمَ الْبَقَاءِ یَا سَامِعَ الدُّعَاءِ یَا وَاسِعَ الْعَطَاءِ یَا غَافِرَ الْخَطَاءِ یَا بَدِیعَ السَّمَاءِ یَا حَسَنَ الْبَلاءِ یَا جَمِیلَ الثَّنَاءِ یَا قَدِیمَ السَّنَاءِ یَا کَثِیرَ الْوَفَاءِ یَا شَرِیفَ الْجَزَاءِ", fa: "ای پاینده‌ی جاودان، ای شنوای دعا، ای گسترده‌بخش عطا، ای آمرزنده خطا، ای پدیدآورنده آسمان، ای نیکو آزمایش، ای زیبا ستایش، ای دیرینه ثنا، ای بسیار وفا، ای بزرگوار پاداش." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا سَتَّارُ یَا غَفَّارُ یَا قَهَّارُ یَا جَبَّارُ یَا صَبَّارُ یَا بَارُّ یَا مُخْتَارُ یَا فَتَّاحُ یَا نَفَّاحُ یَا مُرْتَاحُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای بسیار پوشنده، ای بسیار آمرزنده، ای چیره‌گر، ای جبّار، ای بسیار شکیبا، ای نیکوکار، ای برگزیده، ای گشاینده، ای بخشنده، ای آرامش‌بخش." },
    { ar: "یَا مَنْ خَلَقَنِی وَ سَوَّانِی یَا مَنْ رَزَقَنِی وَ رَبَّانِی یَا مَنْ أَطْعَمَنِی وَ سَقَانِی یَا مَنْ قَرَّبَنِی وَ أَدْنَانِی یَا مَنْ عَصَمَنِی وَ کَفَانِی یَا مَنْ حَفِظَنِی وَ کَلانِی یَا مَنْ أَعَزَّنِی وَ أَغْنَانِی یَا مَنْ وَفَّقَنِی وَ هَدَانِی یَا مَنْ آنَسَنِی وَ آوَانِی یَا مَنْ أَمَاتَنِی وَ أَحْیَانِی", fa: "ای کسی که مرا آفریدی و آراستی، ای کسی که روزی‌ام دادی و پروردم، ای کسی که خوراک و آبم دادی، ای کسی که نزدیکم کردی و مقربم ساختی، ای کسی که نگهم داشتی و کفایتم کردی، ای کسی که حفظ و نگهبانی‌ام کردی، ای کسی که عزیزم و بی‌نیازم کردی، ای کسی که توفیقم دادی و هدایتم کردی، ای کسی که مونسم کردی و جایم دادی، ای کسی که میراندی و زنده‌ام کردی." },
    { ar: "یَا مَنْ یُحِقُّ الْحَقَّ بِکَلِمَاتِهِ یَا مَنْ یَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ یَا مَنْ یَحُولُ بَیْنَ الْمَرْءِ وَ قَلْبِهِ یَا مَنْ لا تَنْفَعُ الشَّفَاعَةُ إِلا بِإِذْنِهِ یَا مَنْ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِیلِهِ یَا مَنْ لا مُعَقِّبَ لِحُکْمِهِ یَا مَنْ لا رَادَّ لِقَضَائِهِ یَا مَنِ انْقَادَ کُلُّ شَیْ‏ءٍ لِأَمْرِهِ یَا مَنِ السَّمَاوَاتُ مَطْوِیَّاتٌ بِیَمِینِهِ یَا مَنْ یُرْسِلُ الرِّیَاحَ بُشْراً بَیْنَ یَدَیْ رَحْمَتِهِ", fa: "ای کسی که حق را با کلماتش ثابت می‌کند، ای کسی که توبه را از بندگانش می‌پذیرد، ای کسی که میان انسان و دلش حائل می‌شود، ای کسی که شفاعت جز به اذن او سود نمی‌بخشد، ای کسی که داناتر است به کسی که از راهش گمراه شده، ای کسی که حکمش را بازدارنده‌ای نیست، ای کسی که قضایش را ردکننده‌ای نیست، ای کسی که همه چیز به فرمانش گردن نهاده، ای کسی که آسمان‌ها در دست راستش پیچیده شده، ای کسی که بادها را به عنوان مژده‌دهنده پیشاپیش رحمتش می‌فرستد." },
    { ar: "یَا مَنْ جَعَلَ الْأَرْضَ مِهَاداً یَا مَنْ جَعَلَ الْجِبَالَ أَوْتَاداً یَا مَنْ جَعَلَ الشَّمْسَ سِرَاجاً یَا مَنْ جَعَلَ الْقَمَرَ نُوراً یَا مَنْ جَعَلَ اللَّیْلَ لِبَاساً یَا مَنْ جَعَلَ النَّهَارَ مَعَاشاً یَا مَنْ جَعَلَ النَّوْمَ سُبَاتاً یَا مَنْ جَعَلَ السَّمَاءَ بِنَاءً یَا مَنْ جَعَلَ الْأَشْیَاءَ أَزْوَاجاً یَا مَنْ جَعَلَ النَّارَ مِرْصَاداً", fa: "ای کسی که زمین را گهواره قرار داد، ای کسی که کوه‌ها را میخ‌ها قرار داد، ای کسی که خورشید را چراغ قرار داد، ای کسی که ماه را روشنایی قرار داد، ای کسی که شب را پوشش قرار داد، ای کسی که روز را مایه معیشت قرار داد، ای کسی که خواب را مایه آرامش قرار داد، ای کسی که آسمان را سقفی محکم قرار داد، ای کسی که همه چیز را جفت آفرید، ای کسی که آتش را کمین‌گاهی قرار داد." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا سَمِیعُ یَا شَفِیعُ یَا رَفِیعُ یَا مَنِیعُ یَا سَرِیعُ یَا بَدِیعُ یَا کَبِیرُ یَا قَدِیرُ یَا خَبِیرُ یَا مُجِیرُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای شنوا، ای شفیع، ای بلندمرتبه، ای شکست‌ناپذیر، ای سریع، ای نوآفرین، ای بزرگ، ای توانا، ای آگاه، ای پناه‌دهنده." },
    { ar: "یَا حَیّاً قَبْلَ کُلِّ حَیٍّ یَا حَیّاً بَعْدَ کُلِّ حَیٍّ یَا حَیُّ الَّذِی لَیْسَ کَمِثْلِهِ حَیٌّ یَا حَیُّ الَّذِی لا یُشَارِکُهُ حَیٌّ یَا حَیُّ الَّذِی لا یَحْتَاجُ إِلَى حَیٍّ یَا حَیُّ الَّذِی یُمِیتُ کُلَّ حَیٍّ یَا حَیُّ الَّذِی یَرْزُقُ کُلَّ حَیٍّ یَا حَیّاً لَمْ یَرِثِ الْحَیَاةَ مِنْ حَیٍّ یَا حَیُّ الَّذِی یُحْیِی الْمَوْتَى یَا حَیُّ یَا قَیُّومُ لا تَأْخُذُهُ سِنَةٌ وَ لا نَوْمٌ", fa: "ای زنده پیش از هر زنده، ای زنده پس از هر زنده، ای زنده‌ای که مانندش زنده‌ای نیست، ای زنده‌ای که هیچ زنده‌ای با او شریک نیست، ای زنده‌ای که به زنده‌ای نیاز ندارد، ای زنده‌ای که هر زنده‌ای را می‌میراند، ای زنده‌ای که هر زنده‌ای را روزی می‌دهد، ای زنده‌ای که زندگی را از زنده‌ای به ارث نبرده، ای زنده‌ای که مردگان را زنده می‌کند، ای زنده، ای پاینده، که خواب و چرت او را فرا نمی‌گیرد." },
    { ar: "یَا مَنْ لَهُ ذِکْرٌ لا یُنْسَى یَا مَنْ لَهُ نُورٌ لا یُطْفَى یَا مَنْ لَهُ نِعَمٌ لا تُعَدُّ یَا مَنْ لَهُ مُلْکٌ لا یَزُولُ یَا مَنْ لَهُ ثَنَاءٌ لا یُحْصَى یَا مَنْ لَهُ جَلالٌ لا یُکَیَّفُ یَا مَنْ لَهُ کَمَالٌ لا یُدْرَکُ یَا مَنْ لَهُ قَضَاءٌ لا یُرَدُّ یَا مَنْ لَهُ صِفَاتٌ لا تُبَدَّلُ یَا مَنْ لَهُ نُعُوتٌ لا تُغَیَّرُ", fa: "ای کسی که یادش فراموش نمی‌شود، ای کسی که نورش خاموش نمی‌شود، ای کسی که نعمت‌هایش شماره نمی‌شود، ای کسی که پادشاهی‌اش زوال نمی‌پذیرد، ای کسی که ستایش‌هایش به شماره نمی‌آید، ای کسی که جلالش به کیفیت وصف نمی‌شود، ای کسی که کمالش درک نمی‌شود، ای کسی که قضایش رد نمی‌شود، ای کسی که صفاتش تغییر نمی‌کند، ای کسی که اوصافش دگرگون نمی‌شود." },
    { ar: "یَا رَبَّ الْعَالَمِینَ یَا مَالِکَ یَوْمِ الدِّینِ یَا غَایَةَ الطَّالِبِینَ یَا ظَهْرَ اللَّاجِینَ یَا مُدْرِکَ الْهَارِبِینَ یَا مَنْ یُحِبُّ الصَّابِرِینَ یَا مَنْ یُحِبُّ التَّوَّابِینَ یَا مَنْ یُحِبُّ الْمُتَطَهِّرِینَ یَا مَنْ یُحِبُّ الْمُحْسِنِینَ یَا مَنْ هُوَ أَعْلَمُ بِالْمُهْتَدِینَ", fa: "ای پروردگار جهانیان، ای مالک روز جزا، ای نهایت خواهندگان، ای پشت و پناه پناهندگان، ای درک‌کننده گریزانان، ای کسی که صابران را دوست دارد، ای کسی که توبه‌کنندگان را دوست دارد، ای کسی که پاک‌کنندگان را دوست دارد، ای کسی که نیکوکاران را دوست دارد، ای کسی که به هدایت‌یافتگان داناتر است." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا شَفِیقُ یَا رَفِیقُ یَا حَفِیظُ یَا مُحِیطُ یَا مُقِیتُ یَا مُغِیثُ یَا مُعِزُّ یَا مُذِلُّ یَا مُبْدِئُ یَا مُعِیدُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای مهربان، ای رفیق، ای نگهبان، ای احاطه‌کننده، ای روزی‌دهنده، ای فریادرس، ای عزت‌بخش، ای خوارکننده، ای آغازگر، ای بازگرداننده." },
    { ar: "یَا مَنْ هُوَ أَحَدٌ بِلا ضِدٍّ یَا مَنْ هُوَ فَرْدٌ بِلا نِدٍّ یَا مَنْ هُوَ صَمَدٌ بِلا عَیْبٍ یَا مَنْ هُوَ وِتْرٌ بِلا کَیْفٍ یَا مَنْ هُوَ قَاضٍ بِلا حَیْفٍ یَا مَنْ هُوَ رَبٌّ بِلا وَزِیرٍ یَا مَنْ هُوَ عَزِیزٌ بِلا ذُلٍّ یَا مَنْ هُوَ غَنِیٌّ بِلا فَقْرٍ یَا مَنْ هُوَ مَلِکٌ بِلا عَزْلٍ یَا مَنْ هُوَ مَوْصُوفٌ بِلا شَبِیهٍ", fa: "ای کسی که یکتاست بی‌ضد، ای کسی که فرد است بی‌همتا، ای کسی که صمد است بی‌عیب، ای کسی که وتر است بی‌چگونگی، ای کسی که داور است بی‌ستم، ای کسی که پروردگار است بی‌وزیر، ای کسی که عزیز است بی‌خواری، ای کسی که بی‌نیاز است بی‌فقر، ای کسی که پادشاه است بی‌عزل، ای کسی که موصوف است بی‌همانند." },
    { ar: "یَا مَنْ ذِکْرُهُ شَرَفٌ لِلذَّاکِرِینَ یَا مَنْ شُکْرُهُ فَوْزٌ لِلشَّاکِرِینَ یَا مَنْ حَمْدُهُ عِزٌّ لِلْحَامِدِینَ یَا مَنْ طَاعَتُهُ نَجَاةٌ لِلْمُطِیعِینَ یَا مَنْ بَابُهُ مَفْتُوحٌ لِلطَّالِبِینَ یَا مَنْ سَبِیلُهُ وَاضِحٌ لِلْمُنِیبِینَ یَا مَنْ آیَاتُهُ بُرْهَانٌ لِلنَّاظِرِینَ یَا مَنْ کِتَابُهُ تَذْکِرَةٌ لِلْمُتَّقِینَ یَا مَنْ رِزْقُهُ عُمُومٌ لِلطَّائِعِینَ وَ الْعَاصِینَ یَا مَنْ رَحْمَتُهُ قَرِیبٌ مِنَ الْمُحْسِنِینَ", fa: "ای کسی که یادش برای ذاکران شرف است، ای کسی که شکرگزاری‌اش برای شاکران رستگاری است، ای کسی که ستایشش برای حامدان عزت است، ای کسی که طاعتش برای مطیعان نجات است، ای کسی که دربش برای خواهندگان باز است، ای کسی که راهش برای توبه‌کنندگان روشن است، ای کسی که آیاتش برای نگرندگان برهان است، ای کسی که کتابش برای پرهیزگاران تذکره است، ای کسی که روزی‌اش برای مطیعان و عاصیان عمومی است، ای کسی که رحمتش به نیکوکاران نزدیک است." },
    { ar: "یَا مَنْ تَبَارَکَ اسْمُهُ یَا مَنْ تَعَالَى جَدُّهُ یَا مَنْ لا إِلَهَ غَیْرُهُ یَا مَنْ جَلَّ ثَنَاؤُهُ یَا مَنْ تَقَدَّسَتْ أَسْمَاؤُهُ یَا مَنْ یَدُومُ بَقَاؤُهُ یَا مَنِ الْعَظَمَةُ بَهَاؤُهُ یَا مَنِ الْکِبْرِیَاءُ رِدَاؤُهُ یَا مَنْ لا تُحْصَى آلاؤُهُ یَا مَنْ لا تُعَدُّ نَعْمَاؤُهُ", fa: "ای کسی که نامش پربرکت است، ای کسی که بزرگی‌اش والاست، ای کسی که معبودی جز او نیست، ای کسی که ستایشش بزرگ است، ای کسی که نام‌هایش پاک است، ای کسی که بقایش جاودان است، ای کسی که عظمت زیبایی اوست، ای کسی که کبریا ردای اوست، ای کسی که نعمت‌هایش به شماره نمی‌آید، ای کسی که بخشش‌هایش به حساب نمی‌آید." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا مُعِینُ یَا أَمِینُ یَا مُبِینُ یَا مَتِینُ یَا مَکِینُ یَا رَشِیدُ یَا حَمِیدُ یَا مَجِیدُ یَا شَدِیدُ یَا شَهِیدُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای یاری‌دهنده، ای امین، ای آشکار، ای استوار، ای توانمند، ای راه‌یاب، ای ستوده، ای با مجد، ای سخت‌گیر، ای گواه." },
    { ar: "یَا ذَا الْعَرْشِ الْمَجِیدِ یَا ذَا الْقَوْلِ السَّدِیدِ یَا ذَا الْفِعْلِ الرَّشِیدِ یَا ذَا الْبَطْشِ الشَّدِیدِ یَا ذَا الْوَعْدِ وَ الْوَعِیدِ یَا مَنْ هُوَ الْوَلِیُّ الْحَمِیدُ یَا مَنْ هُوَ فَعَّالٌ لِمَا یُرِیدُ یَا مَنْ هُوَ قَرِیبٌ غَیْرُ بَعِیدٍ یَا مَنْ هُوَ عَلَى کُلِّ شَیْ‏ءٍ شَهِیدٌ یَا مَنْ هُوَ لَیْسَ بِظَلاَّمٍ لِلْعَبِیدِ", fa: "ای صاحب عرش مجید، ای صاحب گفتار استوار، ای صاحب کردار راه‌یاب، ای صاحب حمله سخت، ای صاحب وعده و وعید، ای کسی که او سرپرست ستوده است، ای کسی که او هر چه خواهد انجام‌دهنده است، ای کسی که او نزدیک است نه دور، ای کسی که او بر هر چیزی گواه است، ای کسی که بر بندگان ستمگر نیست." },
    { ar: "یَا مَنْ لا شَرِیکَ لَهُ وَ لا وَزِیرَ یَا مَنْ لا شَبِیهَ لَهُ وَ لا نَظِیرَ یَا خَالِقَ الشَّمْسِ وَ الْقَمَرِ الْمُنِیرِ یَا مُغْنِیَ الْبَائِسِ الْفَقِیرِ یَا رَازِقَ الطِّفْلِ الصَّغِیرِ یَا رَاحِمَ الشَّیْخِ الْکَبِیرِ یَا جَابِرَ الْعَظْمِ الْکَسِیرِ یَا عِصْمَةَ الْخَائِفِ الْمُسْتَجِیرِ یَا مَنْ هُوَ بِعِبَادِهِ خَبِیرٌ بَصِیرٌ یَا مَنْ هُوَ عَلَى کُلِّ شَیْ‏ءٍ قَدِیرٌ", fa: "ای کسی که برای او شریک و وزیری نیست، ای کسی که برای او مانند و همتایی نیست، ای آفریننده خورشید و ماه تابنده، ای بی‌نیازکننده بینوای فقیر، ای روزی‌دهنده کودک خردسال، ای رحم‌کننده پیر کهنسال، ای جبران‌کننده استخوان شکسته، ای نگهدار هراسان پناه‌جو، ای کسی که به بندگانش آگاه و بیناست، ای کسی که بر هر چیزی تواناست." },
    { ar: "یَا ذَا الْجُودِ وَ النِّعَمِ یَا ذَا الْفَضْلِ وَ الْکَرَمِ یَا خَالِقَ اللَّوْحِ وَ الْقَلَمِ یَا بَارِئَ الذَّرِّ وَ النَّسَمِ یَا ذَا الْبَأْسِ وَ النِّقَمِ یَا مُلْهِمَ الْعَرَبِ وَ الْعَجَمِ یَا کَاشِفَ الضُّرِّ وَ الْأَلَمِ یَا عَالِمَ السِّرِّ وَ الْهِمَمِ یَا رَبَّ الْبَیْتِ وَ الْحَرَمِ یَا مَنْ خَلَقَ الْأَشْیَاءَ مِنَ الْعَدَمِ", fa: "ای صاحب جود و نعمت‌ها، ای صاحب فضل و کرامت، ای آفریننده لوح و قلم، ای پدیدآورنده ذرّات و نفوس، ای صاحب شدت و عقوبت، ای الهام‌بخش عرب و عجم، ای برطرف‌کننده زیان و درد، ای دانای راز و همّت‌ها، ای پروردگار خانه و حرم، ای کسی که اشیاء را از نیستی آفرید." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا فَاعِلُ یَا جَاعِلُ یَا قَابِلُ یَا کَامِلُ یَا فَاصِلُ یَا وَاصِلُ یَا عَادِلُ یَا غَالِبُ یَا طَالِبُ یَا وَاهِبُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای انجام‌دهنده، ای قراردهنده، ای پذیرنده، ای کامل، ای جداکننده، ای پیونددهنده، ای دادگر، ای چیره، ای خواهان، ای بخشنده." },
    { ar: "یَا مَنْ أَنْعَمَ بِطَوْلِهِ یَا مَنْ أَکْرَمَ بِجُودِهِ یَا مَنْ جَادَ بِلُطْفِهِ یَا مَنْ تَعَزَّزَ بِقُدْرَتِهِ یَا مَنْ قَدَّرَ بِحِکْمَتِهِ یَا مَنْ حَکَمَ بِتَدْبِیرِهِ یَا مَنْ دَبَّرَ بِعِلْمِهِ یَا مَنْ تَجَاوَزَ بِحِلْمِهِ یَا مَنْ دَنَا فِی عُلُوِّهِ یَا مَنْ عَلا فِی دُنُوِّهِ", fa: "ای کسی که به فضل خود نعمت داد، ای کسی که به جود خود کرامت کرد، ای کسی که به لطف خود بخشید، ای کسی که به قدرت خود عزت یافت، ای کسی که به حکمت خود تقدیر کرد، ای کسی که به تدبیر خود حکم کرد، ای کسی که به علم خود تدبیر کرد، ای کسی که به حلم خود گذشت کرد، ای کسی که در بلندی‌اش نزدیک است، ای کسی که در نزدیکی‌اش بلند است." },
    { ar: "یَا مَنْ یَخْلُقُ مَا یَشَاءُ یَا مَنْ یَفْعَلُ مَا یَشَاءُ یَا مَنْ یَهْدِی مَنْ یَشَاءُ یَا مَنْ یُضِلُّ مَنْ یَشَاءُ یَا مَنْ یُعَذِّبُ مَنْ یَشَاءُ یَا مَنْ یَغْفِرُ لِمَنْ یَشَاءُ یَا مَنْ یُعِزُّ مَنْ یَشَاءُ یَا مَنْ یُذِلُّ مَنْ یَشَاءُ یَا مَنْ یُصَوِّرُ فِی الْأَرْحَامِ مَا یَشَاءُ یَا مَنْ یَخْتَصُّ بِرَحْمَتِهِ مَنْ یَشَاءُ", fa: "ای کسی که هر چه خواهد می‌آفریند، ای کسی که هر چه خواهد انجام می‌دهد، ای کسی که هر که را خواهد هدایت می‌کند، ای کسی که هر که را خواهد گمراه می‌کند، ای کسی که هر که را خواهد عذاب می‌کند، ای کسی که هر که را خواهد می‌آمرزد، ای کسی که هر که را خواهد عزت می‌بخشد، ای کسی که هر که را خواهد خوار می‌کند، ای کسی که در رحم‌ها هر چه خواهد تصویر می‌کند، ای کسی که هر که را خواهد به رحمت خود اختصاص می‌دهد." },
    { ar: "یَا مَنْ لَمْ یَتَّخِذْ صَاحِبَةً وَ لا وَلَداً یَا مَنْ جَعَلَ لِکُلِّ شَیْ‏ءٍ قَدْراً یَا مَنْ لا یُشْرِکُ فِی حُکْمِهِ أَحَداً یَا مَنْ جَعَلَ الْمَلائِکَةَ رُسُلاً یَا مَنْ جَعَلَ فِی السَّمَاءِ بُرُوجاً یَا مَنْ جَعَلَ الْأَرْضَ قَرَاراً یَا مَنْ خَلَقَ مِنَ الْمَاءِ بَشَراً یَا مَنْ جَعَلَ لِکُلِّ شَیْ‏ءٍ أَمَداً یَا مَنْ أَحَاطَ بِکُلِّ شَیْ‏ءٍ عِلْماً یَا مَنْ أَحْصَى کُلَّ شَیْ‏ءٍ عَدَداً", fa: "ای کسی که همسر و فرزندی برنگرفت، ای کسی که برای هر چیزی اندازه‌ای قرار داد، ای کسی که در حکم خود کسی را شریک نمی‌کند، ای کسی که فرشتگان را رسولان قرار داد، ای کسی که در آسمان برج‌هایی قرار داد، ای کسی که زمین را قرارگاه قرار داد، ای کسی که از آب بشر را آفرید، ای کسی که برای هر چیزی مدتی قرار داد، ای کسی که به همه چیز احاطه علمی دارد، ای کسی که همه چیز را به شماره برشمرده است." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا أَوَّلُ یَا آخِرُ یَا ظَاهِرُ یَا بَاطِنُ یَا بَرُّ یَا حَقُّ یَا فَرْدُ یَا وِتْرُ یَا صَمَدُ یَا سَرْمَدُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای اول، ای آخر، ای آشکار، ای نهان، ای نیکو، ای حق، ای فرد، ای وتر، ای صمد، ای سرمد." },
    { ar: "یَا خَیْرَ مَعْرُوفٍ عُرِفَ یَا أَفْضَلَ مَعْبُودٍ عُبِدَ یَا أَجَلَّ مَشْکُورٍ شُکِرَ یَا أَعَزَّ مَذْکُورٍ ذُکِرَ یَا أَعْلَى مَحْمُودٍ حُمِدَ یَا أَقْدَمَ مَوْجُودٍ طُلِبَ یَا أَرْفَعَ مَوْصُوفٍ وُصِفَ یَا أَکْبَرَ مَقْصُودٍ قُصِدَ یَا أَکْرَمَ مَسْئُولٍ سُئِلَ یَا أَشْرَفَ مَحْبُوبٍ عُلِمَ", fa: "ای بهترین نیکی که شناخته شده، ای برترین معبود که پرستیده شده، ای بزرگ‌ترین سپاسگزار که سپاس گفته شده، ای عزیزترین یاد که یاد شده، ای برترین ستوده که ستوده شده، ای قدیمی‌ترین موجود که طلب شده، ای بلندترین موصوف که وصف شده، ای بزرگ‌ترین مقصود که قصد شده، ای کریم‌ترین مسئول که سؤال شده، ای شریف‌ترین محبوب که شناخته شده." },
    { ar: "یَا حَبِیبَ الْبَاکِینَ یَا سَیِّدَ الْمُتَوَکِّلِینَ یَا هَادِیَ الْمُضِلِّینَ یَا وَلِیَّ الْمُؤْمِنِینَ یَا أَنِیسَ الذَّاکِرِینَ یَا مَفْزَعَ الْمَلْهُوفِینَ یَا مُنْجِیَ الصَّادِقِینَ یَا أَقْدَرَ الْقَادِرِینَ یَا أَعْلَمَ الْعَالِمِینَ یَا إِلَهَ الْخَلْقِ أَجْمَعِینَ", fa: "ای حبیب گریه‌کنندگان، ای آقای توکل‌کنندگان، ای هدایت‌کننده گمراهان، ای سرپرست مؤمنان، ای مونس ذاکران، ای پناهگاه اندوهناکان، ای نجات‌دهنده راستگویان، ای تواناترین توانایان، ای داناترین دانایان، ای معبود همه آفریدگان." },
    { ar: "یَا مَنْ عَلا فَقَهَرَ یَا مَنْ مَلَکَ فَقَدَرَ یَا مَنْ بَطَنَ فَخَبَرَ یَا مَنْ عُبِدَ فَشَکَرَ یَا مَنْ عُصِیَ فَغَفَرَ یَا مَنْ لا تَحْوِیهِ الْفِکَرُ یَا مَنْ لا یُدْرِکُهُ بَصَرٌ یَا مَنْ لا یَخْفَى عَلَیْهِ أَثَرٌ یَا رَازِقَ الْبَشَرِ یَا مُقَدِّرَ کُلِّ قَدَرٍ", fa: "ای کسی که بلند شد و چیره گشت، ای کسی که پادشاهی کرد و توانا شد، ای کسی که نهان گشت و آگاه شد، ای کسی که پرستیده شد و سپاس گرفت، ای کسی که نافرمانی شد و آمرزید، ای کسی که اندیشه‌ها او را در بر نمی‌گیرند، ای کسی که دیدگانی او را در نمی‌یابند، ای کسی که اثری بر او پنهان نمی‌ماند، ای روزی‌دهنده بشر، ای اندازه‌گیر هر اندازه." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا حَافِظُ یَا بَارِئُ یَا ذَارِئُ یَا بَاذِخُ یَا فَارِجُ یَا فَاتِحُ یَا کَاشِفُ یَا ضَامِنُ یَا آمِرُ یَا نَاهِی", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای نگهبان، ای پدیدآورنده، ای آفریننده، ای بزرگوار، ای گشاینده، ای گشاینده، ای برطرف‌کننده، ای ضامن، ای فرمان‌ده، ای نهی‌کننده." },
    { ar: "یَا مَنْ لا یَعْلَمُ الْغَیْبَ إِلا هُوَ یَا مَنْ لا یَصْرِفُ السُّوءَ إِلا هُوَ یَا مَنْ لا یَخْلُقُ الْخَلْقَ إِلا هُوَ یَا مَنْ لا یَغْفِرُ الذَّنْبَ إِلا هُوَ یَا مَنْ لا یُتِمُّ النِّعْمَةَ إِلا هُوَ یَا مَنْ لا یُقَلِّبُ الْقُلُوبَ إِلا هُوَ یَا مَنْ لا یُدَبِّرُ الْأَمْرَ إِلا هُوَ یَا مَنْ لا یُنَزِّلُ الْغَیْثَ إِلا هُوَ یَا مَنْ لا یَبْسُطُ الرِّزْقَ إِلا هُوَ یَا مَنْ لا یُحْیِی الْمَوْتَى إِلا هُوَ", fa: "ای کسی که جز او غیب را نمی‌داند، ای کسی که جز او بدی را برطرف نمی‌کند، ای کسی که جز او خلق را نمی‌آفریند، ای کسی که جز او گناه را نمی‌آمرزد، ای کسی که جز او نعمت را تمام نمی‌کند، ای کسی که جز او دل‌ها را دگرگون نمی‌کند، ای کسی که جز او کار را تدبیر نمی‌کند، ای کسی که جز او باران را فرو نمی‌فرستد، ای کسی که جز او روزی را گسترش نمی‌دهد، ای کسی که جز او مردگان را زنده نمی‌کند." },
    { ar: "یَا مُعِینَ الضُّعَفَاءِ یَا صَاحِبَ الْغُرَبَاءِ یَا نَاصِرَ الْأَوْلِیَاءِ یَا قَاهِرَ الْأَعْدَاءِ یَا رَافِعَ السَّمَاءِ یَا أَنِیسَ الْأَصْفِیَاءِ یَا حَبِیبَ الْأَتْقِیَاءِ یَا کَنْزَ الْفُقَرَاءِ یَا إِلَهَ الْأَغْنِیَاءِ یَا أَکْرَمَ الْکُرَمَاءِ", fa: "ای یاری‌دهنده ضعیفان، ای همراه غربا، ای یاور اولیا، ای چیره‌کننده دشمنان، ای برافرازنده آسمان، ای مونس برگزیدگان، ای حبیب پرهیزگاران، ای گنجینه فقرا، ای معبود اغنیا، ای کریم‌ترین کریمان." },
    { ar: "یَا کَافِیاً مِنْ کُلِّ شَیْ‏ءٍ یَا قَائِماً عَلَى کُلِّ شَیْ‏ءٍ یَا مَنْ لا یُشْبِهُهُ شَیْ‏ءٌ یَا مَنْ لا یَزِیدُ فِی مُلْکِهِ شَیْ‏ءٌ یَا مَنْ لا یَخْفَى عَلَیْهِ شَیْ‏ءٌ یَا مَنْ لا یَنْقُصُ مِنْ خَزَائِنِهِ شَیْ‏ءٌ یَا مَنْ لَیْسَ کَمِثْلِهِ شَیْ‏ءٌ یَا مَنْ لا یَعْزُبُ عَنْ عِلْمِهِ شَیْ‏ءٌ یَا مَنْ هُوَ خَبِیرٌ بِکُلِّ شَیْ‏ءٍ یَا مَنْ وَسِعَتْ رَحْمَتُهُ کُلَّ شَیْ‏ءٍ", fa: "ای کفایت‌کننده از هر چیزی، ای برپا بر هر چیزی، ای که چیزی مانند او نیست، ای که در پادشاهی‌اش چیزی افزوده نمی‌شود، ای که چیزی بر او پنهان نمی‌ماند، ای که از خزائنش چیزی کاسته نمی‌شود، ای که مانند او چیزی نیست، ای که چیزی از علمش دور نیست، ای که او به هر چیزی آگاه است، ای که رحمتش همه چیز را فراگرفته است." },
    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا مُکْرِمُ یَا مُطْعِمُ یَا مُنْعِمُ یَا مُعْطِی یَا مُغْنِی یَا مُقْنِی یَا مُفْنِی یَا مُحْیِی یَا مُرْضِی یَا مُنْجِی", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای گرامی‌دارنده، ای طعام‌دهنده، ای نعمت‌دهنده، ای عطاکننده، ای بی‌نیازکننده، ای قانع‌کننده، ای نابودکننده، ای زنده‌کننده، ای خشنودکننده، ای نجات‌دهنده." },

    { ar: "یَا خَیْرَ ذَاکِرٍ وَ مَذْکُورٍ یَا خَیْرَ شَاکِرٍ وَ مَشْکُورٍ یَا خَیْرَ حَامِدٍ وَ مَحْمُودٍ یَا خَیْرَ شَاهِدٍ وَ مَشْهُودٍ یَا خَیْرَ دَاعٍ وَ مَدْعُوٍّ یَا خَیْرَ مُجِیبٍ وَ مُجَابٍ یَا خَیْرَ مُونِسٍ وَ أَنِیسٍ یَا خَیْرَ صَاحِبٍ وَ جَلِیسٍ یَا خَیْرَ مَقْصُودٍ وَ مَطْلُوبٍ یَا خَیْرَ حَبِیبٍ وَ مَحْبُوبٍ", fa: "ای بهترین یادکننده و یادشده، ای بهترین سپاسگزار و سپاس‌شده، ای بهترین ستاینده و ستوده، ای بهترین گواه و گواه‌شده، ای بهترین دعوت‌کننده و خوانده‌شده، ای بهترین اجابت‌کننده و اجابت‌شده، ای بهترین مونس و مونس‌شده، ای بهترین همراه و همنشین، ای بهترین مقصود و مطلوب، ای بهترین حبیب و محبوب." },

    { ar: "اللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ یَا مُسَبِّبُ یَا مُرَغِّبُ یَا مُقَلِّبُ یَا مُعَقِّبُ یَا مُرَتِّبُ یَا مُخَوِّفُ یَا مُحَذِّرُ یَا مُذَکِّرُ یَا مُسَخِّرُ یَا مُغَیِّرُ", fa: "خدایا! از تو درخواست می‌کنم به نامت، ای سبب‌ساز، ای رغبت‌دهنده، ای دگرگون‌کننده، ای جانشین‌ساز، ای مرتب‌کننده، ای ترساننده، ای هشداردهنده، ای یادآورنده، ای مسخّرکننده، ای تغییردهنده." },
    { ar: "یَا مَنْ عِلْمُهُ سَابِقٌ یَا مَنْ وَعْدُهُ صَادِقٌ یَا مَنْ لُطْفُهُ ظَاهِرٌ یَا مَنْ أَمْرُهُ غَالِبٌ یَا مَنْ کِتَابُهُ مُحْکَمٌ یَا مَنْ قَضَاؤُهُ کَائِنٌ یَا مَنْ قُرْآنُهُ مَجِیدٌ یَا مَنْ مُلْکُهُ قَدِیمٌ یَا مَنْ فَضْلُهُ عَمِیمٌ یَا مَنْ عَرْشُهُ عَظِیمٌ", fa: "ای کسی که علمش پیشین است، ای کسی که وعده‌اش راست است، ای کسی که لطفش آشکار است، ای کسی که فرمانش چیره است، ای کسی که کتابش محکم است، ای کسی که قضایش موجود است، ای کسی که قرآنش مجید است, ای کسی که پادشاهی‌اش قدیم است، ای کسی که فضلش عمومی است، ای کسی که عرشش بزرگ است." },
    { ar: "یَا مَنْ لا یَشْغَلُهُ سَمْعٌ عَنْ سَمْعٍ یَا مَنْ لا یَمْنَعُهُ فِعْلٌ عَنْ فِعْلٍ یَا مَنْ لا یُلْهِیهِ قَوْلٌ عَنْ قَوْلٍ یَا مَنْ لا یُغَلِّطُهُ سُؤَالٌ عَنْ سُؤَالٍ یَا مَنْ لا یَحْجُبُهُ شَیْ‏ءٌ عَنْ شَیْ‏ءٍ یَا مَنْ لا یُبْرِمُهُ إِلْحَاحُ الْمُلِحِّینَ یَا مَنْ هُوَ غَایَةُ مُرَادِ الْمُرِیدِینَ یَا مَنْ هُوَ مُنْتَهَى هِمَمِ الْعَارِفِینَ یَا مَنْ هُوَ مُنْتَهَى طَلَبِ الطَّالِبِینَ یَا مَنْ لا یَخْفَى عَلَیْهِ ذَرَّةٌ فِی الْعَالَمِینَ", fa: "ای کسی که شنوایی از شنوایی دیگر او را مشغول نمی‌کند، ای کسی که کاری از کار دیگر او را باز نمی‌دارد، ای کسی که گفتاری از گفتار دیگر او را سرگرم نمی‌کند، ای کسی که درخواستی از درخواست دیگر او را به خطا نمی‌اندازد، ای کسی که چیزی از چیز دیگر او را محجوب نمی‌کند، ای کسی که اصرار اصرارکنندگان او را به ستوه نمی‌آورد، ای کسی که نهایت آرزوی ارادتمندان است، ای کسی که منتهی همت‌های عارفان است، ای کسی که منتهی طلب خواهندگان است، ای کسی که ذره‌ای در جهانیان بر او پنهان نمی‌شود." },
    { ar: "یَا حَلِیماً لا یَعْجَلُ یَا جَوَاداً لا یَبْخَلُ یَا صَادِقاً لا یُخْلِفُ یَا وَهَّاباً لا یَمَلُّ یَا قَاهِراً لا یُغْلَبُ یَا عَظِیماً لا یُوصَفُ یَا عَدْلاً لا یَحِیفُ یَا غَنِیّاً لا یَفْتَقِرُ یَا کَبِیراً لا یَصْغُرُ یَا حَافِظاً لا یَغْفُلُ سُبْحَانَکَ یَا لا إِلَهَ إِلا أَنْتَ الْغَوْثَ الْغَوْثَ خَلِّصْنَا مِنَ النَّارِ یَا رَبِّ", fa: "ای بردباری که شتاب نمی‌کنی، ای بخشنده‌ای که بخل نمی‌ورزی، ای راست‌گویی که خلف وعده نمی‌کنی، ای بسیار بخشنده‌ای که ملول نمی‌شوی، ای چیره‌ای که مغلوب نمی‌شوی، ای بزرگی که وصف نمی‌شوی، ای دادگری که ستم نمی‌کنی، ای بی‌نیازی که فقیر نمی‌شوی، ای بزرگی که کوچک نمی‌شوی، ای نگهبانی که غافل نمی‌شوی. منزّهی تو، ای که معبودی جز تو نیست، فریاد رس، فریاد رس، ما را از آتش رهایی بخش، ای پروردگار من." }
  ],
  fazilat: "دعای جوشن کبیر از دعاهای بسیار معروف و پرفضیلت است که صد بند (فراز) دارد و هر بند با ده نام از نام‌های خداوند آغاز می‌شود.\n\nاین دعا را جبرئیل امین بر پیامبر اکرم (ص) در یکی از جنگ‌ها نازل کرد تا ایشان با خواندن آن از بلاها و دشمنان در امان بمانند.\n\nخواندن آن در ماه رمضان، شب‌های قدر، و شب‌های جمعه بسیار سفارش شده است.\n\nاز خواص مهم این دعا: دفع بلا، طلب رحمت، آمرزش گناهان، برآورده شدن حاجات، و نجات از آتش دوزخ.",
  source: "مفاتیح الجنان (شیخ عباس قمی) • بحار الأنوار (علامه مجلسی) • مصباح المتهجد (شیخ طوسی)",
  time: "بهترین زمان خواندن این دعا، ماه مبارک رمضان (به ویژه شب‌های قدر)، شب‌های جمعه و هنگام دفع بلا و گرفتاری است. با وضو و رو به قبله و با قلب حاضر خوانده شود."

/* ============================================================
   RENDER VERSES
   ============================================================ */
function renderVerses() {
  const c = $('#versesContainer');
  c.innerHTML = '';
  DUA_DATA.verses.forEach((v, i) => {
    const el = document.createElement('div');
    el.className = 'verse-card';
    el.innerHTML = `
      <div class="v-head">
        <span class="v-num">${faNum(i + 1)}</span>
        <span class="v-label">بند ${faNum(i + 1)}</span>
      </div>
      <div class="v-ar">${v.ar}</div>
      <div class="v-divider"></div>
      <div class="v-fa">${v.fa}</div>
    `;
    c.appendChild(el);
  });
}

const moonIcon = `<svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  localStorage.setItem('noor_theme', dark ? 'dark' : 'light');
  if ($('#themeToggle')) $('#themeToggle').innerHTML = dark ? sunIcon : moonIcon;
}
applyTheme(localStorage.getItem('noor_theme') === 'dark');
$('#themeToggle').onclick = () => applyTheme(!document.body.classList.contains('dark'));

/* ============================================================
   SETTINGS
   ============================================================ */
let arSize = parseInt(localStorage.getItem('noor_ar_size') || '22');
let faSize = parseInt(localStorage.getItem('noor_fa_size') || '16');
let lineHeight = localStorage.getItem('noor_lh') || '2.3';
let showTrans = localStorage.getItem('noor_trans') !== 'false';
const fontAr = localStorage.getItem('noor_font_ar') || 'amiri';
const fontFa = localStorage.getItem('noor_font_fa') || 'vazir';

document.body.classList.add('font-ar-' + fontAr);
document.body.classList.add('font-fa-' + fontFa);

function applySettings() {
  document.documentElement.style.setProperty('--fs-ar', arSize + 'px');
  document.documentElement.style.setProperty('--fs-fa', faSize + 'px');
  document.documentElement.style.setProperty('--line-height', lineHeight);
  $$('.verse-card').forEach(v => v.classList.toggle('hide-trans', !showTrans));
  if ($('#arSizeVal')) $('#arSizeVal').textContent = faNum(arSize);
  if ($('#faSizeVal')) $('#faSizeVal').textContent = faNum(faSize);
  localStorage.setItem('noor_ar_size', arSize);
  localStorage.setItem('noor_fa_size', faSize);
  localStorage.setItem('noor_lh', lineHeight);
  localStorage.setItem('noor_trans', showTrans);
}
applySettings();

$$('[data-ar-step]').forEach(b => b.onclick = () => {
  arSize = Math.max(14, Math.min(42, arSize + parseInt(b.dataset.arStep) * 2));
  applySettings();
});
$$('[data-fa-step]').forEach(b => b.onclick = () => {
  faSize = Math.max(12, Math.min(24, faSize + parseInt(b.dataset.faStep) * 2));
  applySettings();
});
$$('[data-lh]').forEach(b => {
  if (b.dataset.lh === lineHeight) b.classList.add('active');
  b.onclick = () => {
    $$('[data-lh]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    lineHeight = b.dataset.lh;
    applySettings();
  };
});
$$('[data-trans]').forEach(b => {
  const isOn = (b.dataset.trans === '1') === showTrans;
  b.classList.toggle('active', isOn);
  b.onclick = () => {
    $$('[data-trans]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    showTrans = b.dataset.trans === '1';
    applySettings();
  };
});
$$('[data-font-ar]').forEach(b => {
  if (b.dataset.fontAr === fontAr) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-ar]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-ar-\S+/g, '').trim();
    document.body.classList.add('font-ar-' + b.dataset.fontAr);
    localStorage.setItem('noor_font_ar', b.dataset.fontAr);
  };
});
$$('[data-font-fa]').forEach(b => {
  if (b.dataset.fontFa === fontFa) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-fa]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-fa-\S+/g, '').trim();
    document.body.classList.add('font-fa-' + b.dataset.fontFa);
    localStorage.setItem('noor_font_fa', b.dataset.fontFa);
  };
});

   ============================================================ */
$('#btnBack').onclick = () => {
  if (document.referrer && (document.referrer.includes('list.html') || document.referrer.includes('doa.html'))) history.back();
  else location.href = 'list.html?type=famous';
};

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg) {
  const t = $('#toast');
  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   INIT
   ============================================================ */
renderVerses();
applySettings();

console.log('🤲 دعای جوشن کبیر | NOOR – بارگذاری شد. تعداد بندها:', DUA_DATA.verses.length);
</script>
