<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123C32">
<title>دعای کمیل | نــــور NOOR</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Lateef&family=Reem+Kufi:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F5EE; --surface: #FFFDF8; --surface2: #F1ECE2;
  --brand: #123C32; --brand2: #2D6657;
  --gold: #B88A3B; --gold2: #D6B56A;
  --gold-soft: rgba(184, 138, 59, 0.10);
  --gold-border: rgba(184, 138, 59, 0.20);
  --text: #17231F; --text-2: #3d4a44; --muted: #66716C;
  --divider: #E7E0D3;
  --arabic: #123C32; --translation: #3d4a44;
  --shadow: 0 4px 20px rgba(18, 60, 50, 0.05);
  --shadow-sm: 0 2px 8px rgba(18, 60, 50, 0.03);
  --radius: 16px; --radius-sm: 12px;
  --trans: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font-fa: 'Vazirmatn', Tahoma, sans-serif;
  --font-ar: 'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif;
  --fs-ar: 24px; --fs-fa: 16px; --line-height: 2.3;
}
body.dark {
  --bg: #080E0C; --surface: #101A16; --surface2: #16231E;
  --brand: #9FC5B5; --brand2: #B9D5C8;
  --gold: #D2AC5C; --gold2: #E4C982;
  --gold-soft: rgba(210, 172, 92, 0.08);
  --gold-border: rgba(210, 172, 92, 0.16);
  --text: #F4EFE4; --text-2: #c8d2cc; --muted: #A8B3AD;
  --divider: #26352F;
  --arabic: #e8e2d2; --translation: #c8d2cc;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.20);
}
body.font-ar-amiri { --font-ar: 'Amiri', serif; }
body.font-ar-scheherazade { --font-ar: 'Scheherazade New', serif; }
body.font-ar-naskh { --font-ar: 'Noto Naskh Arabic', serif; }
body.font-ar-lateef { --font-ar: 'Lateef', serif; }
body.font-ar-reem { --font-ar: 'Reem Kufi', sans-serif; }
body.font-fa-vazir { --font-fa: 'Vazirmatn', Tahoma, sans-serif; }
body.font-fa-naskh { --font-fa: 'Noto Naskh Arabic', serif; }
body.font-fa-amiri { --font-fa: 'Amiri', serif; }
body.font-fa-scheherazade { --font-fa: 'Scheherazade New', serif; }
body.font-fa-lateef { --font-fa: 'Lateef', serif; }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font-fa); background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.7; font-size: 16px;
  transition: background var(--trans), color var(--trans);
  overflow-x: hidden;
}
button, input { font-family: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: var(--trans); }
svg { display: block; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-sm { width: 18px; height: 18px; }
.app { max-width: 780px; margin: 0 auto; padding: 0 14px 40px; }

.header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 6px;
  padding: 12px 0; background: var(--bg);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.hbtn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--gold-border);
  color: var(--gold); flex: none;
}
.hbtn:hover { background: var(--gold-soft); border-color: var(--gold); }
.hbtn:active { transform: scale(0.94); }
.brand { flex: 1; text-align: center; line-height: 1.15; min-width: 0; }
.brand h1 {
  font-family: 'Amiri', serif;
  font-size: 1.15rem; font-weight: 700;
  color: var(--brand); letter-spacing: 0.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.dark .brand h1 { color: var(--gold); }
.brand .brand-noor {
  display: block; font-family: 'Amiri', serif;
  font-size: 0.65rem; font-weight: 700;
  color: var(--gold); letter-spacing: 6px;
  margin-top: 3px;
}

.scroll-content {
  max-height: calc(100vh - 90px);
  overflow-y: auto;
  padding: 14px 0 20px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--gold-border) transparent;
}
.scroll-content::-webkit-scrollbar { width: 4px; }
.scroll-content::-webkit-scrollbar-track { background: transparent; }
.scroll-content::-webkit-scrollbar-thumb { background: var(--gold-border); border-radius: 10px; }

.top-orn {
  position: relative; overflow: hidden;
  text-align: center;
  padding: 18px 14px 20px;
  margin-bottom: 14px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--gold-border);
  box-shadow: var(--shadow);
}
.top-orn .orn-svg {
  position: absolute; color: var(--gold); opacity: 0.10; pointer-events: none;
}
.top-orn .orn-svg.tr { top: -6px; right: -6px; width: 80px; height: 80px; }
.top-orn .orn-svg.bl { bottom: -6px; left: -6px; width: 80px; height: 80px; transform: rotate(180deg); }
.top-orn .orn-title {
  font-family: 'Amiri', serif;
  font-size: 1.45rem; font-weight: 700;
  color: var(--brand); letter-spacing: 1px;
  margin-bottom: 3px;
}
body.dark .top-orn .orn-title { color: var(--gold); }
.top-orn .orn-sub { font-size: 0.78rem; color: var(--muted); }
.top-orn .orn-div {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin: 8px auto 0; width: 80px;
}
.top-orn .orn-div::before, .top-orn .orn-div::after {
  content: ""; flex: 1; height: 1px; background: var(--gold-border);
}
.top-orn .orn-div svg { color: var(--gold); width: 12px; height: 12px; }

.verse-card {
  background: var(--surface);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius);
  padding: 16px 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  transition: var(--trans);
  position: relative;
}
.verse-card:hover {
  border-color: var(--gold);
  box-shadow: 0 4px 16px rgba(184, 138, 59, 0.08);
}
.verse-card .v-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.verse-card .v-num {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px; padding: 0 8px;
  border-radius: 7px;
  background: var(--gold-soft); color: var(--gold);
  font-family: 'Amiri', serif; font-weight: 700;
  font-size: 0.72rem;
  border: 1px solid var(--gold-border);
}
.verse-card .v-label {
  font-size: 0.68rem; color: var(--muted);
  font-weight: 600;
}
.verse-card .v-ar {
  font-family: var(--font-ar);
  font-size: var(--fs-ar);
  line-height: var(--line-height);
  color: var(--arabic);
  text-align: center;
  font-weight: 400;
  margin-bottom: 12px;
  padding: 4px 2px;
  white-space: pre-line;
}
.verse-card .v-divider {
  height: 1px;
  background: repeating-linear-gradient(90deg, var(--gold-border) 0, var(--gold-border) 3px, transparent 3px, transparent 6px);
  margin: 0 auto 12px;
  width: 50px;
}
.verse-card .v-fa {
  font-family: var(--font-fa);
  font-size: var(--fs-fa);
  line-height: 1.95;
  color: var(--translation);
  text-align: justify;
  padding: 0 2px;
  white-space: pre-line;
}
.verse-card.hide-trans .v-fa { display: none; }
.verse-card.hide-trans .v-divider { display: none; }
.verse-card.hide-trans .v-ar { margin-bottom: 0; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 200; padding: 0 12px 12px;
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 520px; max-height: 85vh;
  overflow-y: auto; background: var(--surface);
  border-radius: 24px 24px 18px 18px;
  padding: 20px 18px 26px;
  border: 1px solid var(--gold-border);
  animation: slideUp 0.3s ease;
  box-shadow: var(--shadow);
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--divider);
}
.modal-head h3 {
  font-size: 1rem; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  color: var(--text);
}
.modal-head h3 svg { color: var(--gold); width: 20px; height: 20px; flex: none; }
.modal-close {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--muted);
}
.modal-close:hover { color: var(--gold); border-color: var(--gold); }

.set-group { margin-bottom: 16px; }
.set-group > label {
  display: block; font-size: 0.75rem; font-weight: 700;
  color: var(--muted); margin-bottom: 8px;
}
.set-options { display: flex; flex-wrap: wrap; gap: 6px; }
.set-opt {
  padding: 6px 12px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--divider);
  color: var(--text-2); font-size: 0.75rem;
  font-weight: 600; cursor: pointer; transition: var(--trans);
}
.set-opt:hover { border-color: var(--gold-border); color: var(--gold); }
.set-opt.active { background: var(--gold-soft); color: var(--gold); border-color: var(--gold); }
.set-ctrl {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--divider);
  border-radius: 10px; padding: 4px; width: fit-content;
}
.set-ctrl button {
  width: 34px; height: 34px; border-radius: 8px;
  color: var(--muted); font-weight: 700; font-size: 1rem;
}
.set-ctrl button:hover { background: var(--gold-soft); color: var(--gold); }
.set-ctrl .val {
  min-width: 40px; text-align: center;
  color: var(--gold); font-weight: 700; font-size: 0.82rem;
}
.font-preview { font-family: 'Amiri', serif; font-size: 1.1rem; }

.info-block {
  padding: 14px 16px;
  background: var(--surface2);
  border: 1px solid var(--gold-border);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
}
.info-block h4 {
  font-size: 0.8rem; font-weight: 700;
  color: var(--gold); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.info-block h4 svg { width: 16px; height: 16px; flex: none; }
.info-block p {
  font-size: 0.8rem; line-height: 1.95;
  color: var(--text-2); text-align: justify;
  white-space: pre-line;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-around; align-items: center;
  background: var(--surface); border-top: 1px solid var(--divider);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  height: 62px;
  box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.06);
}
body.dark .bottom-nav { box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.4); }
.nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; flex: 1; padding: 6px 4px; border-radius: 12px; color: var(--muted);
  transition: var(--trans); font-size: 0.6rem; font-weight: 500;
  text-decoration: none; background: none; border: 0; cursor: pointer;
}
.nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover, .nav-btn.active { color: var(--gold); }

.toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--brand); color: #fff;
  padding: 10px 18px; border-radius: 14px;
  font-size: 0.8rem; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 300; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--gold-border); max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { color: var(--gold2); width: 16px; height: 16px; }

.app { padding-bottom: 80px; }

@media (max-width: 480px) {
  .brand h1 { font-size: 1rem; }
  :root { --fs-ar: 22px; --fs-fa: 15px; }
  .hbtn { width: 36px; height: 36px; }
  .hbtn .icon { width: 18px; height: 18px; }
  .verse-card { padding: 14px 12px; }
  .top-orn .orn-title { font-size: 1.25rem; }
}
</style>
</head>

    <div id="versesContainer"></div>

</div>

    <div class="set-group">
      <label>فونت متن عربی</label>
      <div class="set-options">
        <div class="set-opt" data-font-ar="amiri"><span class="font-preview">بِسْمِ اللَّه</span></div>

    { ar: "فَلَكَ الْحَمْدُ عَلَيَّ فِي جَمِيعِ ذَلِكَ وَ لاَ حُجَّةَ لِي فِيمَا جَرَى عَلَيَّ فِيهِ قَضَاؤُكَ وَ أَلْزَمَنِي حُكْمُكَ وَ بَلاَؤُكَ", fa: "پس تو را در همه اینها ستایش است، و در آنچه قضایت بر من جاری کرده و حکم و بلایت بر من لازم ساخته، برای من هیچ حجتی نیست" },
    { ar: "وَ قَدْ أَتَيْتُكَ يَا إِلَهِي بَعْدَ تَقْصِيرِي وَ إِسْرَافِي عَلَى نَفْسِي مُعْتَذِراً نَادِماً مُنْكَسِراً مُسْتَقِيلاً مُسْتَغْفِراً مُنِيباً مُقِرّاً مُذْعِناً مُعْتَرِفاً لاَ أَجِدُ مَفَرّاً مِمَّا كَانَ مِنِّي وَ لاَ مَفْزَعاً أَتَوَجَّهُ إِلَيْهِ فِي أَمْرِي غَيْرَ قَبُولِكَ عُذْرِي وَ إِدْخَالِكَ إِيَّايَ فِي سَعَةِ رَحْمَتِكَ", fa: "و همانا به درگاهت آمده‌ام، ای خدای من، پس از کوتاهی و اسراف بر خود، درحالی که عذر خواه و پشیمان و شکسته‌دل و خواهان گذشت و آمرزش و توبه‌کار و معترف و اقرارکننده‌ام، و برای آنچه از من سرزده، گریزی نمی‌یابم، و پناهی که در کارم به آن رو آورم، جز پذیرش عذرم و داخل کردنم در گستره رحمتت، نمی‌شناسم" },
    { ar: "اللَّهُمَّ فَاقْبَلْ عُذْرِي وَ ارْحَمْ شِدَّةَ ضُرِّي وَ فُكَّنِي مِنْ شَدِّ وَثَاقِي يَا رَبِّ ارْحَمْ ضَعْفَ بَدَنِي وَ رِقَّةَ جِلْدِي وَ دِقَّةَ عَظْمِي", fa: "خدایا! پس عذرم را بپذیر، و به سختی گرفتاری‌ام رحم کن، و مرا از بندهایم رها ساز، ای پروردگارم! به ضعف بدنم و نازکی پوست و استخوان‌هایم رحم کن" },
    { ar: "يَا مَنْ بَدَأَ خَلْقِي وَ ذِكْرِي وَ تَرْبِيَتِي وَ بِرِّي وَ تَغْذِيَتِي هَبْنِي لاِبْتِدَاءِ كَرَمِكَ وَ سَالِفِ بِرِّكَ بِي", fa: "ای کسی که آفرینش و یاد و تربیت و نیکی و پرورش مرا آغاز کردی، مرا به کرم آغازینت و نیکی گذشته‌ات به من ببخش" },
    { ar: "يَا إِلَهِي وَ سَيِّدِي وَ رَبِّي أَ تُرَاكَ مُعَذِّبِي بِنَارِكَ بَعْدَ تَوْحِيدِكَ وَ بَعْدَ مَا انْطَوَى عَلَيْهِ قَلْبِي مِنْ مَعْرِفَتِكَ وَ لَهِجَ بِهِ لِسَانِي مِنْ ذِكْرِكَ وَ اعْتَقَدَهُ ضَمِيرِي مِنْ حُبِّكَ وَ بَعْدَ صِدْقِ اعْتِرَافِي وَ دُعَائِي خَاضِعاً لِرُبُوبِيَّتِكَ", fa: "ای خدای من و آقای من و پروردگار من! آیا مرا به آتش خود عذاب می‌کنی، پس از آنکه تو را یکتا دانستم، و پس از آنکه دلم بر معرفتت گواهی داد، و زبانم به ذکرت گویا شد، و وجدانم به محبتت معتقد گشت، و پس از آنکه به راستی به یگانگی اعتراف کردم و با فروتنی در برابر پروردگاریت دعا نمودم؟" },
    { ar: "هَيْهَاتَ أَنْتَ أَكْرَمُ مِنْ أَنْ تُضَيِّعَ مَنْ رَبَّيْتَهُ أَوْ تُبْعِدَ مَنْ أَدْنَيْتَهُ أَوْ تُشَرِّدَ مَنْ آوَيْتَهُ أَوْ تُسَلِّمَ إِلَى الْبَلاَءِ مَنْ كَفَيْتَهُ وَ رَحِمْتَهُ", fa: "هرگز! تو کریم‌تر از آنی که کسی را که پرورده‌ای، تباه کنی، یا کسی را که نزدیک کرده‌ای، دور سازی، یا کسی را که پناه داده‌ای، پراکنده کنی، یا کسی را که بسنده کرده و رحمتش نموده‌ای، به بلا بسپاری" },
    { ar: "وَ لَيْتَ شِعْرِي يَا سَيِّدِي وَ إِلَهِي وَ مَوْلاَيَ أَ تُسَلِّطُ النَّارَ عَلَى وُجُوهٍ خَرَّتْ لِعَظَمَتِكَ سَاجِدَةً وَ عَلَى أَلْسُنٍ نَطَقَتْ بِتَوْحِيدِكَ صَادِقَةً وَ بِشُكْرِكَ مَادِحَةً وَ عَلَى قُلُوبٍ اعْتَرَفَتْ بِإِلَهِيَّتِكَ مُحَقِّقَةً وَ عَلَى ضَمَائِرَ حَوَتْ مِنَ الْعِلْمِ بِكَ حَتَّى صَارَتْ خَاشِعَةً وَ عَلَى جَوَارِحَ سَعَتْ إِلَى أَوْطَانِ تَعَبُّدِكَ طَائِعَةً وَ أَشَارَتْ بِاسْتِغْفَارِكَ مُذْعِنَةً", fa: "و کاش می‌دانستم، ای آقای من و خدای من و مولای من! آیا آتش را بر چهره‌هایی که برای عظمتت به سجده افتادند، و بر زبان‌هایی که به راستی به یگانگی‌ات گویا شدند و به سپاست ستایشگر بودند، و بر دل‌هایی که به درستی به خدایی‌ات اعتراف کردند، و بر وجدان‌هایی که از علم به تو برخوردار شدند تا آنکه خاشع گشتند، و بر اندام‌هایی که به سوی عبادتگاه‌هایت با طاعت شتافتند و با اذعان به آمرزشت اشاره کردند، مسلط خواهی ساخت؟" },
    { ar: "مَا هَكَذَا الظَّنُّ بِكَ وَ لاَ أُخْبِرْنَا بِفَضْلِكَ عَنْكَ يَا كَرِيمُ يَا رَبِ", fa: "این گمان به تو نیست، و فضل تو درباره خودت چنین به ما خبر نداده، ای کریم، ای پروردگار من!" },
    { ar: "وَ أَنْتَ تَعْلَمُ ضَعْفِي عَنْ قَلِيلٍ مِنْ بَلاَءِ الدُّنْيَا وَ عُقُوبَاتِهَا وَ مَا يَجْرِي فِيهَا مِنَ الْمَكَارِهِ عَلَى أَهْلِهَا عَلَى أَنَّ ذَلِكَ بَلاَءٌ وَ مَكْرُوهٌ قَلِيلٌ مَكْثُهُ يَسِيرٌ بَقَاؤُهُ قَصِيرٌ مُدَّتُهُ، فَكَيْفَ احْتِمَالِي لِبَلاَءِ الْآخِرَةِ وَ جَلِيلِ وُقُوعِ الْمَكَارِهِ فِيهَا وَ هُوَ بَلاَءٌ تَطُولُ مُدَّتُهُ وَ يَدُومُ مَقَامُهُ وَ لاَ يُخَفَّفُ عَنْ أَهْلِهِ لِأَنَّهُ لاَ يَكُونُ إِلاَّ عَنْ غَضَبِكَ وَ انْتِقَامِكَ وَ سَخَطِكَ وَ هَذَا مَا لاَ تَقُومُ لَهُ السَّمَاوَاتُ وَالْأَرْضُ", fa: "و تو خود می‌دانی که من از اندکی از بلاهای دنیا و کیفرهای آن و ناخوشی‌هایی که بر اهلش می‌گذرد، ناتوانم، با اینکه آن بلا و ناخوشی، اندک ماندن و کوتاه باقی ماندن و ناچیز مدت دارد، پس چگونه می‌توانم بلاهای آخرت و سختی‌های بزرگ آن را تحمل کنم، در حالی که آن بلا، طولانی‌مدت و پایدار است و از اهلش تخفیف نمی‌یابد، زیرا جز از خشم و انتقام و غضب تو نیست، و این چیزی است که آسمان‌ها و زمین تاب آن را ندارند" },
    { ar: "يَا سَيِّدِي فَكَيْفَ لِي وَ أَنَا عَبْدُكَ الضَّعِيفُ الذَّلِيلُ الْحَقِيرُ الْمِسْكِينُ الْمُسْتَكِينُ", fa: "ای آقای من! پس حال من چگونه خواهد بود، در حالی که من بنده ضعیف و خوار و حقیر و بینوا و زبون تو هستم؟" },
    { ar: "يَا إِلَهِي وَ رَبِّي وَ سَيِّدِي وَ مَوْلاَيَ لِأَيِّ الْأُمُورِ إِلَيْكَ أَشْكُو وَ لِمَا مِنْهَا أَضِجُّ وَ أَبْكِي لِأَلِيمِ الْعَذَابِ وَ شِدَّتِهِ أَمْ لِطُولِ الْبَلاَءِ وَ مُدَّتِهِ", fa: "ای خدای من و پروردگارم و آقایم و مولایم! برای کدام یک از کارها به تو شکایت کنم و برای کدام یک ناله و گریه نمایم؟ برای دردناکی عذاب و سختی آن، یا برای طولانی بودن بلا و مدتش؟" },
    { ar: "فَلَئِنْ صَيَّرْتَنِي لِلْعُقُوبَاتِ مَعَ أَعْدَائِكَ وَ جَمَعْتَ بَيْنِي وَ بَيْنَ أَهْلِ بَلاَئِكَ وَ فَرَّقْتَ بَيْنِي وَ بَيْنَ أَحِبَّائِكَ وَ أَوْلِيَائِكَ فَهَبْنِي يَا إِلَهِي وَ سَيِّدِي وَ مَوْلاَيَ وَ رَبِّي صَبَرْتُ عَلَى عَذَابِكَ فَكَيْفَ أَصْبِرُ عَلَى فِرَاقِكَ", fa: "پس اگر مرا برای کیفرها با دشمنانت همراه سازی و میان من و اهل بلایت جمع کنی، و میان من و دوستان و اولیایت جدایی افکنی، پس فرض کن، ای خدای من و آقای من و مولای من و پروردگار من، که بر عذابت صبر کردم، پس چگونه بر دوری از تو صبر کنم؟" },
    { ar: "وَ هَبْنِي صَبَرْتُ عَلَى حَرِّ نَارِكَ فَكَيْفَ أَصْبِرُ عَنِ النَّظَرِ إِلَى كَرَامَتِكَ أَمْ كَيْفَ أَسْكُنُ فِي النَّارِ وَ رَجَائِي عَفْوُكَ", fa: "و فرض کن که بر گرمی آتش تو صبر کردم، پس چگونه بر ندیدن کرامتت صبر کنم؟ یا چگونه در آتش ساکن شوم، در حالی که امیدم به عفو و گذشت توست؟" },
    { ar: "فَبِعِزَّتِكَ يَا سَيِّدِي وَ مَوْلاَيَ أُقْسِمُ صَادِقاً لَئِنْ تَرَكْتَنِي نَاطِقاً لَأَضِجَّنَّ إِلَيْكَ بَيْنَ أَهْلِهَا ضَجِيجَ الْآمِلِينَ وَ لَأَصْرُخَنَّ إِلَيْكَ صُرَاخَ الْمُسْتَصْرِخِينَ وَ لَأَبْكِيَنَّ عَلَيْكَ بُكَاءَ الْفَاقِدِينَ وَ لَأُنَادِيَنَّكَ أَيْنَ كُنْتَ يَا وَلِيَّ الْمُؤْمِنِينَ", fa: "پس به عزتت سوگند، ای آقای من و مولای من، سوگند راستین، که اگر مرا گویا رها کنی، در میان اهل آتش چنان ناله‌ای به درگاهت برآورم که ناله امیدواران، و چنان فریاد کنم که فریاد فریادخواهان، و چنان بر تو بگریم که گریه از دست‌دادگان، و تو را ندا دهم که کجایی ای ولی مؤمنان؟" },
    { ar: "يَا غَايَةَ آمَالِ الْعَارِفِينَ يَا غِيَاثَ الْمُسْتَغِيثِينَ يَا حَبِيبَ قُلُوبِ الصَّادِقِينَ وَ يَا إِلَهَ الْعَالَمِينَ", fa: "ای نهایت آرزوی عارفان، ای فریادرس فریادخواهان، ای حبیب دل‌های راستگویان، و ای معبود جهانیان!" },
    { ar: "فَتُرَاكَ سُبْحَانَكَ يَا إِلَهِي وَ بِحَمْدِكَ تَسْمَعُ فِيهَا صَوْتَ عَبْدٍ مُسْلِمٍ سُجِنَ فِيهَا بِمُخَالَفَتِهِ وَ ذَاقَ طَعْمَ عَذَابِهَا بِمَعْصِيَتِهِ وَ حُبِسَ بَيْنَ أَطْبَاقِهَا بِجُرْمِهِ وَ جَرِيرَتِهِ وَ هُوَ يَضِجُّ إِلَيْكَ ضَجِيجَ مُؤَمِّلٍ لِرَحْمَتِكَ وَ يُنَادِيكَ بِلِسَانِ أَهْلِ تَوْحِيدِكَ وَ يَتَوَسَّلُ إِلَيْكَ بِرُبُوبِيَّتِكَ", fa: "پس آیا (ای پاک و منزّه، ای خدای من و سپاس تو را) در آن (آتش) صدای بنده مسلمانی را می‌شنوی که به خاطر مخالفتش در آن زندانی شده، و به سبب نافرمانی‌اش طعم عذابش را چشیده، و به جرم و گناهش میان طبقات آن حبس گشته، و او به درگاهت ناله می‌کند، ناله امیدوار به رحمتت، و به زبان اهل توحیدت تو را ندا می‌دهد، و به پروردگاریت به تو توسل می‌جوید؟" },
    { ar: "يَا مَوْلاَيَ فَكَيْفَ يَبْقَى فِي الْعَذَابِ وَ هُوَ يَرْجُو مَا سَلَفَ مِنْ حِلْمِكَ أَمْ كَيْفَ تُؤْلِمُهُ النَّارُ وَ هُوَ يَأْمُلُ فَضْلَكَ وَ رَحْمَتَكَ أَمْ كَيْفَ يُحْرِقُهُ لَهِيبُهَا وَ أَنْتَ تَسْمَعُ صَوْتَهُ وَ تَرَى مَكَانَهُ", fa: "ای مولای من! پس چگونه در عذاب بماند، در حالی که به گذشته حلمت امید دارد؟ یا چگونه آتش او را می‌آزارد، در حالی که به فضل و رحمتت امید دارد؟ یا چگونه شعله‌هایش او را می‌سوزاند، در حالی که تو صدایش را می‌شنوی و جایگاهش را می‌بینی؟" },
    { ar: "أَمْ كَيْفَ يَشْتَمِلُ عَلَيْهِ زَفِيرُهَا وَ أَنْتَ تَعْلَمُ ضَعْفَهُ أَمْ كَيْفَ يَتَقَلْقَلُ بَيْنَ أَطْبَاقِهَا وَ أَنْتَ تَعْلَمُ صِدْقَهُ أَمْ كَيْفَ تَزْجُرُهُ زَبَانِيَتُهَا وَ هُوَ يُنَادِيكَ يَا رَبَّهْ أَمْ كَيْفَ يَرْجُو فَضْلَكَ فِي عِتْقِهِ مِنْهَا فَتَتْرُكُهُ فِيهَا", fa: "یا چگونه آتش بر او چیره شود، در حالی که تو ناتوانی او را می‌دانی؟ یا چگونه میان طبقات آن به خود می‌پیچد، در حالی که تو راستی او را می‌دانی؟ یا چگونه نگهبانان آن او را می‌رانند، در حالی که او تو را ندا می‌دهد: ای پروردگار من؟ یا چگونه به فضلت برای آزادی از آن امید بندد، اما تو او را در آن رها کنی؟" },
    { ar: "هَيْهَاتَ مَا ذَلِكَ الظَّنُّ بِكَ وَ لاَ الْمَعْرُوفُ مِنْ فَضْلِكَ وَ لاَ مُشْبِهٌ لِمَا عَامَلْتَ بِهِ الْمُوَحِّدِينَ مِنْ بِرِّكَ وَ إِحْسَانِكَ", fa: "هرگز! این گمان به تو نیست، و از فضل تو شناخته نشده، و با نیکی و احسانت به موحّدان، شباهتی ندارد" },
    { ar: "فَبِالْيَقِينِ أَقْطَعُ لَوْ لاَ مَا حَكَمْتَ بِهِ مِنْ تَعْذِيبِ جَاحِدِيكَ وَ قَضَيْتَ بِهِ مِنْ إِخْلاَدِ مُعَانِدِيكَ لَجَعَلْتَ النَّارَ كُلَّهَا بَرْداً وَ سَلاَماً وَ مَا كَانَ لِأَحَدٍ فِيهَا مَقَرّاً وَ لاَ مُقَاماً لَكِنَّكَ تَقَدَّسَتْ أَسْمَاؤُكَ أَقْسَمْتَ أَنْ تَمْلَأَهَا مِنَ الْكَافِرِينَ مِنَ الْجِنَّةِ وَ النَّاسِ أَجْمَعِينَ وَ أَنْ تُخَلِّدَ فِيهَا الْمُعَانِدِينَ", fa: "پس به یقین حکم می‌کنم که اگر آنچه در عذاب منکرانت مقرر داشتی و در جاودانگی دشمنانت حکم کردی نبود، همه آتش را سرد و سلامت می‌کردی و کسی را در آن قرارگاه و جایگاهی نبود. ولی تو، نام‌هایت منزّه است، سوگند خوردی که آن را از کافران، از جن و انس همگی، پر کنی، و دشمنانت را در آن جاودان گردانی" },
    { ar: "وَ أَنْتَ جَلَّ ثَنَاؤُكَ قُلْتَ مُبْتَدِئاً وَ تَطَوَّلْتَ بِالْإِنْعَامِ مُتَكَرِّماً اَفَمَنْ كانَ مُؤْمِناً كَمَنْ كانَ فاسِقاً لا يَسْتَوُونَ", fa: "و تو، ستایشت بزرگ است، در آغاز (آفرینش) فرمودی و با انعام خود، تکرّماً بخشیدی: «آیا کسی که مؤمن است، مانند کسی است که فاسق است؟ آنان برابر نیستند»" },
    { ar: "اِلهى وَ سَيِّدى فَاَسْئَلُكَ بِالْقُدْرَةِ الَّتى قَدَّرْتَها وَ بِالْقَضِيَّةِ الَّتى حَتَمْتَها وَ حَكَمْتَها وَ غَلَبْتَ مَنْ عَلَيْهِ اَجْرَيْتَها اَنْ تَهَبَ لى فى هذِهِ اللَّيْلَةِ وَ فى هذِهِ السّاعَةِ كُلَّ جُرْمٍ اَجْرَمْتُهُ وَ كُلَّ ذَنْبٍ اَذْنَبْتُهُ وَ كُلَّ قَبِيحٍ اَسْرَرْتُهُ وَ كُلَّ جَهْلٍ عَمِلْتُهُ كَتَمْتُهُ اَوْ اَعْلَنْتُهُ اَخْفَيْتُهُ اَوْ اَظْهَرْتُهُ وَ كُلَّ سَيِّئَةٍ اَمَرْتَ بِاِثْباتِهَا الْكِرامَ الْكاتِبينَ الَّذينَ وَكَّلْتَهُمْ بِحِفْظِ ما يَكُونُ مِنّى وَجَعَلْتَهُمْ شُهُوداً عَلَىَّ مَعَ جَوارِحى وَ كُنْتَ اَنْتَ الرَّقيبَ عَلَىَّ مِنْ وَراَّئِهِمْ وَالشّاهِدَ لِما خَفىَ عَنْهُمْ وَ بِرَحْمَتِكَ اَخْفَيْتَهُ وَ بِفَضْلِكَ سَتَرْتَهُ", fa: "خدای من و آقای من! پس از تو به قدرتی که مقدّر فرمودی، و به قضیه‌ای که حتمی و حکم کردی و هر که را بر او جاری ساختی، مغلوب نمودی، می‌خواهم که در این شب و در این ساعت، هر جرمی که مرتکب شده‌ام و هر گناهی که کرده‌ام و هر زشتی که پنهان داشته‌ام و هر نادانی که کرده و پنهان یا آشکارش ساخته‌ام، و هر بدی که فرشتگان بزرگوار نویسنده را به ثبت آن امر کردی، آنان که بر حفظ آنچه از من سر می‌زند، گماشتی و آنان را همراه با اعضایم بر من گواه ساختی، و تو خود از پس آنها مراقب من بودی و بر آنچه از آنان پنهان بود، شاهد بودی و به رحمتت آن را پنهان و به فضلت آن را پوشاندی، را بر من ببخشی" },
    { ar: "وَ اَنْ تُوَفِّرَ حَظّى مِنْ كُلِّ خَيْرٍ اَنْزَلْتَهُ اَوْ اِحْسانٍ فَضَّلْتَهُ اَوْ بِرٍّ نَشَرْتَهُ اَوْ رِزْقٍ بَسَطْتَهُ اَوْ ذَنْبٍ تَغْفِرُهُ اَوْ خَطاءٍ تَسْتُرُهُ يا رَبِّ يا رَبِّ يا رَبِّ", fa: "و اینکه بهره‌ام را از هر خیری که نازل کرده‌ای، یا احسانی که برتری داده‌ای، یا نیکی که گسترده‌ای، یا روزی که گسترانیده‌ای، یا گناهی که می‌آمرزی، یا خطایی که می‌پوشانی، فراوان گردانی، ای پروردگارم، ای پروردگارم، ای پروردگارم" },
    { ar: "اِلهى وَ سَيِّدى وَ مَوْلاىَ وَ مالِكَ رِقّى يا مَنْ بِيَدِهِ ناصِيَتى يا عَليماً بِضُرّى وَ مَسْكَنَتى يا خَبيراً بِفَقْرى وَ فاقَتى يا رَبِّ يا رَبِّ يا رَبِّ", fa: "خدای من و آقای من و مولای من و صاحب اختیار من، ای کسی که سررشته‌ام به دست اوست، ای آگاه به گرفتاری و بیچارگی‌ام، ای دانا به فقر و نیازم، ای پروردگارم، ای پروردگارم، ای پروردگارم" },
    { ar: "اَسْئَلُكَ بِحَقِّكَ وَ قُدْسِكَ وَ اَعْظَمِ صِفاتِكَ وَ اَسْماَّئِكَ اَنْ تَجْعَلَ اَوْقاتى مِنَ اللَّيْلِ وَالنَّهارِ بِذِكْرِكَ مَعْمُورَةً وَ بِخِدْمَتِكَ مَوْصُولَةً وَ اَعْمالى عِنْدَكَ مَقْبُولَةً حَتّى تَكُونَ اَعْمالى وَ اَوْرادى كُلُّها وِرْداً واحِداً وَ حالى فى خِدْمَتِكَ سَرْمَداً", fa: "از تو به حقت و قدس و بزرگترین صفات و نام‌هایت می‌خواهم که اوقاتم را در شب و روز به ذکرت آباد، و به خدمتت متصل، و اعمال مرا نزد خودت پذیرفته گردانی، تا آنکه همه کارها و اذکارم یکسان و حال من در خدمتت همیشگی باشد" },
    { ar: "يا سَيِّدى يا مَنْ عَلَيْهِ مُعَوَّلى يا مَنْ اِلَيْهِ شَكَوْتُ اَحْوالى يا رَبِّ يا رَبِّ يا رَبِّ قَوِّ عَلى خِدْمَتِكَ جَوارِحى وَاشْدُدْ عَلَى الْعَزيمَةِ جَوانِحى وَ هَبْ لِىَ الْجِدَّ فى خَشْيَتِكَ وَالدَّوامَ فِى الاِْتِّصالِ بِخِدْمَتِكَ", fa: "ای آقای من، ای کسی که پناه من بر اوست، ای کسی که احوالم را به او شکایت کرده‌ام، ای پروردگارم، ای پروردگارم، ای پروردگارم! بر خدمتت، اعضایم را نیرو بخش، و بر عزم و اراده‌ام، قلبم را استوار گردان، و جدیت در خوف از خودت و دوام در پیوستن به خدمتت را به من عطا کن" },
    { ar: "حَتّى اَسْرَحَ اِلَيْكَ فى مَيادينِ السّابِقينَ اُسْرِعَ اِلَيْكَ فِى الْبارِزينَ وَ اَشْتاقَ اِلى قُرْبِكَ فِى الْمُشْتاقينَ وَ اَدْنُوَ مِنْكَ دُنُوَّ الْمُخْلِصينَ وَ اَخافَكَ مَخافَةَ الْمُوقِنينَ وَ اَجْتَمِعَ فى جِوارِكَ مَعَ الْمُؤْمِنينَ", fa: "تا به سوی تو در میدان سبقت‌گیرندگان بشتابم، و در میان پیشگامان به سوی تو شتاب کنم، و در میان مشتاقان به قربت اشتیاق یابم، و چون مخلصان به تو نزدیک شوم، و چون یقین‌داران از تو بترسم، و در جوارت با مؤمنان گرد آیم" },
    { ar: "اَللّهُمَّ وَ مَنْ اَرادَنى بِسُوَّءٍ فَاَرِدْهُ وَ مَنْ كادَنى فَكِدْهُ وَاجْعَلْنى مِنْ اَحْسَنِ عَبيدِكَ نَصيباً عِنْدَكَ وَ اَقْرَبِهِمْ مَنْزِلَةً مِنْكَ وَ اَخَصِّهِمْ زُلْفَةً لَدَيْكَ فَاِنَّهُ لا يُنالُ ذلِكَ اِلاّ بِفَضْلِكَ وَ جُدْلى بِجُودِكَ وَاعْطِفْ عَلَىَّ بِمَجْدِكَ وَاحْفَظْنى بِرَحْمَتِكَ وَاجْعَلْ لِسانى بِذِكْرِكَ لَهِجاً وَ قَلْبى بِحُبِّكَ مُتَيَّماً وَ مُنَّ عَلَىَّ بِحُسْنِ اِجابَتِكَ وَ اَقِلْنى عَثْرَتى وَاغْفِرْ زَلَّتى فَاِنَّكَ قَضَيْتَ عَلى عِبادِكَ بِعِبادَتِكَ وَ اَمَرْتَهُمْ بِدُعاَّئِكَ وَ ضَمِنْتَ لَهُمُ الاِْجابَةَ", fa: "خدایا! هر که مرا به بدی خواهد، تو به او بدی رسان، و هر که به من نیرنگ کند، تو به او نیرنگ کن، و مرا از بهترین بندگانت از نظر بهره‌ات نزد خود، و نزدیک‌ترین آنان از نظر منزلت به خود، و خاص‌ترین آنان از نظر قرب درگاهت قرار ده، که آن جز به فضل تو به دست نمی‌آید، و به جود خود بر من ببخش، و با مجد خود به من توجه کن، و به رحمتت نگاهم دار، و زبانم را به ذکرت گویا، و دلم را به محبتت شیدا گردان، و به نیکی اجابتت بر من منت بگذار، و از لغزشم درگذر و خطایم را بیامرز، که تو بر بندگانت عبادت را مقرر داشتی و به دعا کردن امرشان کردی و اجابت را برایشان تضمین نمودی" },
    { ar: "فَاِلَيْكَ يا رَبِّ نَصَبْتُ وَجْهى وَ اِلَيْكَ يا رَبِّ مَدَدْتُ يَدى فَبِعِزَّتِكَ اسْتَجِبْ لى دُعاَّئى وَ بَلِّغْنى مُناىَ وَ لا تَقْطَعْ مِنْ فَضْلِكَ رَجاَّئى وَاكْفِنى شَرَّ الْجِنِّ وَالاِْنْسِ مِنْ اَعْدآئى", fa: "پس به سوی تو، ای پروردگارم، روی آوردم، و به سوی تو، ای پروردگارم، دستم را دراز کردم، پس به عزتت دعایم را مستجاب فرما، و به آرزویم برسان، و امیدم را از فضلت قطع مکن، و مرا از شر جن و انس از دشمنانم کفایت کن" },
    { ar: "يا سَريعَ الرِّضا اِغْفِرْ لِمَنْ لا يَمْلِكُ اِلا الدُّعاَّءَ فَاِنَّكَ فَعّالٌ لِما تَشاَّءُ يا مَنِ اسْمُهُ دَوآءٌ وَ ذِكْرُهُ شِفاَّءٌ وَ طاعَتُهُ غِنىً اِرْحَمْ مَنْ رَأسُ مالِهِ الرَّجاَّءُ وَ سِلاحُهُ الْبُكاَّءُ", fa: "ای سریع‌الرضا، کسی را که جز دعا چیزی در اختیار ندارد، بیامرز، که تو هر چه خواهی انجام دهنده‌ای، ای کسی که نامش داروست و ذکرش شفاست و طاعتش بی‌نیازی است، رحم کن بر کسی که سرمایه‌اش امید و سلاحش گریه است" },
    { ar: "يا سابِغَ النِّعَمِ يا دافِعَ النِّقَمِ يا نُورَ الْمُسْتَوْحِشينَ فِى الظُّلَمِ يا عالِماً لا يُعَلَّمُ صَلِّ عَلى مُحَمَّدٍ وَآلِ مُحَمَّدٍ وَافْعَلْ بى ما اَنْتَ اَهْلُهُ", fa: "ای تمام‌کننده نعمت‌ها، ای دفع‌کننده بدی‌ها، ای نور وحشت‌زدگان در تاریکی‌ها، ای دانایی که تعلیم نمی‌پذیری، بر محمد و خاندان محمد درود فرست، و با من چنان کن که شایسته توست" },
    { ar: "وَ صَلَّى اللّهُ عَلى رَسُولِهِ وَالاْئِمَّةِ الْمَيامينَ مِنْ الِهِ وَ سَلَّمَ تَسْليماً كَثيراً", fa: "و درود خدا بر فرستاده‌اش و بر امامان میمون از خاندانش باد، و سلام فراوان بر او باد" }
  ],
  fazilat: "خواندن دعای کمیل در شب‌های جمعه و شب نیمه شعبان بسیار سفارش شده است.\n\nاین دعا را حضرت علی (ع) به کمیل بن زیاد آموختند و فرمودند که آن را در هر شب جمعه یا در هر ماه یک بار یا در هر سال یک بار بخواند.\n\nاین دعا برای طلب آمرزش گناهان، دفع بلاها، رفع گرفتاری‌ها و حاجت‌روایی بسیار مؤثر است و به «دعای خضر» نیز معروف است.\n\nامام صادق (ع) فرمودند: «هر کس دعای کمیل را در شب جمعه بخواند، خداوند گناهان او را می‌آمرزد و او را از عذاب قبر ایمن می‌سازد.»\n\nاز خواص مهم این دعا: آمرزش گناهان، دفع بلاها، رفع گرفتاری‌ها، ایمنی از عذاب قبر، و برآورده شدن حاجات.",
  source: "مفاتیح الجنان (شیخ عباس قمی) • بحار الأنوار (علامه مجلسی) • مصباح المتهجد (شیخ طوسی)",
  time: "بهترین زمان خواندن این دعا، شب‌های جمعه است. همچنین در شب نیمه شعبان و در هر زمان برای طلب آمرزش گناهان و رفع گرفتاری‌ها خوانده می‌شود. با وضو و رو به قبله و با قلب حاضر خوانده شود."

/* ============================================================
   RENDER VERSES
   ============================================================ */
function renderVerses() {
  const c = $('#versesContainer');
  c.innerHTML = '';
  DUA_DATA.verses.forEach((v, i) => {
    const el = document.createElement('div');
    el.className = 'verse-card';
    el.innerHTML = `
      <div class="v-head">
        <span class="v-num">${faNum(i + 1)}</span>
        <span class="v-label">بند ${faNum(i + 1)}</span>
      </div>
      <div class="v-ar">${v.ar}</div>
      <div class="v-divider"></div>
      <div class="v-fa">${v.fa}</div>
    `;
    c.appendChild(el);
  });
}

   ============================================================ */
$('#modalFazilat').textContent = DUA_DATA.fazilat;
$('#modalSource').textContent = DUA_DATA.source;
$('#modalTime').textContent = DUA_DATA.time;

$('#btnInfo').onclick = () => $('#modalInfo').classList.add('show');
$('#btnSettings').onclick = () => $('#modalSettings').classList.add('show');

$$('[data-close]').forEach(b => b.onclick = () => $('#' + b.dataset.close).classList.remove('show'));
$$('.modal-bg').forEach(m => m.onclick = (e) => { if (e.target === m) m.classList.remove('show'); });

/* ============================================================
   THEME
   ============================================================ */
const sunIcon = `<svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
const moonIcon = `<svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  localStorage.setItem('noor_theme', dark ? 'dark' : 'light');
  if ($('#themeToggle')) $('#themeToggle').innerHTML = dark ? sunIcon : moonIcon;
}
applyTheme(localStorage.getItem('noor_theme') === 'dark');
$('#themeToggle').onclick = () => applyTheme(!document.body.classList.contains('dark'));

/* ============================================================
   SETTINGS
   ============================================================ */
let arSize = parseInt(localStorage.getItem('noor_ar_size') || '24');
let faSize = parseInt(localStorage.getItem('noor_fa_size') || '16');
let lineHeight = localStorage.getItem('noor_lh') || '2.3';
let showTrans = localStorage.getItem('noor_trans') !== 'false';
const fontAr = localStorage.getItem('noor_font_ar') || 'amiri';
const fontFa = localStorage.getItem('noor_font_fa') || 'vazir';

document.body.classList.add('font-ar-' + fontAr);
document.body.classList.add('font-fa-' + fontFa);

function applySettings() {
  document.documentElement.style.setProperty('--fs-ar', arSize + 'px');
  document.documentElement.style.setProperty('--fs-fa', faSize + 'px');
  document.documentElement.style.setProperty('--line-height', lineHeight);
  $$('.verse-card').forEach(v => v.classList.toggle('hide-trans', !showTrans));
  if ($('#arSizeVal')) $('#arSizeVal').textContent = faNum(arSize);
  if ($('#faSizeVal')) $('#faSizeVal').textContent = faNum(faSize);
  localStorage.setItem('noor_ar_size', arSize);
  localStorage.setItem('noor_fa_size', faSize);
  localStorage.setItem('noor_lh', lineHeight);
  localStorage.setItem('noor_trans', showTrans);
}
applySettings();

$$('[data-ar-step]').forEach(b => b.onclick = () => {
  arSize = Math.max(16, Math.min(42, arSize + parseInt(b.dataset.arStep) * 2));
  applySettings();
});
$$('[data-fa-step]').forEach(b => b.onclick = () => {
  faSize = Math.max(12, Math.min(24, faSize + parseInt(b.dataset.faStep) * 2));
  applySettings();
});
$$('[data-lh]').forEach(b => {
  if (b.dataset.lh === lineHeight) b.classList.add('active');
  b.onclick = () => {
    $$('[data-lh]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    lineHeight = b.dataset.lh;
    applySettings();
  };
});
$$('[data-trans]').forEach(b => {
  const isOn = (b.dataset.trans === '1') === showTrans;
  b.classList.toggle('active', isOn);
  b.onclick = () => {
    $$('[data-trans]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    showTrans = b.dataset.trans === '1';
    applySettings();
  };
});
$$('[data-font-ar]').forEach(b => {
  if (b.dataset.fontAr === fontAr) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-ar]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-ar-\S+/g, '').trim();
    document.body.classList.add('font-ar-' + b.dataset.fontAr);
    localStorage.setItem('noor_font_ar', b.dataset.fontAr);
  };
});
$$('[data-font-fa]').forEach(b => {
  if (b.dataset.fontFa === fontFa) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-fa]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-fa-\S+/g, '').trim();
    document.body.classList.add('font-fa-' + b.dataset.fontFa);
    localStorage.setItem('noor_font_fa', b.dataset.fontFa);
  };
});

/* ============================================================
   BACK BUTTON
   ============================================================ */
$('#btnBack').onclick = () => {
  if (document.referrer && (document.referrer.includes('list.html') || document.referrer.includes('doa.html'))) history.back();
  else location.href = 'list.html?type=famous';
};

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg) {
  const t = $('#toast');
  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   INIT
   ============================================================ */
renderVerses();
applySettings();

console.log('🤲 دعای کمیل | NOOR – بارگذاری شد. تعداد بندها:', DUA_DATA.verses.length);
</script>
</body>
</html>
