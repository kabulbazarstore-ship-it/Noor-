<style>
:root{
  --bg:#F8F5EE; --surface:#FFFDF8; --surface2:#F1ECE2;
  --brand:#123C32; --brand2:#2D6657;
  --gold:#B88A3B; --gold2:#D6B56A;
  --gold-soft:rgba(184,138,59,.10);
  --gold-border:rgba(184,138,59,.20);
  --text:#17231F; --text2:#3D4A44; --muted:#66716C;
  --divider:#E7E0D3;
  --arabic:#123C32; --translation:#3D4A44;
  --shadow:0 4px 20px rgba(18,60,50,.05);
  --shadow-sm:0 2px 10px rgba(18,60,50,.035);
  --radius:16px; --radius-sm:12px;
  --trans:.25s cubic-bezier(.4,0,.2,1);
  --font-fa:'Vazirmatn',Tahoma,sans-serif;
  --font-ar:'Amiri','Scheherazade New','Noto Naskh Arabic',serif;
  --fs-ar:24px; --fs-fa:16px; --lh-ar:2.35;
}
body.dark{
  --bg:#080E0C; --surface:#101A16; --surface2:#16231E;
  --brand:#9FC5B5; --brand2:#B9D5C8;
  --gold:#D2AC5C; --gold2:#E4C982;
  --gold-soft:rgba(210,172,92,.08);
  --gold-border:rgba(210,172,92,.16);
  --text:#F4EFE4; --text2:#C8D2CC; --muted:#A8B3AD;
  --divider:#26352F;
  --arabic:#E8E2D2; --translation:#C8D2CC;
  --shadow:0 4px 24px rgba(0,0,0,.30);
  --shadow-sm:0 2px 10px rgba(0,0,0,.20);
}
body.font-ar-amiri{--font-ar:'Amiri',serif}
body.font-ar-scheherazade{--font-ar:'Scheherazade New',serif}
body.font-ar-naskh{--font-ar:'Noto Naskh Arabic',serif}
body.font-ar-lateef{--font-ar:'Lateef',serif}
body.font-ar-reem{--font-ar:'Reem Kufi',sans-serif}
body.font-fa-vazir{--font-fa:'Vazirmatn',Tahoma,sans-serif}
body.font-fa-naskh{--font-fa:'Noto Naskh Arabic',serif}
body.font-fa-amiri{--font-fa:'Amiri',serif}
body.font-fa-scheherazade{--font-fa:'Scheherazade New',serif}
body.font-fa-lateef{--font-fa:'Lateef',serif}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font-fa);background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.7;font-size:16px;
  transition:background var(--trans),color var(--trans);
  overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:var(--trans)}
svg{display:block}
.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-sm{width:18px;height:18px}
.app{width:100%;max-width:780px;margin:0 auto;padding:0 14px 88px}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:6px;
  padding:12px 0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--divider);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.hbtn{
  width:40px;height:40px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--surface);border:1px solid var(--gold-border);
  color:var(--gold);transition:var(--trans);
}
.hbtn:hover{background:var(--gold-soft);border-color:var(--gold)}
.hbtn:active{transform:scale(.94)}
.brand{flex:1;min-width:0;text-align:center;line-height:1.15}
.brand h1{
  font-family:'Amiri',serif;font-size:1.12rem;font-weight:700;
  color:var(--brand);letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
body.dark .brand h1{color:var(--gold)}
.brand .noor{
  display:block;margin-top:3px;
  font-family:'Amiri',serif;font-size:.65rem;font-weight:700;
  color:var(--gold);letter-spacing:6px;
}

/* SCROLL */
.scroll-content{
  max-height:calc(100vh - 90px);
  overflow-y:auto;padding:14px 0 20px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--gold-border) transparent;
}
.scroll-content::-webkit-scrollbar{width:4px}
.scroll-content::-webkit-scrollbar-track{background:transparent}
.scroll-content::-webkit-scrollbar-thumb{background:var(--gold-border);border-radius:10px}

/* TOP ORNAMENT */
.top-orn{
  position:relative;overflow:hidden;text-align:center;
  padding:18px 14px 20px;margin-bottom:14px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--gold-border);
  box-shadow:var(--shadow);
}
.orn-svg{position:absolute;color:var(--gold);opacity:.10;pointer-events:none}
.orn-svg.tr{top:-6px;right:-6px;width:80px;height:80px}
.orn-svg.bl{bottom:-6px;left:-6px;width:80px;height:80px;transform:rotate(180deg)}
.orn-title{
  position:relative;z-index:1;
  font-family:'Amiri',serif;font-size:1.45rem;font-weight:700;
  color:var(--brand);letter-spacing:1px;
}
body.dark .orn-title{color:var(--gold)}
.orn-sub{position:relative;z-index:1;font-size:.78rem;color:var(--muted)}
.orn-div{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:80px;margin:8px auto 0;
}
.orn-div:before,.orn-div:after{content:"";flex:1;height:1px;background:var(--gold-border)}
.orn-div svg{width:12px;height:12px;color:var(--gold)}

/* VERSE CARD */
.verse-card{
  background:var(--surface);
  border:1px solid var(--gold-border);
  border-radius:var(--radius);
  padding:16px 14px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);
  transition:var(--trans);position:relative;
}
.verse-card:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(184,138,59,.08)}
.verse-card .v-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.verse-card .v-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 8px;
  border-radius:7px;
  background:var(--gold-soft);color:var(--gold);
  font-family:'Amiri',serif;font-weight:700;font-size:.72rem;
  border:1px solid var(--gold-border);
}
.verse-card .v-label{font-size:.68rem;color:var(--muted);font-weight:600}
.verse-card .v-ar{
  font-family:var(--font-ar);
  font-size:var(--fs-ar);line-height:var(--lh-ar);
  color:var(--arabic);text-align:center;font-weight:400;
  margin-bottom:12px;padding:4px 2px;white-space:pre-line;
}
.verse-card.bismillah .v-ar{font-size:calc(var(--fs-ar) * .82);margin-bottom:10px}
.verse-card .v-divider{
  height:1px;
  background:repeating-linear-gradient(90deg,var(--gold-border) 0,var(--gold-border) 3px,transparent 3px,transparent 6px);
  margin:0 auto 12px;width:52px;
}
.verse-card .v-fa{
  font-family:var(--font-fa);
  font-size:var(--fs-fa);line-height:1.95;
  color:var(--translation);text-align:justify;
  padding:0 8px;border-right:3px solid var(--gold-border);
  white-space:pre-line;
}
.verse-card.hide-trans .v-fa{display:none}
.verse-card.hide-trans .v-divider{display:none}
.verse-card.hide-trans .v-ar{margin-bottom:0}

/* MODALS */
.modal-bg{
  position:fixed;inset:0;z-index:200;
  display:none;align-items:flex-end;justify-content:center;
  padding:0 12px 12px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.modal-bg.show{display:flex}
.modal{
  width:100%;max-width:540px;max-height:86vh;overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--gold-border);
  border-radius:24px 24px 18px 18px;
  padding:20px 18px 26px;
  box-shadow:var(--shadow);
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid var(--divider);
}
.modal-head h3{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--text)}
.modal-head h3 svg{color:var(--gold);width:20px;height:20px;flex:none}
.modal-close{
  width:34px;height:34px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);
  color:var(--muted);
}
.modal-close:hover{color:var(--gold);border-color:var(--gold)}

/* SETTINGS */
.set-group{margin-bottom:18px}
.set-group>label{display:block;margin-bottom:8px;color:var(--muted);font-size:.75rem;font-weight:700}
.set-options{display:flex;flex-wrap:wrap;gap:6px}
.set-opt{
  padding:7px 11px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);
  color:var(--text2);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--trans);
}
.set-opt:hover{color:var(--gold);border-color:var(--gold-border)}
.set-opt.active{color:var(--gold);background:var(--gold-soft);border-color:var(--gold)}
.font-preview{font-family:var(--font-ar);font-size:1rem}
.set-ctrl{
  display:flex;align-items:center;gap:6px;width:max-content;
  padding:4px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);
}
.set-ctrl button{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:1.05rem;font-weight:700}
.set-ctrl button:hover{background:var(--gold-soft);color:var(--gold)}
.set-ctrl .val{min-width:42px;text-align:center;color:var(--gold);font-size:.82rem;font-weight:700}

/* INFO BLOCK */
.info-block{
  padding:14px 16px;
  background:var(--surface2);
  border:1px solid var(--gold-border);
  border-radius:var(--radius-sm);
  margin-bottom:10px;
}
.info-block h4{
  display:flex;align-items:center;gap:6px;
  font-size:.8rem;font-weight:700;color:var(--gold);margin-bottom:8px;
}
.info-block h4 svg{width:16px;height:16px;flex:none}
.info-block p{
  font-size:.8rem;line-height:1.95;
  color:var(--text2);text-align:justify;white-space:pre-line;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;align-items:center;justify-content:space-around;
  height:62px;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--divider);
  box-shadow:0 -6px 24px rgba(0,0,0,.06);
}
body.dark .bottom-nav{box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 4px;border-radius:12px;
  color:var(--muted);text-decoration:none;
  font-size:.6rem;font-weight:500;transition:var(--trans);
}
.nav-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover,.nav-btn.active{color:var(--gold)}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:78px;z-index:300;
  display:flex;align-items:center;gap:8px;
  max-width:90%;padding:10px 18px;border-radius:14px;
  background:var(--brand);color:#fff;
  border:1px solid var(--gold-border);
  box-shadow:var(--shadow);
  transform:translateX(-50%) translateY(20px);
  opacity:0;pointer-events:none;
  transition:all .35s ease;font-size:.8rem;font-weight:600;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:var(--gold2)}

@media(max-width:480px){
  :root{--fs-ar:22px;--fs-fa:15px}
  .app{padding-left:10px;padding-right:10px}
  .hbtn{width:36px;height:36px}
  .hbtn .icon{width:18px;height:18px}
  .brand h1{font-size:1rem}
  .orn-title{font-size:1.28rem}
  .verse-card{padding:14px 12px}
}
</style>
</head>

    { ar: "اللّٰهُمَّ إِنِّی أَرْغَبُ إِلَیْکَ وَأَشْهَدُ بِالرُّبُوبِیَّةِ لَکَ مُقِرّاً بِأَنَّکَ رَبِّی، وَأَنَّ إِلَیْکَ مَرَدِّی، ابْتَدَأْتَنِی بِنِعْمَتِکَ قَبْلَ أَنْ أَکُونَ شَیْئاً مَذْکُوراً، وَخَلَقْتَنِی مِنَ التُّرابِ، ثُمَّ أَسْکَنْتَنِی الْأَصْلابَ آمِناً لِرَیْبِ الْمَنُونِ، وَاخْتِلافِ الدُّهُورِ وَالسِّنِینَ؛ فَلَمْ أَزَلْ ظاعِناً مِنْ صُلْبٍ إِلیٰ رَحِمٍ فِی تَقادُمٍ مِنَ الْأَیَّامِ الْماضِیَةِ وَالْقُرُونِ الْخالِیَةِ لَمْ تُخْرِجْنِی لِرَأْفَتِکَ بِی وَلُطْفِکَ لِی وَ إِحْسانِکَ إِلَیَّ فِی دَوْلَةِ أَئِمَّةِ الْکُفْرِ الَّذِینَ نَقَضُوا عَهْدَکَ وَکَذَّبُوا رُسُلَکَ، لَکِنَّکَ أَخْرَجْتَنِی رَأْفَةً مِنْکَ وَتَحَنُّناً عَلَیَّ لِلَّذِی سَبَقَ لِی مِنَ الْهُدَی الَّذِی لَهُ یَسَّرْتَنِی وَفِیهِ أَنْشَأْتَنِی، وَمِنْ قَبْلِ ذٰلِکَ رَؤُفْتَ بِی بِجَمِیلِ صُنْعِکَ وَسَوابِغِ نِعَمِکَ فَابْتَدَعْتَ خَلْقِی مِنْ مَنِیٍّ یُمْنیٰ، وَأَسْکَنْتَنِی فِی ظُلُماتٍ ثَلاثٍ بَیْنَ لَحْمٍ وَدَمٍ وَجِلْدٍ؛ لَمْ تُشْهِدْنِی خَلْقِی، وَلَمْ تَجْعَلْ إِلَیَّ شَیْئاً مِنْ أَمْرِی، ثُمَّ أَخْرَجْتَنِی لِلَّذِی سَبَقَ لِی مِنَ الْهُدیٰ إِلَی الدُّنْیا تامّاً سَوِیّاً، وَحَفِظْتَنِی فِی الْمَهْدِ طِفْلاً صَبِیّاً، وَرَزَقْتَنِی مِنَ الْغِذاءِ لَبَناً مَرِیّاً، وَعَطَفْتَ عَلَیَّ قُلُوبَ الْحَواضِنِ، وَکَفَّلْتَنِی الْأُمَّهاتِ الرَّواحِمَ، وَکَلَأْتَنِی مِنْ طَوارِقِ الْجانِّ، وَسَلَّمْتَنِی مِنَ الزِّیادَةِ وَالنُّقْصانِ، فَتَعالَیْتَ یَا رَحِیمُ یَا رَحْمٰنُ، حَتَّیٰ إِذَا اسْتَهْلَلْتُ ناطِقاً بِالْکَلامِ؛ أَتْمَمْتَ عَلَیَّ سَوابِغَ الْإِنْعامِ، وَرَبَّیْتَنِی زائِداً فِی کُلِّ عامٍ، حَتَّیٰ إِذَا اکْتَمَلَتْ فِطْرَتِی وَاعْتَدَلَتْ مِرَّتِی أَوْجَبْتَ عَلَیَّ حُجَّتَکَ بِأَنْ أَلْهَمْتَنِی مَعْرِفَتَکَ، وَرَوَّعْتَنِی بِعَجائِبِ حِکْمَتِکَ، وَأَیْقَظْتَنِی لِما ذَرَأْتَ فِی سَمائِکَ وَأَرْضِکَ مِنْ بَدائِعِ خَلْقِکَ، وَنَبَّهْتَنِی لِشُکْرِکَ وَذِکْرِکَ، وَأَوْجَبْتَ عَلَیَّ طاعَتَکَ وَعِبادَتَکَ، وَفَهَّمْتَنِی مَا جاءَتْ بِهِ رُسُلُکَ، وَیَسَّرْتَ لِی تَقَبُّلَ مَرْضاتِکَ، وَمَنَنْتَ عَلَیَّ فِی جَمِیعِ ذٰلِکَ بِعَوْنِکَ وَلُطْفِکَ؛ ثُمَّ إِذْ خَلَقْتَنِی مِنْ خَیْرِ الثَّریٰ، لَمْ تَرْضَ لِی یَا إِلٰهِی نِعْمَةً دُونَ أُخْریٰ، وَرَزَقْتَنِی مِنْ أَنْواعِ الْمَعاشِ وَصُنُوفِ الرِّیاشِ بِمَنِّکَ الْعَظِیمِ الْأَعْظَمِ عَلَیَّ، وَ إِحْسانِکَ الْقَدِیمِ إِلَیَّ، حَتَّیٰ إِذا أَتْمَمْتَ عَلَیَّ جَمِیعَ النِّعَمِ وَصَرَفْتَ عَنِّی کُلَّ النِّقَمِ لَمْ یَمْنَعْکَ جَهْلِی وَجُرْأَتِی عَلَیْکَ أَنْ دَلَلْتَنِی إِلَیٰ مَا یُقَرِّبُنِی إِلَیْکَ، وَوَفَّقْتَنِی لِما یُزْ لِفُنِی لَدَیْکَ، فَإِنْ دَعَوْتُکَ أَجَبْتَنِی، وَ إِنْ سَأَلْتُکَ أَعْطَیْتَنِی، وَ إِنْ أَطَعْتُکَ شَکَرْتَنِی، وَ إِنْ شَکَرْتُکَ زِدْتَنِی؛ کُلُّ ذٰلِکَ إِکْمالٌ لِأَنْعُمِکَ عَلَیَّ وَ إِحْسانِکَ إِلَیَّ، فَسُبْحانَکَ سُبْحانَکَ مِنْ مُبْدِیً مُعِیدٍ حَمِیدٍ مَجِیدٍ! وَتَقَدَّسَتْ أَسْماؤُکَ، وَعَظُمَتْ آلاؤُکَ، فَأَىُّ نِعَمِکَ یَا إِلٰهِی أُحْصِی عَدَداً وَذِکْراً؟ أَمْ أَىُّ عَطایاکَ أَقُومُ بِها شُکْراً وَهِیَ یَا رَبِّ أَکْثَرُ مِنْ أَنْ یُحْصِیَهَا الْعادُّونَ، أَوْ یَبْلُغَ عِلْماً بِهَا الْحافِظُونَ؟ ثُمَّ مَا صَرَفْتَ وَدَرَأْتَ عَنِّی اللّٰهُمَّ مِنَ الضُّرِّ وَالضَّرَّاءِ أَکْثَرُ مِمَّا ظَهَرَ لِی مِنَ الْعافِیَةِ وَالسَّرَّاءِ، وَأَنَا أَشْهَدُ یَا إِلٰهِی بِحَقِیقَةِ إِیمانِی؛ وَعَقْدِ عَزَماتِ یَقِینِی، وَخالِصِ صَرِیحِ تَوْحِیدِی، وَباطِنِ مَکْنُونِ ضَمِیرِی، وَعَلائِقِ مَجارِی نُورِ بَصَرِی، وَأَسارِیرِ صَفْحَةِ جَبِینِی، وَخُرْقِ مَسارِبِ نَفْسِی، وَخَذارِیفِ مارِنِ عِرْنِینِی، وَمَسارِبِ سِماخِ سَمْعِی، وَمَا ضُمَّتْ وَأَطْبَقَتْ عَلَیْهِ شَفَتاىَ، وَحَرَکاتِ لَفْظِ لِسانِی، وَمَغْرَزِ حَنَکِ فَمِی وَفَکِّی وَمَنابِتِ أَضْراسِی؛ وَمَساغِ مَطْعَمِی وَمَشْرَبِی، وَحِمالَةِ أُمِّ رَأْسِی، وَبُلُوعِ فارِغِ حَبائِلِ عُنُقِی، وَمَا اشْتَمَلَ عَلَیْهِ تامُورُ صَدْرِی، وَحَمائِلِ حَبْلِ وَتِینِی، وَ نِیاطِ حِجابِ قَلْبِی، وَأَفْلاذِ حَواشِی کَبِدِی، وَمَا حَوَتْهُ شَراسِیفُ أَضْلاعِی، وَحِقاقُ مَفاصِلِی، وَقَبْضُ عَوامِلِی، وَأَطْرافُ أَنامِلِی، وَلَحْمِی وَدَمِی وَشَعْرِی وَبَشَرِی وَعَصَبِی وَقَصَبِی وَعِظامِی وَمُخِّی وَعُرُوقِی وَجَمِیعُ جَوارِحِی وَمَا انْتَسَجَ عَلَیٰ ذٰلِکَ أَیَّامَ رِضاعِی، وَمَا أَقَلَّتِ الْأَرْضُ مِنِّی وَنَوْمِی وَیَقْظَتِی وَسُکُونِی، وَحَرَکاتِ رُکُوعِی وَسُجُودِی؛ أَنْ لَوْ حاوَلْتُ وَاجْتَهَدْتُ مَدَی الْأَعْصارِ وَالْأَحْقابِ لَوْ عُمِّرْتُها أَنْ أُؤَدِّیَ شُکْرَ واحِدَةٍ مِنْ أَنْعُمِکَ مَا اسْتَطَعْتُ ذٰلِکَ إِلّا بِمَنِّکَ الْمُوجَبِ عَلَیَّ بِهِ شُکْرُکَ أَبَداً جَدِیداً، وَثَناءً طارِفاً عَتِیداً، أَجَلْ وَلَوْ حَرَصْتُ أَنَا وَالْعادُّونَ مِنْ أَنامِکَ أَنْ نُحْصِیَ مَدَیٰ إِنْعامِکَ سالِفِهِ وَآنِفِهِ مَا حَصَرْناهُ عَدَداً، وَلَا أَحْصَیْناهُ أَمَداً، هَیْهاتَ أَنَّیٰ ذٰلِکَ وَأَنْتَ الْمُخْبِرُ فِی کِتابِکَ النَّاطِقِ وَالنَّبَاَ الصَّادِقِ ﴿وَ إِنْ تَعُدُّوا نِعْمَةَ اللّٰهِ لاٰ تُحْصُوهٰا﴾؛ صَدَقَ کِتابُکَ اللّٰهُمَّ وَ إِنْباؤُکَ، وَبَلَّغَتْ أَنْبِیاؤُکَ وَرُسُلُکَ مَا أَنْزَلْتَ عَلَیْهِمْ مِنْ وَحْیِکَ، وَشَرَعْتَ لَهُمْ وَبِهِمْ مِنْ دِینِکَ، غَیْرَ أَنِّی یَا إِلٰهِی أَشْهَدُ بِجَُهْدِی وَجِدِّی وَمَبْلَغِ طاعَتِی وَوُسْعِی، وَأَقُولُ مُؤْمِناً مُوقِناً الْحَمْدُلِلّٰهِ الَّذِی لَمْ یَتَّخِذْ وَلَداً فَیَکُونَُ مَوْرُوثاً، وَلَمْ یَکُنْ لَهُ شَرِیکٌ فِی مُلْکِهِ فَیُضادَّهُ فِیَما ابْتَدَعَ؛ وَلَا وَلِیٌّ مِنَ الذُّلِّ فَیُرْفِدَهُ فِیما صَنَعَ، فَسُبْحانَهُ سُبْحانَهُ ﴿لَوْ کانَ فِیهِما آلِهَةٌ إِلّا اللّٰهُ لَفَسَدَتا﴾ وَتَفَطَّرَتا! سُبْحانَ اللّٰهِ الْواحِدِ الْأَحَدِ الصَّمَدِ الَّذِی لَمْ یَلِدْ وَلَمْ یُولَدْ وَلَمْ یَکُنْ لَهُ کُفُواً أَحَدٌ! الْحَمْدُلِلّٰهِ حَمْداً یُعادِلُ حَمْدَ مَلائِکَتِهِ الْمُقَرَّبِینَ وَأَنْبِیائِهِ الْمُرْسَلِینَ، وَصَلَّی اللّٰهُ عَلَىٰ خِیَرَتِهِ مُحَمَّدٍ خاتَِمِ النَّبِیِّینَ وَآلِهِ الطَّیِّبِینَ الطَّاهِرِینَ الْمُخْلَصِینَ وَسَلَّمَ؛ اللّٰهُمَّ اجْعَلْنِی أَخْشاکَ کَأَنِّی أَراکَ، وَأَسْعِدْنِی بِتَقْواکَ، وَلَا تُشْقِنِی بِمَعْصِیَتِکَ، وَخِرْ لِی فِی قَضائِکَ، وَبارِکْ لِی فِی قَدَرِکَ، حَتَّیٰ لَاأُحِبَّ تَعْجِیلَ مَا أَخَّرْتَ وَلَا تَأْخِیرَ مَا عَجَّلْتَ.", fa: "خدایا، به‌سوی تو اشتیاق دارم و به پروردگاری تو گواهی می‌دهم، اقرار کننده‌ام که تو پروردگار منی و بازگشت من به‌سوی تو است، وجودم را با نعمتت آغاز کردی پیش از آنکه موجودی قابل ذکر باشم و مرا از خاک پدید آوردی، سپس در میان صلب‌ها جایم دادی، درحالی‌که از حوادث زمانه و رفت‌وآمد روزگار و سال‌ها ایمنی بخشیدی؛ همواره کوچ‌کننده بودم از صلبی به رحمی، در ایام گذشته و قرن‌های پیشین، از باب رأفت و مهربانی و احسانی که به من داشتی، مرا در حکومت پیشوایان کفر، آنان‌که پیمانت را شکستند و پیامبرانت را تکذیب کردند، به دنیا نیاوردی، ولی زمانی به دنیام آوردی به خاطر آنچه در دانش و آگاهی‌ات برایم رقم خورده بود و آن عبارت بود از هدایتی که مرا برای پذیرفتن آن آماده ساختی و در عرصه گاهش نشو و نمایم دادی و پیش از آن هم با رفتار زیبایت و نعمت‌های کاملت بر من مهر ورزیدی، در نتیجه وجودم را پدید آوردی از نطفه ریخته شده و در تاریکی‌های سه‌گانه میان گوشت و خون و پوست جایم دادی؛ و مرا در آفرینش وجودم گواه نگرفتی و چیزی از کار پدید آمدنم را به من واگذار نکردی، سپس برای آنچه در دانش و آگاهی‌ات از هدایتم گذشته بود مرا کامل و آراسته به دنیا آوردی و در حال کودکی و خردسالی در میان گهواره نگهداری‌ام نمودی و از بین غذاها شیر گوارا نصیبم کردی و دل دایه‌ها را بر من مهربان نمودی و مادران پرمهر را به پرستاری‌ام گماشتی و از آسیب‌های پریان نگهداری فرمودی و از زیادی و کمی سالمم داشتی، پس تو برتری‌ای مهربان،ای بخشنده تا آنگاه که آغاز به سخن کردم؛ نعمت‌های کاملت را بر من تمام کردی و مرا در هر سال با افزوده شدن به وجودم پرورش دادی تا آفرینشم کامل شد و تاب و توانم معتدل گشت، حجّتت را بر من واجب کردی، به اینکه معرفتت را به من الهام فرمودی و با شگفتی‌های حکمتت به هراسم افکندی و به آنچه در آسمان و زمینت از پدیده‌های نو و شگفت پدید آوردی بیدارم کردی، به سپاسگزاری و یادت آگاهی‌ام دادی و طاعت و عبادتت را بر من واجب ساختی و آنچه را پیامبرانت آوردند به من فهماندی و پذیرفتن خشنودی‌ات را بر من آسان کردی و در تمام این امور به یاری و مهربانی‌ات بر من منّت نهادی؛ سپس وقتی که مرا از بهترین خاک آفریدی برایم نپسندیدی‌ای معبودم نعمتی را بدون نعمتی دیگر بنابراین از انواع وسایل زندگی و اقسام بهره‌ها نصیب من فرمودی و این به خاطر نعمت‌بخشی بزرگ و بزرگتر و احسان دیرینه‌ات بر من بود تا جایی که همه نعمت‌ها را بر من کامل کردی و تمام بلاها را از من بازگرداندی، نادانی و گستاخی‌ام بر تو، جلوگیرت نشد، از این که مرا به آنچه به تو نزدیک می‌کند راهنمایی کنی و به آنچه مرا به پیشگاهت مقرّب می‌نماید function renderVerses(){
  const c = $('#versesContainer');
  c.innerHTML = '';
  DUA_DATA.verses.forEach((v,i)=>{
    const el = document.createElement('div');
    el.className = 'verse-card' + (v.bismillah ? ' bismillah' : '');
    el.innerHTML = `
      <div class="v-head">
        <span class="v-num">${faNum(i+1)}</span>
        <span class="v-label">بند ${faNum(i+1)}</span>
      </div>
      <div class="v-ar">${v.ar}</div>
      <div class="v-divider"></div>
      <div class="v-fa">${v.fa}</div>
    `;
    c.appendChild(el);
  });
}

  document.documentElement.style.setProperty('--fs-ar', arSize+'px');
  document.documentElement.style.setProperty('--fs-fa', faSize+'px');
  document.documentElement.style.setProperty('--lh-ar', lineHeight);
  $$('.verse-card').forEach(v=> v.classList.toggle('hide-trans', !showTrans));
  if($('#arSizeVal')) $('#arSizeVal').textContent = faNum(arSize);
  if($('#faSizeVal')) $('#faSizeVal').textContent = faNum(faSize);
  localStorage.setItem('noor_ar_size', arSize);
  localStorage.setItem('noor_fa_size', faSize);
  localStorage.setItem('noor_lh', lineHeight);
  localStorage.setItem('noor_trans', showTrans);
}
applySettings();

$$('[data-ar-step]').forEach(b => b.onclick = ()=>{
  arSize = Math.max(16, Math.min(42, arSize + parseInt(b.dataset.arStep)*2));
  applySettings();
});
$$('[data-fa-step]').forEach(b => b.onclick = ()=>{
  faSize = Math.max(12, Math.min(26, faSize + parseInt(b.dataset.faStep)*2));
  applySettings();
});
$$('[data-lh]').forEach(b=>{
  if(b.dataset.lh===lineHeight) b.classList.add('active');
  b.onclick = ()=>{
    $$('[data-lh]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    lineHeight = b.dataset.lh;
    applySettings();
  };
});
$$('[data-trans]').forEach(b=>{
  const isOn = (b.dataset.trans==='1')===showTrans;
  b.classList.toggle('active',isOn);
  b.onclick = ()=>{
    $$('[data-trans]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    showTrans = b.dataset.trans==='1';
    applySettings();
  };
});
$$('[data-font-ar]').forEach(b=>{
  if(b.dataset.fontAr===fontAr) b.classList.add('active');
  b.onclick = ()=>{
    $$('[data-font-ar]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-ar-\S+/g,'').trim();
    document.body.classList.add('font-ar-'+b.dataset.fontAr);
    localStorage.setItem('noor_font_ar', b.dataset.fontAr);
  };
});
$$('[data-font-fa]').forEach(b=>{
  if(b.dataset.fontFa===fontFa) b.classList.add('active');
  b.onclick = ()=>{
    $$('[data-font-fa]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-fa-\S+/g,'').trim();
    document.body.classList.add('font-fa-'+b.dataset.fontFa);
    localStorage.setItem('noor_font_fa', b.dataset.fontFa);
  };
});

/* ============================================================
   BACK BUTTON
   ============================================================ */
$('#btnBack').onclick = ()=>{
  if(document.referrer && (document.referrer.includes('list.html') || document.referrer.includes('doa.html'))) history.back();
  else location.href = 'list.html?type=famous';
};

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg){
  const t = $('#toast');
  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ============================================================
   INIT
   ============================================================ */
renderVerses();
applySettings();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js')
      .then(()=> console.log('NOOR Service Worker registered.'))
      .catch(err=> console.log('Service Worker error:', err));
  });
}

console.log('🤲 دعای عرفه | NOOR – بارگذاری شد. تعداد بندها:', DUA_DATA.verses.length);
</script>
