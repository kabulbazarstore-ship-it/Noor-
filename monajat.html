<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123C32">
<meta name="description" content="مناجات‌ها | نــــور NOOR">
<title>مناجات‌ها | نــــور NOOR</title>

<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Lateef:wght@400;700&family=Reem+Kufi:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F8F5EE; --surface:#FFFDF8; --surface2:#F1ECE2;
  --brand:#123C32; --brand2:#2D6657;
  --gold:#B88A3B; --gold2:#D6B56A;
  --gold-soft:rgba(184,138,59,.10);
  --gold-border:rgba(184,138,59,.20);
  --text:#17231F; --text2:#3D4A44; --muted:#66716C;
  --divider:#E7E0D3;
  --arabic:#123C32; --translation:#3D4A44;
  --shadow:0 4px 20px rgba(18,60,50,.05);
  --shadow-sm:0 2px 10px rgba(18,60,50,.035);
  --radius:16px; --radius-sm:12px;
  --trans:.25s cubic-bezier(.4,0,.2,1);
  --font-fa:'Vazirmatn',Tahoma,sans-serif;
  --font-ar:'Amiri','Scheherazade New','Noto Naskh Arabic',serif;
  --fs-ar:24px; --fs-fa:16px; --lh-ar:2.35;
}
body.dark{
  --bg:#080E0C; --surface:#101A16; --surface2:#16231E;
  --brand:#9FC5B5; --brand2:#B9D5C8;
  --gold:#D2AC5C; --gold2:#E4C982;
  --gold-soft:rgba(210,172,92,.08);
  --gold-border:rgba(210,172,92,.16);
  --text:#F4EFE4; --text2:#C8D2CC; --muted:#A8B3AD;
  --divider:#26352F;
  --arabic:#E8E2D2; --translation:#C8D2CC;
  --shadow:0 4px 24px rgba(0,0,0,.30);
  --shadow-sm:0 2px 10px rgba(0,0,0,.20);
}
body.font-ar-amiri{--font-ar:'Amiri',serif}
body.font-ar-scheherazade{--font-ar:'Scheherazade New',serif}
body.font-ar-naskh{--font-ar:'Noto Naskh Arabic',serif}
body.font-ar-lateef{--font-ar:'Lateef',serif}
body.font-ar-reem{--font-ar:'Reem Kufi',sans-serif}
body.font-fa-vazir{--font-fa:'Vazirmatn',Tahoma,sans-serif}
body.font-fa-naskh{--font-fa:'Noto Naskh Arabic',serif}
body.font-fa-amiri{--font-fa:'Amiri',serif}
body.font-fa-scheherazade{--font-fa:'Scheherazade New',serif}
body.font-fa-lateef{--font-fa:'Lateef',serif}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font-fa);background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.7;font-size:16px;
  transition:background var(--trans),color var(--trans);
  overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:var(--trans)}
svg{display:block}
.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-sm{width:18px;height:18px}
.icon-xs{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{width:100%;max-width:780px;margin:0 auto;padding:0 14px 88px}

.header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:6px;
  padding:12px 0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--divider);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.hbtn{
  width:40px;height:40px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--surface);border:1px solid var(--gold-border);
  color:var(--gold);transition:var(--trans);
}
.hbtn:hover{background:var(--gold-soft);border-color:var(--gold)}
.hbtn:active{transform:scale(.94)}
.brand{flex:1;min-width:0;text-align:center;line-height:1.15}
.brand h1{
  font-family:'Amiri',serif;font-size:1.12rem;font-weight:700;
  color:var(--brand);letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
body.dark .brand h1{color:var(--gold)}
.brand .noor{
  display:block;margin-top:3px;
  font-family:'Amiri',serif;font-size:.65rem;font-weight:700;
  color:var(--gold);letter-spacing:6px;
}

.scroll-content{
  max-height:calc(100vh - 90px);
  overflow-y:auto;padding:14px 0 20px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--gold-border) transparent;
}
.scroll-content::-webkit-scrollbar{width:4px}
.scroll-content::-webkit-scrollbar-track{background:transparent}
.scroll-content::-webkit-scrollbar-thumb{background:var(--gold-border);border-radius:10px}

.top-orn{
  position:relative;overflow:hidden;text-align:center;
  padding:18px 14px 20px;margin-bottom:14px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--gold-border);
  box-shadow:var(--shadow);
}
.orn-svg{position:absolute;color:var(--gold);opacity:.10;pointer-events:none}
.orn-svg.tr{top:-6px;right:-6px;width:80px;height:80px}
.orn-svg.bl{bottom:-6px;left:-6px;width:80px;height:80px;transform:rotate(180deg)}
.orn-title{
  position:relative;z-index:1;
  font-family:'Amiri',serif;font-size:1.3rem;font-weight:700;
  color:var(--brand);letter-spacing:.5px;
}
body.dark .orn-title{color:var(--gold)}
.orn-sub{position:relative;z-index:1;font-size:.76rem;color:var(--muted)}
.orn-div{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:80px;margin:8px auto 0;
}
.orn-div:before,.orn-div:after{content:"";flex:1;height:1px;background:var(--gold-border)}
.orn-div svg{width:12px;height:12px;color:var(--gold)}

.search-box{position:relative;margin-bottom:12px}
.search-box input{
  width:100%;padding:11px 44px 11px 16px;border-radius:30px;
  border:1px solid var(--gold-border);background:var(--surface);
  color:var(--text);font-family:inherit;font-size:.9rem;outline:none;transition:var(--trans);
}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.search-box .search-icon{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;
}

.category-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;justify-content:center}
.cat-btn{
  padding:6px 12px;border-radius:20px;font-size:.72rem;font-weight:600;
  background:var(--surface);border:1px solid var(--divider);color:var(--text2);
  cursor:pointer;transition:var(--trans);
}
.cat-btn:hover{color:var(--gold);border-color:var(--gold-border)}
.cat-btn.active{color:#fff;background:var(--gold);border-color:var(--gold)}

.section-head{
  position:relative;margin:18px 0 12px;padding:14px 16px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--gold-border);box-shadow:var(--shadow-sm);text-align:center;
}
.section-head:first-child{margin-top:0}
.section-head .sec-title{font-family:'Amiri',serif;font-size:1rem;font-weight:700;color:var(--gold);margin-bottom:4px;line-height:1.4}
.section-head .sec-orn{display:flex;align-items:center;justify-content:center;gap:6px;width:60px;margin:8px auto 0}
.section-head .sec-orn:before,.section-head .sec-orn:after{content:"";flex:1;height:1px;background:var(--gold-border)}
.section-head .sec-orn svg{width:10px;height:10px;color:var(--gold)}

.monajat-item{
  background:var(--surface);border:1px solid var(--gold-border);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:var(--trans);
  display:flex;align-items:center;gap:12px;
}
.monajat-item:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(184,138,59,.08);transform:translateX(-3px)}
.monajat-item:active{transform:scale(.98)}
.monajat-item .v-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:32px;height:32px;padding:0 8px;border-radius:8px;
  background:var(--gold-soft);color:var(--gold);font-family:'Amiri',serif;font-weight:700;font-size:.8rem;
  border:1px solid var(--gold-border);flex:none;
}
.monajat-item .mj-body{flex:1;min-width:0}
.monajat-item .mj-title{font-family:'Amiri',serif;font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:3px}
.monajat-item .mj-sub{font-size:.7rem;color:var(--muted)}
.monajat-item .mj-arrow{color:var(--gold);opacity:.6;flex:none}

.detail-head{
  position:relative;text-align:center;padding:18px 14px;
  margin-bottom:14px;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--gold-border);box-shadow:var(--shadow);
}
.detail-head .d-title{font-family:'Amiri',serif;font-size:1.15rem;font-weight:700;color:var(--gold);margin-bottom:6px}
.detail-head .d-meta{font-size:.72rem;color:var(--muted);margin-top:6px}
.detail-head .d-source{font-size:.7rem;color:var(--text2);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-style:italic}
.back-btn{
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;
  padding:7px 16px;border-radius:20px;
  background:var(--surface);border:1px solid var(--gold-border);
  color:var(--gold);font-size:.72rem;font-weight:600;transition:var(--trans);
}
.back-btn:hover{background:var(--gold-soft);border-color:var(--gold)}

.verse-card{
  background:var(--surface);border:1px solid var(--gold-border);
  border-radius:var(--radius);padding:16px 14px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);transition:var(--trans);
}
.verse-card:hover{border-color:var(--gold)}
.verse-card .v-ar{
  font-family:var(--font-ar);font-size:var(--fs-ar);line-height:var(--lh-ar);
  color:var(--arabic);text-align:center;font-weight:400;
  margin-bottom:12px;padding:4px 2px;white-space:pre-line;
}
.verse-card .v-divider{
  height:1px;
  background:repeating-linear-gradient(90deg,var(--gold-border) 0,var(--gold-border) 3px,transparent 3px,transparent 6px);
  margin:0 auto 12px;width:52px;
}
.verse-card .v-fa{
  font-family:var(--font-fa);font-size:var(--fs-fa);line-height:1.95;
  color:var(--translation);text-align:justify;
  padding:0 8px;border-right:3px solid var(--gold-border);white-space:pre-line;
}
.verse-card.hide-trans .v-fa{display:none}
.verse-card.hide-trans .v-divider{display:none}
.verse-card.hide-trans .v-ar{margin-bottom:0}

.info-block{
  padding:14px 16px;background:var(--surface2);border:1px solid var(--gold-border);
  border-radius:var(--radius-sm);margin-top:14px;
}
.info-block h4{
  display:flex;align-items:center;gap:6px;
  font-size:.8rem;font-weight:700;color:var(--gold);margin-bottom:8px;
}
.info-block h4 svg{width:16px;height:16px;flex:none}
.info-block p{font-size:.8rem;line-height:1.95;color:var(--text2);text-align:justify;white-space:pre-line}
.info-block .info-source{font-size:.72rem;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;font-style:italic}

.modal-bg{
  position:fixed;inset:0;z-index:200;
  display:none;align-items:flex-end;justify-content:center;
  padding:0 12px 12px;background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.modal-bg.show{display:flex}
.modal{
  width:100%;max-width:540px;max-height:86vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--gold-border);
  border-radius:24px 24px 18px 18px;padding:20px 18px 26px;
  box-shadow:var(--shadow);animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--divider);
}
.modal-head h3{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--text)}
.modal-head h3 svg{color:var(--gold);width:20px;height:20px;flex:none}
.modal-close{
  width:34px;height:34px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);color:var(--muted);
}
.modal-close:hover{color:var(--gold);border-color:var(--gold)}

.set-group{margin-bottom:18px}
.set-group>label{display:block;margin-bottom:8px;color:var(--muted);font-size:.75rem;font-weight:700}
.set-options{display:flex;flex-wrap:wrap;gap:6px}
.set-opt{
  padding:7px 11px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);
  color:var(--text2);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--trans);
}
.set-opt:hover{color:var(--gold);border-color:var(--gold-border)}
.set-opt.active{color:var(--gold);background:var(--gold-soft);border-color:var(--gold)}
.font-preview{font-family:var(--font-ar);font-size:1rem}
.set-ctrl{
  display:flex;align-items:center;gap:6px;width:max-content;
  padding:4px;border-radius:10px;background:var(--surface2);border:1px solid var(--divider);
}
.set-ctrl button{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:1.05rem;font-weight:700}
.set-ctrl button:hover{background:var(--gold-soft);color:var(--gold)}
.set-ctrl .val{min-width:42px;text-align:center;color:var(--gold);font-size:.82rem;font-weight:700}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;align-items:center;justify-content:space-around;
  height:62px;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--divider);
  box-shadow:0 -6px 24px rgba(0,0,0,.06);
}
body.dark .bottom-nav{box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 4px;border-radius:12px;color:var(--muted);text-decoration:none;
  font-size:.6rem;font-weight:500;transition:var(--trans);
}
.nav-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover,.nav-btn.active{color:var(--gold)}

.toast{
  position:fixed;left:50%;bottom:78px;z-index:300;
  display:flex;align-items:center;gap:8px;
  max-width:90%;padding:10px 18px;border-radius:14px;
  background:var(--brand);color:#fff;border:1px solid var(--gold-border);
  box-shadow:var(--shadow);transform:translateX(-50%) translateY(20px);
  opacity:0;pointer-events:none;transition:all .35s ease;
  font-size:.8rem;font-weight:600;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:var(--gold2)}

.empty-msg{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty-msg svg{width:48px;height:48px;opacity:.3}

@media(max-width:480px){
  :root{--fs-ar:22px;--fs-fa:15px}
  .app{padding-left:10px;padding-right:10px}
  .hbtn{width:36px;height:36px}
  .hbtn .icon{width:18px;height:18px}
  .brand h1{font-size:1rem}
  .orn-title{font-size:1.15rem}
  .verse-card{padding:14px 12px}
  .section-head{padding:12px}
  .section-head .sec-title{font-size:.92rem}
  .monajat-item{padding:12px 14px}
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <button class="hbtn" id="btnBack" aria-label="بازگشت">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </button>

    <div class="brand">
      <h1 id="pageTitle">مناجات‌ها</h1>
      <span class="noor">نور</span>
    </div>

    <button class="hbtn" id="btnInfo" aria-label="اطلاعات">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    </button>

    <button class="hbtn" id="btnSettings" aria-label="تنظیمات">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>

    <button class="hbtn" id="themeToggle" aria-label="تغییر تم">
      <svg id="themeIcon" class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <div class="scroll-content" id="scrollContent">

    <section class="top-orn">
      <svg class="orn-svg tr" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width=".8">
        <path d="M50 5L95 50L50 95L5 50Z"/><path d="M50 20L80 50L50 80L20 50Z"/><circle cx="50" cy="50" r="15"/>
      </svg>
      <svg class="orn-svg bl" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width=".8">
        <path d="M50 5L95 50L50 95L5 50Z"/><path d="M50 20L80 50L50 80L20 50Z"/><circle cx="50" cy="50" r="15"/>
      </svg>
      <div class="orn-title">مناجات‌ها</div>
      <div class="orn-sub">راز و نیاز با خداوند متعال</div>
      <div class="orn-div">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9 12 2"/></svg>
      </div>
    </section>

    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" placeholder="جستجو در مناجات‌ها..." oninput="filterItems()">
      <span class="search-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
    </div>

    <div class="category-filter" id="categoryFilter">
      <button class="cat-btn active" data-cat="all" onclick="filterCategory('all')">همه</button>
      <button class="cat-btn" data-cat="خمس عشر" onclick="filterCategory('خمس عشر')">خمس عشر</button>
      <button class="cat-btn" data-cat="امیرالمؤمنین" onclick="filterCategory('امیرالمؤمنین')">امیرالمؤمنین (ع)</button>
      <button class="cat-btn" data-cat="عمومی" onclick="filterCategory('عمومی')">عمومی</button>
    </div>

    <div id="listContainer"></div>
    <div id="detailContainer" style="display:none;"></div>

  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-btn" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 21v-6h4v6"/></svg>
    <span>خانه</span>
  </a>
  <a class="nav-btn" href="quran.html">

    verses:[
      {ar:`إِلٰهِى أَلْبَسَتْنِى الْخَطايا ثَوْبَ مَذَلَّتِى، وَجَلَّلَنِى التَّباعُدُ مِنْكَ لِباسَ مَسْكَنَتِى، وَأَماتَ قَلْبِى عَظِيمُ جِنايَتِى، فَأَحْيِهِ بِتَوْبَةٍ مِنْكَ يَا أَمَلِى وَبُغْيَتِى، وَيَا سُؤْلِى وَمُنْيَتِى، فَوَعِزَّتِكَ ما أَجِدُ لِذُنُوبِى سِواكَ غافِراً، وَلَا أَرَىٰ لِكَسْرِى غَيْرَكَ جابِراً، وَقَدْ خَضَعْتُ بِالْإِنابَةِ إِلَيْكَ، وَعَنَوْتُ بِالاسْتِكانَةِ لَدَيْكَ، فَإِنْ طَرَدْتَنِى مِنْ بابِكَ فَبِمَنْ أَلُوذُ؟ وَإِنْ رَدَدْتَنِى عَنْ جَنابِكَ فَبِمَنْ أَعُوذُ؟ فَوا أَسَفاهُ مِنْ خَجْلَتِى وَافْتِضاحِى، وَوا لَهْفاهُ مِنْ سُوءِ عَمَلِى وَاجْتِراحِى.`, fa:`خدایا! گناهان بر من لباس خواری پوشانده و دوری از تو جامه درماندگی بر تنم پیچیده و بزرگی جنایتم دلم را میرانده، پس آن را با توبه به درگاهت زنده کن، ای آرزویم و مرادم و خواسته‌ام و امیدم، به عزّتت سوگند برای گناهانم آمرزنده‌ای جز تو نمی‌یابم و برای دل‌شکستگی‌ام جبران‌کننده‌ای جز تو نمی‌بینم، به پیشگاهت با توبه و انابه فروتنی کردم و با ذلّت و خواری به درگاهت تسلیم شدم، اگر مرا از درگاهت برانی به که روی آورم؟ و اگر از آستانت بازم گردانی به که پناه برم؟ در این حال افسوس از شرمندگی و رسوایی‌ام و وای از نگرانی‌ام از زشتی کردار و مرتکب شدن گناهانم.`},
      {ar:`أَسْأَلُكَ يَا غافِرَ الذَّنْبِ الْكَبِيرِ، وَيَا جابِرَ الْعَظْمِ الْكَسِيرِ، أَنْ تَهَبَ لِى مُوبِقاتِ الْجَرائِرِ، وَتَسْتُرَ عَلَىَّ فاضِحاتِ السَّرائِرِ، وَلَا تُخْلِنِى فِى مَشْهَدِ الْقِيامَةِ مِنْ بَرْدِ عَفْوِكَ وَغَفْرِكَ، وَلَا تُعْرِنِى مِنْ جَمِيلِ صَفْحِكَ وَسَتْرِكَ.`, fa:`ای آمرزنده گناهان بزرگ و ای جبران‌کننده استخوان شکسته، از تو می‌خواهم که گناهان تباه‌کننده‌ام را بر من ببخشایی و پنهان‌کاری‌های رسواکننده‌ام را بپوشانی و مرا در عرصه قیامت از نسیم گذشت و آمرزشت بی‌بهره مگذاری و از پوشش زیبای چشم‌پوشی‌ات عریان و بی‌پوشش رها نسازی.`},

      {ar:`إِلٰهِى بِقُدْرَتِكَ عَلَىَّ تُبْ عَلَىَّ، وَبِحِلْمِكَ عَنِّى اعْفُ عَنِّى، وَبِعِلْمِكَ بِى ارْفَقْ بِى. إِلٰهِى أَنْتَ الَّذِى فَتَحْتَ لِعِبادِكَ بَاباً إِلىٰ عَفْوِكَ سَمَّيْتَهُ التَّوْبَةَ، فَقُلْتَ: ﴿تُوبُوا إِلَى اللّٰهِ تَوْبَةً نَصُوحاً﴾؛ فَمَا عُذْرُ مَنْ أَغْفَلَ دُخُولَ الْبابِ بَعْدَ فَتْحِهِ؟ إِلٰهِى إِنْ كانَ قَبُحَ الذَّنْبُ مِنْ عَبْدِكَ فَلْيَحْسُنِ الْعَفْوُ مِنْ عِنْدِكَ.`, fa:`خدایا، با توانایی‌ات بر من، توبه‌ام را بپذیر و با بردباری‌ات نسبت به من، از من بگذر و با آگاهی‌ات از حال من با من مدارا کن، معبودم تویی که به روی بندگانت دری به‌سوی بخششت گشودی و آن را توبه نامیدی و خود فرمودی: «ای مؤمنان! به پیشگاه خداوند توبه کنید، توبه‌ای خالص!»؛ پس عذر کسی که از ورود به این در پس از گشوده شدنش غفلت ورزد چه می‌تواند باشد؟ معبودم، اگر نافرمانی و گناه از بنده‌ات زشت است، پس گذشت از جانب تو زیباست.`},
      {ar:`إِلٰهِى مَا أَنَا بِأَوَّلِ مَنْ عَصَاكَ فَتُبْتَ عَلَيْهِ، وَتَعَرَّضَ لِمَعْرُوفِكَ فَجُدْتَ عَلَيْهِ، يَا مُجِيبَ الْمُضْطَرِّ، يَا كَاشِفَ الضُّرِّ، يَا عَظِيمَ الْبِرِّ، يَا عَلِيماً بِمَا فِى السِّرِّ، يَا جَمِيلَ السَِّتْرِ، اسْتَشْفَعْتُ بِجُودِكَ وَكَرَمِكَ إِلَيْكَ، وَتَوَسَّلْتُ بِجَنابِكَ وَتَرَحُّمِكَ لَدَيْكَ، فَاسْتَجِبْ دُعائِى، وَلَا تُخَيِّبْ فِيكَ رَجائِى، وَتَقَبَّلْ تَوْبَتِى، وَكَفِّرْ خَطِيئَتِى، بِمَنِّكَ وَرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`خدایا، نخستین کسی نیستم که تو را نافرمانی کرده و تو توبه‌اش را پذیرفتی و خود را در معرض احسانت قرار داده و تو مورد احسانش قرار دادی، ای پاسخگوی درماندگان، ای برطرف‌کننده زیان، ای بزرگ نیکی، ای دانای نهان، ای زیبا پرده‌پوش، به جود و بزرگواری‌ات از تو درخواست یاری و کمک دارم و به آستانه‌ات و رحمت و بخشایشی که نزد توست متوسل شدم پس دعایم را اجابت کن، امیدم را به خود ناامید مساز و توبه‌ام را بپذیر و با احسان و مهرت خطاهایم را نادیده گیر، ای مهربان‌ترین مهربانان.`}

    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`إِلٰهِى إِلَيْكَ أَشْكُو نَفْساً بِالسُّوءِ أَمَّارَةً، وَإِلَى الْخَطِيئَةِ مُبادِرَةً، وَبِمَعاصِيكَ مُولَعَةً، وَلِسَخَطِكَ مُتَعَرِّضَةً، تَسْلُكُ بِى مَسالِكَ الْمَهَالِكِ، وَتَجْعَلُنِى عِنْدَكَ أَهْوَنَ هَالِكٍ، كَثِيرَةَ الْعِلَلِ، طَوِيلَةَ الْأَمَلِ، إِنْ مَسَّهَا الشَّرُّ تَجْزَعُ، وَإِنْ مَسَّهَا الْخَيْرُ تَمْنَعُ، مَيَّالَةً إِلَى اللَّعِبِ وَاللَّهْوِ، مَمْلُوَّةً بِالْغَفْلَةِ وَالسَّهْوِ، تُسْرِعُ بِى إِلى الْحَوْبَةِ، وَتُسَوِّفُنِى بِالتَّوْبَةِ.`, fa:`معبودم، از نفسی که فراوان به بدی فرمان می‌دهد به تو شکایت می‌کنم، همان نفسی که شتابنده به‌سوی خطا و آزمند به انجام گناهان و در معرض خشم توست، نفسی که مرا به راه هلاکت می‌کشاند و هستی‌ام را نزد تو از پست‌ترین تباه‌شدگان قرار می‌دهد، بیماری‌هایش بسیار، آرزویش دراز است، اگر گزندی به او رسد بی‌تابی می‌کند و اگر خیری به او رسد از انفاقش دریغ می‌ورزد، به بازی و هوسرانی میل بسیار دارد، از غفلت و اشتباه آکنده است، مرا به‌سرعت به‌جانب گناه می‌راند و با من در توبه و ندامت امروز و فردا می‌کند.`},
      {ar:`إِلٰهِى أَشْكُو إِلَيْكَ عَدُوّاً يُضِلُّنِى، وَشَيْطاناً يُغْوِينِى، قَدْ مَلَأَ بِالْوَسْواسِ صَدْرِى، وَأَحاطَتْ هَواجِسُه بِقَلْبِى، يُعاضِدُ لِىَ الْهَوىٰ، وَيُزَيِّنُ لِى حُبَّ الدُّنْيا، وَيَحُولُ بَيْنِى وَبَيْنَ الطَّاعَةِ وَالزُّلْفىٰ؛ إِلٰهِى إِلَيْكَ أَشْكُو قَلْباً قاسِياً مَعَ الْوَسْواسِ مُتَقَلِّباً، وَبِالرَّيْنِ وَالطَّبْعِ مُتَلَبِّساً، وَعَيْناً عَنِ الْبُكاءِ مِنْ خَوْفِكَ جامِدَةً، وَإِلىٰ ما تَسُرُّها طامِحَةً.`, fa:`معبودم، از دشمنی که گمراهم می‌کند و از شیطانی که به بی‌راهه‌ام می‌برد به تو شکایت می‌کنم، شیطانی که سینه‌ام را از وسوسه انباشته و زمزمه‌های خطرناکش قلبم را فرا گرفته است، شیطانی که با هوا و هوس به من کمک می‌کند و عشق به دنیا را در دیدگانم نیکو و آراسته جلوه می‌دهد و بین من و بندگی و مقام قرب پرده می‌افکند؛ معبودم، از دل همچون سنگی که با وسوسه زیرورو می‌شود و به آلودگی گناه و سیاهی نافرمانی آلوده شده به تو شکایت می‌کنم؛ معبودم، از چشمی که از گریه ناشی از هراس تو خشک شده و در عوض به مناظری که خوش‌آیند آن است خیره گشته به تو گلایه می‌کنم.`},
      {ar:`إِلٰهِى لَاحَوْلَ لِى وَلَا قُوَّةَ إِلّا بِقُدْرَتِكَ، وَلَا نَجاةَ لِى مِنْ مَكارِهِ الدُّنْيا إِلّا بِعِصْمَتِكَ، فَأَسْأَلُكَ بِبَلاغَةِ حِكْمَتِكَ، وَنَفاذِ مَشِيئَتِكَ، أَنْ لَاتَجْعَلَنِى لِغَيْرِ جُودِكَ مُتَعَرِّضاً، وَلَا تُصَيِّرَنِى لِلْفِتَنِ غَرَضاً، وَكُنْ لِى عَلَى الْأَعْداءِ ناصِراً، وَعَلَى الْمَخازِى وَالْعُيُوبِ ساتِراً، وَمِنَ الْبَلاءِ واقِياً، وَعَنِ الْمَعاصِى عاصِماً، بِرَأْفَتِكَ وَرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`خدایا توان و نیرویی برای من جز به قدرت تو نیست، راه نجاتی از گرفتاری‌های دنیا جز حفظ و نگهداری تو برایم نمی‌باشد، از تو می‌خواهم به رسایی حکمتت و نفوذ اراده‌ات که مرا جز جود و بخشندگی‌ات در معرض چیزی قرار ندهی و هدف فتنه‌ها نگردانی و بر ضد دشمنانم یاور باشی و پرده‌پوش رسوایی‌ها و عیوبم گردی و از بلا نگهدار و از گناهان بازدارنده‌ام باشی، به مهر و رحمتت ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات شاکین، مناجات کسی است که از نفس اماره و شیطان به درگاه الهی شکایت می‌برد و از او یاری می‌جوید.'
  },
  {
    id:'kh_03', number:'۳', category:'خمس عشر',
    title:'مناجاة الخائفين',
    subtitle:'مناجات ترسندگان',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`إِلٰهِى أَتَراكَ بَعْدَ الْإِيمانِ بِكَ تُعَذِّبُنِى؟ أَمْ بَعْدَ حُبِّى إِيَّاكَ تُبَعِّدُنِى؟ أَمْ مَعَ رَجائِى لِرَحْمَتِكَ وَصَفْحِكَ تَحْرِمُنِى؟ أَمْ مَعَ اسْتِجارَتِى بِعَفْوِكَ تُسْلِمُنِى؟ حَاشَا لِوَجْهِكَ الْكَرِيمِ أَنْ تُخَيِّبَنِى.`, fa:`معبودم، آیا چنین می‌نمایی که پس از ایمانم به تو، عذابم کنی؟ یا پس از عشقم به تو، از خود دورم سازی؟ یا با امید به رحمت و چشم‌پوشی‌ات محرومم نمایی؟ یا با پناه‌جویی‌ام به گذشتت رهایم کنی؟ هرگز چنین نیست! از ذات بزرگوار و مهمان‌نوازت به دور است که محرومم کنی.`},
      {ar:`لَيْتَ شِعْرِى أَلِلشَّقاءِ وَلَدَتْنِى أُمِّى؟ أَمْ لِلْعَناءِ رَبَّتْنِى؟ فَلَيْتَها لَمْ تَلِدْنِى، وَلَمْ تُرَبِّنِى، وَلَيْتَنِى عَلِمْتُ أَمِنْ أَهْلِ السَّعادَةِ جَعَلْتَنِى، وَبِقُرْبِكَ وَجِوارِكَ خَصَصْتَنِى، فَتَقَِرَّ بِذٰلِكَ عَيْنِى، وَتَطْمَئِنَّ لَهُ نَفْسِى.`, fa:`ای کاش می‌دانستم که آیا مادرم مرا برای بدبختی به دنیا آورده، یا برای رنج کشیدن و زحمت پرورانده است؟ اگر چنین است کاش مرا نزاده و نپرورانده بود و ای کاش آگاه بودم که آیا مرا از اهل سعادت قرار داده و به قرب و جوارت اختصاص داده‌ای تا به این سبب چشمم روشن و جانم آرام گیرد؟`},
      {ar:`إِلٰهِى هَلْ تُسَوِّدُ وُجُوهاً خَرَّتْ ساجِدَةً لِعَظَمَتِكَ؟ أَوْ تُخْرِسُ أَلْسِنَةً نَطَقَتْ بِالثَّناءِ عَلىٰ مَجْدِكَ وَجَلالَتِكَ؟ أَوْ تَطْبَعُ عَلىٰ قُلُوبٍ انْطَوَتْ عَلىٰ مَحَبَّتِكَ؟ أَوْ تُصِمُّ أَسْماعاً تَلَذَّذَتْ بِسَماعِ ذِكْرِكَ فِى إِرادَتِكَ؛ أَوْ تَغُلُّ أَكُفّاً رَفَعَتْهَا الْآمالُ إِلَيْكَ رَجاءَ رَأْفَتِكَ؟ أَوْ تُعاقِبُ أَبْداناً عَمِلَتْ بِطاعَتِكَ حَتَّىٰ نَحِلَتْ فِى مُجاهَدَتِكَ؟ أَوْ تُعَذِّبُ أَرْجُلاً سَعَتْ فِى عِبادَتِكَ؟`, fa:`معبودم، آیا چهره‌هایی که در برابر عظمتت سجده‌کنان به خاک افتاده سیاه می‌کنی؟ یا زبان‌هایی را که برای بزرگی و شکوهت به ستایش گویا شده ناگویا می‌نمایی؟ یا بر دل‌هایی که به محبتت پیچیده شده مُهر می‌زنی؟ یا گوش‌هایی را که از شنیدن ذکرت در راه رضایت لذّت برده ناشنوا می‌کنی؟ یا دست‌هایی را که به امید آرزوهای مهرورزی‌ات، به سویت بلند کرده به زنجیر می‌بندی؟ یا بدن‌هایی را که در طاعتت کوشیده تا جایی که در راه کوشش در بندگی‌ات لاغر شده، مجازات می‌کنی؟ یا پاهایی را که در راه عبادتت پوییده، به عذاب دچار می‌نمایی؟`},
      {ar:`إِلٰهِى لَاتُغْلِقْ عَلىٰ مُوَحِّدِيكَ أَبْوابَ رَحْمَتِكَ، وَلَا تَحْجُبْ مُشْتاقِيكَ عَنِ النَّظَرِ إِلىٰ جَمِيلِ رُؤْيَتِكَ.`, fa:`معبودم، درهای رحمتت را بر یکتاپرستان مبند و شیفتگانت را از نگاه به زیبایی دیدارت محروم مساز.`},
      {ar:`إِلٰهِى نَفْسٌ أَعْزَزْتَها بِتَوْحِيدِكَ كَيْفَ تُذِلُّها بِمَهانَةِ هِجْرانِكَ؟ وَضَمِيرٌ انْعَقَدَ عَلىٰ مَوَدَّتِكَ كَيْفَ تُحْرِقُهُ بِحَرارَةِ نِيرانِكَ؟ إِلٰهِى أَجِرْنِى مِنْ أَلِيمِ غَضَبِكَ، وَعَظِيمِ سَخَطِكَ، يَا حَنَّانُ يَا مَنَّانُ، يَا رَحِيمُ يَا رَحْمانُ، يَا جَبَّارُ يَا قَهَّارُ، يَا غَفَّارُ يَا سَتَّارُ، نَجِّنِى بِرَحْمَتِكَ مِنْ عَذابِ النَّارِ، وَفَضِيحَةِ الْعارِ، إِذَا امْتازَ الْأَخْيارُ مِنَ الْأَشْرارِ، وَحَالَتِ الْأَحْوالُ وَهَالَتِ الْأَهْوالُ، وَقَرُبَ الْمُحْسِنُونَ وَبَعُدَ الْمُسِيئُونَ، ﴿وَ وُفِّيَتْ كُلُّ نَفْسٍ ما كَسَبَتْ وَهُمْ لَايُظْلَمُونَ﴾.`, fa:`معبودم، جانی را که به توحیدت عزّت بخشیدی، چگونه به خواری هجرانت خوار می‌کنی و باطنی که بر دوستی‌ات پیمان بسته، چگونه به سوز آتشت می‌سوزانی؟ معبودم، از دردناکی خشمت و بزرگی ناخشنودی‌ات پناهم ده، ای پرمهر، ای بسیار احسان‌کننده، ای مهربان، ای بخشاینده، ای توانا، ای چیره، ای آمرزنده، ای پرده‌پوش، به مهرت مرا از شکنجه آتش و رسوایی ننگ رهایی‌بخش، آنگاه که نیکان از بدان جدا شوند و حالت‌ها دگرگون گردد و هراسنده‌ها بهراسند و نیکوکاران به خوشبختی نزدیک شوند و بدکاران از آن دور گردند و به هرکس آنچه را که انجام داده به‌طور کامل خواهند داد و مورد ستم قرار نمی‌گیرند.`}
    ],
    fazilat:'مناجات خائفین، مناجات کسی است که از عذاب الهی می‌ترسد و به رحمت او امیدوار است.'
  },
  {
    id:'kh_04', number:'۴', category:'خمس عشر',
    title:'مناجاة الراجين',
    subtitle:'مناجات امیدواران',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`يَا مَنْ إِذا سَأَلَهُ عَبْدٌ أَعْطاهُ، وَإِذا أَمَّلَ ما عِنْدَهُ بَلَّغَهُ مُناهُ، وَإِذا أَقْبَلَ عَلَيْهِ قَرَّبَهُ وَأَدْناهُ، وَإِذا جاهَرَهُ بِالْعِصْيانِ سَتَرَ عَلىٰ ذَنْبِهِ وَغَطَّاهُ، وَإِذا تَوَكَّلَ عَلَيْهِ أَحْسَبَهُ وَكَفاهُ.`, fa:`ای آن‌که هرگاه بنده‌ای از او بخواهد عطایش کند و هرگاه چیزی را که نزد اوست آرزو کند، به آرزویش برساند و زمانی که به او روی آورد، مقرّب و نزدیکش سازد و گاهی که تظاهر به گناه کند، گناهش را پرده‌پوشی نماید و آنگاه که بر او توکل نماید، او را بس باشد و کفایت کند.`},
      {ar:`إِلٰهِى مَنِ الَّذِى نَزَلَ بِكَ مُلْتَمِساً قِراكَ فَما قَرَيْتَهُ؟ وَمَنِ الَّذِى أَناخَ بِبابِكَ مُرْتَجِياً نَداكَ فَما أَوْلَيْتَهُ؟ أَيَحْسُنُ أَنْ أَرْجِعَ عَنْ بابِكَ بِالْخَيْبَةِ مَصْرُوفاً، وَلَسْتُ أَعْرِفُ سِواكَ مَوْلىً بِالْإِحْسانِ مَوْصُوفاً؟!`, fa:`معبودم، کیست که بر آستانت وارد شده و خواهان مهمان‌پذیری‌ات باشد و تو از او پذیرایی نکرده باشی و کیست که مرکب حاجت را با امید به سخاوتت به درگاهت خوابانده باشد و تو احسانش ننموده باشی؟ آیا خوشایند است که از درگاهت با محرومیت بازگردم، درحالی‌که جز تو سروری که به احسان متصف باشد نشناسم؟`},
      {ar:`كَيْفَ أَرْجُو غَيْرَكَ وَالْخَيْرُ كُلُّهُ بِيَدِكَ؟ وَكَيْفَ أُؤَمِّلُ سِواكَ وَالْخَلْقُ وَالْأَمْرُ لَكَ؟! أَ أَقْطَعُ رَجائِى مِنْكَ وَقَدْ أَوْلَيْتَنِى ما لَمْ أَسْأَلْهُ مِنْ فَضْلِكَ؟ أَمْ تُفْقِرُنِى إِلىٰ مِثْلِى وَأَنَا أَعْتَصِمُ بِحَبْلِكَ؟`, fa:`چگونه به غیر تو امید بندم درحالی‌که هر خوبی به دست توست و چگونه جز تو را آرزو کنم درحالی‌که آفرینش و فرمان ویژه توست؟ آیا امیدم را از تو بِبُرم درحالی‌که از روی احسان آنچه از تو نخواستم به من عطا فرمودی یا آیا به مانند خودم نیازمندم می‌کنی درحالی‌که به رشته محکمت چنگ می‌زنم؟`},
      {ar:`يَا مَنْ سَعَدَ بِرَحْمَتِهِ الْقاصِدُونَ، وَلَمْ يَشْقَ بِنِقْمَتِهِ الْمُسْتَغْفِرُونَ؛ كَيْفَ أَنْساكَ وَلَمْ تَزَلْ ذاكِرِى؟! وَكَيْفَ أَ لْهُو عَنْكَ وَأَنْتَ مُراقِبِى؟!`, fa:`ای آن‌که قصدکنندگان به رحمتش خوشبخت شدند و آمرزش‌خواهان به انتقامش بدبخت نشدند؛ چگونه فراموشت کنم که همیشه به یادم بوده‌ای و چگونه از تو بی‌خبر شوم که تو نگهبانم هستی؟`},
      {ar:`إِلٰهِى بِذَيْلِ كَرَمِكَ أَعْلَقْتُ يَدِى، وَلِنَيْلِ عَطاياكَ بَسَطْتُ أَمَلِى، فَأَخْلِصْنِى بِخالِصَةِ تَوْحِيدِكَ، وَاجْعَلْنِى مِنْ صَفْوَةِ عَبِيدِكَ، يَا مَنْ كُلُّ هارِبٍ إِلَيْهِ يَلْتَجِئُ، وَكُلُّ طالِبٍ إِيَّاهُ يَرْتَجِى، يَا خَيْرَ مَرْجُوٍّ، وَيَا أَكْرَمَ مَدْعُوٍّ، وَيَا مَنْ لَايُرَدُّ سائِلُهُ، وَلَا يُخَيَّبُ آمِلُهُ، يَا مَنْ بابُهُ مَفْتُوحٌ لِداعِيهِ، وَحِجابُهُ مَرْفُوعٌ لِراجِيهِ، أَسْأَلُكَ بِكَرَمِكَ أَنْ تَمُنَّ عَلَىَّ مِنْ عَطائِكَ بِما تَقَرُّ بِهِ عَيْنِى، وَمِنْ رَجائِكَ بِما تَطْمَئِنُّ بِهِ نَفْسِى، وَمِنَ الْيَقِينِ بِما تُهَوِّنُ بِهِ عَلَىَّ مُصِيبَاتِ الدُّنْيا، وَتَجْلُو بِهِ عَنْ بَصِيرَتِى غَشَواتِ الْعَمىٰ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`معبودم دستم را به دامن کرمت آویختم و برای رسیدن به عطایت سفره آرزویم را گستردم، مرا به خلوص توحیدت خالص کن و از بندگان برگزیده‌ات قرار ده، ای آن‌که هر گریزانی به او پناه می‌جوید و هر جوینده‌ای به او امید می‌بندد، ای بهترین امیدبخش، ای کریم‌ترین خوانده‌شده، ای آن‌که پرسنده‌اش برگردانده نشود و آرزومندش محروم نگردد، ای آن‌که در رحمتش به روی خوانندگان باز است و پرده درگاهش برای امیدواران گشوده است، از تو می‌خواهم به بزرگواری‌ات که ببخشی از عطای خود بر من آن‌چنان‌که دیده‌ام به آن روشن شود و از امید به تو سرشارم سازی به اندازه‌ای که نهادم آرامش یابد و از یقین آن‌چنان بر من عطا کنی که با آن ناگواری‌های دنیا را برایم آسان نمایی و با آن از دیدگان دلم پرده‌های نابینایی را برگیری، به مهربانی‌ات ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات راجین، مناجات کسی است که به رحمت و بخشش الهی امید بسته و امید خود را در پیشگاه او به نمایش می‌گذارد.'
  },
  {
    id:'kh_05', number:'۵', category:'خمس عشر',
    title:'مناجاة الراغبين',
    subtitle:'مناجات مشتاقان',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`اللّٰهُمَّ إِنَّ مَطَايَانَا قَدْ أَنْضَتْهَا الْآمَالُ، وَقَدْ أَوْهَنَتْهَا الْأَعْمَالُ، وَقَدْ بَلَغَتْ بِنَا الْجُهْدُ وَأَنْتَ الْمُنْتَهَى، فَيَا مُنْتَهَى آمَالِ الْمُؤْمِنِينَ، وَيَا غَايَةَ سُؤْلِ الْمُحِبِّينَ، وَيَا أَقْصَىٰ طَلِبَةِ الْمُتَوَكِّلِينَ، وَيَا مَوْلَىٰ الْمُوَحِّدِينَ، وَيَا أَمَلَ الْمُذْنِبِينَ، أَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَحُبَّ كُلِّ عَمَلٍ يُوصِلُنِى إِلَىٰ قُرْبِكَ، وَأَنْ تَجْعَلَكَ أَحَبَّ إِلَىَّ مِمَّا سِوَاكَ، وَأَنْ تَجْعَلَ حُبِّي إِيَّاكَ قَائِداً إِلَىٰ رِضْوَانِكَ، وَشَوْقِي إِلَيْكَ ذَائِداً عَنْ عِصْيَانِكَ، وَامْنُنْ بِالنَّظَرِ إِلَيْكَ عَلَىَّ، وَانْظُرْ بِعَيْنِ الْوُدِّ وَالْعَطْفِ إِلَىَّ، وَلَا تَصْرِفْ عَنِّي وَجْهَكَ، وَاجْعَلْنِي مِنْ أَهْلِ الْإِسْعَادِ وَالْحُِظْوَةِ عِنْدَكَ، يَا مُجِيبُ، يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`خدایا، امیدها و آرزوها، مرکب‌های ما را رنجور و خسته کرده و اعمال ما آنها را ناتوان ساخته و ما به سختی و مشقت رسیده‌ایم و تو نهایت و غایت آرزوها هستی، پس ای نهایت آرزوهای مؤمنان، ای غایت خواسته‌های دوستداران، ای دورترین مطلوب توکل‌کنندگان، ای مولای یکتاپرستان، ای امید گناهکاران، از تو می‌خواهم دوستی خودت را، و دوستی آنان که تو را دوست دارند، و دوستی هر عملی که مرا به قربت برساند، و اینکه تو را نزد من از هرچه غیر توست محبوب‌تر گردانی، و عشقم را به خودت رهنمون به خشنودی‌ات سازی، و شوقم به دیدارت بازدارنده از نافرمانی‌ات قرار دهی، و کرامت نگاه به جمالت را بر من منّت گذار، و با چشم مهر و عطوفت به من بنگر، و رویت را از من مگردان، و مرا از خوشبختان و بهره‌مندان نزد خود قرار ده، ای اجابت‌کننده، ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات راغبین، مناجات کسی است که مشتاق لقاء الهی است و از خداوند می‌خواهد که محبت خود را در دلش جای دهد.'
  },
  {
    id:'kh_06', number:'۶', category:'خمس عشر',
    title:'مناجاة الشاكرين',
    subtitle:'مناجات سپاسگزاران',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`إِلٰهِى أَذْهَلَنِى عَنْ إِقامَةِ شُكْرِكَ تَتابُعُ طَوْلِكَ، وَأَعْجَزَنِى عَنْ إِحْصاءِ ثَنائِكَ فَيْضُ فَضْلِكَ، وَشَغَلَنِى عَنْ ذِكْرِ مَحامِدِكَ تَرادُفُ عَوائِدِكَ، وَأَعْيانِى عَنْ نَشْرِ عَوارِفِكَ تَوَالِى أَيادِيكَ، وَهٰذا مَقامُ مَنِ اعْتَرَفَ بِسُبُوغِ النَّعْماءِ وَقابَلَها بِالتَّقْصِيرِ، وَشَهِدَ عَلىٰ نَفْسِهِ بِالْإِهْمالِ وَالتَّضْيِيعِ، وَأَنْتَ الرَّؤُوفُ الرَّحِيمُ الْبَرُّ الْكَرِيمُ، الَّذِى لَايُخَيِّبُ قاصِدِيهِ، وَلَا يَطْرُدُ عَنْ فِنائِهِ آمِلِيهِ، بِساحَتِكَ تَحُطُّ رِحالُ الرَّاجِينَ، وَبِعَرْصَتِكَ تَقِفُ آمالُ الْمُسْتَرْفِدِينَ، فَلَا تُقابِلْ آمالَنا بِالتَّخْيِيبِ وَالْإِيآسِ، وَلَا تُلْبِسْنا سِرْبالَ الْقُنُوطِ وَالْإِ بْلاسِ؛`, fa:`معبودم، پیاپی آمدن نیکی و محبّتت، برپاداشتن سپاست را از یاد من برد و فراوانی بخششت، مرا از شمارش ستایشت درمانده ساخت و در پی هم آمدن احسانت، مرا از یاد اوصاف نیکت بازداشت و پشت هم رسیدن نعمت‌هایت مرا از گسترش خوبی‌هایت درمانده کرد، این است جایگاه آن‌که به فراوانی نعمت‌های تو در برابر آن به کوتاهی خود اقرار دارد و به زیان خود به سستی در بندگی و هدر دادن نعمت‌ها گواهی می‌دهد و تویی نیک‌خو و مهرورز، مهربان، نیکوکار، مهمان‌نواز که خواهنده‌اش را محروم نمی‌کند و آرزومندش را از درگاهش نمی‌راند، به آستانت فرود می‌آید بار امیدواران و در درگاه رحمت تو می‌ایستد آرزوهای عطاخواهان، پس آرزوهایمان را با محرومیت و ناامیدی روبرو مکن و جامه ناامیدی و دوری از رحمت را بر ما مپوشان؛`},
      {ar:`إِلٰهِى تَصَاغَرَ عِنْدَ تَعاظُمِ آلائِكَ شُكْرِى، وَتَضَاءَلَ فِى جَنْبِ إِكْرامِكَ إِيَّاىَ ثَنائِى وَنَشْرِى، جَلَّلَتْنِى نِعَمُكَ مِنْ أَنْوارِ الْإِيمانِ حُلَلاً، وَضَرَبَتْ عَلَىَّ لَطائِفُ بِرِّكَ مِنَ الْعِزِّ كِلَلاً، وَقَلَّدَتْنِى مِنَنُكَ قَلائِدَ لَاتُحَلُّ، وَطَوَّقَتْنِى أَطْواقاً لَاتُفَلُّ، فَآلاؤُكَ جَمَّةٌ ضَعُفَ لِسانِى عَنْ إِحْصَائِها، وَنَعْماؤُكَ كَثِيرَةٌ قَصُرَ فَهْمِى عَنْ إِدْراكِها فَضْلاً عَنِ اسْتِقْصَائِها؛ فَكَيْفَ لِى بِتَحْصِيلِ الشُّكْرِ وَشُكْرِى إِيَّاكَ يَفْتَقِرُ إِلىٰ شُكْرٍ؟ فَكُلَّما قُلْتُ لَكَ الْحَمْدُ وَجَبَ عَلَىَّ لِذٰلِكَ أَنْ أَقُولَ لَكَ الْحَمْدُ.`, fa:`معبودم، در برابر بزرگی نعمت‌هایت، سپاسم کوچک است و در کنار اکرامت بر من، ستایش و گزارشم از آن، خود را پست و ناچیز نشان می‌دهد، نعمت‌هایت از انوار ایمان، زینت‌هایی به من پوشاند و لطایف نیکی‌ات خیمه‌هایی از عزت بالای سرم افراشت و عطاهایت گردنبندهای زیبنده‌ای به گردنم افکند که هرگز باز نشود و طوق‌هایی بر من آویخت که به هیچ روی گسسته نگردد، عطاهای انبوهت زبانم را از شمردنش ناتوان ساخته و نعمت‌های فراوانت فهمم را از دریافتشان کوتاه کرده تا چه رسد به بررسی کامل آن‌ها؛ سپاسگزاری‌ات چگونه برای من امکان‌پذیر است درحالی‌که سپاسم نسبت به تو خود نیازمند سپاسی دیگر است، پس هر نوبت که گفتم تو را سپاس، بر من واجب شد که به خاطر آن باز بگویم تو را سپاس.`},
      {ar:`إِلٰهِى فَكَما غَذَّيْتَنا بِلُطْفِكَ، وَرَبَّيْتَنا بِصُنْعِكَ، فَتَمِّمْ عَلَيْنا سَوَابِغَ النِّعَمِ، وَادْفَعْ عَنَّا مَكارِهَ النِّقَمِ، وَآتِنا مِنْ حُظُوظِ الدَّارَيْنِ أَرْفَعَها وَأَجَلَّها عاجِلاً وَآجِلاً، وَلَكَ الْحَمْدُ عَلىٰ حُسْنِ بَلائِكَ، وَسُبُوغِ نَعْمَائِكَ، حَمْداً يُوافِقُ رِضَاكَ، وَيَمْتَرِى الْعَظِيمَ مِنْ بِرِّكَ وَنَداكَ، يَا عَظِيمُ يَا كَرِيمُ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`معبودم، همان‌گونه که ما را به لطفت تغذیه کردی و با احسانت پروریدی، پس نعمت‌های سرشارت را بر ما به انجام رسان و ناگواری‌های ناخوشایند را از ما دور کن و از بهره‌های هر دو جهان بالاتر و برترش را چه الان و چه در آینده به ما عطا کن، تو را سپاس بر خوبی آزمونت و بر نعمت‌های سرشارت، سپاسی که درخور خشنودی‌ات باشد و خیر وجودت را به‌سوی ما جلب کند، ای بزرگ، ای مهمان‌نواز، به مهربانی‌ات ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات شاکرین، مناجات کسی است که در برابر نعمت‌های بی‌شمار الهی، خود را از شکرگزاری کامل ناتوان می‌بیند.'
  },
  {
    id:'kh_07', number:'۷', category:'خمس عشر',
    title:'مناجاة المطيعين',
    subtitle:'مناجات فرمانبرداران',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`اللّٰهُمَّ أَلْهِمْنا طَاعَتَكَ، وَجَنِّبْنا مَعْصِيَتَكَ، وَيَسِّرْ لَنا بُلُوغَ مَا نَتَمَنَّىٰ مِنِ ابْتِغاءِ رِضْوانِكَ، وَأَحْلِلْنا بُحْبُوحَةَ جِنانِكَ، وَاقْشَعْ عَنْ بَصائِرِنا سَحابَ الارْتِيابِ، وَاكْشِفْ عَنْ قُلُوبِنا أَغْشِيَةَ الْمِرْيَةِ وَالْحِجابِ، وَأَزْهِقِ الْباطِلَ عَنْ ضَمائِرِنا، وَأَثْبِتِ الْحَقَّ فِى سَرائِرِنا، فَإِنَّ الشُّكُوكَ وَالظُّنُونَ لَواقِحُ الْفِتَنِ، وَمُكَدِّرَةٌ لِصَفْوِ الْمَنائِحِ وَالْمِنَنِ.`, fa:`خدایا، فرمانبری‌ات را به ما الهام فرما و ما را از نافرمانیت دور کن و راه رسیدن به آنچه از خشنودی‌ات آرزومندیم آسان کن و ما را در میان بهشت‌هایت جای ده و از برابر دیدگان دل‌هایمان، ابرهای شک و دودلی را بزدای و از قلوبمان پرده‌های تردید و کوردلی را کنار زن و از نهادمان باطل را نابود کن و حق را در درون ما استوار گردان، زیرا شک‌ها و گمان‌ها، بارورکننده‌ی آشوب‌ها و تیره‌کننده‌ی عطاها و بخشش‌های زلال و بی‌آلایش‌اند.`},
      {ar:`اللّٰهُمَّ احْمِلْنا فِى سُفُنِ نَجاتِكَ، وَمَتِّعْنا بِلَذِيذِ مُنَاجَاتِكَ، وَأَوْرِدْنا حِيَاضَ حُبِّكَ؛ وَأَذِقْنا حَلاوَةَ وُدِّكَ وَقُرْبِكَ، وَاجْعَلْ جِهادَنا فِيكَ، وَهَمَّنا فِى طَاعَتِكَ، وَأَخْلِصْ نِيَّاتِنا فِى مُعامَلَتِكَ، فَإِنَّا بِكَ وَلَكَ وَلَا وَسِيلَةَ لَنا إِلَيْكَ إِلّا أَنْتَ.`, fa:`خدایا ما را بر کشتی‌های نجاتت سوار کن و از لذّت راز و نیازت بهره‌مند گردان و به حوض‌های دوستی‌ات وارد کن؛ و شیرینی محبّت و مقام قربت را به ما بچشان، کوششمان را در راهت و همّتمان را در طاعتت قرار ده و نیّت‌هایمان را در معامله با خود خالص گردان، چراکه ما با تو و از توییم و برای ما وسیله‌ای جز به‌سوی تو نیست.`},
      {ar:`إِلٰهِى اجْعَلْنِى مِنَ الْمُصْطَفَيْنَ الْأَخْيارِ، وَأَلْحِقْنِى بِالصَّالِحِينَ الْأَبْرارِ، السَّابِقِينَ إِلَى الْمَكْرُماتِ، الْمُسارِعِينَ إِلَى الْخَيْراتِ، الْعامِلِينَ لِلْباقِياتِ الصَّالِحاتِ، السَّاعِينَ إِلَىٰ رَفِيعِ الدَّرَجاتِ، إِنَّكَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ، وَبِالْإِجابَةِ جَدِيرٌ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`معبودم، مرا از گزیدگان بندگان خوبت قرار ده و به شایستگان نیکوکار ملحق کن، هم آنان‌که به کار نیک و جوانمردی پیشی گرفتند و به‌سوی خیرات شتافتند و برای کارهای خداپسند ماندگار تلاش کردند و برای رسیدن به درجات بلند کوشش نمودند، همانا تو بر هر چیز توانایی و به اجابت دعا سزاواری، به مهربانی‌ات ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات مطیعین، مناجات کسی است که خواهان اطاعت کامل از خداوند و دوری از معصیت است.'
  },
  {
    id:'kh_08', number:'۸', category:'خمس عشر',
    title:'مناجاة المريدين',
    subtitle:'مناجات اراده‌کنندگان',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`اللَّهُمَّ اجْعَلْنِي مِنْ أَوْلِيَائِكَ الصَّالِحِينَ، وَأَتْبِعِ السَّادَةَ الرَّاشِدِينَ، وَاجْعَلْنِي مِنْ خِيَرَةِ الْمُتَّقِينَ، وَأَعِزَّنِي بِعِزَّتِكَ الْبَاقِيَةِ، وَلَا تَذِلَّنِي بِذُلِّ الْعُصَاةِ الْمُسِيئِينَ، وَارْزُقْنِي مُرَادِي وَارْضَ عَنِّي فِيهِ، وَأَلْهِمْنِي رُشْدِي وَوَفِّقْنِي لِمَا أُرِيدُ مِنْ طَاعَتِكَ، وَاسْتَعْمِلْنِي بِمَا أَنْتَ أَهْلُهُ، يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`خدایا، مرا از دوستان شایسته‌ات قرار ده و از سروران راه‌یافته پیرو کن و مرا از برگزیدگان پرهیزگاران قرار ده و با عزت جاویدانت عزیزم دار و با خواری گناهکاران بدکار خوارم مکن و مرادم را روزیم کن و از من در آن خشنود باش و رشد و هدایتم را به من الهام کن و بر آنچه از طاعتت اراده دارم موفقم بدار و به گونه‌ای که شایسته توست به کارم بگمار، ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات مریدین، مناجات کسی است که اراده‌ی کامل برای بندگی خداوند و پیروی از اولیای الهی دارد.'
  },
  {
    id:'kh_09', number:'۹', category:'خمس عشر',
    title:'مناجاة المحبين',
    subtitle:'مناجات دوستداران',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`إِلٰهِى مَنْ ذَا الَّذِى ذاقَ حَلاوَةَ مَحَبَّتِكَ فَرامَ مِنْكَ بَدَلاً؟ وَمَنْ ذَا الَّذِى أَنَِسَ بِقُرْبِكَ فَابْتَغَىٰ عَنْكَ حِوَلاً؟`, fa:`معبودم، کیست آن‌که شیرینی محبّتت را چشید پس به‌جای تو دیگری را برگزید؟ و کیست آن‌که با مقام قرب تو انس یافت پس مایل به روی برتافتن از تو شد؟`},
      {ar:`إِلٰهِى فَاجْعَلْنا مِمَّنِ اصْطَفَيْتَهُ لِقُرْبِكَ وَوِلايَتِكَ، وَأَخْلَصْتَهُ لِوُدِّكَ وَمَحَبَّتِكَ، وَشَوَّقْتَهُ إِلَىٰ لِقائِكَ، وَرَضَّيْتَهُ بِقَضائِكَ، وَمَنَحْتَهُ بِالنَّظَرِ إِلَىٰ وَجْهِكَ، وَحَبَوْتَهُ بِرِضَاكَ، وَأَعَذْتَهُ مِنْ هَجْرِكَ وَقِلَاكَ، وَبَوَّأْتَهُ مَقْعَدَ الصِّدْقِ فِى جِوارِكَ، وَخَصَصْتَهُ بِمَعْرِفَتِكَ، وَأَهَّلْتَهُ لِعِبادَتِكَ، وَهَيَّمْتَ قَلْبَهُ لِإِرادَتِكَ، وَاجْتَبَيْتَهُ لِمُشَاهَدَتِكَ؛ وَأَخْلَيْتَ وَجْهَهُ لَكَ، وَفَرَّغْتَ فُؤادَهُ لِحُبِّكَ، وَرَغَّبْتَهُ فِيما عِنْدَكَ، وَأَلْهَمْتَهُ ذِكْرَكَ، وَأَوْزَعْتَهُ شُكْرَكَ، وَشَغَلْتَهُ بِطَاعَتِكَ، وَصَيَّرْتَهُ مِنْ صَالِحِى بَرِيَّتِكَ، وَاخْتَرْتَهُ لِمُنَاجَاتِكَ، وَقَطَعْتَ عَنْهُ كُلَّ شَىْءٍ يَقْطَعُهُ عَنْكَ.`, fa:`خدایا، ما را از کسانی قرار ده که برای قرب ولایتت برگزیدی و برای دوستی و محبتت خالص نمودی و برای دیدارت مشتاق کردی و به قضایت راضی ساختی و نعمت نگاه به جمالت را عطایش کردی و به خشنودی‌ات از او حمایت کردی و از غم هجران و دوری‌ات پناه دادی و در جوارت در جایگاه راستی جای دادی و به شناخت خود مخصوصشان کردی و برای بندگی‌ات سزاوارش نمودی و به اراده‌ات دلباخته‌اش کردی و برای تماشای جمالت برگزیدی؛ و رویش را برای خود از غیر، پاک کردی و دلش را برای عشقت تهی نمودی و آن را به‌سوی آنچه نزد توست مشتاق فرمودی و یادت را به او الهام کردی و سپاس‌گزاری‌ات را نصیبش نمودی و به طاعتت مشغول ساختی و او را از بندگان شایسته‌ات گرداندی و برای راز و نیازت انتخاب کردی و جدا کردی از او هرچه که او را از تو جدا می‌کند.`},
      {ar:`اللّٰهُمَّ اجْعَلْنا مِمَّنْ دَأْبُهُمُ الارْتِياحُ إِلَيْكَ وَالْحَنِينُ، وَدَهْرُهُمُ الزَّفْرَةُ وَالْأَنِينُ، جِباهُهُمْ سَاجِدَةٌ لِعَظَمَتِكَ، وَعُيُونُهُمْ سَاهِرَةٌ فِى خِدْمَتِكَ، وَدُمُوعُهُمْ سَائِلَةٌ مِنْ خَشْيَتِكَ، وَقُلُوبُهُمْ مُتَعَلِّقَةٌ بِمَحَبَّتِكَ، وَأَفْئِدَتُهُمْ مُنْخَلِعَةٌ مِنْ مَهَابَتِكَ؛ يَا مَنْ أَنْوارُ قُدْسِهِ لِأَبْصَارِ مُحِبِّيهِ رَائِقَةٌ، وَسُبُحَاتُ وَجْهِهِ لِقُلُوبِ عَارِفِيهِ شَائِفَةٌ، يَا مُنَىٰ قُلُوبِ الْمُشْتَاقِينَ، وَيَا غَايَةَ آمَالِ الْمُحِبِّينَ، أَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَحُبَّ كُلِّ عَمَلٍ يُوصِلُنِى إِلَىٰ قُرْبِكَ، وَأَنْ تَجْعَلَكَ أَحَبَّ إِلَىَّ مِمَّا سِوَاكَ، وَأَنْ تَجْعَلَ حُبِّى إِيَّاكَ قائِداً إِلَىٰ رِضْوَانِكَ، وَشَوْقِى إِلَيْكَ ذائِداً عَنْ عِصْيانِكَ، وَامْنُنْ بِالنَّظَرِ إِلَيْكَ عَلَىَّ، وَانْظُرْ بِعَيْنِ الْوُدِّ وَالْعَطْفِ إِلَىَّ، وَلَا تَصْرِفْ عَنِّى وَجْهَكَ، وَاجْعَلْنِى مِنْ أَهْلِ الْإِسْعادِ وَالْحُِظْوَةِ عِنْدَكَ، يَا مُجِيبُ، يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`خدایا ما را از کسانی قرار ده که شیوه‌هایشان و اشتیاقشان آرام گرفتن به درگاه توست و روزگارشان آه و ناله است و پیشانی‌شان در پیشگاه عظمتت بر سجده و دیدگانشان در خدمتت بی‌خواب و اشکشان از ترس تو روان و دل‌هاشان به عشقت آویخته و قلوبشان از حرمت و ارجمندی‌ات از جا کنده است؛ ای آن‌که انوار قدسش برای دیدگان عاشقانش جلوه‌گر است و شکوه و عظمت دانشش برای قلوب عارفانش دیدنی است، ای آرمان دل مشتاقان، ای نهایت آروزهای عاشقان، از تو می‌خواهم دوستی خودت را و دوستی آنان‌که تو را دوست دارند و دوستی هر کاری که مرا به میدان قرب تو می‌رساند و اینکه خودت را نزد من محبوب‌تر از دیگران قرار دهی و عشقم را به وجودت راهبر به‌سوی خرسندی‌ات گردانی و شوقم را به حضرتت بازدارنده از نافرمانی‌ات سازی، خدایا تماشای زیبایی وجودت را بر من منّت گذار و به من به دیده عشق و عاطفه بنگر و رویت از من متاب و مرا نزد خود از اهل خوشبختی و بهره‌مندی قرار ده، ای اجابت‌کننده، ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات محبین، مناجات کسی است که با محبت و عشق الهی زندگی می‌کند و از خداوند طلب عشق و محبت بیشتر می‌کند.'
  },
  {
    id:'kh_10', number:'۱۰', category:'خمس عشر',
    title:'مناجاة المتوسلين',
    subtitle:'مناجات توسل‌جویان',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`إِلٰهِى لَيْسَ لِى وَسِيلَةٌ إِلَيْكَ إِلّا عَوَاطِفُ رَأْفَتِكَ، وَلَا لِى ذَرِيعَةٌ إِلَيْكَ إِلّا عَوَارِفُ رَحْمَتِكَ، وَشَفَاعَةُ نَبِيِّكَ نَبِيِّ الرَّحْمَةِ، وَمُنْقِذِ الْأُمَّةِ مِنَ الْغُمَّةِ، فَاجْعَلْهُما لِى سَبَباً إِلَىٰ نَيْلِ غُفْرانِكَ، وَصَيِّرْهُما لِى وُصْلَةً إِلَى الْفَوْزِ بِرِضْوانِكَ، وَقَدْ حَلَّ رَجائِى بِحَرَمِ كَرَمِكَ، وَحَطَّ طَمَعِى بِفِناءِ جُودِكَ، فَحَقِّقْ فِيكَ أَمَلِى، وَاخْتِمْ بِالْخَيْرِ عَمَلِى، وَاجْعَلْنِى مِنْ صَفْوَتِكَ الَّذِينَ أَحْلَلْتَهُمْ بُحْبُوحَةَ جَنَّتِكَ، وَبَوَّأْتَهُمْ دَارَ كَرامَتِكَ؛ وَأَقْرَرْتَ أَعْيُنَهُمْ بِالنَّظَرِ إِلَيْكَ يَوْمَ لِقائِكَ، وَأَوْرَثْتَهُمْ مَنَازِلَ الصِّدْقِ فِى جِوارِكَ.`, fa:`معبودم، به پیشگاهت وسیله‌ای جز عواطف مهرت ندارم و به درگاهت دست‌آویزی جز از آنچه از رحمتت شناخته شده و جز شفاعت پیامبرت، پیامبر رحمت و رهایی‌بخش امت از رنج و ناراحتی ندارم، خدایا! این دو وسیله را برای من سبب رسیدن به آمرزشت قرار ده و آن دو را رابطه‌ای برای دست‌یابی به خشنودی‌ات گردان، همانا امیدم به حریم کرمت فرود آمده و مرکب طعمم به آستانه جودت بار انداخته است، پس درباره خودت آرزویم را محقّق ساز و کارم را به خیر پایان ده و مرا از آن برگزیدگانی قرار ده که در میان بهشت قرارشان دادی و در خانه کرامتت جایشان؛ و دیده آنان را در روز قیامت با نگاه به‌سوی جمال خود روشن نمودی و جایگاه راستی را در جوارت به آنان واگذار نمودی.`},
      {ar:`يَا مَنْ لَايَفِدُ الْوَافِدُونَ عَلَىٰ أَكْرَمَ مِنْهُ، وَلَا يَجِدُ الْقَاصِدُونَ أَرْحَمَ مِنْهُ، يَا خَيْرَ مَنْ خَلَا بِهِ وَحِيدٌ، وَيَا أَعْطَفَ مَنْ أَوَىٰ إِلَيْهِ طَرِيدٌ، إِلَىٰ سَعَةِ عَفْوِكَ مَدَدْتُ يَدِى، وَبِذَيْلِ كَرَمِكَ أَعْلَقْتُ كَفِّى، فَلا تُولِنِى الْحِرْمَانَ، وَلَا تُبْلِنِى بِالْخَيْبَةِ وَالْخُسْرانِ، يَا سَمِيعَ الدُّعاءِ، يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`ای آن‌که باریافتگان بر کریم‌تر از او بار نیابند و قصدکنندگان مهربان‌تر از او را نیابند، ای بهترین کسی که شخص تک و تنها با او خلوت کند و ای مهربان‌ترین کسی که انسان رانده به‌جانب او روی می‌آورد، به‌سوی گستردگی گذشت و بخششت دست گدایی دراز کردم و به دامن کرمت چنگ آویختم، مرا سزاوار محرومیت مکن و به ناامیدی و زیان دچار مساز، ای شنوای دعا، ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات متوسلین، مناجات کسی است که به وسیله‌ی اهل بیت (ع) به درگاه الهی توسل می‌جوید.'
  },
  {
    id:'kh_11', number:'۱۱', category:'خمس عشر',
    title:'مناجاة المفتقرين',
    subtitle:'مناجات نیازمندان',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`إِلٰهِى كَسْرِى لَايَجْبُرُهُ إِلّا لُطْفُكَ وَحَنانُكَ، وَفَقْرِى لَايُغْنِيهِ إِلّا عَطْفُكَ وَإِحْسَانُكَ، وَرَوْعَتِى لَايُسَكِّنُها إِلّا أَمانُكَ، وَذِلَّتِى لَايُعِزُّها إِلّا سُلْطانُكَ، وَأُمْنِيَّتِى لَايُبَلِّغُنِيها إِلّا فَضْلُكَ، وَخَلَّتِى لَايَسُدُّها إِلّا طَوْلُكَ، وَحَاجَتِى لَا يَقْضِيها غَيْرُكَ، وَكَرْبِى لَايُفَرِّجُهُ سِوَىٰ رَحْمَتِكَ، وَضُرِّى لَايكْشِفُهُ غَيْرُ رَأْفَتِكَ، وَغُلَّتِى لَايُبَرِّدُها إِلّا وَصْلُكَ، وَلَوْعَتِى لَايُطْفِيها إِلّا لِقاؤُكَ، وَشَوْقِى إِلَيْكَ لَايَبُلُّهُ إِلّا النَّظَرُ إِلىٰ وَجْهِكَ، وَقَرارِى لَايَقِرُّ دُونَ دُنُوِّى مِنْكَ؛ وَلَهْفَتِى لَا يَرُدُّها إِلّا رَوْحُكَ، وَسُقْمِى لَايَشْفِيهِ إِلّا طِبُّكَ، وَغَمِّى لَايُزِيلُهُ إِلّا قُرْبُكَ، وَجُرْحِى لَايُبْرِئُهُ إِلّا صَفْحُكَ، وَرَيْنُ قَلْبِى لَايَجْلُوهُ إِلّا عَفْوُكَ، وَوَسْوَاسُ صَدْرِى لَايُزِيحُهُ إِلّا أَمْرُكَ.`, fa:`معبودم، شکستگی‌ام را جز لطف و محبتت جبران نکند و تهیدستی‌ام را به بی‌نیازی نرساند جز مهر و احسانت و هراسم را جز امان تو آرام ننماید و خواری‌ام را جز توانایی‌ات به عزّت تبدیل نکند و مرا جز احسانت به آرزویم نرساند و شکاف فقرم را جز نیکی و محبتت پر نکند و حاجتم را کسی جز تو برنیاورد و غم‌زدگی‌ام را جز رحمتت برطرف نکند و بدحالی‌ام را جز مهرت نگشاید و سوز سینه‌ام را جز وصل تو خنک نکند و آتش درونم را جز دیدارت خاموش نگرداند و بر حرارت شوقم به تو جز نگاه به جمالت آب نریزد و آرامشم بدون نزدیک شدن به حضرتت برقرار نشود؛ و حسرتم را جز نسیم رحمتت برنگرداند و بیماری‌ام را جز درمانت شفا ندهد و غمم را جز مقام قربت برطرف نسازد و زخمم را جز چشم‌پوشی‌ات التیام ندهد و آلودگی دلم را جز گذشت تو صیقل ندهد و وسواس سینه‌ام را جز فرمانت از میان برد.`},
      {ar:`فَيَا مُنْتَهىٰ أَمَلِ الْآمِلِينَ، وَيَا غَايَةَ سُؤْلِ السَّائِلِينَ، وَيَا أَقْصَىٰ طَلِبَةِ الطَّالِبِينَ، وَيَا أَعْلَىٰ رَغْبَةِ الرَّاغِبِينَ، وَيَا وَلِىَّ الصَّالِحِينَ، وَيَا أَمانَ الْخَائِفِينَ، وَيَا مُجِيبَ دَعْوَةِ الْمُضْطَرِّينَ، وَيَا ذُخْرَ الْمُعْدِمِينَ، وَيَا كَنْزَ الْبَائِسِينَ، وَيَا غِيَاثَ الْمُسْتَغِيثِينَ؛ وَيَا قَاضِىَ حَوَائِجِ الْفُقَرَاءِ وَالْمَسَاكِينِ، وَيَا أَكْرَمَ الْأَكْرَمِينَ، وَيَا أَرْحَمَ الرَّاحِمِينَ، لَكَ تَخَضُّعِى وَسُؤالِى، وَإِلَيْكَ تَضَرُّعِى وَابْتِهالِى، أَسْأَلُكَ أَنْ تُنِيلَنِى مِنْ رَوْحِ رِضْوانِكَ، وَتُدِيمَ عَلَىَّ نِعَمَ امْتِنانِكَ، وَهَا أَنَا بِبابِ كَرَمِكَ واقِفٌ، وَلِنَفَحاتِ بِرِّكَ مُتَعَرِّضٌ، وَبِحَبْلِكَ الشَّدِيدِ مُعْتَصِمٌ، وَبِعُرْوَتِكَ الْوُثْقىٰ مُتَمَسِّكٌ.`, fa:`ای نهایت آرزوی آرزومندان، ای هدف خواهش خواهندگان، ای دورترین مطلوب جویندگان، ای والاترین اشتیاق مشتاقان، ای سرپرست شایستگان، ای امان ترسیدگان، ای اجابت‌کننده دعای بیچارگان، ای ذخیره ناداران، ای گنج بینوایان، ای فریادرس دادخواهان؛ ای برآورنده حاجات تهیدستان و بر خاک‌نشستگان، ای کریم‌ترین کریمان، ای مهربان‌ترین مهربانان، فروتنی و خواهشم به پیشگاه توست و زاری و ناله‌ام به‌سوی تو، از تو می‌خواهم مرا به نسیم خرسندی‌ات برسانی و نعمت‌های نیکویت را بر من تداوم بخشی، من اینک بر در خانه کرمت ایستاده‌ام و در معرض نسیم‌های نیکی‌ات قرار دارم و به رشته محکمت چنگ زده‌ام و به دست‌آویز استوارت دست آویختم.`},
      {ar:`إِلٰهِى ارْحَمْ عَبْدَكَ الذَّلِيلَ، ذَا اللِّسَانِ الْكَلِيلِ، وَالْعَمَلِ الْقَلِيلِ، وَامْنُنْ عَلَيْهِ بِطَوْلِكَ الْجَزِيلِ، وَاكْنُفْهُ تَحْتَ ظِلِّكَ الظَّلِيلِ، يَا كَرِيمُ يَا جَمِيلُ، يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`خدایا بر بنده خوارت که زبانش از گفتن ناتوان و عملش اندک است رحم کن و با احسان پیوسته و برجسته‌ات بر او منّت گذار و او را زیر سایه بلندت حمایت کن، ای گرامی، ای زیبا، ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات مفتقرین، مناجات کسی است که به فقر و نیازمندی خود در پیشگاه الهی اعتراف می‌کند.'
  },
  {
    id:'kh_12', number:'۱۲', category:'خمس عشر',
    title:'مناجاة العارفين',
    subtitle:'مناجات عارفان',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`إِلٰهِى قَصُرَتِ الْأَلْسُنُ عَنْ بُلُوغِ ثَنائِكَ كَما يَلِيقُ بِجَلالِكَ، وَعَجَزَتِ الْعُقُولُ عَنْ إِدْراكِ كُنْهِ جَمالِكَ، وَانْحَسَرَتِ الْأَبْصارُ دُونَ النَّظَرِ إِلىٰ سُبُحاتِ وَجْهِكَ، وَلَمْ تَجْعَلْ لِلْخَلْقِ طَرِيقاً إِلىٰ مَعْرِفَتِكَ، إِلّا بِالْعَجْزِ عَنْ مَعْرِفَتِكَ.`, fa:`معبودم، زبان‌ها از ادای ثنایت آن‌چنان‌که شایسته عظمت توست کوتاه است و خردها از درک ژرفای جمالت ناتوان است و دیده‌ها از تماشای بزرگی‌های ذاتت درمانده است، برای انسان‌ها راهی به‌سوی شناسایی‌ات جز ناتوانی از شناختت قرار ندادی.`},
      {ar:`إِلٰهِى فَاجْعَلْنا مِنَ الَّذِينَ تَرَسَّخَتْ أَشْجارُ الشَّوْقِ إِلَيْكَ فِى حَدائِقِ صُدُورِهِمْ، وَأَخَذَتْ لَوْعَةُ مَحَبَّتِكَ بِمَجامِعِ قُلُوبِهِمْ، فَهُمْ إِلَىٰ أَوْكارِ الْأَفْكارِ يَأْوُونَ، وَفِى رِياضِ الْقُرْبِ وَالْمُكاشَفَةِ يَرْتَعُونَ، وَمِنْ حِيَاضِ الْمَحَبَّةِ بِكَأْسِ الْمُلاطَفَةِ يَكْرَعُونَ؛ وَشَرائِعَ الْمُصافاةِ يَرِدُونَ، قَدْ كُشِفَ الْغِطاءُ عَنْ أَبْصارِهِمْ، وَانْجَلَتْ ظُلْمَةُ الرَّيْبِ عَنْ عَقائِدِهِمْ وَضَمائِرِهِمْ، وَانْتَفَتْ مُخالَجَةُ الشَّكِّ عَنْ قُلُوبِهِمْ وَسَرائِرِهِمْ، وَانْشَرَحَتْ بِتَحْقِيقِ الْمَعْرِفَةِ صُدُورُهُمْ، وَعَلَتْ لِسَبْقِ السَّعادَةِ فِى الزَّهادَةِ هِمَمُهُمْ، وَعَذُبَ فِى مَعِينِ الْمُعامَلَةِ شِرْبُهُمْ، وَطابَ فِى مَجْلِسِ الْأُنْسِ سِرُّهُمْ، وَأَمِنَ فِى مَوْطِنِ الْمَخافَةِ سِرْبُهُمْ، وَاطْمَأَنَّتْ بِالرُّجُوعِ إِلىٰ رَبِّ الْأَرْبابِ أَنْفُسُهُمْ؛ وَتَيَقَّنَتْ بِالْفَوْزِ وَالْفَلاحِ أَرْواحُهُمْ، وَقَرَّتْ بِالنَّظَرِ إِلىٰ مَحْبُوبِهِمْ أَعْيُنُهُمْ، وَاسْتَقَرَّ بِإِدْراكِ السُّؤْلِ وَنَيْلِ الْمَأْمُولِ قَرارُهُمْ، وَرَبِحَتْ فِى بَيْعِ الدُّنْيا بِالْآخِرَةِ تِجارَتُهُمْ.`, fa:`معبودم، ما را از کسانی قرار ده که شاخسارهای اشتیاق به سویت در بوستان‌های سینه‌هایشان استوار و پابرجا شده است و سوز عشقت در کانون دل‌هایشان برافروخته، از این روی به آشیانه اندیشه‌های والا جای گیرند و در گلستان قرب و مکاشفه‌ات خوش‌گذرانی می‌کنند و از حوض‌های محبّتت با جام ملاطفت می‌نوشند؛ و در کنار نهرهای حسن‌نیّت و خیرخواهی‌ات وارد می‌شوند، درحالی‌که پرده از دیدگانشان برداشته شده و تاریکی دودلی از باورها و درون‌هایشان دور گشته و خلجان شک از دل‌ها و باطنشان بیرون رفته و سینه‌هایشان با تحقّق معرفت گشوده شده و همّتشان برای پیشی گرفتن در میدان خوشبختی بر اثر زهد بلندی گرفته و نوشیدنشان در چشمه زلال کردار گوارا شده و باطنشان در مجلس انس پاکیزه گشته و راهشان در جای ترسناک ایمنی یافته و جانشان با رجوع به رب الارباب اطمینان یافته؛ و ارواحشان به نیکبختی و رستگاری یقین یافته و دیدگانشان با نظر به محبوبشان روشنی گرفته و آرامششان با دریافت خواهش و رسیدن به آرزو استقرار یافته و تجارتشان در فروش دنیا به آخرت سودبخش بوده.`},
      {ar:`إِلٰهِى مَا أَلَذَّ خَواطِرَ الْإِلْهامِ بِذِكْرِكَ عَلَى الْقُلُوبِ! وَمَا أَحْلَى الْمَسِيرَ إِلَيْكَ بِالْأَوْهامِ فِى مَسالِكِ الْغُيُوبِ! وَمَا أَطْيَبَ طَعْمَ حُبِّكَ! وَمَا أَعْذَبَ شِرْبَ قُرْبِكَ، فَأَعِذْنا مِنْ طَرْدِكَ وَإِبْعادِكَ، وَاجْعَلْنا مِنْ أَخَصِّ عَارِفِيكَ، وَأَصْلَحِ عِبَادِكَ، وَأَصْدَقِ طَائِعِيكَ، وَأَخْلَصِ عُبَّادِكَ، يَا عَظِيمُ يَا جَلِيلُ، يَا كَرِيمُ يَا مُنِيلُ، بِرَحْمَتِكَ وَمَنِّكَ يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`خدایا چه لذّت‌بخش است در دل‌ها خاطرات الهام گرفته از یادت و چقدر شیرین است پویش به‌سوی تو با مرکب اندیشه‌ها در راه‌های غیب و طعم عشقت چه خوش و شربت مقام قربت چقدر گوارا است، پس ما را از راندن و دور کردنت پناه ده و از ویژه‌ترین عارفانت و شایسته‌ترین بندگانت و راست‌گوترین فرمان‌برانت و خالص‌ترین پرستندگانت قرار ده، ای بزرگ، ای باشکوه، ای مهمان‌نواز، ای رساننده به مطلوب، به رحمتت و احسانت، به مهربانی‌ات ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات عارفین، مناجات کسی است که به مقام معرفت الهی رسیده و در پی شناخت بیشتر خداوند است.'
  },
  {
    id:'kh_13', number:'۱۳', category:'خمس عشر',
    title:'مناجاة الذاكرين',
    subtitle:'مناجات یادکنندگان',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`اللَّهُمَّ إِنَّكَ قُلْتَ وَقَوْلُكَ الْحَقُّ: ﴿وَسَبِّحُوهُ بُكْرَةً وَأَصِيلاً﴾، وَقُلْتَ وَقَوْلُكَ الْحَقُّ: ﴿اذْكُرُونِي أَذْكُرْكُمْ﴾؛ فَأَمَرْتَنا بِذِكْرِكَ وَوَعَدْتَنا أَنْ تَذْكُرَنا تَشْرِيفاً لَنا وَتَفْخِيماً وَإِعْظَاماً، وَهَا نَحْنُ ذَاكِرُوكَ كَما أَمَرْتَنا، فَأَنْجِزْ لَنا مَا وَعَدْتَنا، يَا ذاكِرَ الذَّاكِرِينَ، وَيَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`خدایا تو گفتی و گفتارت حق است که: «و صبح و شام او را با تسبیح گفتن [از هر عیب و نقصی] پاک و منزّه بدارید» و تو گفتی و گفتارت حق است: «[چنانچه خوش‌بختی دنیا و آخرت را می‌خواهید] مرا [به عنوان معبود حقیقی قلباً] مورد توجه قرار دهید تا [با پاداش ویژه‌ام] شما را مورد عنایت خاص خود قرار دهم» ما را به یاد کردنت فرمان دادی و وعده فرمودی که تو نیز از روی گرامی‌داشت و تمجید و بلندمرتبه شدن و بزرگ شدن، ما را یاد کنی، اکنون برابر با فرمانت تو را یاد می‌کنیم، پس تو نیز به وعده‌ات وفا کن، ای یادآور یادکنندگان و ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات ذاکرین، مناجات کسی است که به یاد همیشگی خداوند پرداخته و از او می‌خواهد که به وعده‌اش عمل کند.'
  },
  {
    id:'kh_14', number:'۱۴', category:'خمس عشر',
    title:'مناجاة المعتصمين',
    subtitle:'مناجات پناه‌جویان',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`اللّٰهُمَّ يَا مَلاذَ اللَّائِذِينَ، وَيَا مَعَاذَ الْعَائِذِينَ، وَيَا مُنْجِىَ الْهَالِكِينَ، وَيَا عَاصِمَ الْبَائِسِينَ، وَيَا رَاحِمَ الْمَساكِينِ، وَيَا مُجِيبَ الْمُضْطَرِّينَ، وَيَا كَنْزَ الْمُفْتَقِرِينَ، وَيَا جابِرَ الْمُنْكَسِرِينَ، وَيَا مَأْوَى الْمُنْقَطِعِينَ، وَيَا نَاصِرَ الْمُسْتَضْعَفِينَ، وَيَا مُجِيرَ الْخائِفِينَ، وَيَا مُغِيثَ الْمَكْرُوبِينَ، وَيَا حِصْنَ اللَّاجِينَ، إِنْ لَمْ أَعُذْ بِعِزَّتِكَ فَبِمَنْ أَعُوذُ؟ وَإِنْ لَمْ أَلُذْ بِقُدْرَتِكَ فَبِمَنْ أَلُوذُ؟`, fa:`خدایا، ای پشتیبان پناه‌جویان و ای پناه پناهندگان و ای رهایی‌بخش هلاک‌شدگان و ای نگهدار بینوایان و ای مهرورز به مستمندان و ای اجابت‌کننده درماندگان و ای گنجینه تهیدستان و ای جبران‌کننده شکست‌خوردگان و ای جایگاه آوارگان و ای یاور ناتوان‌شمردگان و ای پناه‌دهنده ترسیدگان و ای غمگسار غم‌زدگان و ای دژ پناهندگان، اگر به عزّتت پناه نیاورم پس به که پناه برم و اگر به قدرتت پناهنده نشوم، به که پناهنده شوم؟`},
      {ar:`وَقَدْ أَلْجَأَتْنِى الذُّنُوبُ إِلَى التَّشَبُّثِ بِأَذْيَالِ عَفْوِكَ، وَأَحْوَجَتْنِى الْخَطَايَا إِلَى اسْتِفْتاحِ أَبْوابِ صَفْحِكَ؛ وَدَعَتْنِى الْإِساءَةُ إِلَى الْإِناخَةِ بِفِناءِ عِزِّكَ، وَحَمَلَتْنِى الْمَخافَةُ مِنْ نِقْمَتِكَ عَلَى التَّمَسُّكِ بِعُرْوَةِ عَطْفِكَ، وَمَا حَقُّ مَنِ اعْتَصَمَ بِحَبْلِكَ أَنْ يُخْذَلَ، وَلَا يَلِيقُ بِمَنِ اسْتَجَارَ بِعِزِّكَ أَنْ يُسْلَمَ أَوْ يُهْمَلَ.`, fa:`گناهان وادارم ساخته که به دامان گذشتت چنگ زنم و خطاها محتاجم کرده که از تو خواهم، درهای چشم‌پوشی‌ات را بر من بگشایی؛ و بدی‌ها مرا فراخوانده تا به آستان عزّتت بار اندازم و هراس از انتقام وادارم کرده که به دستاویز مهرت چنگ زنم، کسی که به ریسمانت چنگ زده سزاوار نیست خوار گردد و آن‌که به عزّتت پناهنده شده، شایسته نیست رها گردد یا واگذاشته شود.`},
      {ar:`إِلٰهِى فَلا تُخْلِنا مِنْ حِمَايَتِكَ، وَلَا تُعْرِنا مِنْ رِعَايَتِكَ، وَذُدْنا عَنْ مَوارِدِ الْهَلَكَةِ، فَإِنَّا بِعَيْنِكَ وَفِى كَنَفِكَ وَلَكَ، أَسْأَلُكَ بِأَهْلِ خَاصَّتِكَ مِنْ مَلَائِكَتِكَ وَالصَّالِحِينَ مِنْ بَرِيَّتِكَ، أَنْ تَجْعَلَ عَلَيْنا واقِيَةً تُنْجِينا مِنَ الْهَلَكَاتِ، وَتُجَنِّبُنا مِنَ الْآفاتِ، وَتُكِنُّنا مِنْ دَوَاهِى الْمُصِيبَاتِ، وَأَنْ تُنْزِلَ عَلَيْنا مِنْ سَكِينَتِكَ، وَأَنْ تُغَشِّىَ وُجُوهَنا بِأَنْوارِ مَحَبَّتِكَ، وَأَنْ تُؤْوِيَنا إِلَىٰ شَدِيدِ رُكْنِكَ، وَأَنْ تَحْوِيَنا فِى أَكْنافِ عِصْمَتِكَ، بِرَأْفَتِكَ وَرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`خدایا ما را از حمایتت محروم مکن و از پوشش توجه و حمایتت برهنه مساز و از پرتگاه‌های هلاکت دورم کن، زیرا ما در سایه توجه تو و در حمایت تو به سر می‌بریم و از توییم، از تو می‌خواهم به‌حق خاصان از فرشتگانت و شایستگان از بندگانت که برای ما سپری قرار دهی که ما را از هلاکت‌ها برهاند و از آفات برکنار دارد و از بلاهای سخت نگهداری کند و هم اینکه آرامش خود را بر ما نازل کنی و چهره‌های ما را به انوار محبتت پرفروغ گردانی و ما را در پناهگاه استوارت پناه دهی و در کناره‌های نگهداری خویش بگنجانی، به‌حق مهر و رحمتت ای مهربان‌ترین مهربانان.`}
    ],
    fazilat:'مناجات معتصمین، مناجات کسی است که به خداوند پناه برده و از او حفظ و حمایت می‌خواهد.'
  },
  {
    id:'kh_15', number:'۱۵', category:'خمس عشر',
    title:'مناجاة الزاهدين',
    subtitle:'مناجات زاهدان',
    source:'صحیفه سجادیه — مناجات خمس عشر',
    verses:[
      {ar:`إِلٰهِى أَسْكَنْتَنا داراً حَفَرَتْ لَنا حُفَرَ مَكْرِها، وَعَلَّقَتْنا بِأَيْدِى الْمَنايا فِى حَبَائِلِ غَدْرِها، فَإِلَيْكَ نَلْتَجِئُ مِنْ مَكَائِدِ خُدَعِها، وَبِكَ نَعْتَصِمُ مِنَ الاغْتِرارِ بِزَخَارِفِ زِينَتِها، فَإِنَّهَا الْمُهْلِكَةُ طُلَّابَهَا، الْمُتْلِفَةُ حُلَّالَهَا، الْمَحْشُوَّةُ بِالْآفاتِ، الْمَشْحُونَةُ بِالنَّكَبَاتِ.`, fa:`معبودم، ما را در خانه‌ای ساکن کرده‌ای که گودال‌های فریبش را برای ما آماده ساخته و در شبکه‌های خیانتش به دست‌های مرگ آویخته، از دام‌های فریبش به تو پناه می‌آوریم و چنگ می‌زنیم از مغرور شدن به زیورهای آراسته‌اش به عنایت تو که این دنیا خواهندگانش را هلاک می‌سازد و واردینش را نابود می‌کند، آکنده به آفت‌هاست، انباشته از نکبت‌هاست.`},
      {ar:`إِلٰهِى فَزَهِّدْنا فِيها، وَسَلِّمْنا مِنْها بِتَوْفِيقِكَ وَعِصْمَتِكَ، وَانْزَعْ عَنَّا جَلابِيبَ مُخالَفَتِكَ، وَتَوَلَّ أُمُورَنا بِحُسْنِ كِفايَتِكَ؛ وَأَوْفِرْ مَزِيدَنا مِنْ سَعَةِ رَحْمَتِكَ، وَأَجْمِلْ صِلاتِنا مِنْ فَيْضِ مَواهِبِكَ، وَاغْرِسْ فِى أَفْئِدَتِنا أَشْجارَ مَحَبَّتِكَ، وَأَتْمِمْ لَنا أَنْوارَ مَعْرِفَتِكَ، وَأَذِقْنا حَلاوَةَ عَفْوِكَ وَلَذَّةَ مَغْفِرَتِكَ، وَأَقْرِرْ أَعْيُنَنا يَوْمَ لِقائِكَ بِرُؤْيَتِكَ، وَأَخْرِجْ حُبَّ الدُّنْيا مِنْ قُلُوبِنا كَما فَعَلْتَ بِالصَّالِحِينَ مِنْ صَفْوَتِكَ وَالْأَبْرارِ مِنْ خَاصَّتِكَ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ، وَيَا أَكْرَمَ الْأَكْرَمِينَ.`, fa:`خدایا ما را به دنیا بی‌رغبت کن و به توفیق و عصمتت ما را از آن سلامت بدار و جامه‌های مخالفت را از هستی‌مان برکن و با حسن کفایتت امور ما را سرپرستی فرما؛ و فزونی سهم ما را از رحمت گسترده‌ات کامل گردان و از چشمه‌سار مواهبت عطای ما را نیکو کن و در سرزمین دل‌های ما درختان محبتت را بکار و انوار معرفتت را بر ما کامل کن و شیرینی گذشت و لذّت آمرزشت را به ما بچشان و دیدگان ما را در جهان دیگر به دیدارت روشن کن و محبّت دنیا را از دل ما بیرون بر، آن‌گونه که درباره نیکوکاران برگزیده‌ات و خاصان نیکوکردارت انجام دادی، به‌حق مهربانی‌ات ای مهربان‌ترین مهربانان و ای گرامی‌ترین گرامیان.`}
    ],
    fazilat:'مناجات زاهدین، مناجات کسی است که از دنیا و زخارف آن روی گردانده و به آخرت مشتاق است.'
  },

  /* ============ مناجات امیرالمؤمنین ============ */
  {
    id:'amir_01', number:'۱', category:'امیرالمؤمنین',
    title:'مناجات امیرالمؤمنین (ع)',
    subtitle:'مناجات معروف حضرت علی (ع)',
    source:'صحیفه علویه — مناجات امیرالمؤمنین (ع)',
    verses:[
      {ar:`اللَّهُمَّ إِنِّي أَسْأَلُكَ الْأَمَانَ ﴿يَوْمَ لا يَنْفَعُ مَالٌ وَ لا بَنُونَ، إِلّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ﴾ وَ أَسْأَلُكَ الْأَمَانَ ﴿يَوْمَ يَعَضُّ الظَّالِمُ عَلَى يَدَيْهِ يَقُولُ يَا لَيْتَنِي اتَّخَذْتُ مَعَ الرَّسُولِ سَبِيلا﴾ وَ أَسْأَلُكَ الْأَمَانَ يَوْمَ ﴿يُعْرَفُ الْمُجْرِمُونَ بِسِيمَاهُمْ، فَيُؤْخَذُ بِالنَّوَاصِي وَ الْأَقْدَامِ﴾ وَ أَسْأَلُكَ الْأَمَانَ ﴿يَوْمَ لا يَجْزِي وَالِدٌ عَنْ وَلَدِهِ وَ لا مَوْلُودٌ هُوَ جَازٍ عَنْ وَالِدِهِ شَيْئاً، إِنَّ وَعْدَ اللَّهِ حَقٌّ﴾`, fa:`خدایا از تو امان می‌خواهم، «روزی که هیچ مال و اولادی سود نمی‌دهد، مگر کسی که قلبی سالم [از آلودگی‌ها] به پیشگاه خداوند بیاورد»؛ و از تو امان می‌خواهم «روزی که ستمکار [از شدت حسرت] دست‌های خود را به دندان می‌گزد [و] می‌گوید: ای‌کاش همراه این پیامبر راهی [به‌سوی حق] انتخاب می‌کردم!»؛ و از تو امان می‌خواهم روزی که «گناه‌پیشگان را از نشانه‌هایشان می‌شناسند، پس موهای جلوی سر و پاهایشان را می‌گیرند [و به دوزخشان می‌اندازند]»؛ و از تو امان می‌خواهم «روزی که هیچ پدری چیزی [از عذاب را] از فرزندش دفع نمی‌کند و نه هیچ فرزندی برطرف‌کننده چیزی از [عذابِ] پدر خویش است؛ به‌یقین وعده خداوند حق است.»`},
      {ar:`وَ أَسْأَلُكَ الْأَمَانَ ﴿يَوْمَ لا يَنْفَعُ الظَّالِمِينَ مَعْذِرَتُهُمْ، وَ لَهُمُ اللَّعْنَةُ وَ لَهُمْ سُوءُ الدَّارِ﴾ وَ أَسْأَلُكَ الْأَمَانَ ﴿يَوْمَ لا تَمْلِكُ نَفْسٌ لِنَفْسٍ شَيْئا، وَ الْأَمْرُ يَوْمَئِذٍ لِلَّهِ﴾ وَ أَسْأَلُكَ الْأَمَانَ ﴿يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ، وَ أُمِّهِ وَ أَبِيهِ، وَ صَاحِبَتِهِ وَ بَنِيهِ، لِكُلِّ امْرِى ءٍ مِنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ﴾ وَ أَسْأَلُكَ الْأَمَانَ يَوْمَ ﴿يَوَدُّ الْمُجْرِمُ لَوْ يَفْتَدِي مِنْ عَذَابِ يَوْمَئِذٍ بِبَنِيهِ، وَ صَاحِبَتِهِ وَ أَخِيهِ، وَ فَصِيلَتِهِ الَّتِي تُؤْوِيهِ، وَ مَنْ فِي الْأَرْضِ جَمِيعا ثُمَّ يُنْجِيهِ، كَلّا إِنَّهَا لَظَى نَزَّاعَةً لِلشَّوَى﴾`, fa:`و از تو امان می‌خواهم «روزی که عذرخواهی ستمکاران هیچ سودی به حالشان ندارد و برای آنان لعنت و سرای بدی [چون دوزخ] است»؛ و از تو امان می‌خواهم «روزی که کسی از کسی چیزی [از عذاب] را دفع نمی‌کند، در آن روز حکومت و فرمانروایی ویژه خداست»؛ و از تو امان می‌خواهم «روزی که آدمی از برادرش می‌گریزد و از مادر و پدرش و از همسر و فرزندانش؛ در آن روز هرکس از آنان را گرفتاری و کاری است که برای او [از اینکه نتواند به کار دیگر بپردازد] بس است»؛ و از تو امان می‌خواهم روزی که «گناه‌پیشه آرزو می‌کند ای‌کاش می‌توانست فرزندانش را در برابر [نجات از] عذاب آن روز عوض دهد! و همسر و برادرش را و خویشان نزدیکش را که به او پناه می‌دادند و نیز همه کسانی که در زمینند، تا او را [از عذاب] برهانند؛ چنین نیست [که راه نجاتی برایش باشد]، همانا آتش سوزنده زبانه می‌کشد، درحالی‌که اعضا و پوست سر را برمی‌کَند.»`},
      {ar:`مَوْلايَ يَا مَوْلايَ، أَنْتَ الْمَوْلَى وَ أَنَا الْعَبْدُ، وَ هَلْ يَرْحَمُ الْعَبْدَ إِلّا الْمَوْلَى؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْمَالِكُ وَ أَنَا الْمَمْلُوكُ، وَ هَلْ يَرْحَمُ الْمَمْلُوكَ إِلا الْمَالِكُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْعَزِيزُ وَ أَنَا الذَّلِيلُ، وَ هَلْ يَرْحَمُ الذَّلِيلَ إِلّا الْعَزِيزُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْخَالِقُ وَ أَنَا الْمَخْلُوقُ، وَ هَلْ يَرْحَمُ الْمَخْلُوقَ إِلّا الْخَالِقُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْعَظِيمُ وَ أَنَا الْحَقِيرُ، وَ هَلْ يَرْحَمُ الْحَقِيرَ إِلّا الْعَظِيمُ؟`, fa:`مولایم ای مولای من، تو مولایی و من بنده‌ام، آیا رحم می‌کند به بنده جز مولا؟ مولایم ای مولای من، تو مالکی و من بنده‌ام، آیا رحم می‌کند به بنده جز مالک؟ مولایم ای مولای من، تو عزیزی و من خوار، آیا رحم می‌کند به خوار جز عزیز؟ مولایم ای مولای من، تو خالقی و من مخلوق، آیا رحم می‌کند به مخلوق جز خالق؟ مولایم ای مولای من، تو باعظمتی و من ناچیز، آیا رحم می‌کند به ناچیز جز باعظمت؟`},
      {ar:`مَوْلايَ يَا مَوْلايَ، أَنْتَ الْقَوِيُّ وَ أَنَا الضَّعِيفُ، وَ هَلْ يَرْحَمُ الضَّعِيفَ إِلّا الْقَوِيُّ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْغَنِيُّ وَ أَنَا الْفَقِيرُ، وَ هَلْ يَرْحَمُ الْفَقِيرَ إِلّا الْغَنِيُّ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْمُعْطِي وَ أَنَا السَّائِلُ، وَ هَلْ يَرْحَمُ السَّائِلَ إِلا الْمُعْطِي؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْحَيُّ وَ أَنَا الْمَيِّتُ، وَ هَلْ يَرْحَمُ الْمَيِّتَ إِلا الْحَيُّ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْبَاقِي وَ أَنَا الْفَانِي، وَ هَلْ يَرْحَمُ الْفَانِيَ إِلا الْبَاقِي؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الدَّائِمُ وَ أَنَا الزَّائِلُ، وَ هَلْ يَرْحَمُ الزَّائِلَ إِلا الدَّائِمُ؟`, fa:`مولایم ای مولای من، تو نیرومندی و من ناتوان، آیا رحم می‌کند به ناتوان جز نیرومند؟ مولایم ای مولای من، تو بی‌نیازی و من نیازمند، آیا رحم می‌کند به نیازمند جز بی‌نیاز؟ مولایم ای مولای من، تو عطابخشی و من گدا، آیا رحم می‌کند به گدا جز عطابخش؟ مولایم ای مولای من، تو زنده‌ای و من مرده، آیا رحم می‌کند به مرده جز زنده؟ مولایم ای مولای من، تو باقی هستی و من فانی، آیا رحم می‌کند به فانی جز باقی؟ مولایم ای مولای من، تو پاینده‌ای و من از بین‌رونده، آیا رحم می‌کند به از بین‌رونده جز پاینده؟`},
      {ar:`مَوْلايَ يَا مَوْلايَ، أَنْتَ الرَّازِقُ وَ أَنَا الْمَرْزُوقُ، وَ هَلْ يَرْحَمُ الْمَرْزُوقَ إِلا الرَّازِقُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْجَوَادُ وَ أَنَا الْبَخِيلُ، وَ هَلْ يَرْحَمُ الْبَخِيلَ إِلا الْجَوَادُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْمُعَافِي وَ أَنَا الْمُبْتَلَى، وَ هَلْ يَرْحَمُ الْمُبْتَلَى إِلا الْمُعَافِي؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْكَبِيرُ وَ أَنَا الصَّغِيرُ، وَ هَلْ يَرْحَمُ الصَّغِيرَ إِلا الْكَبِيرُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْهَادِي وَ أَنَا الضَّالُّ، وَ هَلْ يَرْحَمُ الضَّالَّ إِلا الْهَادِي؟`, fa:`مولایم ای مولای من، تو روزی‌دهنده‌ای و من روزی‌داده‌شده، آیا رحم می‌کند به روزی‌داده‌شده جز روزی‌دهنده؟ مولایم ای مولای من، تو باسخاوتی و من بخیل، آیا رحم می‌کند به بخیل جز باسخاوت؟ مولایم ای مولای من، تو سلامت‌بخشی و من گرفتار، آیا رحم می‌کند به گرفتار جز سلامت‌بخش؟ مولایم ای مولای من، تو بزرگی و من کوچک، آیا رحم می‌کند به کوچک جز بزرگ؟ مولایم ای مولای من، تو راهنمایی و من گمراه، آیا رحم می‌کند به گمراه جز راهنما؟`},
      {ar:`مَوْلايَ يَا مَوْلايَ، أَنْتَ الرَّحْمَنُ وَ أَنَا الْمَرْحُومُ، وَ هَلْ يَرْحَمُ الْمَرْحُومَ إِلا الرَّحْمَنُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ السُّلْطَانُ وَ أَنَا الْمُمْتَحَنُ، وَ هَلْ يَرْحَمُ الْمُمْتَحَنَ إِلا السُّلْطَانُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الدَّلِيلُ وَ أَنَا الْمُتَحَيِّرُ، وَ هَلْ يَرْحَمُ الْمُتَحَيِّرَ إِلا الدَّلِيلُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْغَفُورُ وَ أَنَا الْمُذْنِبُ، وَ هَلْ يَرْحَمُ الْمُذْنِبَ إِلا الْغَفُورُ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْغَالِبُ وَ أَنَا الْمَغْلُوبُ، وَ هَلْ يَرْحَمُ الْمَغْلُوبَ إِلا الْغَالِبُ؟`, fa:`مولایم ای مولای من، تو رحم‌کننده‌ای و من رحم‌شده، آیا رحم می‌کند به رحم‌شده جز رحم‌کننده؟ مولایم ای مولای من، تو سلطانی و من آزمایش‌شده به بلاها، آیا رحم می‌کند به آزمایش‌شده به بلاها جز سلطان؟ مولایم ای مولای من، تو راهنمایی و من سرگردان، آیا رحم می‌کند به سرگردان جز راهنما؟ مولایم ای مولای من، تو آمرزنده‌ای و من گناهکار، آیا رحم می‌کند به گناهکار جز آمرزنده؟ مولایم ای مولای من، تو پیروزی و من شکست‌خورده، آیا رحم می‌کند به شکست‌خورده جز پیروز؟`},
      {ar:`مَوْلايَ يَا مَوْلايَ، أَنْتَ الرَّبُّ وَ أَنَا الْمَرْبُوبُ، وَ هَلْ يَرْحَمُ الْمَرْبُوبَ إِلا الرَّبُّ؟ مَوْلايَ يَا مَوْلايَ، أَنْتَ الْمُتَكَبِّرُ وَ أَنَا الْخَاشِعُ، وَ هَلْ يَرْحَمُ الْخَاشِعَ إِلا الْمُتَكَبِّرُ؟ مَوْلايَ يَا مَوْلايَ، ارْحَمْنِي بِرَحْمَتِكَ وَ ارْضَ عَنِّي بِجُودِكَ وَ كَرَمِكَ وَ فَضْلِكَ؛ يَا ذَا الْجُودِ وَ الْإِحْسَانِ، وَ الطَّوْلِ وَ الامْتِنَانِ، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.`, fa:`مولایم ای مولای من، تو پرورنده‌ای و من پروریده، آیا رحم می‌کند به پروریده جز پرورنده؟ مولایم ای مولای من، تو بزرگ‌منشی و من فروتن، آیا رحم می‌کند به فروتن جز بزرگ‌منش؟ مولایم ای مولای من، به من رحم کن به رحمتت و به جود و کرم و فضلت از من راضی شو، ای دارای جود و احسان و عطا و مهربانی و محبت، به مهربانی‌ات ای مهربان‌ترین مهربانان.`}

      {ar:`اَللّهُمَّ اَرْسِلْ عَلَىَّ سِجالَ رِزْقِک مِدْراراً، وَ اَمْطِرْ عَلَىَّ سَحآئِبَ اِفْضالِک غِزاراً، وَ اَدِمْ غَیْثَ نَیْلِک اِلَىَّ سِجالاً، وَ اَسْبِلْ مَزیدَ نِعَمِک عَلى خَلَّتى اِسْبالاً، وَ اَفْقِرْنى بِجُودِک اِلَیْک، وَ اَغْنِنى عَمَّنْ یَطْلُبُ ما لَدَیْک، وَ داوِ دآءَ فَقْرى بِدَوآءِ فَضْلِک، وَ انْعَشْ صَرْعَةَ عَیْلَتى بِطَوْلِک، وَ تَصَدَّقْ عَلى اِقْلالى بِکثْرَةِ عَطآئِک، وَ عَلَى اخْتِلالى بِکریمِ حِبآئِک، وَ سَهِّلْ رَبِّ سَبیلَ الرِّزْقِ اِلَىَّ، وَ ثَبِّتْ قَواعِدَهُ لَدَىَّ، وَ بَجِّسْ لى عُیُونَ سَعَتِهِ بِرَحْمَتِک، وَ فَجِّرْ اَنْهارَ رَغَدِ الْعَیْشِ قِبَلى بِرَاْفَتِک، وَ اَجْدِبْ اَرْضَ فَقْرى، وَ اَخْصِبْ جَدْبَ ضُرّى، وَ اصْرِفْ عَنّى فِى الرِّزْقِ الْعَوائِقَ، وَ اَقْطَعْ عَنّى مِنَ الضّیقِ الْعَلائِقَ، وَ ارْمِنى مِنْ سَعَةِ الرِّزْقِ اَللّهُمَّ بِاَسْهُمِهِ الْقاتِلَةِ، وَ احْجُبْنى مِنْ ضیقِهِ بِالْحُجَبِ الْحاجِزَةِ، وَ اَسْغِبْ لى مَغانیَ رِزْقِک طَلَباً، وَ اقْصُرْهُ عَلى دَعَةِ السَّبَبِ، وَ اْجْهَدْ لى فِى الْعَیْشِ السَّهْلِ الرَّغَدِ، وَ لا تَشْغَلْنى بِالْفَقْرِ عَنِ الْعِبادَةِ، وَ لا بِالْحِرْصِ عَنْ جَميلِ الزَّهادَةِ، وَ بارِکْ لى فیما رَزَقْتَنى، وَ اجْعَلْ عِنْدَكَ مَصیرى، وَ مَسْلكى فى بَيتِ الكَرامَةِ، اِنَّكَ سَميعُ الدُّعاءِ، جَوادٌ كَريمٌ.`, fa:`خدایا! باران پیاپی روزی‌ات را به فراوانی بر من بباران، و ابرهای فضل و بخششت را رگبارآسا بر من بفرست، و بارانِ بخششت را پیاپی بر من تداوم بخش، و فزونی نعمت‌هایت را بر تهیدستی‌ام به طور کامل سرازیر کن، و مرا به جود و بخششت، تنها نیازمند خودت قرار ده، و از هر کسی که خواهان داشته‌های توست بی‌نیاز ساز، و درد فقرم را به داروی فضلت درمان کن، و بر زمین‌خوردگیِ تنگدستی‌ام با عطا و نعمتت جانی تازه ببخش، و بر کم‌مالی‌ام با فراوانی بخششت، و بر پریشانی‌ام با عطای کریمانه‌ات صدقه و بخشش فرما، و پروردگارا! راه روزی را به سوی من هموار ساز، و پایه‌هایش را در نزد من استوار کن، و چشمه‌های وسعتش را به رحمتت برایم جاری کن، و نهرهای زندگی خوش و مرفه را به رأفتت به سوی من روان ساز، و زمین فقر مرا خشک کن، و قحطیِ زیان و بدحالی‌ام را به سرسبزی و فراوانی تبدیل فرما، و موانع را از سر راه /* ============================================================
   FILTERS
   ============================================================ */
let currentCategory = 'all';

function filterCategory(cat){
  currentCategory = cat;
  $$('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  filterItems();
}

function filterItems(){
  if($('#detailContainer').style.display !== 'none') return;
  const q = ($('#searchInput').value || '').trim().toLowerCase();

  let items = MONAJAT_DATA;
  if(currentCategory !== 'all') items = items.filter(i => i.category === currentCategory);
  if(q){
    items = items.filter(i =>
      i.title.toLowerCase().includes(q) ||
      i.subtitle.toLowerCase().includes(q) ||
      i.category.includes(q) ||
      (i.verses && i.verses.some(v => v.ar.includes(q) || v.fa.includes(q)))
    );
  }
  renderList(items);
}

/* ============================================================
   RENDER LIST
   ============================================================ */
function renderList(items){
  const c = $('#listContainer');
  if(!items || items.length === 0){
    c.innerHTML = `<div class="empty-msg">${ICONS.empty}<span>نتیجه‌ای یافت نشد.</span></div>`;
    return;
  }

  const groups = {};
  items.forEach(i => { (groups[i.category] = groups[i.category] || []).push(i); });

  let html = '';
  Object.keys(groups).forEach(cat => {
    const catTitle = cat === 'خمس عشر' ? 'مناجات خمس عشر (امام سجاد ع)' :
                     cat === 'امیرالمؤمنین' ? 'مناجات امیرالمؤمنین (ع)' :
                     'مناجات‌های عمومی';
    html += `
      <div class="section-head">
        <div class="sec-title">${catTitle}</div>
        <div class="sec-orn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9 12 2"/>
          </svg>
        </div>
      </div>
    `;
    groups[cat].forEach(item => {
      html += `
        <div class="monajat-item" onclick="showDetail('${item.id}')">
          <span class="v-num">${item.number}</span>
          <div class="mj-body">
            <div class="mj-title">${item.title}</div>
            <div class="mj-sub">${item.subtitle}</div>
          </div>
          <span class="mj-arrow">${ICONS.arrowLeft}</span>
        </div>
      `;
    });
  });

  c.innerHTML = html;
}

/* ============================================================
   RENDER DETAIL
   ============================================================ */
function showDetail(id){
  const item = MONAJAT_DATA.find(i => i.id === id);
  if(!item) return;

  $('#listContainer').style.display = 'none';
  $('#searchBox').style.display = 'none';
  $('#categoryFilter').style.display = 'none';
  $('#detailContainer').style.display = 'block';
  $('#pageTitle').textContent = item.title;

  let html = `
    <div class="detail-head">
      <div class="d-title">${item.title}</div>
      <div class="d-meta">${item.subtitle}</div>
      <div class="d-source">${ICONS.book} ${item.source}</div>
      <button class="back-btn" onclick="backToList()">${ICONS.arrowLeft} بازگشت به لیست</button>
    </div>
  `;

  if(item.verses && item.verses.length){
    item.verses.forEach(v => {
      html += `
        <div class="verse-card">
          <div class="v-ar">${v.ar}</div>
          <div class="v-divider"></div>
          <div class="v-fa">${v.fa}</div>
        </div>
      `;
    });
  }

  if(item.fazilat){
    html += `
      <div class="info-block">
        <h4>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          توضیحات
        </h4>
        <p>${item.fazilat}</p>
      </div>
    `;
  }

  html += `
    <div style="display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;">
      <button onclick="copyItem('${item.id}')" style="padding:8px 18px;border-radius:20px;background:var(--surface2);border:1px solid var(--divider);color:var(--text2);font-size:.75rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">${ICONS.copy} کپی متن</button>
      <button onclick="shareItem('${item.id}')" style="padding:8px 18px;border-radius:20px;background:var(--surface2);border:1px solid var(--divider);color:var(--text2);font-size:.75rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">${ICONS.share} اشتراک‌گذاری</button>
    </div>
  `;

  $('#detailContainer').innerHTML = html;
  $('.scroll-content').scrollTop = 0;
}

function backToList(){
  $('#detailContainer').style.display = 'none';
  $('#listContainer').style.display = 'block';
  $('#searchBox').style.display = 'block';
  $('#categoryFilter').style.display = 'flex';
  $('#pageTitle').textContent = 'مناجات‌ها';
  filterItems();
  $('.scroll-content').scrollTop = 0;
}

/* ============================================================
   COPY / SHARE
   ============================================================ */
function getItemText(id){
  const item = MONAJAT_DATA.find(i => i.id === id);
  if(!item) return '';
  let t = item.title + '\n' + item.subtitle + '\n\n';
  if(item.verses) item.verses.forEach(v => { t += v.ar + '\n' + v.fa + '\n\n'; });
  t += 'منبع: ' + item.source;
  return t;
}
function copyItem(id){
  const t = getItemText(id);
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(() => toast('متن کپی شد'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('متن کپی شد');
  }
}
function shareItem(id){
  const t = getItemText(id);
  if(navigator.share){ navigator.share({title: 'مناجات', text: t}).catch(()=>{}); }
  else copyItem(id);
}

  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   MODALS
   ============================================================ */
$('#btnInfo').onclick = () => $('#modalInfo').classList.add('show');
$('#btnSettings').onclick = () => $('#modalSettings').classList.add('show');
$$('[data-close]').forEach(b => b.onclick = () => $('#'+b.dataset.close).classList.remove('show'));
$$('.modal-bg').forEach(m => m.onclick = e => { if(e.target === m) m.classList.remove('show'); });

/* ============================================================
   SETTINGS HANDLERS
   ============================================================ */
$$('[data-ar-step]').forEach(b => b.onclick = () => {
  arSize = Math.max(16, Math.min(42, arSize + parseInt(b.dataset.arStep)*2));
  applySettings();
});
$$('[data-fa-step]').forEach(b => b.onclick = () => {
  faSize = Math.max(12, Math.min(26, faSize + parseInt(b.dataset.faStep)*2));
  applySettings();
});
$$('[data-lh]').forEach(b => {
  if(b.dataset.lh === lineHeight) b.classList.add('active');
  b.onclick = () => {
    $$('[data-lh]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    lineHeight = b.dataset.lh;
    applySettings();
  };
});
$$('[data-trans]').forEach(b => {
  const on = (b.dataset.trans === '1') === showTrans;
  b.classList.toggle('active', on);
  b.onclick = () => {
    $$('[data-trans]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    showTrans = b.dataset.trans === '1';
    applySettings();
  };
});
$$('[data-font-ar]').forEach(b => {
  if(b.dataset.fontAr === fontAr) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-ar]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-ar-\S+/g,'').trim();
    document.body.classList.add('font-ar-'+b.dataset.fontAr);
    localStorage.setItem('noor_font_ar', b.dataset.fontAr);
  };
});
$$('[data-font-fa]').forEach(b => {
  if(b.dataset.fontFa === fontFa) b.classList.add('active');
  b.onclick = () => {
    $$('[data-font-fa]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.body.className = document.body.className.replace(/font-fa-\S+/g,'').trim();
    document.body.classList.add('font-fa-'+b.dataset.fontFa);
    localStorage.setItem('noor_font_fa', b.dataset.fontFa);
  };
});

$('#modalTime').textContent = "بهترین زمان‌ها: سحرها، بین‌الطلوعین، نیمه‌شب، شب‌های جمعه، و هنگام خلوت با خداوند. توصیه شده با وضو، رو به قبله، با حضور قلب و اخلاص خوانده شود. مناجات‌های خمس عشر، هریک در حال و هوای خاص خود خوانده می‌شود.";
