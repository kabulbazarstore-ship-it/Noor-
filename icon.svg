<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- پس‌زمینه سبز تیره -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2E26"/>
      <stop offset="0.5" stop-color="#123C32"/>
      <stop offset="1" stop-color="#2D6657"/>
    </linearGradient>

    <!-- طلایی -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4C982"/>
      <stop offset="0.5" stop-color="#D6B56A"/>
      <stop offset="1" stop-color="#B88A3B"/>
    </linearGradient>

    <!-- نور مرکزی -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D6B56A" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#D6B56A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#D6B56A" stop-opacity="0"/>
    </radialGradient>

    <!-- سایه داخلی برای عمق -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- پس‌زمینه مربع با گوشه‌های گرد -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- هاله نور مرکزی -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- حلقه تزئینی طلایی بیرونی -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.35"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.25"/>

  <!-- تزئینات گوشه‌ها - نقوش اسلامی -->
  <g stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.55">
    <!-- گوشه بالا راست -->
    <path d="M 400 60 Q 420 60 430 70 Q 440 80 440 100" stroke-linecap="round"/>
    <path d="M 410 75 Q 420 75 425 80 Q 430 85 430 95" stroke-linecap="round"/>
    <!-- گوشه بالا چپ -->
    <path d="M 112 60 Q 92 60 82 70 Q 72 80 72 100" stroke-linecap="round"/>
    <path d="M 102 75 Q 92 75 87 80 Q 82 85 82 95" stroke-linecap="round"/>
    <!-- گوشه پایین راست -->
    <path d="M 400 452 Q 420 452 430 442 Q 440 432 440 412" stroke-linecap="round"/>
    <path d="M 410 437 Q 420 437 425 432 Q 430 427 430 417" stroke-linecap="round"/>
    <!-- گوشه پایین چپ -->
    <path d="M 112 452 Q 92 452 82 442 Q 72 432 72 412" stroke-linecap="round"/>
    <path d="M 102 437 Q 92 437 87 432 Q 82 427 82 417" stroke-linecap="round"/>
  </g>

  <!-- ستاره هشت‌پر اسلامی (نشانه اهل بیت) -->
  <g transform="translate(256 256)" opacity="0.18">
    <polygon points="0,-155 37,-92 108,-108 92,-37 155,0 92,37 108,108 37,92 0,155 -37,92 -108,108 -92,37 -155,0 -92,-37 -108,-108 -37,-92"
             fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  </g>

  <!-- حرف «ن» بزرگ و اصلی -->
  <text x="256" y="335"
        font-family="'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif"
        font-size="280"
        font-weight="700"
        fill="url(#gold)"
        text-anchor="middle"
        filter="url(#innerShadow)">ن</text>

  <!-- نقطه نور بالای حرف ن -->
  <circle cx="256" cy="105" r="9" fill="url(#gold)"/>
  <circle cx="256" cy="105" r="18" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="256" cy="105" r="28" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.25"/>

  <!-- خط تزئینی زیر حرف -->
  <line x1="180" y1="380" x2="332" y2="380" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="180" cy="380" r="3" fill="url(#gold)" opacity="0.6"/>
  <circle cx="332" cy="380" r="3" fill="url(#gold)" opacity="0.6"/>
  <circle cx="256" cy="380" r="4" fill="url(#gold)"/>
</svg>