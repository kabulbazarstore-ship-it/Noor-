<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>دعای سمات | نور</title>
<link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;700;900&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ================================================================
       RESET & BASE (هماهنگ با سایر صفحات)
       ================================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-body: #fcf9f2;
      --bg-card: #ffffff;
      --bg-card-hover: #f8f4ea;
      --bg-tab: rgba(0, 0, 0, 0.04);
      --bg-tab-active: rgba(212, 175, 55, 0.10);
      --text-primary: #2b2b2b;
      --text-secondary: #5a5040;
      --text-muted: #8b877f;
      --text-arabic: #0b3a30;
      --text-translation: #4a4a4a;
      --border-gold: rgba(180, 140, 70, 0.2);
      --border-dash: rgba(180, 140, 70, 0.15);
      --gold: #b38a2e;
      --gold-light: #d4af37;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      --radius: 18px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --font-arabic: 'Amiri', serif;
      --font-persian: 'Vazirmatn', sans-serif;
      --font-size-base: 16px;
    }

    /* ===== حالت تاریک ===== */
    body.dark-mode {
      --bg-body: #0b0e1a;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --bg-tab: rgba(255, 255, 255, 0.04);
      --bg-tab-active: rgba(212, 175, 55, 0.12);
      --text-primary: #ede7d9;
      --text-secondary: #b0c0b8;
      --text-muted: #6a8a80;
      --text-arabic: #b8d9b8;
      --text-translation: #c8c8c8;
      --border-gold: rgba(212, 175, 55, 0.15);
      --border-dash: rgba(212, 175, 55, 0.12);
      --gold: #d4af37;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: var(--font-persian);
      background: var(--bg-body);
      color: var(--text-primary);
      transition: background 0.4s, color 0.4s;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px 40px;
      line-height: 1.6;
      font-size: var(--font-size-base);
    }

    /* ===== فونت‌ها ===== */
    body.font-vazir { font-family: 'Vazirmatn', sans-serif; }
    body.font-amiri { font-family: 'Amiri', serif; }
    body.font-naskh { font-family: 'Noto Naskh Arabic', serif; }

    /* ===== اندازه متن ===== */
    body.font-small .arabic-text { font-size: calc(var(--font-size-base) * 0.9); }
    body.font-small .persian-text { font-size: calc(var(--font-size-base) * 0.75); }
    body.font-small .app-header .brand strong { font-size: 1.1rem; }

    body.font-large .arabic-text { font-size: calc(var(--font-size-base) * 1.3); }
    body.font-large .persian-text { font-size: calc(var(--font-size-base) * 1.05); }
    body.font-large .app-header .brand strong { font-size: 1.6rem; }

    /* ================================================================
       CONTAINER
       ================================================================ */
    .dua-page {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    /* ================================================================
       HEADER (هماهنگ با سایر صفحات)
       ================================================================ */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 16px;
      border-bottom: 1px solid var(--border-gold);
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-body);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.4s;
      flex-wrap: wrap;
      gap: 6px;
    }
    .app-header .circle {
      background: var(--bg-tab);
      border: 1px solid var(--border-gold);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.2rem;
      color: var(--text-primary);
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .app-header .circle:hover {
      background: var(--bg-tab-active);
      border-color: var(--gold);
      transform: rotate(8deg);
    }
    .app-header .brand {
      text-align: center;
      flex: 1;
    }
    .app-header .brand strong {
      display: block;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold);
      font-family: var(--font-arabic);
      letter-spacing: 2px;
      transition: font-size 0.3s;
    }
    .app-header .brand small {
      font-size: 0.6rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header-controls button {
      background: var(--bg-tab);
      border: 1px solid var(--border-gold);
      border-radius: 30px;
      padding: 4px 12px;
      font-size: 1rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
      min-width: 32px;
      text-align: center;
      line-height: 1.4;
    }
    .header-controls button:hover {
      background: var(--bg-tab-active);
      border-color: var(--gold);
      color: var(--gold);
    }
    .header-controls .font-btn {
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* ================================================================
       CONTENT
       ================================================================ */
    .scroll-content {
      overflow-y: auto;
      padding: 4px 0 20px;
      -webkit-overflow-scrolling: touch;
      max-height: calc(100vh - 180px);
    }
    .scroll-content::-webkit-scrollbar { width: 4px; }
    .scroll-content::-webkit-scrollbar-track { background: var(--bg-body); }
    .scroll-content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

    .content-box {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius);
      padding: 22px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .dua-verse {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--border-dash);
      transition: border-color 0.3s;
    }
    .dua-verse:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .arabic-text {
      font-family: 'Amiri Quran', 'Traditional Arabic', 'Amiri', serif;
      font-size: calc(var(--font-size-base) * 1.1);
      line-height: 2.4;
      color: var(--text-arabic);
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      transition: color 0.3s, font-size 0.2s;
    }

    .persian-text {
      font-size: calc(var(--font-size-base) * 0.9);
      line-height: 1.9;
      color: var(--text-translation);
      text-align: justify;
      padding-right: 8px;
      border-right: 3px solid var(--border-gold);
      transition: color 0.3s, font-size 0.2s;
    }

    /* ===== بخش فضیلت ===== */
    .info-section {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-top: 10px;
      box-shadow: var(--shadow);
    }
    .info-section .info-title {
      font-size: calc(var(--font-size-base) * 0.85);
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .info-section .info-text {
      font-size: calc(var(--font-size-base) * 0.8);
      line-height: 1.9;
      color: var(--text-secondary);
      text-align: justify;
      white-space: pre-line;
    }
    .info-section .info-source {
      font-size: calc(var(--font-size-base) * 0.7);
      color: var(--text-muted);
      font-style: italic;
      margin-top: 6px;
    }

    /* ================================================================
       RESPONSIVE
       ================================================================ */
    @media (max-width: 600px) {
      .app-header .brand strong { font-size: 1.1rem; }
      .content-box { padding: 18px 14px; }
      .arabic-text { font-size: calc(var(--font-size-base) * 0.95); }
      .persian-text { font-size: calc(var(--font-size-base) * 0.8); }
      .header-controls button { font-size: 0.85rem; padding: 3px 10px; }
      .scroll-content { max-height: calc(100vh - 160px); }
    }
    @media (max-width: 400px) {
      body { padding: 10px 8px 30px; }
      .content-box { padding: 14px 10px; }
    }
  </style>
</head>
<body>

  <!-- ================================================================
  PAGE: دعای سمات
  ================================================================ -->
  <main class="dua-page">

    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <button class="circle" onclick="location.href='index.html'">←</button>
      <div class="brand">
        <strong id="pageTitle">دعای سمات</strong>
        <small>دعای شب‌های جمعه</small>
      </div>
      <div class="header-controls">
        <button class="font-btn" onclick="changeFontSize(-1)">−</button>
        <button class="font-btn" onclick="changeFontSize(1)">+</button>
        <button id="themeToggle" aria-label="تغییر تم">🌙</button>
      </div>
    </header>

    <!-- ===== CONTENT ===== -->
    <div class="scroll-content" id="scrollContent">

      <div class="content-box" id="duaContent">
        <!-- داینامیک توسط جاوااسکریپت -->
      </div>

      <div class="info-section" id="infoBox" style="display:none;">
        <div class="info-title">✨ فضیلت و خواص دعای سمات</div>
        <div class="info-text" id="fazilatText"></div>
        <div class="info-source" id="sourceText"></div>
      </div>

    </div>

  </main>


  <!-- ================================================================
  JAVASCRIPT
  ================================================================ -->
  <script>
    // ================================================================
    // 1. DATA – دعای سمات (بندبه‌بند)
    // ================================================================

    const duaData = {
      title: "دعای سمات",
      verses: [
        { ar: 'بِسْمِ اللهِ الرَّحْمَنِ الرَّحِیمِ', fa: 'به نام خداوند بخشنده مهربان' },

        { ar: 'اَللَّهُمَّ إِنِّی أَسْأَلُکَ بِاسْمِکَ الْعَظِیمِ الْأَعْظَمِ الْأَعَزِّ الْأَجَلِّ الْأَکْرَمِ', fa: 'خدایا! از تو درخواست می‌کنم به نام بزرگت، آن نام بزرگ‌تر، عزیزتر، والاتر و گرامی‌تر' },
        { ar: 'الَّذِی إِذَا دُعِیتَ بِهِ عَلَى مَغَالِقِ أَبْوَابِ السَّمَاءِ لِلْفَتْحِ بِالرَّحْمَةِ انْفَتَحَتْ', fa: 'آن نامی که چون بر درهای بسته آسمان، برای گشایش به رحمت خوانده شوی، گشوده شوند' },
        { ar: 'وَ إِذَا دُعِیتَ بِهِ عَلَى مَضَائِقِ أَبْوَابِ الْأَرْضِ لِلْفَرَجِ انْفَرَجَتْ', fa: 'و چون بر تنگناهای زمین برای گشایش خوانده شوی، گشایش یابند' },
        { ar: 'وَ إِذَا دُعِیتَ بِهِ عَلَى الْعُسْرِ لِلْیُسْرِ تَیَسَّرَتْ', fa: 'و چون برای آسانیِ سختی خوانده شوی، آسان گردند' },
        { ar: 'وَ إِذَا دُعِیتَ بِهِ عَلَى الْأَمْوَاتِ لِلنُّشُورِ انْتَشَرَتْ', fa: 'و چون بر مردگان برای رستاخیز خوانده شوی، زنده شوند' },
        { ar: 'وَ إِذَا دُعِیتَ بِهِ عَلَى کَشْفِ الْبَأْسَاءِ وَ الضَّرَّاءِ انْکَشَفَتْ', fa: 'و چون برای برطرف کردن بلاها و سختی‌ها خوانده شوی، برطرف گردند' },
        { ar: 'وَ بِجَلَالِ وَجْهِکَ الْکَرِیمِ أَکْرَمِ الْوُجُوهِ وَ أَعَزِّ الْوُجُوهِ', fa: 'و سوگند به جلال ذات بزرگوارت که گرامی‌ترین و عزیزترین چهره‌هاست' },
        { ar: 'الَّذِی عَنَتْ لَهُ الْوُجُوهُ وَ خَضَعَتْ لَهُ الرِّقَابُ وَ خَشَعَتْ لَهُ الْأَصْوَاتُ وَ وَجِلَتْ لَهُ الْقُلُوبُ مِنْ مَخَافَتِکَ', fa: 'آنکه چهره‌ها در برابر آن خاضع، گردن‌ها فروتن، صداها خاشع و دل‌ها از ترس تو هراسان شده‌اند' },
        { ar: 'وَ بِقُوَّتِکَ الَّتِی بِهَا تُمْسِکُ السَّمَاءَ أَنْ تَقَعَ عَلَى الْأَرْضِ إِلَّا بِإِذْنِکَ', fa: 'و به توانایی‌ات که آسمان را از افتادن بر زمین بازمی‌داری، مگر به اذن خودت' },
        { ar: 'وَ تُمْسِکُ السَّمَاوَاتِ وَ الْأَرْضَ أَنْ تَزُولَا', fa: 'و آسمان‌ها و زمین را از نابودی حفظ می‌کنی' },
        { ar: 'وَ بِمَشِیَّتِکَ الَّتِی دَانَ لَهَا الْعَالَمُونَ', fa: 'و به مشیتت که جهانیان در برابر آن سر تعظیم فرود آورده‌اند' },
        { ar: 'وَ بِکَلِمَتِکَ الَّتِی خَلَقْتَ بِهَا السَّمَاوَاتِ وَ الْأَرْضَ', fa: 'و به کلمه‌ات که آسمان‌ها و زمین را با آن آفریدی' },
        { ar: 'وَ بِحِکْمَتِکَ الَّتِی صَنَعْتَ بِهَا الْعَجَائِبَ', fa: 'و به حکمتت که شگفتی‌ها را با آن پدید آوردی' },
        { ar: 'وَ خَلَقْتَ بِهَا الظُّلْمَةَ وَ جَعَلْتَهَا لَیْلًا وَ جَعَلْتَ اللَّیْلَ سَکَنًا', fa: 'و با آن، تاریکی را آفریدی و آن را شب قرار دادی و شب را مایه آرامش' },
        { ar: 'وَ خَلَقْتَ بِهَا النُّورَ وَ جَعَلْتَهُ نَهَارًا وَ جَعَلْتَ النَّهَارَ نُشُورًا مُبْصِرًا', fa: 'و با آن، نور را آفریدی و آن را روز قرار دادی و روز را زمان پراکندگی و بینایی گردانیدی' },
        { ar: 'وَ خَلَقْتَ بِهَا الشَّمْسَ وَ جَعَلْتَ الشَّمْسَ ضِیَاءً', fa: 'و با آن، خورشید را آفریدی و آن را روشنی‌بخش قرار دادی' },
        { ar: 'وَ خَلَقْتَ بِهَا الْقَمَرَ وَ جَعَلْتَ الْقَمَرَ نُورًا', fa: 'و با آن، ماه را آفریدی و آن را نور قرار دادی' },
        { ar: 'وَ خَلَقْتَ بِهَا الْکَوَاکِبَ وَ جَعَلْتَهَا نُجُومًا وَ بُرُوجًا وَ مَصَابِیحَ وَ زِینَةً وَ رُجُومًا', fa: 'و با آن، ستارگان را آفریدی و آنها را ستارگان و برج‌ها و چراغ‌ها و زیور و تیرهای شیاطین قرار دادی' },
        { ar: 'وَ جَعَلْتَ لَهَا مَشَارِقَ وَ مَغَارِبَ وَ جَعَلْتَ لَهَا مَطَالِعَ وَ مَجَارِیَ', fa: 'و برای آنها مشرق‌ها و مغرب‌ها، و طلوع‌گاه‌ها و مسیرهایی قرار دادی' },
        { ar: 'وَ جَعَلْتَ لَهَا فَلَکًا وَ مَسَابِحَ وَ قَدَّرْتَهَا فِی السَّمَاءِ مَنَازِلَ فَأَحْسَنْتَ تَقْدِیرَهَا', fa: 'و برای آنها فلک و جایگاه‌های گردش قرار دادی و در آسمان منزل‌هایی برایشان تقدیر کردی و نیکو تقدیرشان نمودی' },
        { ar: 'وَ صَوَّرْتَهَا فَأَحْسَنْتَ تَصْوِیرَهَا', fa: 'و آنها را به نیکوترین صورت تصویر کردی' },
        { ar: 'وَ أَحْصَیْتَهَا بِأَسْمَائِکَ إِحْصَاءً', fa: 'و آنها را با نام‌هایت به دقت برشمردی' },
        { ar: 'وَ دَبَّرْتَهَا بِحِکْمَتِکَ تَدْبِیرًا فَأَحْسَنْتَ تَدْبِیرَهَا', fa: 'و به حکمتت تدبیرشان کردی و نیکو تدبیرشان نمودی' },
        { ar: 'وَ سَخَّرْتَهَا بِسُلْطَانِ اللَّیْلِ وَ سُلْطَانِ النَّهَارِ وَ السَّاعَاتِ وَ عَدَدِ السِّنِینَ وَ الْحِسَابِ', fa: 'و آنها را مسخر سلطنت شب و روز و ساعت‌ها و شمارش سال‌ها و حساب قرار دادی' },
        { ar: 'وَ جَعَلْتَ رُؤْیَتَهَا لِجَمِیعِ النَّاسِ مَرْئًی وَاحِدًا', fa: 'و دیدن آنها را برای همه مردم یکسان گردانیدی' },

        { ar: 'وَ أَسْأَلُکَ اللَّهُمَّ بِمَجْدِکَ الَّذِی کَلَّمْتَ بِهِ عَبْدَکَ وَ رَسُولَکَ مُوسَى بْنَ عِمْرَانَ عَلَیْهِ السَّلامُ فِی الْمُقَدَّسِینَ', fa: 'و از تو خواهانم، خدایا، به مجد و عظمتی که با آن، با بنده و رسولت موسی بن عمران (ع) در میان فرشتگان مقدس سخن گفتی' },
        { ar: 'فَوْقَ إِحْسَاسِ الْکَرُّوبِینَ فَوْقَ غَمَائِمِ النُّورِ فَوْقَ تَابُوتِ الشَّهَادَةِ فِی عَمُودِ النَّارِ', fa: 'بالاتر از درک فرشتگان مقرب، بر فراز ابرهای نور، بر فراز تابوت شهادت، در ستون آتش' },
        { ar: 'وَ فِی طُورِ سَیْنَاءَ وَ فِی جَبَلِ حُورِیثَ فِی الْوَادِ الْمُقَدَّسِ فِی الْبُقْعَةِ الْمُبَارَکَةِ', fa: 'و در کوه سینا، و در کوه حوریت، در وادی مقدس، در آن بقعه مبارک' },
        { ar: 'مِنْ جَانِبِ الطُّورِ الْأَیْمَنِ مِنَ الشَّجَرَةِ', fa: 'از سمت راست کوه، از آن درخت' },
        { ar: 'وَ فِی أَرْضِ مِصْرَ بِتِسْعِ آیَاتٍ بَیِّنَاتٍ', fa: 'و در سرزمین مصر با نه نشانه روشن' },
        { ar: 'وَ یَوْمَ فَرَقْتَ لِبَنِی إِسْرَائِیلَ الْبَحْرَ', fa: 'و آن روز که دریا را برای بنی‌اسرائیل شکافتی' },
        { ar: 'وَ فِی الْمُنْبَجِسَاتِ الَّتِی صَنَعْتَ بِهَا الْعَجَائِبَ فِی بَحْرِ سُوفٍ', fa: 'و در آن چشمه‌های جوشانی که شگفتی‌ها را با آن پدید آوردی در بحر سوف' },
        { ar: 'وَ عَقَدْتَ مَاءَ الْبَحْرِ فِی قَلْبِ الْغَمْرِ کَالْحِجَارَةِ', fa: 'و آب دریا را در دل امواج، مانند سنگ، بستی' },
        { ar: 'وَ جَاوَزْتَ بِبَنِی إِسْرَائِیلَ الْبَحْرَ', fa: 'و بنی‌اسرائیل را از دریا عبور دادی' },
        { ar: 'وَ تَمَّتْ کَلِمَتُکَ الْحُسْنَى عَلَیْهِمْ بِمَا صَبَرُوا', fa: 'و کلمه‌ی نیکویت به خاطر صبرشان بر آنان تحقق یافت' },
        { ar: 'وَ أَوْرَثْتَهُمْ مَشَارِقَ الْأَرْضِ وَ مَغَارِبَهَا الَّتِی بَارَکْتَ فِیهَا لِلْعَالَمِینَ', fa: 'و مشرق‌ها و مغرب‌های زمین را که در آن برای جهانیان برکت نهادی، به ارثشان دادی' },
        { ar: 'وَ أَغْرَقْتَ فِرْعَوْنَ وَ جُنُودَهُ وَ مَرَاکِبَهُ فِی الْیَمِّ', fa: 'و فرعون و لشکریان و مرکب‌هایش را در دریا غرق کردی' },

        { ar: 'وَ بِاسْمِکَ الْعَظِیمِ الْأَعْظَمِ الْأَعَزِّ الْأَجَلِّ الْأَکْرَمِ', fa: 'و به نام بزرگت، آن نام بزرگ‌تر، عزیزتر، والاتر، گرامی‌تر' },
        { ar: 'وَ بِمَجْدِکَ الَّذِی تَجَلَّیْتَ بِهِ لِمُوسَى کَلِیمِکَ عَلَیْهِ السَّلامُ فِی طُورِ سَیْنَاءَ', fa: 'و به مجد و عظمتی که با آن بر موسی، هم‌کلامت، در کوه سینا تجلی کردی' },
        { ar: 'وَ لِإِبْرَاهِیمَ عَلَیْهِ السَّلامُ خَلِیلِکَ مِنْ قَبْلُ فِی مَسْجِدِ الْخَیْفِ', fa: 'و برای ابراهیم (ع) خلیل خود، پیش از آن در مسجد خیف' },
        { ar: 'وَ لِإِسْحَاقَ صَفِیِّکَ عَلَیْهِ السَّلامُ فِی بِئْرِ شِیَعٍ', fa: 'و برای اسحاق (ع) صفی خود، در چاه شیع' },
        { ar: 'وَ لِیَعْقُوبَ نَبِیِّکَ عَلَیْهِ السَّلامُ فِی بَیْتِ إِیلٍ', fa: 'و برای یعقوب (ع) پیامبرت، در بیت‌ایل' },
        { ar: 'وَ أَوْفَیْتَ لِإِبْرَاهِیمَ عَلَیْهِ السَّلامُ بِمِیثَاقِکَ', fa: 'و پیمانت را با ابراهیم (ع) به انجام رساندی' },
        { ar: 'وَ لِإِسْحَاقَ بِحَلْفِکَ', fa: 'و با اسحاق (ع) به سوگندت وفا کردی' },
        { ar: 'وَ لِیَعْقُوبَ بِشَهَادَتِکَ', fa: 'و برای یعقوب (ع) گواهی دادی' },
        { ar: 'وَ لِلْمُؤْمِنِینَ بِوَعْدِکَ', fa: 'و به مؤمنان وعده‌ات را دادی' },
        { ar: 'وَ لِلدَّاعِینَ بِأَسْمَائِکَ فَأَجَبْتَ', fa: 'و خوانندگانت را به نام‌هایت اجابت کردی' },
        { ar: 'وَ بِمَجْدِکَ الَّذِی ظَهَرَ لِمُوسَى بْنِ عِمْرَانَ عَلَیْهِ السَّلامُ عَلَى قُبَّةِ الرُّمَّانِ', fa: 'و به مجد و عظمتی که برای موسی بن عمران (ع) بر گنبد انار نمایان شد' },
        { ar: 'وَ بِآیَاتِکَ الَّتِی وَقَعَتْ عَلَى أَرْضِ مِصْرَ بِمَجْدِ الْعِزَّةِ وَ الْغَلَبَةِ', fa: 'و به آیاتت که بر سرزمین مصر با عزت و غلبه فرود آمد' },
        { ar: 'بِآیَاتٍ عَزِیزَةٍ وَ بِسُلْطَانِ الْقُوَّةِ وَ بِعِزَّةِ الْقُدْرَةِ', fa: 'با آیاتی عزیز، و به سلطنت قدرت، و به عزت توانایی' },
        { ar: 'وَ بِشَأْنِ الْکَلِمَةِ التَّامَّةِ', fa: 'و به شأن کلمه‌ی کامل' },

        { ar: 'وَ بِکَلِمَاتِکَ الَّتِی تَفَضَّلْتَ بِهَا عَلَى أَهْلِ السَّمَاوَاتِ وَ الْأَرْضِ', fa: 'و به کلماتت که بر اهل آسمان‌ها و زمین فضل نهادی' },
        { ar: 'وَ أَهْلِ الدُّنْیَا وَ أَهْلِ الْآخِرَةِ', fa: 'و بر اهل دنیا و آخرت' },
        { ar: 'وَ بِرَحْمَتِکَ الَّتِی مَنَنْتَ بِهَا عَلَى جَمِیعِ خَلْقِکَ', fa: 'و به رحمتت که بر همه آفریدگانت منت نهادی' },
        { ar: 'وَ بِاسْتِطَاعَتِکَ الَّتِی أَقَمْتَ بِهَا عَلَى الْعَالَمِینَ', fa: 'و به توانایی‌ات که جهانیان را بر آن برپا داشتی' },
        { ar: 'وَ بِنُورِکَ الَّذِی قَدْ خَرَّ مِنْ فَزَعِهِ طُورُ سَیْنَاءَ', fa: 'و به نورت که کوه سینا از هراس آن فرو ریخت' },
        { ar: 'وَ بِعِلْمِکَ وَ جَلَالِکَ وَ کِبْرِیَائِکَ وَ عِزَّتِکَ وَ جَبَرُوتِکَ', fa: 'و به علم و جلال و کبریا و عزت و جبروتت' },
        { ar: 'الَّتِی لَمْ تَسْتَقِلَّهَا الْأَرْضُ وَ انْخَفَضَتْ لَهَا السَّمَاوَاتُ', fa: 'آن عظمتی که زمین تاب تحمل آن را نداشت و آسمان‌ها در برابر آن فروتن شدند' },
        { ar: 'وَ انْزَجَرَ لَهَا الْعُمْقُ الْأَکْبَرُ وَ رَکَدَتْ لَهَا الْبِحَارُ وَ الْأَنْهَارُ', fa: 'و ژرفای بزرگ در برابر آن آرام گرفت و دریاها و رودها ساکن شدند' },
        { ar: 'وَ خَضَعَتْ لَهَا الْجِبَالُ وَ سَکَنَتْ لَهَا الْأَرْضُ بِمَنَاکِبِهَا', fa: 'و کوه‌ها در برابر آن خاضع شدند و زمین با همه پهناورش آرام گرفت' },
        { ar: 'وَ اسْتَسْلَمَتْ لَهَا الْخَلَائِقُ کُلُّهَا', fa: 'و همه آفریدگان در برابر آن تسلیم شدند' },
        { ar: 'وَ خَفَقَتْ لَهَا الرِّیَاحُ فِی جَرَیَانِهَا', fa: 'و بادها در جریان خود به لرزه درآمدند' },
        { ar: 'وَ خَمَدَتْ لَهَا النِّیرَانُ فِی أَوْطَانِهَا', fa: 'و آتش‌ها در جایگاه‌هایشان فروکش کردند' },
        { ar: 'وَ بِسُلْطَانِکَ الَّذِی عُرِفَتْ لَکَ بِهِ الْغَلَبَةُ دَهْرَ الدُّهُورِ', fa: 'و به سلطنتت که با آن غلبه را برای همیشه از آن خود کردی' },
        { ar: 'وَ حُمِدْتَ بِهِ فِی السَّمَاوَاتِ وَ الْأَرَضِینَ', fa: 'و در آسمان‌ها و زمین‌ها ستوده شدی' },

        { ar: 'وَ بِکَلِمَتِکَ کَلِمَةِ الصِّدْقِ الَّتِی سَبَقَتْ لِأَبِینَا آدَمَ عَلَیْهِ السَّلامُ وَ ذُرِّیَّتِهِ بِالرَّحْمَةِ', fa: 'و به کلمه‌ی راستت که برای پدرمان آدم (ع) و فرزندانش به رحمت پیشی گرفت' },
        { ar: 'وَ أَسْأَلُکَ بِکَلِمَتِکَ الَّتِی غَلَبَتْ کُلَّ شَیْءٍ', fa: 'و از تو خواهانم به کلمه‌ات که بر هر چیزی چیره شد' },
        { ar: 'وَ بِنُورِ وَجْهِکَ الَّذِی تَجَلَّیْتَ بِهِ لِلْجَبَلِ فَجَعَلْتَهُ دَکًّا وَ خَرَّ مُوسَى صَعِقًا', fa: 'و به نور رویت که بر کوه تجلی کردی و آن را متلاشی نمودی و موسی مدهوش به زمین افتاد' },
        { ar: 'وَ بِمَجْدِکَ الَّذِی ظَهَرَ عَلَى طُورِ سَیْنَاءَ فَکَلَّمْتَ بِهِ عَبْدَکَ وَ رَسُولَکَ مُوسَى بْنَ عِمْرَانَ', fa: 'و به مجدت که بر کوه سینا آشکار شد و با آن با بنده و رسولت موسی بن عمران سخن گفتی' },
        { ar: 'وَ بِطَلْعَتِکَ فِی سَاعِیرَ وَ ظُهُورِکَ فِی جَبَلِ فَارَانَ', fa: 'و به طلوعت در ساعیر و ظهورت در کوه فاران' },
        { ar: 'بِرَبَوَاتِ الْمُقَدَّسِینَ وَ جُنُودِ الْمَلَائِکَةِ الصَّافِّینَ', fa: 'با گروه‌های مقدس و لشکر فرشتگان صف‌کشیده' },
        { ar: 'وَ خُشُوعِ الْمَلَائِکَةِ الْمُسَبِّحِینَ', fa: 'و فروتنی فرشتگان تسبیح‌گوی' },
        { ar: 'وَ بِبَرَکَاتِکَ الَّتِی بَارَکْتَ فِیهَا عَلَى إِبْرَاهِیمَ خَلِیلِکَ عَلَیْهِ السَّلامُ فِی أُمَّةِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَیْهِ وَ آلِهِ', fa: 'و به برکاتت که بر ابراهیم خلیلت (ع) در امت محمد (ص) برکت دادی' },
        { ar: 'وَ بَارَکْتَ لِإِسْحَاقَ صَفِیِّکَ فِی أُمَّةِ عِیسَى عَلَیْهِمَا السَّلامُ', fa: 'و بر اسحاق صفی‌ات در امت عیسی (ع) برکت دادی' },
        { ar: 'وَ بَارَکْتَ لِیَعْقُوبَ إِسْرَائِیلَکَ فِی أُمَّةِ مُوسَى عَلَیْهِمَا السَّلامُ', fa: 'و بر یعقوب، اسرائیلت، در امت موسی (ع) برکت دادی' },
        { ar: 'وَ بَارَکْتَ لِحَبِیبِکَ مُحَمَّدٍ صَلَّى اللَّهُ عَلَیْهِ وَ آلِهِ فِی عِتْرَتِهِ وَ ذُرِّیَّتِهِ وَ أُمَّتِهِ', fa: 'و بر حبیبت محمد (ص) در عترت و ذریه و امتش برکت دادی' },

        { ar: 'اَللَّهُمَّ وَ کَمَا غِبْنَا عَنْ ذَلِکَ وَ لَمْ نَشْهَدْهُ وَ آمَنَّا بِهِ وَ لَمْ نَرَهُ صِدْقًا وَ عَدْلًا', fa: 'خدایا! همان‌گونه که ما از آن غایب بودیم و آن را ندیدیم، ولی به راستی و درستی به آن ایمان آوردیم' },
        { ar: 'أَنْ تُصَلِّیَ عَلَى مُحَمَّدٍ وَ آلِ مُحَمَّدٍ', fa: 'که بر محمد و آل محمد درود فرستی' },
        { ar: 'وَ أَنْ تُبَارِکَ عَلَى مُحَمَّدٍ وَ آلِ مُحَمَّدٍ', fa: 'و بر محمد و آل محمد برکت فرستی' },
        { ar: 'وَ تَرَحَّمَ عَلَى مُحَمَّدٍ وَ آلِ مُحَمَّدٍ', fa: 'و بر محمد و آل محمد رحمت آوری' },
        { ar: 'کَأَفْضَلِ مَا صَلَّیْتَ وَ بَارَکْتَ وَ تَرَحَّمْتَ عَلَى إِبْرَاهِیمَ وَ آلِ إِبْرَاهِیمَ', fa: 'بهترین درود و برکت و رحمتی که بر ابراهیم و آل ابراهیم فرستادی' },
        { ar: 'إِنَّکَ حَمِیدٌ مَجِیدٌ فَعَّالٌ لِمَا تُرِیدُ', fa: 'همانا تو ستوده‌ای بزرگوار، هر چه خواهی انجام دهی' },
        { ar: 'وَ أَنْتَ عَلَى کُلِّ شَیْءٍ قَدِیرٌ', fa: 'و تو بر هر چیزی توانایی' },

        { ar: 'اَللَّهُمَّ بِحَقِّ هَذَا الدُّعَاءِ وَ بِحَقِّ هَذِهِ الْأَسْمَاءِ الَّتِی لَا یَعْلَمُ تَفْسِیرَهَا وَ لَا یَعْلَمُ بَاطِنَهَا غَیْرُکَ', fa: 'خدایا! به حق این دعا و به حق این نام‌هایی که تفسیر و باطن آنها را جز تو کسی نمی‌داند' },
        { ar: 'صَلِّ عَلَى مُحَمَّدٍ وَ آلِ مُحَمَّدٍ وَ افْعَلْ بِی مَا أَنْتَ أَهْلُهُ وَ لَا تَفْعَلْ بِی مَا أَنَا أَهْلُهُ', fa: 'بر محمد و آل محمد درود فرست و با من چنان کن که شایسته‌ی توست و با من چنان مکن که سزاوار آنم' },
        { ar: 'وَ اغْفِرْ لِی مِنْ ذُنُوبِی مَا تَقَدَّمَ مِنْهَا وَ مَا تَأَخَّرَ', fa: 'و گناهان گذشته و آینده‌ام را بیامرز' },
        { ar: 'وَ وَسِّعْ عَلَیَّ مِنْ حَلَالِ رِزْقِکَ', fa: 'و روزی حلالت را بر من گسترده گردان' },
        { ar: 'وَ اکْفِنِی مَؤُنَةَ إِنْسَانِ سَوْءٍ وَ جَارِ سَوْءٍ وَ قَرِینِ سَوْءٍ وَ سُلْطَانِ سَوْءٍ', fa: 'و مرا از شر انسان بد، همسایه بد، همنشین بد و سلطان بد کفایت کن' },
        { ar: 'إِنَّکَ عَلَى مَا تَشَاءُ قَدِیرٌ وَ بِکُلِّ شَیْءٍ عَلِیمٌ', fa: 'همانا تو بر هر چه بخواهی توانایی و به هر چیزی دانایی' },
        { ar: 'آمِینَ رَبَّ الْعَالَمِینَ', fa: 'اجابت کن ای پروردگار جهانیان' },

        { ar: 'یَا اَللَّهُ یَا حَنَّانُ یَا مَنَّانُ یَا بَدِیعَ السَّمَاوَاتِ وَ الْأَرْضِ یَا ذَا الْجَلَالِ وَ الْإِکْرَامِ یَا أَرْحَمَ الرَّاحِمِینَ', fa: 'ای خدا! ای بسیار مهربان! ای بخشاینده! ای پدیدآورنده‌ی آسمان‌ها و زمین! ای صاحب جلال و بزرگواری! ای مهربان‌ترین مهربانان!' },
        { ar: 'اَللَّهُمَّ بِحَقِّ هَذَا الدُّعَاءِ تَفَضَّلْ عَلَى فُقَرَاءِ الْمُؤْمِنِینَ وَ الْمُؤْمِنَاتِ بِالْغِنَى وَ الثَّرْوَةِ', fa: 'خدایا! به حق این دعا، بر مؤمنان و مؤمنات فقیر، با غنا و ثروت منّت بگذار' },
        { ar: 'وَ عَلَى مَرْضَى الْمُؤْمِنِینَ وَ الْمُؤْمِنَاتِ بِالشِّفَاءِ وَ الصِّحَّةِ', fa: 'و بر مؤمنان و مؤمنات بیمار، با شفا و عافیت' },
        { ar: 'وَ عَلَى أَحْیَاءِ الْمُؤْمِنِینَ وَ الْمُؤْمِنَاتِ بِاللُّطْفِ وَ الْکَرَامَةِ', fa: 'و بر مؤمنان و مؤمنات زنده، با لطف و کرامت' },
        { ar: 'وَ عَلَى أَمْوَاتِ الْمُؤْمِنِینَ وَ الْمُؤْمِنَاتِ بِالْمَغْفِرَةِ وَ الرَّحْمَةِ', fa: 'و بر مؤمنان و مؤمنات مرده، با آمرزش و رحمت' },
        { ar: 'وَ عَلَى مُسَافِرِی الْمُؤْمِنِینَ وَ الْمُؤْمِنَاتِ بِالرَّدِّ إِلَى أَوْطَانِهِمْ سَالِمِینَ غَانِمِینَ', fa: 'و بر مؤمنان و مؤمنات مسافر، با بازگشت به وطنشان، سالم و بهره‌مند' },
        { ar: 'بِرَحْمَتِکَ یَا أَرْحَمَ الرَّاحِمِینَ', fa: 'به رحمتت، ای مهربان‌ترین مهربانان' },
        { ar: 'وَ صَلَّى اللَّهُ عَلَى سَیِّدِنَا مُحَمَّدٍ خَاتَمِ النَّبِیِّینَ وَ عِتْرَتِهِ الطَّاهِرِینَ وَ سَلَّمَ تَسْلِیمًا کَثِیرًا', fa: 'و درود خدا بر آقای ما محمد، خاتم پیامبران، و عترت پاکش، و سلام فراوان بر او باد.' }
      ],
      fazilat: 'این دعا که به «شَبّور» (به معنای عطا و بخشش) معروف است، خواندن آن در ساعت آخر روز جمعه بسیار سفارش شده است. از امام محمد باقر (ع) و امام صادق (ع) روایت شده و علما و بزرگان گذشته بر خواندن آن مداومت داشته‌اند. علامه مجلسی (ره) آن را در کتاب بحار الأنوار با شرح ذکر کرده است.',
      source: '📚 منابع: مفاتیح الجنان (شیخ عباس قمی) • مصباح المتهجد (شیخ طوسی) • جمال الأسبوع (سید بن طاووس) • بلد الأمین (کفعمی) • بحار الأنوار (علامه مجلسی)'
    };

    // ================================================================
    // 2. RENDER
    // ================================================================

    function renderDua() {
      const container = document.getElementById('duaContent');
      let html = '';
      duaData.verses.forEach(v => {
        html += `
          <div class="dua-verse">
            <div class="arabic-text">${v.ar}</div>
            <div class="persian-text">${v.fa}</div>
          </div>
        `;
      });
      container.innerHTML = html;

      // نمایش فضیلت
      const infoBox = document.getElementById('infoBox');
      if (duaData.fazilat) {
        document.getElementById('fazilatText').textContent = duaData.fazilat;
        document.getElementById('sourceText').textContent = duaData.source;
        infoBox.style.display = 'block';
      }
    }

    document.getElementById('pageTitle').textContent = duaData.title;
    renderDua();

    // ================================================================
    // 3. THEME
    // ================================================================

    const THEME_KEY = 'noor_theme_samat';

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : prefersDark;
      document.body.classList.toggle('dark-mode', isDark);
      document.body.classList.toggle('light-mode', !isDark);
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = isDark ? '☀️' : '🌙';
    }

    document.getElementById('themeToggle').addEventListener('click', function() {
      const isDark = document.body.classList.contains('dark-mode');
      document.body.classList.toggle('dark-mode', !isDark);
      document.body.classList.toggle('light-mode', isDark);
      localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark');
      this.textContent = isDark ? '🌙' : '☀️';
    });

    initTheme();

    // ================================================================
    // 4. FONT SIZE
    // ================================================================

    let currentFontSize = parseInt(localStorage.getItem('noor_font_size_samat')) || 16;

    function applyFontSize(size) {
      document.documentElement.style.setProperty('--font-size-base', size + 'px');
      localStorage.setItem('noor_font_size_samat', size);
      currentFontSize = size;
    }

    function changeFontSize(delta) {
      let newSize = currentFontSize + delta * 2;
      if (newSize < 12) newSize = 12;
      if (newSize > 28) newSize = 28;
      applyFontSize(newSize);
    }

    applyFontSize(currentFontSize);

    // ================================================================
    // 5. KEYBOARD SHORTCUTS (Ctrl+1, Ctrl+2, Ctrl+3)
    // ================================================================

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === '1') {
        e.preventDefault();
        applyFontSize(12);
      } else if (e.ctrlKey && e.key === '2') {
        e.preventDefault();
        applyFontSize(16);
      } else if (e.ctrlKey && e.key === '3') {
        e.preventDefault();
        applyFontSize(22);
      }
    });

    // ================================================================
    // 6. FONT SELECTION (Vazir, Amiri, Naskh)
    // ================================================================

    let currentFont = localStorage.getItem('noor_font_samat') || 'vazir';

    function applyFont(font) {
      document.body.classList.remove('font-vazir', 'font-amiri', 'font-naskh');
      document.body.classList.add('font-' + font);
      localStorage.setItem('noor_font_samat', font);
      currentFont = font;
    }

    applyFont(currentFont);

    // کلیدهای میانبر Alt+1 → Vazir, Alt+2 → Amiri, Alt+3 → Naskh
    document.addEventListener('keydown', function(e) {
      if (e.altKey && e.key === '1') {
        e.preventDefault();
        applyFont('vazir');
        console.log('فونت وزیرمتن انتخاب شد');
      } else if (e.altKey && e.key === '2') {
        e.preventDefault();
        applyFont('amiri');
        console.log('فونت امیری انتخاب شد');
      } else if (e.altKey && e.key === '3') {
        e.preventDefault();
        applyFont('naskh');
        console.log('فونت نسخ انتخاب شد');
      }
    });

    // ================================================================
    // 7. INIT
    // ================================================================

    window.addEventListener('load', function() {
      document.getElementById('scrollContent').scrollTop = 0;
    });

    console.log('🤲 دعای سمات | NOOR – بارگذاری شد.');
    console.log('💡 کلیدهای میانبر:');
    console.log('   Ctrl+1 → متن کوچک');
    console.log('   Ctrl+2 → متن متوسط');
    console.log('   Ctrl+3 → متن بزرگ');
    console.log('   Alt+1 → فونت وزیرمتن');
    console.log('   Alt+2 → فونت امیری');
    console.log('   Alt+3 → فونت نسخ');
  </script>
