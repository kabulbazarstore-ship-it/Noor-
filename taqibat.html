<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123C32">
<meta name="description" content="تعقیبات نماز | نــــور NOOR">
<title>تعقیبات نماز | نــــور NOOR</title>

<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Lateef:wght@400;700&family=Reem+Kufi:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F8F5EE; --surface:#FFFDF8; --surface2:#F1ECE2;
  --brand:#123C32; --brand2:#2D6657;
  --gold:#B88A3B; --gold2:#D6B56A;
  --gold-soft:rgba(184,138,59,.10);
  --gold-border:rgba(184,138,59,.20);
  --text:#17231F; --text2:#3D4A44; --muted:#66716C;
  --divider:#E7E0D3;
  --arabic:#123C32; --translation:#3D4A44;
  --shadow:0 4px 20px rgba(18,60,50,.05);
  --shadow-sm:0 2px 10px rgba(18,60,50,.035);
  --radius:16px; --radius-sm:12px;
  --trans:.25s cubic-bezier(.4,0,.2,1);
  --font-fa:'Vazirmatn',Tahoma,sans-serif;
  --font-ar:'Amiri','Scheherazade New','Noto Naskh Arabic',serif;
  --fs-ar:24px; --fs-fa:16px; --lh-ar:2.35;
}
body.dark{
  --bg:#080E0C; --surface:#101A16; --surface2:#16231E;
  --brand:#9FC5B5; --brand2:#B9D5C8;
  --gold:#D2AC5C; --gold2:#E4C982;
  --gold-soft:rgba(210,172,92,.08);
  --gold-border:rgba(210,172,92,.16);
  --text:#F4EFE4; --text2:#C8D2CC; --muted:#A8B3AD;
  --divider:#26352F;
  --arabic:#E8E2D2; --translation:#C8D2CC;
  --shadow:0 4px 24px rgba(0,0,0,.30);
  --shadow-sm:0 2px 10px rgba(0,0,0,.20);
}
body.font-ar-amiri{--font-ar:'Amiri',serif}
body.font-ar-scheherazade{--font-ar:'Scheherazade New',serif}
body.font-ar-naskh{--font-ar:'Noto Naskh Arabic',serif}
body.font-ar-lateef{--font-ar:'Lateef',serif}
body.font-ar-reem{--font-ar:'Reem Kufi',sans-serif}
body.font-fa-vazir{--font-fa:'Vazirmatn',Tahoma,sans-serif}
body.font-fa-naskh{--font-fa:'Noto Naskh Arabic',serif}
body.font-fa-amiri{--font-fa:'Amiri',serif}
body.font-fa-scheherazade{--font-fa:'Scheherazade New',serif}
body.font-fa-lateef{--font-fa:'Lateef',serif}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font-fa);background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.7;font-size:16px;
  transition:background var(--trans),color var(--trans);
  overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:var(--trans)}
svg{display:block}
.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-sm{width:18px;height:18px}
.icon-xs{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{width:100%;max-width:780px;margin:0 auto;padding:0 14px 88px}

.header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:6px;
  padding:12px 0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-bottom:1px solid var(--divider);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.hbtn{
  width:40px;height:40px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--surface);border:1px solid var(--gold-border);
  color:var(--gold);transition:var(--trans);
}
.hbtn:hover{background:var(--gold-soft);border-color:var(--gold)}
.hbtn:active{transform:scale(.94)}
.brand{flex:1;min-width:0;text-align:center;line-height:1.15}
.brand h1{
  font-family:'Amiri',serif;font-size:1.12rem;font-weight:700;
  color:var(--brand);letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
body.dark .brand h1{color:var(--gold)}
.brand .noor{
  display:block;margin-top:3px;
  font-family:'Amiri',serif;font-size:.65rem;font-weight:700;
  color:var(--gold);letter-spacing:6px;
}

.scroll-content{
  max-height:calc(100vh - 90px);
  overflow-y:auto;padding:14px 0 20px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--gold-border) transparent;
}
.scroll-content::-webkit-scrollbar{width:4px}
.scroll-content::-webkit-scrollbar-track{background:transparent}
.scroll-content::-webkit-scrollbar-thumb{background:var(--gold-border);border-radius:10px}

.top-orn{
  position:relative;overflow:hidden;text-align:center;
  padding:18px 14px 20px;margin-bottom:14px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--gold-border);
  box-shadow:var(--shadow);
}
.orn-svg{position:absolute;color:var(--gold);opacity:.10;pointer-events:none}
.orn-svg.tr{top:-6px;right:-6px;width:80px;height:80px}
.orn-svg.bl{bottom:-6px;left:-6px;width:80px;height:80px;transform:rotate(180deg)}
.orn-title{
  position:relative;z-index:1;
  font-family:'Amiri',serif;font-size:1.3rem;font-weight:700;
  color:var(--brand);letter-spacing:.5px;
}
body.dark .orn-title{color:var(--gold)}
.orn-sub{position:relative;z-index:1;font-size:.76rem;color:var(--muted)}
.orn-div{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:80px;margin:8px auto 0;
}
.orn-div:before,.orn-div:after{content:"";flex:1;height:1px;background:var(--gold-border)}
.orn-div svg{width:12px;height:12px;color:var(--gold)}

/* Search */
.search-box{position:relative;margin-bottom:12px}
.search-box input{
  width:100%;padding:11px 44px 11px 16px;border-radius:30px;
  border:1px solid var(--gold-border);background:var(--surface);
  color:var(--text);font-family:inherit;font-size:.9rem;outline:none;transition:var(--trans);
}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.search-box .search-icon{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;
}

/* Category filter */
.category-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;justify-content:center}
.cat-btn{
  padding:6px 12px;border-radius:20px;font-size:.72rem;font-weight:600;
  background:var(--surface);border:1px solid var(--divider);color:var(--text2);
  cursor:pointer;transition:var(--trans);
}
.cat-btn:hover{color:var(--gold);border-color:var(--gold-border)}
.cat-btn.active{color:#fff;background:var(--gold);border-color:var(--gold)}

/* Section head */
.section-head{
  position:relative;margin:18px 0 12px;padding:14px 16px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--gold-border);box-shadow:var(--shadow-sm);text-align:center;
}
.section-head:first-child{margin-top:0}
.section-head .sec-title{font-family:'Amiri',serif;font-size:1rem;font-weight:700;color:var(--gold);margin-bottom:4px;line-height:1.4}
.section-head .sec-orn{display:flex;align-items:center;justify-content:center;gap:6px;width:60px;margin:8px auto 0}
.section-head .sec-orn:before,.section-head .sec-orn:after{content:"";flex:1;height:1px;background:var(--gold-border)}
.section-head .sec-orn svg{width:10px;height:10px;color:var(--gold)}

/* Taqib item */
.taq-item{
  background:var(--surface);border:1px solid var(--gold-border);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:var(--trans);
  display:flex;align-items:center;gap:12px;
}
.taq-item:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(184,138,59,.08);transform:translateX(-3px)}
.taq-item:active{transform:scale(.98)}
.taq-item .v-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:28px;height:28px;padding:0 8px;border-radius:8px;
  background:var(--gold-soft);color:var(--gold);font-family:'Amiri',serif;font-weight:700;font-size:.75rem;
  border:1px solid var(--gold-border);flex:none;
}
.taq-item .taq-body{flex:1;min-width:0}
.taq-item .taq-title{font-family:'Amiri',serif;font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:4px}
.taq-item .taq-meta{font-size:.68rem;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.taq-item .taq-meta span{display:inline-flex;align-items:center;gap:4px}
.taq-item .taq-arrow{color:var(--gold);opacity:.6;flex:none}
.taq-item .fav-btn{
  width:32px;height:32px;border-radius:8px;flex:none;
  background:var(--surface2);color:var(--muted);
  border:1px solid var(--divider);transition:var(--trans);
}
.taq-item .fav-btn.active{color:#e74c3c;border-color:rgba(231,76,60,.3)}
.taq-item .fav-btn:hover{background:var(--gold-soft)}
.taq-item .fav-btn.active svg{fill:currentColor}

/* Detail header */
.detail-head{
  position:relative;text-align:center;padding:18px 14px;
  margin-bottom:14px;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--gold-border);box-shadow:var(--shadow);
}
.detail-head .d-title{font-family:'Amiri',serif;font-size:1.15rem;font-weight:700;color:var(--gold);margin-bottom:4px}
.detail-head .d-meta{font-size:.72rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.detail-head .d-meta span{display:inline-flex;align-items:center;gap:4px}
.detail-head .d-source{font-size:.7rem;color:var(--text2);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.back-btn{
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;
  padding:7px 16px;border-radius:20px;
  background:var(--surface);border:1px solid var(--gold-border);
  color:var(--gold);font-size:.72rem;font-weight:600;transition:var(--trans);
}
.back-btn:hover{background:var(--gold-soft);border-color:var(--gold)}

/* Verse card */
.verse-card{
  background:var(--surface);border:1px solid var(--gold-border);
  border-radius:var(--radius);padding:16px 14px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);transition:var(--trans);
}
.verse-card:hover{border-color:var(--gold)}
.verse-card .v-ar{
  font-family:var(--font-ar);font-size:var(--fs-ar);line-height:var(--lh-ar);
  color:var(--arabic);text-align:center;font-weight:400;
  margin-bottom:12px;padding:4px 2px;white-space:pre-line;
}
.verse-card .v-divider{
  height:1px;
  background:repeating-linear-gradient(90deg,var(--gold-border) 0,var(--gold-border) 3px,transparent 3px,transparent 6px);
  margin:0 auto 12px;width:52px;
}
.verse-card .v-fa{
  font-family:var(--font-fa);font-size:var(--fs-fa);line-height:1.95;
  color:var(--translation);text-align:justify;
  padding:0 8px;border-right:3px solid var(--gold-border);white-space:pre-line;
}
.verse-card.hide-trans .v-fa{display:none}
.verse-card.hide-trans .v-divider{display:none}
.verse-card.hide-trans .v-ar{margin-bottom:0}

/* Counter */
.counter-area{
  background:var(--surface);border:1px solid var(--gold-border);
  border-radius:var(--radius);padding:16px;margin-top:14px;
  box-shadow:var(--shadow-sm);
}
.counter-label{
  font-size:.78rem;font-weight:700;color:var(--gold);text-align:center;
  margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.counter-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px}
.counter-btn{
  width:48px;height:48px;border-radius:50%;flex:none;
  background:var(--surface2);border:1px solid var(--divider);
  color:var(--text);transition:var(--trans);
}
.counter-btn.plus{background:var(--gold);border-color:var(--gold);color:#fff}
.counter-btn.plus:hover{background:var(--gold2)}
.counter-btn.minus:hover{background:var(--gold-soft);color:var(--gold)}
.counter-btn:active{transform:scale(.9)}
.counter-number{
  font-family:'Amiri',serif;font-size:2rem;font-weight:700;
  color:var(--gold);min-width:70px;text-align:center;line-height:1;
}
.counter-target{font-size:.7rem;color:var(--muted);text-align:center;margin-top:4px}
.counter-progress{
  height:5px;background:var(--divider);border-radius:5px;
  margin-top:10px;overflow:hidden;
}
.counter-progress .bar{height:100%;background:var(--gold);border-radius:5px;transition:width .3s}
.counter-stats{
  display:flex;justify-content:space-between;
  font-size:.7rem;color:var(--muted);margin-top:8px;
}
.counter-actions{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.counter-actions button{
  padding:7px 16px;border-radius:20px;font-size:.72rem;font-weight:600;
  background:var(--surface2);border:1px solid var(--divider);color:var(--text2);
  transition:var(--trans);display:inline-flex;align-items:center;gap:5px;
}
.counter-actions button:hover{color:var(--gold);border-color:var(--gold-border)}
.counter-actions .complete-btn:hover{color:#27ae60;border-color:#27ae60}

/* Tasbih steps */
.tasbih-step{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:10px 0;border-bottom:1px solid var(--divider);
}
.tasbih-step:last-child{border-bottom:none}
.tasbih-step .step-text{
  font-family:var(--font-ar);font-size:1rem;font-weight:700;color:var(--arabic);flex:1;
}
.tasbih-step .step-progress{
  width:70px;height:5px;background:var(--divider);border-radius:5px;overflow:hidden;flex:none;
}
.tasbih-step .step-progress .bar{height:100%;background:var(--gold);border-radius:5px;transition:width .3s}
.tasbih-step .step-count{font-size:.7rem;color:var(--muted);min-width:50px;text-align:left}

/* Modals */
.modal-bg{
  position:fixed;inset:0;z-index:200;
  display:none;align-items:flex-end;justify-content:center;
  padding:0 12px 12px;background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.modal-bg.show{display:flex}
.modal{
  width:100%;max-width:540px;max-height:86vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--gold-border);
  border-radius:24px 24px 18px 18px;padding:20px 18px 26px;
  box-shadow:var(--shadow);animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--divider);
}
.modal-head h3{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--text)}
.modal-head h3 svg{color:var(--gold);width:20px;height:20px;flex:none}
.modal-close{
  width:34px;height:34px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);color:var(--muted);
}
.modal-close:hover{color:var(--gold);border-color:var(--gold)}

.set-group{margin-bottom:18px}
.set-group>label{display:block;margin-bottom:8px;color:var(--muted);font-size:.75rem;font-weight:700}
.set-options{display:flex;flex-wrap:wrap;gap:6px}
.set-opt{
  padding:7px 11px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--divider);
  color:var(--text2);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--trans);
}
.set-opt:hover{color:var(--gold);border-color:var(--gold-border)}
.set-opt.active{color:var(--gold);background:var(--gold-soft);border-color:var(--gold)}
.font-preview{font-family:var(--font-ar);font-size:1rem}
.set-ctrl{
  display:flex;align-items:center;gap:6px;width:max-content;
  padding:4px;border-radius:10px;background:var(--surface2);border:1px solid var(--divider);
}
.set-ctrl button{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:1.05rem;font-weight:700}
.set-ctrl button:hover{background:var(--gold-soft);color:var(--gold)}
.set-ctrl .val{min-width:42px;text-align:center;color:var(--gold);font-size:.82rem;font-weight:700}

.info-block{
  padding:14px 16px;background:var(--surface2);border:1px solid var(--gold-border);
  border-radius:var(--radius-sm);margin-bottom:10px;
}
.info-block h4{
  display:flex;align-items:center;gap:6px;
  font-size:.8rem;font-weight:700;color:var(--gold);margin-bottom:8px;
}
.info-block h4 svg{width:16px;height:16px;flex:none}
.info-block p{font-size:.8rem;line-height:1.95;color:var(--text2);text-align:justify;white-space:pre-line}

/* Bottom nav */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;align-items:center;justify-content:space-around;
  height:62px;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--divider);
  box-shadow:0 -6px 24px rgba(0,0,0,.06);
}
body.dark .bottom-nav{box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 4px;border-radius:12px;color:var(--muted);text-decoration:none;
  font-size:.6rem;font-weight:500;transition:var(--trans);
}
.nav-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover,.nav-btn.active{color:var(--gold)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:78px;z-index:300;
  display:flex;align-items:center;gap:8px;
  max-width:90%;padding:10px 18px;border-radius:14px;
  background:var(--brand);color:#fff;border:1px solid var(--gold-border);
  box-shadow:var(--shadow);transform:translateX(-50%) translateY(20px);
  opacity:0;pointer-events:none;transition:all .35s ease;
  font-size:.8rem;font-weight:600;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:var(--gold2)}

.empty-msg{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty-msg svg{width:48px;height:48px;opacity:.3}

@media(max-width:480px){
  :root{--fs-ar:22px;--fs-fa:15px}
  .app{padding-left:10px;padding-right:10px}
  .hbtn{width:36px;height:36px}
  .hbtn .icon{width:18px;height:18px}
  .brand h1{font-size:1rem}
  .orn-title{font-size:1.15rem}
  .verse-card{padding:14px 12px}
  .section-head{padding:12px}
  .section-head .sec-title{font-size:.92rem}
  .counter-btn{width:42px;height:42px}
  .counter-number{font-size:1.6rem;min-width:60px}
  .taq-item{padding:12px 14px}
}
</style>
</head>

<body>

<div class="app">

  <!-- ========== HEADER ========== -->
  <header class="header">
    <button class="hbtn" id="btnBack" aria-label="بازگشت">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </button>

    <div class="brand">
      <h1 id="pageTitle">تعقیبات نماز</h1>
      <span class="noor">نور</span>
    </div>

    <button class="hbtn" id="btnInfo" aria-label="اطلاعات">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>

/* ============================================================
   FAVORITES & COUNTS
   ============================================================ */
const FAV_KEY = 'taqibat_favs';
const CNT_KEY = 'taqibat_counts';
const TASBIH_KEY = 'taqibat_tasbih';

function getFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }catch(e){ return []; } }
function setFavs(f){ localStorage.setItem(FAV_KEY, JSON.stringify(f)); }
function isFav(id){ return getFavs().includes(id); }
function toggleFav(id){
  const f = getFavs();
  const i = f.indexOf(id);
  if(i > -1) f.splice(i, 1); else f.push(id);
  setFavs(f);
  return f.includes(id);
}
function getCount(id){ try{ return (JSON.parse(localStorage.getItem(CNT_KEY) || '{}')[id]) || 0; }catch(e){ return 0; } }
function setCount(id, v){ const c = JSON.parse(localStorage.getItem(CNT_KEY) || '{}'); c[id] = v; localStorage.setItem(CNT_KEY, JSON.stringify(c)); }
function getTasbih(id){ try{ return JSON.parse(localStorage.getItem(TASBIH_KEY) || '{}')[id] || {}; }catch(e){ return {}; } }
function setTasbih(id, p){ const d = JSON.parse(localStorage.getItem(TASBIH_KEY) || '{}'); d[id] = p; localStorage.setItem(TASBIH_KEY, JSON.stringify(d)); }

/* ============================================================
   FILTERS
   ============================================================ */
let currentCategory = 'all';

function filterCategory(cat){
  currentCategory = cat;
  $$('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  filterItems();
}

function filterItems(){
  if($('#detailContainer').style.display !== 'none') return;
  const q = ($('#searchInput').value || '').trim().toLowerCase();

  let items = TAQIBAT_DATA;
  if(currentCategory !== 'all') items = items.filter(i => i.category === currentCategory);
  if(q){
    items = items.filter(i =>
      i.title.toLowerCase().includes(q) ||
      i.category.includes(q) ||
      (i.verses && i.verses.some(v => v.ar.includes(q) || v.fa.includes(q)))
    );
  }
  renderList(items);
}

/* ============================================================
   RENDER LIST
   ============================================================ */
function renderList(items){
  const c = $('#listContainer');
  if(!items || items.length === 0){
    c.innerHTML = `<div class="empty-msg">${ICONS.empty}<span>نتیجه‌ای یافت نشد.</span></div>`;
    return;
  }

  const groups = {};
  items.forEach(i => { (groups[i.category] = groups[i.category] || []).push(i); });

  let html = '';
  Object.keys(groups).forEach(cat => {
    html += `
      <div class="section-head">
        <div class="sec-title">${cat === 'مشترک' ? 'تعقیبات مشترک همه‌ی نمازها' : 'تعقیبات نماز ' + cat}</div>
        <div class="sec-orn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9 12 2"/>
          </svg>
        </div>
      </div>
    `;
    groups[cat].forEach(item => {
      const fav = isFav(item.id);
      const cnt = getCount(item.id);
      const tgt = item.count || 1;
      html += `
        <div class="taq-item" onclick="showDetail('${item.id}')">
          <span class="v-num">${faNum(item.number)}</span>
          <div class="taq-body">
            <div class="taq-title">${item.title}</div>
            <div class="taq-meta">
              <span>${ICONS.target} ${faNum(tgt)} مرتبه</span>
              <span>${ICONS.refresh} ${faNum(cnt)} انجام شده</span>
            </div>
          </div>
          <button class="fav-btn ${fav ? 'active' : ''}" onclick="event.stopPropagation(); handleFav('${item.id}');">${ICONS.heart}</button>
          <span class="taq-arrow">${ICONS.arrowLeft}</span>
        </div>
      `;
    });
  });

  c.innerHTML = html;
}

/* ============================================================
   RENDER DETAIL
   ============================================================ */
function showDetail(id){
  const item = TAQIBAT_DATA.find(i => i.id === id);
  if(!item) return;

  $('#listContainer').style.display = 'none';
  $('#searchBox').style.display = 'none';
  $('#categoryFilter').style.display = 'none';
  $('#detailContainer').style.display = 'block';
  $('#pageTitle').textContent = item.title;

  const tgt = item.count || 1;
  const cnt = getCount(item.id);
  const fav = isFav(item.id);

  let html = `
    <div class="detail-head">
      <div class="d-title">${item.title}</div>
      <div class="d-meta">
        <span>${ICONS.target} ${item.category} • ${faNum(tgt)} مرتبه</span>
      </div>
      <div class="d-source">${ICONS.book} ${item.source}</div>
      <button class="back-btn" onclick="backToList()">${ICONS.arrowLeft} بازگشت به لیست</button>
    </div>
  `;

  if(item.verses && item.verses.length){
    item.verses.forEach(v => {
      html += `
        <div class="verse-card">
          <div class="v-ar">${v.ar}</div>
          <div class="v-divider"></div>
          <div class="v-fa">${v.fa}</div>
        </div>
      `;
    });
  }

  if(item.isTasbih && item.tasbihSteps){
    const prog = getTasbih(item.id);
    let totalDone = 0, totalTarget = 0;
    let stepsHtml = '';
    item.tasbihSteps.forEach((s, i) => {
      const d = prog[i] || 0;
      totalDone += d; totalTarget += s.target;
      const pct = Math.min((d / s.target) * 100, 100);
      stepsHtml += `
        <div class="tasbih-step">
          <span class="step-text">${s.text}</span>
          <span class="step-count" id="ts_${item.id}_${i}">${faNum(d)} / ${faNum(s.target)}</span>
          <div class="step-progress"><div class="bar" id="tb_${item.id}_${i}" style="width:${pct}%"></div></div>
        </div>
      `;
    });
    html += `
      <div class="counter-area">
        <div class="counter-label">${ICONS.beads} تسبیحات حضرت زهرا (س)</div>
        ${stepsHtml}
        <div class="counter-progress"><div class="bar" id="tprog_${item.id}" style="width:${Math.min((totalDone/totalTarget)*100,100)}%"></div></div>
        <div class="counter-stats">
          <span>${ICONS.check} ${faNum(totalDone)} از ${faNum(totalTarget)}</span>
          <span>${faNum(totalTarget - totalDone)} باقی‌مانده</span>
        </div>
        <div class="counter-actions">
          <button onclick="resetTasbih('${item.id}')">${ICONS.reset} صفر</button>
          <button class="complete-btn" onclick="markTasbihComplete('${item.id}')">${ICONS.check} کامل شد</button>
        </div>
      </div>
    `;
  } else {
    const pct = Math.min((cnt / tgt) * 100, 100);
    html += `
      <div class="counter-area">
        <div class="counter-label">${ICONS.beads} شمارنده‌ی ذکر</div>
        <div class="counter-row">
          <button class="counter-btn minus" onclick="changeCount('${item.id}',-1)">−</button>
          <div>
            <div class="counter-number" id="cn_${item.id}">${faNum(cnt)}</div>
            <div class="counter-target">از ${faNum(tgt)}</div>
          </div>
          <button class="counter-btn plus" onclick="changeCount('${item.id}',1)">+</button>
        </div>
        <div class="counter-progress"><div class="bar" id="cp_${item.id}" style="width:${pct}%"></div></div>
        <div class="counter-stats">
          <span id="cd_${item.id}">${ICONS.check} ${faNum(cnt)} انجام شده</span>
          <span id="cr_${item.id}">${faNum(Math.max(tgt-cnt,0))} باقی‌مانده</span>
        </div>
        <div class="counter-actions">
          <button onclick="resetCount('${item.id}')">${ICONS.reset} صفر</button>
          <button class="complete-btn" onclick="markComplete('${item.id}')">${ICONS.check} کامل شد</button>
        </div>
      </div>
    `;
  }

  html += `
    <div class="counter-actions" style="margin-top:16px;">
      <button onclick="copyItem('${item.id}')">${ICONS.copy} کپی متن</button>
      <button onclick="shareItem('${item.id}')">${ICONS.share} اشتراک‌گذاری</button>
      <button onclick="handleFavAndReload('${item.id}')">${ICONS.heart} ${fav ? 'حذف از برگزیده' : 'افزودن به برگزیده'}</button>
    </div>
  `;

  $('#detailContainer').innerHTML = html;
  $('.scroll-content').scrollTop = 0;
}

function backToList(){
  $('#detailContainer').style.display = 'none';
  $('#listContainer').style.display = 'block';
  $('#searchBox').style.display = 'block';
  $('#categoryFilter').style.display = 'flex';
  $('#pageTitle').textContent = 'تعقیبات نماز';
  filterItems();
  $('.scroll-content').scrollTop = 0;
}

function handleFav(id){
  toggleFav(id);
  filterItems();
}
function handleFavAndReload(id){
  toggleFav(id);
  showDetail(id);
}

/* ============================================================
   COUNTERS
   ============================================================ */
function changeCount(id, delta){
  const item = TAQIBAT_DATA.find(i => i.id === id);
  if(!item) return;
  const tgt = item.count || 1;
  let c = getCount(id);
  c = Math.min(Math.max(c + delta, 0), tgt);
  setCount(id, c);

  const n = $('#cn_'+id); if(n) n.textContent = faNum(c);
  const p = $('#cp_'+id); if(p) p.style.width = Math.min((c/tgt)*100, 100) + '%';
  const d = $('#cd_'+id); if(d) d.innerHTML = ICONS.check + ' ' + faNum(c) + ' انجام شده';
  const r = $('#cr_'+id); if(r) r.textContent = faNum(Math.max(tgt-c,0)) + ' باقی‌مانده';
}

function resetCount(id){
  const item = TAQIBAT_DATA.find(i => i.id === id);
  const tgt = item ? item.count || 1 : 1;
  setCount(id, 0);
  const n = $('#cn_'+id); if(n) n.textContent = '۰';
  const p = $('#cp_'+id); if(p) p.style.width = '0%';
  const d = $('#cd_'+id); if(d) d.innerHTML = ICONS.check + ' ۰ انجام شده';
  const r = $('#cr_'+id); if(r) r.textContent = faNum(tgt) + ' باقی‌مانده';
  toast('شمارنده صفر شد');
}

function markComplete(id){
  const item = TAQIBAT_DATA.find(i => i.id === id);
  if(!item) return;
  const tgt = item.count || 1;
  setCount(id, tgt);
  const n = $('#cn_'+id); if(n) n.textContent = faNum(tgt);
  const p = $('#cp_'+id); if(p) p.style.width = '100%';
  const d = $('#cd_'+id); if(d) d.innerHTML = ICONS.check + ' ' + faNum(tgt) + ' انجام شده';
  const r = $('#cr_'+id); if(r) r.textContent = '۰ باقی‌مانده';
  toast('کامل شد — ' + item.title);
}

/* ============================================================
   TASBIH
   ============================================================ */
function changeTasbihStep(id, delta){
  const item = TAQIBAT_DATA.find(i => i.id === id);
  if(!item || !item.tasbihSteps) return;
  let prog = getTasbih(id);
  let totalDone = 0, totalTarget = 0;
  item.tasbihSteps.forEach((s, i) => {
    let v = prog[i] || 0;
    v = Math.min(Math.max(v + delta, 0), s.target);
    prog[i] = v;
    totalDone += v; totalTarget += s.target;
  });
  setTasbih(id, prog);
  item.tasbihSteps.forEach((s, i) => {
    const v = prog[i] || 0;
    const pct = Math.min((v/s.target)*100, 100);
    const b = $('#tb_'+id+'_'+i); if(b) b.style.width = pct+'%';
    const t = $('#ts_'+id+'_'+i); if(t) t.textContent = faNum(v) + ' / ' + faNum(s.target);
  });
  const tp = $('#tprog_'+id); if(tp) tp.style.width = Math.min((totalDone/totalTarget)*100,100)+'%';
}

function resetTasbih(id){
  setTasbih(id, {});
  const item = TAQIBAT_DATA.find(i => i.id === id);
  if(!item) return;
  item.tasbihSteps.forEach((s, i) => {
    const b = $('#tb_'+id+'_'+i); if(b) b.style.width = '0%';
    const t = $('#ts_'+id+'_'+i); if(t) t.textContent = '۰ / ' + faNum(s.target);
  });
  const tp = $('#tprog_'+id); if(tp) tp.style.width = '0%';
  toast('تسبیحات صفر شد');
}

function markTasbihComplete(id){
  const item = TAQIBAT_DATA.find(i => i.id === id);
  if(!item || !item.tasbihSteps) return;
  const prog = {};
  item.tasbihSteps.forEach((s, i) => { prog[i] = s.target; });
  setTasbih(id, prog);
  item.tasbihSteps.forEach((s, i) => {
    const b = $('#tb_'+id+'_'+i); if(b) b.style.width = '100%';
    const t = $('#ts_'+id+'_'+i); if(t) t.textContent = faNum(s.target) + ' / ' + faNum(s.target);
  });
  const tp = $('#tprog_'+id); if(tp) tp.style.width = '100%';
  toast('تسبیحات حضرت زهرا (س) کامل شد');
}

/* ============================================================
   COPY / SHARE
   ============================================================ */
function getItemText(id){
  const item = TAQIBAT_DATA.find(i => i.id === id);
  if(!item) return '';
  let t = item.title + '\n\n';
  if(item.verses) item.verses.forEach(v => { t += v.ar + '\n' + v.fa + '\n\n'; });
  t += 'منبع: ' + item.source;
  return t;
}
function copyItem(id){
  const t = getItemText(id);
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(() => toast('متن کپی شد'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('متن کپی شد');
  }
}
function shareItem(id){
  const t = getItemText(id);
  if(navigator.share){ navigator.share({title: 'تعقیبات نماز', text: t}).catch(()=>{}); }
  else copyItem(id);
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg){
  const t = $('#toast');
  $('#toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(() => t.classList.remove('show'), 2200);
}

$$('[data-trans]').forEach(b => {

    $$('[data-trans]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');

});
$$('[data-font-ar]').forEach(b => {

$$('[data-font-fa]').forEach(b => {

  };
});
